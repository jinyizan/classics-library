<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>本草綱目 · 본초학 목차</title>
<style>
  :root{
    --ink:#1e3a2f;
    --ink-soft:#3d5a4e;
    --bg:#f8faf6;
    --card:#ffffff;
    --line:#e3eae2;
    --muted:#7a8b81;
    --accent:#2f5d49;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:#22332b;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Pretendard",sans-serif;}
  .wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
  /* header */
  header.top{background:var(--ink);color:#f2f5ef;padding:22px 20px 18px}
  header.top h1{margin:0;font-size:22px;letter-spacing:.14em;font-weight:700;
    font-family:"Noto Serif KR","Songti SC",serif}
  header.top p{margin:6px 0 0;font-size:12.5px;color:#c9d4c9;letter-spacing:.02em}
  /* search */
  .searchbox{background:var(--ink);padding:0 16px 14px;position:sticky;top:0;z-index:19}
  .searchbox .inner{background:#fff;border-radius:12px;display:flex;align-items:center;gap:8px;
    padding:11px 14px;box-shadow:0 1px 0 rgba(30,58,47,.08)}
  .searchbox input{border:0;outline:0;flex:1;font-size:15px;background:transparent;color:#22332b}
  main{padding:14px 14px 40px;flex:1}
  /* chapter accordion — uniform margins */
  .chapter{background:var(--card);border:1px solid var(--line);border-radius:14px;
    margin:0 0 12px;overflow:hidden}
  .chapter > button.head{width:100%;border:0;background:#fff;cursor:pointer;
    display:flex;align-items:center;gap:12px;padding:16px;text-align:left}
  .chapter .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#f2f5ef;
    display:flex;align-items:center;justify-content:center;font-size:15px;
    font-family:"Noto Serif KR",serif}
  .chapter .ttl{flex:1;min-width:0}
  .chapter .ttl b{display:block;font-size:16.5px;letter-spacing:.04em;color:var(--ink);
    font-family:"Noto Serif KR",serif;font-weight:700}
  .chapter .ttl small{font-size:11.5px;color:var(--muted)}
  .chapter .chev{flex:none;color:var(--muted);transition:transform .2s;font-size:13px}
  .chapter.open .chev{transform:rotate(180deg)}
  .chapter .body{display:none;border-top:1px solid var(--line);padding:12px 12px 14px;background:#fdfffd}
  .chapter.open .body{display:block}
  /* section */
  .sec{margin:6px 2px 4px}
  .sec + .sec{margin-top:14px}
  .sec h3{margin:0 0 8px;font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.03em;
    display:flex;align-items:center;gap:8px;font-family:"Noto Serif KR",serif}
  .sec h3::before{content:"";width:3px;height:14px;background:var(--ink);border-radius:2px;display:inline-block}
  .sec h3 .n{font-family:inherit;font-size:11px;color:var(--muted);font-weight:400}
  /* herb 2-col uniform grid */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .herb{border:1px solid var(--line);background:#fff;border-radius:11px;min-height:64px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:11px 6px;cursor:pointer;transition:border-color .15s,transform .1s}
  .herb:active{transform:scale(.98);border-color:var(--ink)}
  .herb .ko{font-size:14.5px;font-weight:700;color:#26382f}
  .herb .han{font-size:12.5px;color:var(--ink-soft);font-family:"Noto Serif KR",serif;letter-spacing:.06em}
  .herb.nomatch{opacity:.75}
  .herb.nomatch .han{color:#9aa8a0}
  .empty{padding:26px;text-align:center;color:var(--muted);font-size:13px}
  footer.note{padding:0 18px 34px;color:var(--muted);font-size:11.5px;line-height:1.7}
  /* bottom sheet */
  .backdrop{position:fixed;inset:0;background:rgba(20,32,26,.45);opacity:0;pointer-events:none;
    transition:opacity .22s;z-index:40}
  .backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;transform:translate(-50%,105%);bottom:0;width:100%;max-width:520px;
    background:#fff;border-radius:18px 18px 0 0;z-index:41;max-height:86vh;display:flex;flex-direction:column;
    transition:transform .28s cubic-bezier(.32,.72,.35,1);box-shadow:0 -12px 40px rgba(0,0,0,.2)}
  .sheet.show{transform:translate(-50%,0)}
  .grab{padding:10px 0 4px;display:flex;justify-content:center;touch-action:none;cursor:grab}
  .grab i{width:40px;height:5px;border-radius:99px;background:#d5ddd6;display:block}
  .sheet-head{padding:6px 18px 12px;border-bottom:1px solid var(--line)}
  .sheet-head .row{display:flex;align-items:flex-start;gap:10px}
  .sheet-head h2{margin:0;flex:1;font-size:18px;color:var(--ink)}
  .sheet-head h2 .h{font-family:"Noto Serif KR",serif;margin-left:8px;font-size:15px;color:var(--ink-soft);font-weight:500}
  .sheet-head .sub{margin-top:4px;font-size:11.5px;color:var(--muted)}
  .xbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:50%;width:30px;height:30px;
    font-size:14px;color:var(--muted);cursor:pointer;line-height:1}
  .sheet-body{overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom));
    -webkit-overflow-scrolling:touch}
  .orig-sec{margin-bottom:16px}
  .orig-sec h4{margin:0 0 6px;font-size:13px;color:var(--ink);letter-spacing:.08em;
    font-family:"Noto Serif KR",serif;border-left:3px solid var(--ink);padding-left:8px}
  .orig-sec p{margin:0;font-size:13.5px;line-height:1.85;color:#33463c;white-space:pre-wrap;word-break:break-word}
  .orig-sec .more{font-size:11px;color:var(--muted);margin-top:4px}
  .src{font-size:11px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;line-height:1.6}
  .notebox{font-size:12.5px;line-height:1.7;color:var(--ink);background:#eef4ee;
    border:1px solid #d3e0d3;border-radius:10px;padding:10px 12px;margin-bottom:14px}
  .notebox b{font-weight:700}
  #segWrap{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:2px;
    scrollbar-width:none}
  #segWrap::-webkit-scrollbar{display:none}
  #segWrap button{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--muted);
    font-size:12.5px;border-radius:999px;padding:7px 13px;cursor:pointer;letter-spacing:.1em;
    font-family:"Noto Serif KR",serif}
  #segWrap button.on{background:var(--ink);border-color:var(--ink);color:#f2f5ef;font-weight:700}
  mark{background:#fff3c4;border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>本草綱目</h1>
    <p>본초학 교과서 목차 · 모바일 본초 편람</p>
  </header>
  <div class="searchbox">
    <div class="inner">
      <span aria-hidden="true">🔍</span>
      <input id="q" type="search" placeholder="" autocomplete="off" aria-label="본초 검색">
    </div>
  </div>
  <main id="list"></main>
  <footer class="note">
    ※ 장(章) 표기는 ‘一 解表藥’처럼 한자 번호와 명칭만 노출합니다.<br>
    ※ 교과서 목차 원본이 ‘行人’에서 중단되어, 제13장 제3절은 行人(杏仁)까지만 수록되어 있습니다.<br>
    ※ 원문은 《本草綱目》 위키텍스트 발췌·정리본이며, 明代 이후 유통된 일부 본초(胖大海·白花蛇舌草)는 正文 조문이 없어 준비중으로 표기됩니다.
  </footer>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" aria-modal="true" role="dialog">
  <div class="grab" id="grab"><i></i></div>
  <div class="sheet-head">
    <div class="row">
      <h2><span id="sKo"></span><span class="h" id="sHan"></span></h2>
      <button class="xbtn" id="closeBtn" aria-label="닫기">✕</button>
    </div>
    <div class="sub" id="sSub"></div>
  </div>
  <div class="sheet-body" id="sBody"></div>
</section>

<script src="./data.js"></script>
<script>
(function(){
  const data = window.BONCHO_DATA;
  const list = document.getElementById('list');
  const total = data.meta.total;
  const nCh = data.chapters.length;

  const SEC_LABEL = {'釋名':'釋名','集解':'集解','氣味':'氣味','主治':'主治','發明':'發明','修治':'修治','附方':'附方'};

  function herbMatch(h, kw){
    kw = kw.trim().toLowerCase();
    if(!kw) return true;
    return (h.ko||'').toLowerCase().includes(kw) || (h.han||'').includes(kw) ||
           (h.entry||'').includes(kw) || ((h.hanNorm||'').includes(kw));
  }

  function herbCard(h){
    const b = document.createElement('button');
    b.className = 'herb' + (h.entry ? '' : ' nomatch');
    b.type = 'button';
    const ko = document.createElement('span'); ko.className='ko'; ko.textContent = h.ko;
    const han = document.createElement('span'); han.className='han'; han.textContent = h.han;
    b.appendChild(ko); b.appendChild(han);
    b.addEventListener('click', ()=>openSheet(h));
    return b;
  }

  function render(filter){
    list.innerHTML = '';
    const kw = (filter||'').trim();
    let shown = 0;
    data.chapters.forEach((c, ci)=>{
      const wrap = document.createElement('section');
      wrap.className = 'chapter';
      const head = document.createElement('button');
      head.className = 'head'; head.type='button';
      const chHerbs = c.direct.length + c.sections.reduce((a,s)=>a+s.herbs.length,0);
      head.innerHTML = '<span class="num">'+c.hanNum+'</span>' +
        '<span class="ttl"><b>'+escapeHtml(c.title)+'</b><small>'+chHerbs+'種 · 本草 '+chHerbs+'</small></span>' +
        '<span class="chev">▼</span>';
      const body = document.createElement('div');
      body.className = 'body';
      let cShown = 0;

      function secBlock(title, herbs){
        const vis = herbs.filter(h=>herbMatch(h, kw));
        if(kw && vis.length===0) return null;
        cShown += vis.length;
        const sec = document.createElement('div');
        sec.className = 'sec';
        const h3 = document.createElement('h3');
        h3.innerHTML = escapeHtml(title) + ' <span class="n">'+vis.length+'</span>';
        sec.appendChild(h3);
        const g = document.createElement('div');
        g.className = 'grid';
        vis.forEach(h=>g.appendChild(herbCard(h)));
        sec.appendChild(g);
        return sec;
      }

      if(c.direct.length){
        const s = secBlock('本草', c.direct);
        if(s) body.appendChild(s);
      }
      c.sections.forEach(s=>{
        const el = secBlock(s.title, s.herbs);
        if(el) body.appendChild(el);
      });

      if(kw && cShown===0) return; // hide chapter
      if(kw) wrap.classList.add('open');
      shown += cShown;
      head.addEventListener('click', ()=>wrap.classList.toggle('open'));
      // update count in header when filtering
      if(kw) head.querySelector('small').textContent = cShown + '種 · 檢索 結果';
      wrap.appendChild(head); wrap.appendChild(body);
      list.appendChild(wrap);
    });
    if(shown===0){
      const d = document.createElement('div');
      d.className='empty'; d.textContent='검색 결과가 없습니다.';
      list.appendChild(d);
    }
  }

  function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  // ---- bottom sheet (섹션 탭 + 번역본 표시) ----
  const sheet = document.getElementById('sheet');
  const backdrop = document.getElementById('backdrop');
  const sKo = document.getElementById('sKo'), sHan = document.getElementById('sHan'),
        sSub = document.getElementById('sSub'), sBody = document.getElementById('sBody');
  let sheetHerb = null, sheetSec = null;
  // section tabs (釋名·集解·氣味·主治·發明·修治·附方) — sheet head에 1회 삽입
  const segWrap = document.createElement('div');
  segWrap.id = 'segWrap';
  document.querySelector('.sheet-head').appendChild(segWrap);
  function renderSheetBody(h){
    sBody.innerHTML = '';
    const order = h.secOrder && h.secOrder.length ? h.secOrder : Object.keys(h.secs||{});
    if(!sheetSec || !order.includes(sheetSec)) sheetSec = order[0] || null;
    segWrap.innerHTML = '';
    order.forEach(k=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = k;
      b.classList.toggle('on', k===sheetSec);
      b.addEventListener('click', ()=>{ sheetSec = k; renderSheetBody(h); });
      segWrap.appendChild(b);
    });
    if(h.note){
      const nb = document.createElement('div');
      nb.className = 'notebox';
      nb.textContent = '對照注記 · ' + h.note;
      sBody.appendChild(nb);
    }
    if(!sheetSec){
      sBody.innerHTML += '<div class="src">발췌를 불러오지 못했습니다.</div>';
      return;
    }
    const s = h.secs[sheetSec];
    if(!s) return;
    const div = document.createElement('div');
    div.className = 'orig-sec';
    const hh = document.createElement('h4'); hh.textContent = SEC_LABEL[sheetSec]||sheetSec;
    const p = document.createElement('p');
    p.textContent = (h.trans && h.trans[sheetSec]) ? h.trans[sheetSec] : s.text;
    div.appendChild(hh); div.appendChild(p);
    if(s.truncated){
      const m = document.createElement('div'); m.className='more';
      m.textContent = '※ 번역은 발췌 범위까지만 표시합니다.';
      div.appendChild(m);
    }
    sBody.appendChild(div);
  }
  function openSheet(h){
    sheetHerb = h;
    sheetSec = null;
    sKo.textContent = h.ko || '';
    sHan.textContent = h.han || '';
    sBody.innerHTML = '';
    if(h.entry){
      sSub.textContent = '本草綱目 · ' + h.entry + (h.source ? ' · ' + sourceLabel(h.source) : '');
      segWrap.style.display = '';
      renderSheetBody(h);
    } else {
      segWrap.style.display = 'none';
      sSub.textContent = '本草綱目 原文 準備中';
      const msg = h.note || '해당 본초는 明代 이후에 유통이 확대된 품목으로, 《本草綱目》 正文에 독립 조문이 확인되지 않아 원문을 싣지 않았습니다. 교과서 목차상의 한글·한자명은 그대로 수록합니다.';
      sBody.innerHTML = '';
      const nb = document.createElement('div');
      nb.className = 'notebox';
      nb.textContent = '對照注記 · ' + msg;
      sBody.appendChild(nb);
    }
    sheet.classList.add('show'); backdrop.classList.add('show');
    document.body.style.overflow = 'hidden';
    document.querySelector('.sheet-body').scrollTop = 0;
  }
  function closeSheet(){
    sheet.classList.remove('show'); backdrop.classList.remove('show');
    document.body.style.overflow = '';
  }
  function sourceLabel(fn){
    // 015_草之一.txt -> 草之一
    const m = String(fn||'').match(/^\d+_(.+)\.txt$/);
    return m ? m[1] : fn;
  }
  document.getElementById('closeBtn').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
  // swipe-down to close
  (function(){
    const grab = document.getElementById('grab');
    let y0=null, dy=0;
    grab.addEventListener('touchstart', e=>{ y0=e.touches[0].clientY; }, {passive:true});
    grab.addEventListener('touchmove', e=>{
      if(y0==null) return;
      dy = e.touches[0].clientY - y0;
      if(dy>0) sheet.style.transform = 'translate(-50%,'+dy+'px)';
    }, {passive:true});
    grab.addEventListener('touchend', ()=>{
      sheet.style.transform = '';
      if(dy>90) closeSheet();
      y0=null; dy=0;
    });
  })();

  document.getElementById('q').addEventListener('input', e=>render(e.target.value));
  render('');
})();
</script>
</body>
</html>
