간질, 치병, 중악과 명치 아래가 아픈 것[心腹痛]을 치료하며 눈에 군살과 예막이 생긴 것을 없애고 여러 가지 옹창의 고름을 다 빨아낸다. 또한 해산을 쉽게 하게 하고 유산시킨다. 어린이의 驚癎과 객오도 낫게 한다[본초]","-여러 가지 사기[百邪]와 헛것이 들린 병과 가위 눌린 것[鬼魅]을 치료하며 3가지 충을 죽인다[본초]","-사향 기운은 비(脾)로 들어가서 살에 생긴 병을 낫게 한다[강목]","-사향은 성질이 따뜻하나 음(陰)에 속한다. 그러나 능히 양으로 변하며 주리를 열어준다[직지소아].","-사향은 다른 약 기운을 이끌고 뚫고 들어간다[직지]","-춘분 때 채취한 생것이 더 좋다. 사향이란 바로 사향노루 음경 앞의 가죽 속에 따로 막(膜)이 씌워진 곳에 있는 것이다[본초]","-사향에는 3가지가 있다. 그 첫째는 생향(生香)이다. 사향노루가 여름에 뱀과 벌레를 많이 먹으면 겨울에 가서 향이 가득 들어차게 된다. 그런데 봄이 되면 갑자기 아파서 사향노루가 발톱으로 긁어서 떨어지게 한다. 생향이 떨어진 부근의 풀과 나무는 다 누렇게 마른다. 생향을 얻기는 아주 어렵다. 진짜 사향을 가지고 오이나 과수밭을 지나면 열매가 달리지 않는다. 이것으로 진짜 사향을 알 수 있다. 둘째는 제향(臍香)인데 이것은 사향노루를 산 채로 잡아서 떼낸 것이다. 셋째는 심결향(心結香)인데 사향노루가 무엇에 쫓기어 미친 것같이 달아나다가 저절로 죽은 것에서 떼낸 것이다[본초]","-사향에는 가짜가 많으나 그것을 쪼개 보아 속에 털이 있는 것은 좀 나은 것이다. 사향의 당문자(當門子)를 태워 보아 부글부글 끓는 것이 좋은 것이다. [본초]","-사향은 자일(子日)에 쪼개서 쓰는데 아주 보드랍게 갈지 말고 채구멍으로 빠져 나갈 정도로 갈아서 써야 한다[본초]","-사향은 일명 사미취(四味臭)라고도 한다[강목]"]}]],"searchText":"麝香 분류 開竅藥 기원 사슴과에 속한 動物인 사향노루와 林麝 및 馬麝의 成熟한 雄體의 香囊中에 分泌物을 乾燥 性味 歸經 效能 主治 備考 辛 溫 心 脾 開竅醒神<br>活血通經<br>消腫止痛 熱病神昏, 中風痰厥, 氣鬱暴厥,中惡昏迷<br>經閉, 癥瘕, 難産死胎, 心腹暴痛 癰腫瘰癧, 咽喉腫痛, 跌撲傷痛, 痺痛麻木  약물특징/비교 -開竅시키는 效力이 强하므로 邪氣가 心竅를 蒙閉하여 된 神志昏迷를 治療하는 要藥 -本品은 비록 溫性에 속하나 ․淸熱藥과 配伍하면 凉開劑가 되고, ․祛寒藥과 配合하면 溫開劑가 되어 救急의 藥品이 되며 각종 急性熱病의 神昏과 中風으로 昏迷된 證을 治療 ․消腫, 止痛시키는 效能이 있어 瘡瘍腫毒이나 跌撲損傷에 內服 또는 外用하면 治療效果가 있다. -麝香과 牛黃은 다같이 開竅시키는 要藥으로 兩藥은 또한 外科瘡瘍에 良品이 되나, ․牛黃은 性이 凉하여 능히 淸心豁痰하고, 淸熱解毒시키는 效能이 있어 豁痰定驚에 쓰며 ․麝香은 性이 溫하여 通經散結, 活血消腫에 特長이 있어 開竅醒神에 쓴다. 瘀血凝滯者는 麝香○ 牛黃× ․熱病으로 인한 神昏抽搐과 中風으로 인한 痰迷痙厥에는 두 가지 藥物을 配伍한다 진존인본초 -최근의 약리연구에 의하면 麝香에 중추신경계통을 興奮시켜 호흡중추와 심율부제를 조정하는 作用이 있다. 경악전서 二七三 味苦辛, 性溫하며 能開諸竅, 通經絡, 透肌骨, 解酒毒, 吐風痰, 消積聚癥瘕, 散諸惡濁氣하니 除心腹暴痛脹急하며 殺鬼物邪氣魘寐, 臟腑蟲積, 蛇蟲毒‧蠱毒‧瘴毒‧沙虱毒하며 及婦人難産하며 尤善墮胎라 用熱水硏服一粒이라 治小兒驚癎客忤하며 鎭心安神하며 療鼻塞不聞香臭하며 目疾可去翳膜하며 除一切惡瘡, 痔漏腫痛, 膿水腐肉, 面䵟斑疹이라 凡氣滯爲病者엔 俱宜用之며 若鼠咬蟲咬成瘡이면 但以麝香으로 封之則愈라 欲辨眞假면 但置些須於火炭上하야 有油滾出而成焦黑炭者는 肉類也니 此卽香之本體나 若燃火而化白灰者는 木類也니 是卽假攙이라 동의보감 -나쁜 사기를 없애고 마음을 진정시키며 정신을 안정시키고 온학, 고독, 간질, 치병, 중악과 명치 아래가 아픈 것[心腹痛]을 치료하며 눈에 군살과 예막이 생긴 것을 없애고 여러 가지 옹창의 고름을 다 빨아낸다. 또한 해산을 쉽게 하게 하고 유산시킨다. 어린이의 驚癎과 객오도 낫게 한다[본초] -여러 가지 사기[百邪]와 헛것이 들린 병과 가위 눌린 것[鬼魅]을 치료하며 3가지 충을 죽인다[본초] -사향 기운은 비(脾)로 들어가서 살에 생긴 병을 낫게 한다[강목] -사향은 성질이 따뜻하나 음(陰)에 속한다. 그러나 능히 양으로 변하며 주리를 열어준다[직지소아]. -사향은 다른 약 기운을 이끌고 뚫고 들어간다[직지] -춘분 때 채취한 생것이 더 좋다. 사향이란 바로 사향노루 음경 앞의 가죽 속에 따로 막(膜)이 씌워진 곳에 있는 것이다[본초] -사향에는 3가지가 있다. 그 첫째는 생향(生香)이다. 사향노루가 여름에 뱀과 벌레를 많이 먹으면 겨울에 가서 향이 가득 들어차게 된다. 그런데 봄이 되면 갑자기 아파서 사향노루가 발톱으로 긁어서 떨어지게 한다. 생향이 떨어진 부근의 풀과 나무는 다 누렇게 마른다. 생향을 얻기는 아주 어렵다. 진짜 사향을 가지고 오이나 과수밭을 지나면 열매가 달리지 않는다. 이것으로 진짜 사향을 알 수 있다. 둘째는 제향(臍香)인데 이것은 사향노루를 산 채로 잡아서 떼낸 것이다. 셋째는 심결향(心結香)인데 사향노루가 무엇에 쫓기어 미친 것같이 달아나다가 저절로 죽은 것에서 떼낸 것이다[본초] -사향에는 가짜가 많으나 그것을 쪼개 보아 속에 털이 있는 것은 좀 나은 것이다. 사향의 당문자(當門子)를 태워 보아 부글부글 끓는 것이 좋은 것이다. [본초] -사향은 자일(子日)에 쪼개서 쓰는데 아주 보드랍게 갈지 말고 채구멍으로 빠져 나갈 정도로 갈아서 써야 한다[본초] -사향은 일명 사미취(四味臭)라고도 한다[강목]"},{"id":179,"name":"牛黃","aliases":[],"category":"淸熱藥-淸熱解毒藥","origin":"牛科 소의 膽囊結石","initial":"기타","sortName":"牛黃","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 凉","心 肝","淸熱解毒<br>息風止痙<br>化痰開竅","熱病神昏, 中風痰迷, 驚癎抽搐, 癲癎發狂, 咽喉腫痛, 口舌生瘡, 癰腫疔瘡",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱解毒藥"]}],["sec",{"key":"origin","label":"기원","lines":["牛科 소의 膽囊結石"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 凉","心 肝","淸熱解毒<br>息風止痙<br>化痰開竅","熱病神昏, 中風痰迷, 驚癎抽搐, 癲癎發狂, 咽喉腫痛, 口舌生瘡, 癰腫疔瘡",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-開竅시키는 效能이 麝香과 같지 않고 解毒시키는 效能이 비교적 强하여 解毒去腐시키는 要藥","-中風을 治療하는데는 반드시 邪氣가 臟腑에 들어가 痰涎이 壅塞하고 神志가 昏迷한 때에 處方에 應用","-熱邪가 아직 營分에 들어가지 않았거나 小兒의 驚癎이 脾胃虛寒에 속하는 경우에는 服用을 忌"]}],["sec",{"key":"qna","label":"본초문답","lines":["-風溫重證 往往有此 法當但淸其熱 犀角羚羊牛黃 以透達之(p143)","-牛黃淸心丸 有大黃入血分 有牛黃走膈膜 是入包絡 則本地火之陰 以瀉火也(p178)","-痰結心膈之間 則非牛黃不能透達(p212)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-매우 강한 해열진경의 효능이 있으며, 각종 원인의 高熱에 의하여 일어나는 번조불안, 의식불명, 헛소리등 증상의 치료에 사용된다.","-뇌출혈에 의한 졸도, 혼수, 開口障碍, 喘鳴, 大小便失禁등의 증상이 나타났을 경우, 조속히 牛黃淸心丸 1粒을 죽력즙에 용해하여 용수, 灌服시킬 필요가 있다.","-해담해소, 배농소종을 위한 要藥이며, 咽喉疾患에 대하여 임상상 가장 많이 사용된다.","-牛黃은 强心性의 해열, 진정약이며 赤血球의 신생을 촉진하는 작용을 가진다."]}],["sec",{"key":"gyeong","lab  하기며 근골강건작용이 있다. 수축의 효능이 있어서, 體虛로 인해 일어나는 白帶下, 子宮頸弛緩, 月經過多등의 치료에 적합하다. -鹿角膠 ․우수한 壯陽生精,보혈지혈의 효능이 있으며 婦人科에서 많이 사용한다. -鹿角霜 ․壯陽效力은 미약하며 보신약으로 응용되는데 불과하지만 수렴고섭의 効果는 좋다. 盜汗이 많이 날 때 쓴다 경악전서 二六六 味甘鹹, 氣溫하며 大補虛羸, 益血氣, 塡精髓, 壯筋骨, 長肌肉, 悅顔色, 延年益壽하며 療吐血下血, 尿精尿血, 及婦人崩淋, 赤白帶濁, 血虛無子하며 止痛安胎, 亦治折跌損傷, 瘡瘍腫毒하며 善助陰中之陽하야 最爲補陰要藥이라 동의보감 -성질이 평(平)하면서 따뜻하고[溫] 맛이 달며[甘] 독이 없다. 남자가 신기(腎氣)가 쇠약하고 허손되어 허리가 아프고 몹시 여위는 것[腰痛羸瘦]을 치료한다. 부인이 먹으면 임신하게 되고 안태(安胎)시키며 적백대하, 피를 토하는 것[吐血], 하혈하는 것이 낫는다[본초] -일명 녹각교(鹿角膠) 또는 황명교(黃明膠)라고 하는데 사슴의 뿔을 고아서 만든다."},{"id":181,"name":"龜板","aliases":["龜甲"],"category":"補益藥-補陰藥","origin":"거북이 배껍질/등껍질","initial":"기타","sortName":"龜板","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹甘 微寒","肝 腎","滋陰<br>潛陽<br>補腎<br>健骨","腎陰不足,,陰虛風動,久痢, 久瘧<br>吐血,衄血,久咳<br>遺精,崩漏,帶下<br>腰痛,骨蒸勞熱,骨痿,小兒囟門不合",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陰藥"]}],["sec",{"key":"origin","label":"기원","lines":["거북이 배껍질/등껍질"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹甘 微寒","肝 腎","滋陰<br>潛陽<br>補腎<br>健骨","腎陰不足,,陰虛風動,久痢, 久瘧<br>吐血,衄血,久咳<br>遺精,崩漏,帶下<br>腰痛,骨蒸勞熱,骨痿,小兒囟門不合",""]]}],["sec",{"key":"qna","label":"본초문답","lines":["-龜之性伏, 而其精在板, 能通任脈, 任爲離中之陰, 而下交於督, 合爲旣濟之象, 故龜板益陰而滋心腎(p118)","-乾脚氣, 是風熱, 宜龜板.. 益陰氣, 使陽不動, 以還其厥陰之本體. 故諺云:治風先治血, 血行風自滅, 血足則肝陽不動, 而風自熄(p141)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-신체가 虛弱하고 진액이 손실되었기 때문에 일어나는 증상, 예를 들면 미열이 하강하지 않고 盜汗,自汗이 나오고 병후의 쇠약, 현기증,이명등을 치료하는데 사용한다.","-뇌혈전이나 뇌일혈후의 반신불수, 高血壓에는 龜板을 常用한다.","-脊髓疾患의 常用藥이다. 脊髓炎 初期로 痲痺가 경할 때 龜板을 조속히 사용하면 좋다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-구갑(龜甲)","․성질이 평하고 맛이 짜면서 달고 독이 있다(독이 없다고도 한다). 적백대하를 치료하고 징가를 헤치며 학질과 5가지 치질, 음식창과 습비로 다리가 늘어지고 약해진 것을 치료한다[본초]","․징가를 헤치고 대하를 멎게 하며 학질과 노복을 치료한다[의감]","․일명 신옥(神屋)이라고도 하는데 강과 호수에서 산다. 아무 때나 잡아서 써도 좋다. 누기가 차지 않게 해야 한다. 누기가 차면 독이 생긴다[본초]","․남생이등딱지는 산 채로 벗긴 것이 제일 좋은데, 졸인젖에 발라 굽거나 술에 담갔다가 구워서 쓴다[입문]","-구판(龜板)","․등딱지는 구갑이라고 하고 배딱지는 구판이라고 하는데, 이것들은 다 음이 허하거나 식적으로 열이 나는 것을 잘 치료한다[입문]","․남생이 배딱지는 음을 보하고 뼈가 이어지게 하며 어혈을 몰아낸다[의감]","․배 밑에 송곳으로 구멍을 열 개 뚫을 수 있는 것이 패구 <br>遺精帶下<br>心悸失眠",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-蓮心은 蓮子의 胚芽","․性味가 苦寒하여 淸心除煩하는 效能이 있어 心火亢盛으로 인한 煩躁不安證을 治療","-蓮鬚는 연꽃의 꽃술","․性味는 平하고, 甘澀하여 淸心固腎하고 澁精止血→腎虛滑精과 遺精, 尿意頻數, 遺尿 및 吐血, 崩漏등 症"]}],["sec",{"key":"qna","label":"본초문답","lines":["-蓮子象心, 而蓮心又在其中, 味又極苦, 有似離中陰爻, 用以淸心中之火, 最爲相合(p47)","-蓮子‧芡實味甘而濇, 能收濕氣, 故健脾(p160)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-滋養强壯藥으로 여러 허약성 疾患을 치료하는데에 대단히 뛰어난 効果가 있다.","-오래된 이질로 瀉下不爽하고 농혈이 섞이며 복냉통이 있는 경우에는 蓮子에 黨蔘, 白朮, 木香을 配合해서 服用하면 補腎止痢의 効果가 있다.","-심전병환자로서 심계가 경중을 반복하고, 움직이면 더욱 심해지며 체질허약으로 무기력할 경우에 蓮子를 사용하면 동계를 鎭定시킬수 있다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-연실","․성질은 평(平)하고 차며[寒] 맛이 달고[甘] 독이 없다. 기력을 도와 온갖 병을 낫게 하며 5장을 補하고 갈증과 이질을 멈춘다. 또한 정신을 좋게 하고 마음을 안정시키며 많이 먹으면 몸이 좋아진다[본초]","․12경맥의 기혈을 補한다[입문]","․일명 수지단(水芝丹) 또는 서련(瑞蓮) 또는 우실(藕實)이라고도 한다. 그 껍질은 검고 물에 가라앉는데 이것을 석련(石蓮)이라고 한다. 물에 넣으면 반드시 가라앉지만 소금을 넣고 달이면 뜬다. 연밥은 어느 곳에나 있으며 못에서 자란다. 음력 8-9월에 검고 딴딴한 것을 따서 쓴다. 생것으로 쓰면 배가 불러 오르기 때문에 쪄서 먹는 것이 좋다[본초]","․그 잎은 ‘하(荷)’라고 하고 줄기는 ‘가(茄)’라 하며 밑그루는 ‘밀’이라 하고 피지 않은 꽃봉오리는 ‘함담(菡萏)’이라 하며 꽃이 핀 것은 ‘부용(芙蓉)’이라고 하고 열매는 ‘연(蓮)’이라고 하며 뿌리는 ‘우(藕)’라 한다. 연밥 가운데를 ‘적(的)’이라 하는데 이 적 가운데는 길이가 2푼쯤 되는 푸른 심이 있다. 이것을 ‘의(薏)’라고 하는데 맛이 쓰다. 부거(芙蕖)라고 하는 것은 통틀어서 이르는 말이다[본초]","․대체로 흰 연밥을 쓰는 것이 좋다[일용]"]}]],"searchText":"蓮子肉 藕實莖 분류 收澀藥-澀精縮尿止帶藥 기원 睡蓮科 연꽃의 성숙한 종자 性味 歸經 效能 主治 備考 甘澀 平 脾 腎 心 補脾止瀉<br>益腎澀精<br>養心安神 脾虛久瀉<br>遺精帶下<br>心悸失眠  약물특징/비교 -蓮心은 蓮子의 胚芽 ․性味가 苦寒하여 淸心除煩하는 效能이 있어 心火亢盛으로 인한 煩躁不安證을 治療 -蓮鬚는 연꽃의 꽃술 ․性味는 平하고, 甘澀하여 淸心固腎하고 澁精止血→腎虛滑精과 遺精, 尿意頻數, 遺尿 및 吐血, 崩漏등 症 본초문답 -蓮子象心, 而蓮心又在其中, 味又極苦, 有似離中陰爻, 用以淸心中之火, 最爲相合(p47) -蓮子‧芡實味甘而濇, 能收濕氣, 故健脾(p160) 진존인본초 -滋養强壯藥으로 여러 허약성 疾患을 치료하는데에 대단히 뛰어난 効果가 있다. -오래된 이질로 瀉下不爽하고 농혈이 섞이며 복냉통이 있는 경우에는 蓮子에 黨蔘, 白朮, 木香을 配合해서 服用하면 補腎止痢의 効果가 있다. -심전병환자로서 심계가 경중을 반복하고, 움직이면 더욱 심해지며 체질허약으로 무기력할 경우에 蓮子를 사용하면 동계를 鎭定시킬수 있다. 동의보감 -연실 ․성질은 평(平)하고 차며[寒] 맛이 달고[甘] 독이 없다. 기력을 도와 온갖 병을 낫게 하며 5장을 補하고 갈증과 이질을 멈춘다. 또한 정신을 좋게 하고 마음을 안정시키며 많이 먹으면 몸이 좋아진다[본초] ․12경맥의 기혈을 補한다[입문] ․일명 수지단(水芝丹) 또는 서련(瑞蓮) 또는 우실(藕實)이라고도 한다. 그 껍질은 검고 물에 가라앉는데 이것을 석련(石蓮)이라고 한다. 물에 넣으면 반드시 가라앉지만 소금을 넣고 달이면 뜬다. 연밥은 어느 곳에나 있으며 못에서 자란다. 음력 8-9월에 검고 딴딴한 것을 따서 쓴다. 생것으로 쓰면 배가 불러 오르기 때문에 쪄서 먹는 것이 좋다[본초] ․그 잎은 ‘하(荷)’라고 하고 줄기는 ‘가(茄)’라 하며 밑그루는 ‘밀’이라 하고 피지 않은 꽃봉오리는 ‘함담(菡萏)’이라 하며 꽃이 핀 것은 ‘부용(芙蓉)’이라고 하고 열매는 ‘연(蓮)’이라고 하며 뿌리는 ‘우(藕)’라 한다. 연밥 가운데를 ‘적(的)’이라 하는데 이 적 가운데는 길이가 2푼쯤 되는 푸른 심이 있다. 이것을 ‘의(薏)’라고 하는데 맛이 쓰다. 부거(芙蕖)라고 하는 것은 통틀어서 이르는 말이다[본초] ․대체로 흰 연밥을 쓰는 것이 좋다[일용]"},{"id":185,"name":"藕節","aliases":["연뿌리"],"category":"止血藥-收斂止血藥","origin":"睡蓮科 다년생 초본인 연꽃의 根莖의 마디","initial":"ㅇ","sortName":"연뿌리","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘澀 平","心 胃 肝","收斂止血","咳血,吐血,衄血,尿血,便血,血痢,血崩",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["止血藥-收斂止血藥"]}],["sec",{"key":"origin","label":"기원","lines":["睡蓮科 다년생 초본인 연꽃의 根莖의 마디"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘澀 平","心 胃 肝","收斂止血","咳血,吐血,衄血,尿血,便血,血痢,血崩",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-止血시키되 瘀血을 停留하게 하지 않는다.","-藥力이 和平하여 各種 內出血의 病證에 常用","-吐血과 咯血에 많이 應用하는데 新鮮한 것을 搗汁하여 服用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-藕節生於水, 而上發花, 花秉火色, 是水上交於火之象, ...所以淸火而化瘀血(p199)"]}],["sec",{"key":"dong","label":"동의보감","lines":["-우즙(藕汁, 연근을 짜낸 물)","․성질이 따뜻하고[溫] 맛은 달며[甘] 독이 없다. 우(藕)란 것은 연뿌리이다. 토혈을 멎게 하고 어혈을 삭힌다. 생것을 먹으면 곽란 후 허해서 나는 갈증을 멎게 하고 쪄서 먹으면 5장을 아주 잘 보하며 하초를 든든하게 한다. 연뿌리와 꿀을 함께 먹으면 배에 살이 오르고 여러 가지 충병이 생기지 않는다.","․답답한 것을 없애고 설사를 멎게 하며 술독을 풀어 주고 끼니 뒤나 병을 앓고 난 뒤에 열이 나면서 나는 갈증을 멎게 한다.","․연뿌리마디는 성질이 차므로[冷] 열독을 풀며 어혈을 삭힌다.","․옛날 송나라의 고관이 연뿌리의 껍질을 벗기다가 실수하여 양의 피를 받아 놓은 그릇에 떨어뜨렸는데 그 피가 엉키지 않았다. 이것으로써 연뿌리가 어혈을 헤칠[散] 수 있다는 것을 알게 되었다[본초]"]}]],"searchText":"藕節 연뿌리 분류 止血藥-收斂止血藥 기원 睡蓮科 다년생 초본인 연꽃의 根莖의 마디 性味 歸經 效能 主治 備考 甘澀 平 心 胃 肝 收斂止血 咳血,吐血,衄血,尿血,便血,血痢,血崩  약물특징/비교 -止血시키되 瘀血을 停留하게 하지 않는다. -藥力이 和平하여 各種 內出血의 病證에 常用 -吐血과 咯血에 많이 應用하는데 新鮮한 것을 搗汁하여 服用 본초문답 -藕節生於水, 而上發花, 花秉火色, 是水上交於火之象, ...所以淸火而化瘀血(p199) 동의보감 -우즙(藕汁, 연근을 짜낸 물) ․성질이 따뜻하고[溫] 맛은 달며[甘] 독이 없다. 우(藕)란 것은 연뿌리이다. 토혈을 멎게 하고 어혈을 삭힌다. 생것을 먹으면 곽란 후 허해서 나는 갈증을 멎게 하고 쪄서 먹으면 5장을 아주 잘 보하며 하초를 든든하게 한다. 연뿌리와 꿀을 함께 먹으면 배에 살이 오르고 여러 가지 충병이 생기지 않는다. ․답답한 것을 없애고 설사를 멎게 하며 술독을 풀어 주고 끼니 뒤나 병을 앓고 난 뒤에 열이 나면서 나는 갈증을 멎게 한다. ․연뿌리마디는 성질이 차므로[冷] 열독을 풀며 어혈을 삭힌다. ․옛날 송나라의 고관이 연뿌리의 껍질을 벗기다가 실수하여 양의 피를 받아 놓은 그릇에 떨어뜨렸는데 그 피가 엉키지 않았다. 이것으로써 연뿌리가 어혈을 헤칠[散] 수 있다는 것을 알게 되었다[본초]"},{"id":186,"name":"芡實","aliases":["雞頭實","芡仁","가시연꽃"],"category":"收澀藥-澀精縮尿止帶藥","origin":"睡蓮科 일년생 水生초본인 가시연꽃의 성숙한 종인","initial":"ㄱ","sortName":"가시연꽃","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘澀 平","脾 腎","益腎固精<br>補脾止瀉<br>祛濕止帶","夢遺滑精, 遺尿尿頻<br>脾虛久瀉<br>白濁, 帶下",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["收澀藥-澀精縮尿止帶藥"]}],["sec",{"key":"origin","label":"기원","lines":["睡蓮科 일년생 水生초본인 가시연꽃의 성숙한 종인"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘澀 平","脾 腎","益腎固精<br>補脾止瀉<br>祛濕止帶","夢遺滑精, 遺尿尿頻<br>脾虛久瀉<br>白濁, 帶下",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-效能이 山藥과 비슷하고 性質이 和平하여 不燥不膩하므로 두 藥物을 配伍하면 좋은데,","․山藥은 補益力이 强하고,","․芡實은 收散固澀시키는 效能이 優秀하며, 또한","․山藥은 補肺, 芡實은 脾腎을 補"]}],["sec",{"key":"qna","label":"본초문답","lines":["-蓮子‧芡實味甘而濇, 能收濕氣, 故健脾(p160)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-단백질, 탄수화물, 칼슘, 철등을 함유하고 있어 영양가치가 대단히 높다.","-遺精을 중지시키는 作用이 있어 광범위하게 사용된다.","-金櫻子를 加味한 수륙이선단은 유정치료의 기본 方劑이다.","-요실금, 頻尿, 多飮多尿나 소아야뇨증등의 사용에도 모두 좋다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 평(平)하고 맛은 달며[甘] 독이 없다. 정기를 보하고 의지를 강하게 하며 귀와 눈을 밝게 하고 오래 살게 한다.","-일명 계두실(鷄頭實) 또는 계옹(鷄癰)이라고도 하는데 못 가운데서 자라며 잎은 연잎 크기만하다. 주름과 가시가 있다. 그 꽃은 주먹 크기만하고 생김새가 닭의 대가리 같다고 하여 계두실이라고 하였다. 열매는 석류와 비슷한데 껍질은 검푸르고 살은 희다. 음력 8월에 따서 찐 다음 볕에 말리면 껍질이 터진다. 또한 가루내어 쓸 수도 있는데 마름(菱)보다 사람에게 더 유익하다[본초]","-가시연밥은 부족한 精을 잘 보하므로 수류황(水硫黃)이라고도 한다[입문]","-가루내어 금앵자즙으로 알약을 만든다. 이것을 수륙단(水陸丹)이라고 하는데 정액이 저절로 나가지 않게 한다[일용]"]}]],"searchText":"芡實 雞頭實 芡仁 가시연꽃 분류 收澀藥-澀精縮尿止帶藥 기원 睡蓮科 일년생 水生초본인 가시연꽃의 성숙한 종인 性味 歸經 效能 主治 備考 甘澀 平 脾 腎 益腎固精<br>補脾止瀉<br>祛濕止帶 夢遺滑精, 遺尿尿頻<br>脾虛久瀉<br>白濁, 帶下  약물특징/비교 -效能이 山藥과 비슷하고 性質이 和平하여 不燥不膩하므로 두 藥物을 配伍하면 좋은데, ․山藥은 補益力이 强하고, ․芡實은 收散固澀시키는 效能이 優秀하며, 또한 ․山藥은 補肺, 芡實은 脾腎을 補 본초문답 -蓮子‧芡實味甘而濇, 能收濕氣, 故健脾(p160) 진존인본초 -단백질, 탄수화물, 칼슘, 철등을 함유하고 있어 영양가치가 대단히 높다. -遺精을 중지시키는 作用이 있어 광범위하게 사용된다. -金櫻子를 加味한 수륙이선단은 유정치료의 기본 方劑이다. -요실금, 頻尿, 多飮多尿나 소아야뇨증등의 사용에도 모두 좋다. 동의보감 -성질은 평(平)하고 맛은 달며[甘] 독이 없다. 정기를 보하고 의지를 강하게 하며 귀와 눈을 밝게 하고 오래 살게 한다. -일명 계두실(鷄頭實) 또는 계옹(鷄癰)이라고도 하는데 못 가운데서 자라며 잎은 연잎 크기만하다. 주름과 가시가 있다. 그 꽃은 주먹 크기만하고 생김새가 닭의 대가리 같다고 하여 계두실이라고 하였다. 열매는 석류와 비슷한데 껍질은 검푸르고 살은 희다. 음력 8월에 따서 찐 다음 볕에 말리면 껍질이 터진다. 또한 가루내어 쓸 수도 있는데 마름(菱)보다 사람에게 더 유익하다[본초] -가시연밥은 부족한 精을 잘 보하므로 수류황(水硫黃)이라고도 한다[입문] -가루내어 금앵자즙으로 알약을 만든다. 이것을 수륙단(水陸丹)이라고 하는데 정액이 저절로 나가지 않게 한다[일용]"},{"id":187,"name":"覆盆子","aliases":["蓬虆"],"category":"收澀藥-澀精縮尿止帶藥","origin":"장미과에 속한 落葉灌木인 華東覆盆子의 果實","initial":"기타","sortName":"覆盆子","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸 溫","肝 腎 膀胱","益腎固精<br>縮尿","腎虛遺尿, 陽痿早泄, 遺精滑精<br>小便頻數",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["收澀藥-澀精縮尿止帶藥"]}],["sec",{"key":"origin","label":"기원","lines":["장미과에 속한 落葉灌木인 華東覆盆子의 果實"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸 溫","肝 腎 膀胱","益腎固精<br>縮尿","腎虛遺尿, 陽痿早泄, 遺精滑精<br>小便頻數",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-甘味는 補益하고 酸味는 收斂하며 性이 溫하되 燥熱하지 않아 腎陽을 補하면서 傷陰시키는 弊가 없다."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-精液을 固攝하는 작용이 있다.","-배뇨를 抑制하는 작용이 있으므로 방광무력증, 요실금, 신경성빈뇨, 소아야뇨증등의 만성비뇨기질환치료에 사용된다.","-建腦, 신경안정의 작용이 있어 신경쇠약치료에 유효하다.","-睡眠不續, 多夢, 동계, 두혼의 증상이 있을 경우에는 覆盆子에 五味子, 女貞子, 酸棗仁, 柏子仁을 配合사용한다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 평(平)하며(약간 열하다[微熱]고도 한다) 맛은 달고[甘] 시며[酸] 독이 없다. 남자의 신기(腎氣)가 허하고 정(精)이 고갈된 것과 여자가 임신되지 않는 것을 치료한다. 또한 남자의 음위증을 낫게 하고 간을 보하며 눈을 밝게 하고 기운을 도와 몸을 가쁜하게 하며 머리털이 희어지지 않게 한다.","-음력 5월에 따는데 어느 곳에나 다 있다. 절반쯤 익은 것을 따서 볕에 말린다. 그것을 쓸 때에는 껍질과 꼭지를 버리고 술에 쪄서 쓴다.","-신정(腎精)을 보충해 주고 오줌이 잦은 것을 멎게 한다. 그러므로 요강을 엎어 버렸다고 하여 엎을 ‘복(覆)’자와 동이 ‘분(盆)’자를 따서 복분자라고 하였다[본초]"]}]],"searchText":"覆盆子 蓬虆 분류 收澀藥-澀精縮尿止帶藥 기원 장미과에 속한 落葉灌木인 華東覆盆子의 果實 性味 歸經 效能 主治 備考 甘酸 溫 肝 腎 膀胱 益腎固精<br>縮尿 腎虛遺尿, 陽痿早泄, 遺精滑精<br>小便頻數  약물특징/비교 -甘味는 補益하고 酸味는 收斂하며 性이 溫하되 燥熱하지 않아 腎陽을 補하면서 傷陰시키는 弊가 없다. 진존인본초 -精液을 固攝하는 작용이 있다. -배뇨를 抑制하는 (腎)이 상한 데는 반드시 써야 한다. 족소음신경의 주약[君藥]이다. 술에 축여 쪄서 쓰는 것이 역시 좋다[입문] -우리나라에는 다만 경상도에서 난다고 하는데 사실인지 아닌지 알 수 없다[속방]"},{"id":193,"name":"秦艽","aliases":["진범"],"category":"祛風濕藥-祛風濕止痺痛藥","origin":"龍膽科 다년생 草本인 秦艽와 麻花진교, 粗莖진교, 小진교의 根","initial":"ㅈ","sortName":"진범","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛 微寒","胃 肝 膽","祛風濕<br>舒筋絡<br>淸虛熱","風濕痺痛<br>筋脈拘攣, 骨節煩痛<br>日哺潮熱, 小兒疳積發熱",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["祛風濕藥-祛風濕止痺痛藥"]}],["sec",{"key":"origin","label":"기원","lines":["龍膽科 다년생 草本인 秦艽와 麻花진교, 粗莖진교, 小진교의 根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛 微寒","胃 肝 膽","祛風濕<br>舒筋絡<br>淸虛熱","風濕痺痛<br>筋脈拘攣, 骨節煩痛<br>日哺潮熱, 小兒疳積發熱",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-대개 辛燥傷陰하나 오직 秦艽는 “質潤하여 燥하지 않아 風藥中에 潤劑이며 發散藥中에 補劑가 된다”"]}],["sec",{"key":"qna","label":"본초문답","lines":["-用筋者, 如續斷多根, 故續絶傷. 秦艽肌紋, 左右交얽혀, 故治左右偏風, 筋脈疼痛之症(p107)","-寒入於筋脈, 或拘急不能屈伸, 或享單緩不能收引, 或疼痛不可忍耐, 總宜續斷秦艽, 引入筋脈 (p150)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-약성이 隱하고 윤기가 있어 風濕을 제거할 뿐, 潮熱은 되지 않으나 虛熱을 제거하는 作用이 있다.","-특히 風濕病에 의한 미열이 장기간 하강하지 않을 때에 사용하면 비교적 좋은 効果를 거둘 수 있다. 여기에는 秦艽를 君藥으로 하고 牛膝, 銀柴胡, 黃柏, 鱉甲등을 加味하여 이것을 1개월 이상 服用시킨다.","-秦艽의 亢炎症作用은 신경계통이 뇌하수체를 움직이게 함으로써 부신피질호르몬의 分泌가 促進되어 일어난다는 것을 알 수 있다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["三四 味苦, 性沈寒하며 沈中有浮하며 手足陽明淸火藥也라 治風寒濕痺하며 利小水하며 療通身風濕拘攣, 手足不遂하며 淸黃疸하며 解溫疫熱毒하며 除口噤牙疼口瘡, 腸風下血, 及虛勞骨蒸發熱, 潮熱煩渴, 及婦人胎熱, 小兒疳熱瘦弱等證이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 평(平)하며 약간 따뜻하고[微溫](서늘하다[冷]고도 한다) 맛은 쓰고 매우며[苦辛] 독이 없다. 풍(風), 한(寒), 습(濕)으로 생긴 비증(痺證)에 주로 쓴다. 풍으로 온몸이 가드라들면서 팔다리 뼈마디가 아픈 것이 오래되었거나 갓 생겼거나를 물론하고 다 낫게 한다. 주황(酒黃), 황달(黃疸), 골증(骨蒸)을 낫게 하고 오줌을 잘 나가게 한다.","-일명 진과(秦瓜)라고도 하는데 산에서 자란다. 뿌리는 누런 흙빛이다. 그물과 같이 서로 얽혔으며 길이는 한자 정도이고 잎은 푸르러 부루잎 비슷하다. 음력 6월에 칡꽃(葛花)과 같은 자줏빛의 꽃이 피어 그 달로 열매가 열린다. 음력 2월, 8월에 뿌리를 캐어 햇볕에 말려서 쓴다. 새로 캐서 쓰는 것이 좋은데 그물발 같은 무늬가 있는 것이 좋다[본초]","-수양명경약[手陽明經藥]이다. 장풍(腸風)으로 피를 쏟는 것[瀉血]을 낫게 하고 양명경의 풍습(風濕)을 없앤다. 물로 흙을 씻어 버리고 쓴다[탕액]."]}]],"searchText":"秦艽 진범 분류 祛風濕藥-祛風濕止痺痛藥 기원 龍膽科 다년생 草本인 秦艽와 麻花진교, 粗莖진교, 小진교의 根 性味 歸經 效能 主治 備考 苦辛 微寒 胃 肝 膽 祛風濕<br>舒筋絡<br>淸虛熱 風濕痺痛<br>筋脈拘攣, 骨節煩痛<br>日哺潮熱, 小兒疳積發熱  약물특징/비교 -대개 辛燥傷陰하나 오직 秦艽는 “質潤하여 燥하지 않아 風藥中에 潤劑이며 發散藥中에 補劑가 된다” 본초문답 -用筋者, 如續斷多根, 故續絶傷. 秦艽肌紋, 左右交얽혀, 故治左右偏風, 筋脈疼痛之症(p107) -寒入於筋脈, 或拘急不能屈伸, 或享單緩不能收引, 或疼痛不可忍耐, 總宜續斷秦艽, 引入筋脈 (p150) 진존인본초 -약성이 隱하고 윤기가 있어 風濕을 제거할 뿐, 潮熱은 되지 않으나 虛熱을 제거하는 作用이 있다. -특히 風濕病에 의한 미열이 장기간 하강하지 않을 때에 사용하면 비교적 좋은 効果를 거둘 수 있다. 여기에는 秦艽를 君藥으로 하고 牛膝, 銀柴胡, 黃柏, 鱉甲등을 加味하여 이것을 1개월 이상 服用시킨다. -秦艽의 亢炎症作用은 신경계통이 뇌하수체를 움직이게 함으로써 부신피질호르몬의 分泌가 促進되어 일어난다는 것을 알 수 있다. 경악전서 三四 味苦, 性沈寒하며 沈中有浮하며 手足陽明淸火藥也라 治風寒濕痺하며 利小水하며 療通身風濕拘攣, 手足不遂하며 淸黃疸하며 解溫疫熱毒하며 除口噤牙疼口瘡, 腸風下血, 及虛勞骨蒸發熱, 潮熱煩渴, 及婦人胎熱, 小兒疳熱瘦弱等證이라 동의보감 -성질은 평(平)하며 약간 따뜻하고[微溫](서늘하다[冷]고도 한다) 맛은 쓰고 매우며[苦辛] 독이 없다. 풍(風), 한(寒), 습(濕)으로 생긴 비증(痺證)에 주로 쓴다. 풍으로 온몸이 가드라들면서 팔다리 뼈마디가 아픈 것이 오래되었거나 갓 생겼거나를 물론하고 다 낫게 한다. 주황(酒黃), 황달(黃疸), 골증(骨蒸)을 낫게 하고 오줌을 잘 나가게 한다. -일명 진과(秦瓜)라고도 하는데 산에서 자란다. 뿌리는 누런 흙빛이다. 그물과 같이 서로 얽혔으며 길이는 한자 정도이고 잎은 푸르러 부루잎 비슷하다. 음력 6월에 칡꽃(葛花)과 같은 자줏빛의 꽃이 피어 그 달로 열매가 열린다. 음력 2월, 8월에 뿌리를 캐어 햇볕에 말려서 쓴다. 새로 캐서 쓰는 것이 좋은데 그물발 같은 무늬가 있는 것이 좋다[본초] -수양명경약[手陽明經藥]이다. 장풍(腸風)으로 피를 쏟는 것[瀉血]을 낫게 하고 양명경의 풍습(風濕)을 없앤다. 물로 흙을 씻어 버리고 쓴다[탕액]."},{"id":194,"name":"白芷","aliases":["구릿대"],"category":"解表藥-發散風寒藥","origin":"繖形科 구릿대의 뿌리","initial":"ㄱ","sortName":"구릿대","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛溫","肺 胃 大腸","散風除濕<br>通竅止痛<br>消腫排膿","感冒頭痛<br>眉棱骨痛,齒痛,鼻塞,鼻淵,寒濕腹痛<br>腸風痔漏,癰疽瘡瘍,皮膚燥痒,疥癬",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥 - 發散風寒藥"]}],["sec",{"key":"origin","label":"기원","lines":["繖形科 구릿대의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛溫","肺 胃 大腸","散風除濕<br>通竅止痛<br>消腫排膿","感冒頭痛<br>眉棱骨痛,齒痛,鼻塞,鼻淵,寒濕腹痛<br>腸風痔漏,癰疽瘡瘍,皮膚燥痒,疥癬",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-溫燥한 性格은 除濕시키고, 芳香은 通竅시키고 止痛","-足陽明胃經에 主藥이 된다","-足陽明經脈(頭面을 循行)의 風寒濕으로 인한 頭額痛과 眉稜骨痛, 齒齦腫痛 및 鼻淵 등 모든 頭面疾患을 治療","-다만 升散溫燥하여 耗血傷氣하므로 陰虛火旺이나 血虛有熱한 病證에는 應用×"]}],["sec",{"key":"qna","label":"본초문답","lines":["-白芷辛香, 色白入肺與陽明經, 根性又主升, 故能升散肺與陽明之風寒, 觀獨活色黑, 入太陽少陰, 白芷色白, 入肺與陽明, 此又金水異質, 各歸其類之象(p72)","-本草有引經藥, 白芷葛粉, 入陽明經(p128)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-유행성감기의 치료에 유효하다.","-미골이나 眼窩周圍의 痛症, 혹은 그 부분의 壓痛은 대체로 風寒에 의하여 일어나는 것인데, 이것에는 白芷만을 煎服시키면 좋다. 신경성두통, 혈관성두통, 삼차신경통에 대하여서도 白芷가 常用된다. 이 경우에는 川芎, 升摩, 川烏를 配合하여 사용하는 것이 좋다.","-알레르기성 鼻炎으로 조금만 냉하여도 재채기가 멎지 않으며 鼻水가 많이 나오는 경우에는 白芷에 蒼耳子, 薄荷를 配合하여 사용한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["九三 味辛, 氣溫하며 氣厚味輕하며 升也며 陽也라 其性이 溫散敗毒하니 逐陽明經風寒邪熱하야 止頭痛頭風頭眩, 目痛 目癢 淚出하며 散肺經風寒, 皮膚斑疹燥癢하며 治鼻鼽鼻淵, 齒痛眉稜骨痛, 大腸風秘, 腸風尿血이라","其氣가 辛香達表라 故로 治瘡瘍하며 排膿止癢定痛하며 托癰하야 疽肺癰瘰癧痔瘻에 長肉生肌라 炒黑用之하면 提女人血崩, 漏下赤白, 血閉陰腫하며 欲去䵟斑이면 宜以生用이니 可作面脂. 亦治蛇傷砒毒. 金瘡傷損이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하고[溫] 맛은 매우며[辛] 독이 없다. 풍사(風邪)로 머리가 아프고 눈 앞이 아찔하며 눈물이 나오는 것을 멎게 한다. 부인의 적백대하[赤白漏下], 월경을 하지 못하는 것, 음부가 부은 것에 쓰며 오래된 어혈을 헤치고 피를 생겨나게 하며 임신하혈로 유산되려는 것을 안정시킨다. 유옹(乳癰), 등창[發背], 나력(瘰癧), 장풍(腸風), 치루(痔瘻), 창이(瘡痍), 옴[疥]과 버짐[癬]을 낫게 한다. 통증을 멎게 하고 새살이 나게하며 고름을 빨아내거나 삭혀 버리며 얼굴에 바르는 기름을 만들어 쓰면 얼굴빛을 부드럽게 하며 얼굴에 기미와 주근깨, 흉터를 없앤다.","-곳곳에 다 자라는데 음력 2월과 8월에 뿌리를 캐어 햇볕에 말린다. 누르고 윤기가 있는 것이 좋다[본초]","-『이소경(離騷經)』에는 이 약은 수양명본경약이며 족양명, 수태음의 풍한을 풀리게[解利] 하는 약재라고 하였다[입문]"]}]],"searchText":"白芷 구릿대 분류 解表藥 - 發散風寒藥 기원 繖形科 구릿대의 뿌리 性味 歸經 效能 主治 備考 辛溫 肺 胃 大腸 散風除濕<br>通竅止痛<br>消腫排膿 感冒頭痛<br>眉棱骨痛,齒痛,鼻塞,鼻淵,寒濕腹痛<br>腸風痔漏,癰疽瘡瘍,皮膚燥痒,疥癬  약물특징/비교 -溫燥한 性格은 除濕시키고, 芳香은 通竅시키고 止痛 -足陽明胃經에 主藥이 된다 -足陽明經脈(頭面을 循行)의 風寒濕으로 인한 頭額痛과 眉稜骨痛, 齒齦腫痛 및 鼻淵 등 모든 頭面疾患을 治療 -다만 升散溫燥하여 耗血傷氣하므로 陰虛火旺이나 血虛有熱한 病證에는 應用× 본초문답 -白芷辛香, 色白入肺與陽明經, 根性又主升, 故能升散肺與陽明之風寒, 觀獨活色黑, 入太陽少陰, 白芷色白, 入肺與陽明, 此又金水異質, 各歸其類之象(p72) -本草有引經藥, 白芷葛粉, 入陽明經(p128) 진존인본초 -유행성감기의 치료에 유효하다. -미골이나 眼窩周圍의 痛症, 혹은 그 부분의 壓痛은 대체로 風寒에 의하여 일어나는 것인데, 이것에는 白芷만을 煎服시키면 좋다. 신경성두통, 혈관성두통, 삼차신경통에 대하여서도 白芷가 常用된다. 이 경우에는 川芎, 升摩, 川烏를 配合하여 사용하는 것이 좋다. -알레르기성 鼻炎으로 조금만 냉하여도 재채기가 멎지 않으며 鼻水가 많이 나오는 경우에는 白芷에 蒼耳子, 薄荷를 配合하여 사용한다. 경악전서 九三 味辛, 氣溫하며 氣厚味輕하며 升也며 陽也라 其性이 溫散敗毒하니 逐陽明經風寒邪熱하야 止頭痛頭風頭眩, 目痛 目癢 淚出하며 散肺經風寒, 皮膚斑疹燥癢하며 治鼻鼽鼻淵, 齒痛眉稜骨痛, 大腸風秘, 腸風尿血이라 其氣가 辛香達表라 故로 治瘡瘍하며 排膿止癢定痛하며 托癰하야 疽肺癰瘰癧痔瘻에 長肉生肌라 炒黑用之하면 提女人血崩, 漏下赤白, 血閉陰腫하며 欲去䵟斑이면 宜以生用이니 可作面脂. 亦治蛇傷砒毒. 金瘡傷損이라 동의보감 -성질은 따뜻하고[溫] 맛은 매우며[辛] 독이 없다. 풍사(風邪)로 머리가 아프고 눈 앞이 아찔하며 눈물이 나오는 것을 멎게 한다. 부인의 적백대하[赤白漏下], 월경을 하지 못하는 것, 음부가 부은 것에 쓰며 오래된 어혈을 헤치고 피를 생겨나게 하며 임신하혈로 유산되려는 것을 안정시킨다. 유옹(乳癰), 등창[發背], 나력(瘰癧), 장풍(腸風), 치루(痔瘻), 창이(瘡痍), 옴[疥]과 버짐[癬]을 낫게 한다. 통증을 멎게 하고 새살이 나게하며 고름을 빨아내거나 삭혀 버리며 얼굴에 바르는 기름을 만들어 쓰면 얼굴빛을 부드럽게 하며 얼굴에 기미와 주근깨, 흉터를 없앤다. -곳곳에 다 자라는데 음력 2월과 8월에 뿌리를 캐어 햇볕에 말린다. 누르고 윤기가 있는 것이 좋다[본초] -『이소경(離騷經)』에는 이 약은 수양명본경약이며 족양명, 수태음의 풍한을 풀리게[解利] 하는 약재라고 하였다[입문]"},{"id":195,"name":"淫羊藿","aliases":["三枝九葉草"],"category":"補益藥-補陽藥","origin":"小蘗科(매자나무과)에 속한 多年生 草本인 삼지구엽초의 全草","initial":"기타","sortName":"淫羊藿","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 溫","肝 腎","補腎壯陽<br>祛風除濕","陽痿不擧, 小便淋瀝, 筋骨攣急, 半身不遂, 腰膝無力, 風濕痺痛, 四肢不仁, 更年期高血壓症",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["小蘗科(매자나무과)에 속한 多年生 草本인 삼지구엽초의 全草"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 溫","肝 腎","補腎壯陽<br>祛風除濕","陽痿不擧, 小便淋瀝, 筋骨攣急, 半身不遂, 腰膝無力, 風濕痺痛, 四肢不仁, 更年期高血壓症",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-溫腎壯陽의 效能이 비교적 强 → 腎陽不足으로 인한 男子陽痿와 女子의 子宮發育不全 및 風寒痺痛 등에","-最近에 와서 婦女의 更年期에 나타나는 高血壓과 小兒痲痺의 急性期를 治療하는데 좋은 效果가 있다.","-性이 燥烈하여 陰液을 損傷시키고 쉬우므로 陰虛火旺으로 인한 夢精, 遺精 및 陽强易擧者는 服用을 忌"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-현대의 약리연구에 의하여 淫羊藿에는 최음작용이 있고 정액분비를 촉진하여 정낭을 충만시키는 작용을 가지며 그에 따라 감각신경을 자극하여 간접적으로 성욕의 흥분을 야기한다는 것이 증명되어 있다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["十六 味甘, 氣辛, 性溫, 乃手足陽明‧少陰, 三焦命門藥也. 主陽虛陽痿, 莖中作痛.","化小水, 益精氣, 强志意, 堅筋骨, 煖下部一切冷風勞氣, 筋骨拘攣. 補腰膝, 壯眞陰, 及年老昏耄, 中年健忘.","凡男子陽衰, 女子陰衰, 艱於子嗣者에 皆宜服之하며 服此之法은 或單用浸酒커나 或兼佐하야丸散이니 無不可者라 制法은每擇淨一斤하야 以羊脂四兩으로 同炒油盡用之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하고[溫](평(平)하다고도 한다) 독이 없다. 모든 풍랭증(風冷證)과 허로(虛勞)를 낫게 하며 허리와 무릎을 보한다. 남자의 양기(陽氣)가 끊어져 음경이 일어나지 않는 데와 여자의 음기가 소모되어 아이를 낳지 못하는 데 쓴다. 늙은이가 정신없고 기력이 없는 것, 중년에 건망증이 있는데 음위증(陰痿證)과 음경 속이 아픈 것을 낫게 한다. 기력을 도와주고 근골(筋骨)을 든든하게 한다. 남자가 오래 먹으면 자식을 낳게 할 수 있고 나력을 삭게 하며 음부에 생긴 헌데를 씻으면 벌레가 나온다.","-일명 선령 疼, 膝痛脚弱, 寒濕周痺, 失溺尿頻, 遺精, 白帶",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-腰脊의 酸痛을 治療하는데 그 效能이 杜仲과 비슷하고, 關節通利, 風濕痺痛는 巴戟天과 비숫하나,","․杜仲은 肝腎을 補益하는 作用이 强하고 겸하여 安胎시키고,","․巴戟天은 質潤不燥하고 風濕을 溫散시키는 作用이 强하지 않고 補腎壯陽의 效能이 더욱 좋다.","․腰膝痠痛이 肝腎不足에 속하고 겸하여 風濕이 많은 者는 狗脊을 多用","․그렇지 않고 다만 腎虛에는 杜仲을 適用","․腎虛陽痿나 腰膝無力者에게는 巴戟天을 多用","-狗脊의 根莖上에 茸毛는 外傷出血에 外敷하여 止血시키고 生肌시키는데 應用"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-허약성 풍습에 의한 만성적인 통증을 치료하는 효능이 있다. 체질이 허약하여 만성적인 통증이 소퇴되지 않을경우에 狗脊을 복용하면 허약보강, 풍습제거, 근골강화한다.","-근위축의 치료에 常用된다. 특히, 소아마비 초기에 狗脊을 사용하면 마비를 조기에 회복시키며 또 근위축을 방지할 수 있다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 平하고(약간 따뜻하다[微溫]고도 한다) 맛은 쓰고 달며[苦甘](맵다[辛]고도 한다) 독이 없다. 독풍(毒風)으로 다리에 힘이 없는 것과 풍, 한, 습으로 생긴 비증(痺證)과 신기(腎氣)가 허약하여 허리와 무릅이 뻣뻣하면서 아픈 것을 낫게 한다. 늙은이에게 아주 좋은데 오줌을 참지 못하거나 조절하지 못하는 것을 낫게 한다.","-뿌리는 길고 가닥진 것을 많이 쳐서 생김새가 개의 등뼈와 같기 때문에 이름을 구척이라 한 것이다. 그 살은 청록색이다. 음력 2월과 8월에 뿌리를 캐 햇볕에 말린다[본초]","-생김새가 개의 등뼈와 같고 노란 솜털 같은 것이 있는 것이 좋기 때문에 금모구척(金毛狗脊)이라고 한다. 불에 그을려 털을 없애고 술에 버무려 쪄서 햇볕에 말려 쓴다[입문]"]}]],"searchText":"狗脊 고비 분류 補益藥-補陽藥 기원 방각궐과 다년생 樹蕨(고사리 궐)인 금모구척의 뿌리모양 줄기 性味 歸經 效能 主治 備考 苦甘 溫 肝 腎 補肝腎<br>除風濕<br>健腰脚<br>利關節 腰背酸疼, 膝痛脚弱, 寒濕周痺, 失溺尿頻, 遺精, 白帶  약물특징/비교 -腰脊의 酸痛을 治療하는데 그 效能이 杜仲과 비슷하고, 關節通利, 風濕痺痛는 巴戟天과 비숫하나, ․杜仲은 肝腎을 補益하는 作用이 强하고 겸하여 安胎시키고, ․巴戟天은 質潤不燥하고 風濕을 溫散시키는 作用이 强하지 않고 補腎壯陽의 效能이 더욱 좋다. ․腰膝痠痛이 肝腎不足에 속하고 겸하여 風濕이 많은 者는 狗脊을 多用 ․그렇지 않고 다만 腎虛에는 杜仲을 適用 ․腎虛陽痿나 腰膝無力者에게는 巴戟天을 多用 -狗脊의 根莖上에 茸毛는 外傷出血에 外敷하여 止血시키고 生肌시키는데 應用 진존인본초 -허약성 풍습에 의한 만성적인 통증을 치료하는 효능이 있다. 체질이 허약하여 만성적인 통증이 소퇴되지 않을경우에 狗脊을 복용하면 허약보강, 풍습제거, 근골강화한다. -근위축의 치료에 常用된다. 특히, 소아마비 초기에 狗脊을 사용하면 마비를 조기에 회복시키며 또 근위축을 방지할 수 있다. 동의보감 -성질은 平하고(약간 따뜻하다[微溫]고도 한다) 맛은 쓰고 달며[苦甘](맵다[辛]고도 한다) 독이 없다. 독풍(毒風)으로 다리에 힘이 없는 것과 풍, 한, 습으로 생긴 비증(痺證)과 신기(腎氣)가 허약하여 허리와 무릅이 뻣뻣하면서 아픈 것을 낫게 한다. 늙은이에게 아주 좋은데 오줌을 참지 못하거나 조절하지 못하는 것을 낫게 한다. -뿌리는 길고 가닥진 것을 많이 쳐서 생김새가 개의 등뼈와 같기 때문에 이름을 구척이라 한 것이다. 그 살은 청록색이다. 음력 2월과 8월에 뿌리를 캐 햇볕에 말린다[본초] -생김새가 개의 등뼈와 같고 노란 솜털 같은 것이 있는 것이 좋기 때문에 금모구척(金毛狗脊)이라고 한다. 불에 그을려 털을 없애고 술에 버무려 쪄서 햇볕에 말려 쓴다[입문]"},{"id":197 "동의보감","lines":["-성질은 따뜻하고[溫] 맛은 매우며[辛] 독이 없다. 모든 기병[氣]과 명치 아래와 배가 아프며 음식에 체하여 소화되지 않는 것과 설사와 적백이질을 낫게 한다. 비위(脾胃)를 덥게[煖] 하며 태동[胎]으로 통증을 멈추게 하고 곽란을 낫게 한다.","-모양은 백두구와 비슷한데 약간 검은 것은 익지인과 비슷하다. 음력 7-8월에 받는다[본초]","-백두구를 사약(使藥)으로 쓰면 폐(肺)에 들어가고 인삼, 익지인을 사약으로 쓰면 비(脾)에 들어간다. 황백과 흰솔풍령을 사약으로 쓰면 신(腎)에 들어가고 적석지와 백석지[赤白石脂]를 사약으로 쓰면 대장과 소장에 들어간다[탕액].","-또한 사인(砂仁)이라고도 한다. 수족태음경과 양명경 족소음경에 들어간다. 약한 불에 고소하게 닦아 손으로 비벼 껍질을 버리고 속씨만 받아 짓찧어서 쓴다[입문]"]}]],"searchText":"縮砂蜜 砂仁 분류 芳香化濕藥 기원 生薑科에 속한 多年生 草本인 陽春砂와 海南砂 또는 縮砂의 成熟한 果實 性味 歸經 效能 主治 備考 辛 溫 脾 胃 腎 化濕開胃<br>溫脾止瀉<br>理氣安胎 濕濁中阻, 脘痞不飢, 脾胃虛寒, 嘔吐泄瀉, 姙娠惡阻, 胎動不安  약물특징/비교 -化濕, 行氣, 溫中시키는데 常用하는 要藥이 된다. -本品은 性이 溫하면서도 燥烈하지 않고, 行氣하되 破氣하지 않은 長點 본초문답 -寒水犯中宮, 上吐下瀉, 爲藿亂洞泄, 乾薑溫中故主之, 砂仁白寇良薑亦治之(p152) -砂仁辛澁, 正入大腸(p171) -其臟寒者, 水不化氣而停飮, 宜砂仁/白寇/莞花/茯笭, 以溫利之(p212) 진존인본초 -健胃効果가 현저하여 각종만성위병(항상 동통이 나타나고 공복시 더욱 심하여 음식물을 약간 섭취하거나 胃部를 온화하게 하거나 안마하면 완화되며 無氣力‧食少‧胃酸 또는 淸水를 투출 하는 등의 증상)에는 砂仁을 사용하는 것이 최적이다. -만성장염으로 장기간 멎지 않는 오래된 설사를 치료하는데 砂仁과 白朮, 扁豆, 堆山藥등을 配合한 蔘苓白朮散은 砂仁의 溫한 약성에 의하여 止瀉목적을 달성한다. 경악전서 八九 味辛微苦하며 氣溫이라 和脾行氣하야 消食逐寒하며 除霍亂, 止惡心. 消脹滿, 安氣滯之胎하며 却腹痛하며 治臟寒之瀉하며 止小便洩痢하며 快胸膈開痰하며 平氣逆欬嗽, 口齒浮熱하며 止女子崩中, 鬼氣奔豚이라 欲其溫暖이면 須用炒用하며. 入肺腎膀胱이면 各隨使引하며 亦善消化銅鐵骨哽이라 동의보감 -성질은 따뜻하고[溫] 맛은 매우며[辛] 독이 없다. 모든 기병[氣]과 명치 아래와 배가 아프며 음식에 체하여 소화되지 않는 것과 설사와 적백이질을 낫게 한다. 비위(脾胃)를 덥게[煖] 하며 태동[胎]으로 통증을 멈추게 하고 곽란을 낫게 한다. -모양은 백두구와 비슷한데 약간 검은 것은 익지인과 비슷하다. 음력 7-8월에 받는다[본초] -백두구를 사약(使藥)으로 쓰면 폐(肺)에 들어가고 인삼, 익지인을 사약으로 쓰면 비(脾)에 들어간다. 황백과 흰솔풍령을 사약으로 쓰면 신(腎)에 들어가고 적석지와 백석지[赤白石脂]를 사약으로 쓰면 대장과 소장에 들어간다[탕액]. -또한 사인(砂仁)이라고도 한다. 수족태음경과 양명경 족소음경에 들어간다. 약한 불에 고소하게 닦아 손으로 비벼 껍질을 버리고 속씨만 받아 짓찧어서 쓴다[입문]"},{"id":213,"name":"益智仁","aliases":["益智子"],"category":"補益藥-補氣藥","origin":"생강과에 속한 多年生 草本인 益智의 果實","initial":"기타","sortName":"益智仁","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","脾 腎","溫脾<br>暖腎<br>固氣<br>澀精","冷氣腹痛, 中寒吐瀉, 多唾, 遺精, 小便餘瀝, 夜多小便",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["생강과에 속한 多年生 草本인 益智의 果實"]}],["table",{"header":["性味","歸經","效 能消宿食, 解酒毒, 除痰癖, 宣壅滯, 溫中快氣하니 治腹脹積聚, 心腹疼痛喘急하며 通關節, 利九竅하며 逐五鬲‧奔豚‧膀胱諸氣하며 殺三蟲하며 除脚氣하며 療諸瘧瘴癘濕邪라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-모든 풍을 없애며 모든 기를 내려가게 한다. 뼈마디와 9규를 순조롭게 하며 먹은 것을 잘 삭이고 물을 잘 몰아낸다[逐]. 담벽(痰癖), 수종, 징결을 낫게 하며 5장 6부에 막혀 있는 기를 잘 퍼지게 하고 돌게 한다.","-영남지방에서 나는데 과실 대신 먹는다. 남방은 기후가 더워 이것을 먹지 않으면 장기와 역려를 막아낼 수 없다고 한다. 그 열매는 봄에 열리며 여름에 익는다. 그러나 그 살은 썩기 쉽기 때문에 먼저 잿물에 삶아 익혀서 약한 불기운에 말려야 오래 둘 수 있다.","-잘고 맛이 단것을 산빈랑(山檳榔)이라 하고 크고 맛이 떫은 것을 저빈랑(猪檳榔)이라 한다. 제일 작은 것을 납자라 하는데 그 지방 사람들은 빈랑손(檳榔孫)이라고 한다.","-끝이 뾰족하고 길며 자줏빛 무늬가 있는 것을 빈(檳)이라 하고 둥글고 짤막한 것을 낭(榔)이라 한다. 지금은 그렇게 세분하지 않고 다만 닭의 염통 비슷하면서 바로 세워 놓을 수 있고 속이 비어 있지 않으며 깨뜨릴 때 비단 무늬 같은 것이 나타나면 좋은 것으로 본다.","-뾰족하고 긴 것을 골라 쓰는 것은 빨리 효과를 보기 위한 것이다[본초]","-양지 쪽을 향한 것은 빈랑이고 음지 쪽을 향한 것은 대복자(大腹子)이다. 가라앉는 성질이 있고 쇠나 돌같이 무겁다. 빛이 흰 것은 맛이 맵고[辛] 기를 잘 헤치며 벌건 것은 맛이 쓰고[苦] 떫으며[澁] 벌레를 죽인다[입문]","-칼로 밑을 긁어 버리고 잘게 썬다. 빨리 효과를 내려면 생것대로 써야 한다. 불에 닦으면 약힘이 없어진다. 효과를 천천히 내려면 약간 닦거나 식초에 삶아서 쓴다[입문]"]}]],"searchText":"檳榔 분류 驅蟲藥 기원 棕櫚科 교목인 빈랑의 성숙한 종자 性味 歸經 效能 主治 備考 苦辛 溫 脾 胃 大腸 殺蟲<br>破積<br>下氣<br>行水 蟲積, 食滯, 脘腹脹痛, 瀉痢後重, 瘧疾, 水腫, 脚氣痰癖, 癥結 檳榔 辛 微溫 脾 胃 大腸 小腸 下氣寬中<br>行水消腫 濕阻氣滯, 脘腹脹悶, 大便不爽, 水腫脹滿, 脚氣浮腫, 小便不利 大腹皮 약물특징/비교 -殺蟲作用이 비교적 광범위 -南瓜子와 同用하면 더욱 현저한 효과 본초문답 -檳榔 主降(p76) -檳榔是木之子 其性多沈 故治小腹疝氣 然沈降之性 自上而下 故檳榔亦能兼利胸膈 且味不烈 故降性亦緩(p82) -橘‧朴‧檳榔之去濕 以木疎土也(p165) -凡積皆是血中氣滯 而行氣用沈香 檳郞 而行血兼用當歸 川芎(p216) 진존인본초 -蟲體에 弛緩性痲痺를 일으키는 작용이 있고 또 경미한 瀉下作用도 있으므로 보통 복약한후 12-24시간이내에 충체를 체외로 배출시킬수가 있다. -消積效能이 뛰어나서 소화불량에 기인하는 胃腸道積滯, 上下腹脹痛, 大便不良의 치료에 사용된다. 경악전서 二一六 味辛澁, 微苦微甘하고 氣微溫하며 味厚氣薄하야 降中有升하며 陰中陽也라 能消宿食, 解酒毒, 除痰癖, 宣壅滯, 溫中快氣하니 治腹脹積聚, 心腹疼痛喘急하며 通關節, 利九竅하며 逐五鬲‧奔豚‧膀胱諸氣하며 殺三蟲하며 除脚氣하며 療諸瘧瘴癘濕邪라 동의보감 -모든 풍을 없애며 모든 기를 내려가게 한다. 뼈마디와 9규를 순조롭게 하며 먹은 것을 잘 삭이고 물을 잘 몰아낸다[逐]. 담벽(痰癖), 수종, 징결을 낫게 하며 5장 6부에 막혀 있는 기를 잘 퍼지게 하고 돌게 한다. -영남지방에서 나는데 과실 대신 먹는다. 남방은 기후가 더워 이것을 먹지 않으면 장기와 역려를 막아낼 수 없다고 한다. 그 열매는 봄에 열리며 여름에 익는다. 그러나 그 살은 썩기 쉽기 때문에 먼저 잿물에 삶아 익혀서 약한 불기운에 말려야 오래 둘 수 있다. -잘고 맛이 단것을 산빈랑(山檳榔)이라 하고 크고 맛이 떫은 것을 저빈랑(猪檳榔)이라 한다. 제일 작은 것을 납자라 하는데 그 지방 사람들은 빈랑손(檳榔孫)이라고 한다. -끝이 뾰족하고 길며 자줏빛 무늬가 있는 것을 빈(檳)이라 하고 둥글고 짤막한 것을 낭(榔)이라 한다. 지금은 그렇게 세분하지 않고 다만 닭의 염통 비슷하면서 바로 세워 놓을 수 있고 속이 비어 있지 않으며 깨뜨릴 때 비단 무늬 같은 것이 나타나면 좋은 것으로 본다. -뾰족하고 긴 것을 골라 쓰는 것은 빨리 효과를 보기 위한 것이다[본초] -양지 쪽을 향한 것은 빈랑이고 음지 쪽을 향한 것은 대복자(大腹子)이다. 가라앉는 성질이 있고 쇠나 돌같이 무겁다. 빛이 흰 것은 맛이 맵고[辛] 기를 잘 헤치며 벌건 것은 맛이 쓰고[苦] 떫으며[澁] 벌레를 죽인다[입문] -칼로 밑을 긁어 버리고 잘게 썬다. 빨리 효과를 내려면 생것대로 써야 한다. 불에 닦으면 약힘이 없어진다. 효과를 천천히 내려면 약간 닦거나 식초에 삶아서 쓴다[입문]"},{"id":218,"name":"烏藥","aliases":[],"category":"理氣藥","origin":"樟科(녹나무과) 상록관목인 오약의 塊根","initial":"기타","sortName":"烏藥","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","脾 肺 腎 膀胱","順氣<br>開鬱<br>散寒<br>止痛","氣逆胸腹脹痛, 宿食不消, 反胃吐食, 寒疝, 脚氣, 小便頻數",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["理氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["樟科(녹나무과) 상록관목인 오약의 塊根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","脾 肺 腎 膀胱","順氣<br>開鬱<br>散寒<br>止痛","氣逆胸腹脹痛, 宿食不消, 反胃吐食, 寒疝, 脚氣, 小便頻數",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-위로는 脾肺로 들어가서 胸腹의 氣滯를 疏暢시키고","-아래로는 腎 膀胱에 達하여 능히 溫腎散寒","-香附子 木香 烏藥은 모두 理氣止痛의 常用藥이나","․香附子는 疏肝解鬱과 調經止痛의 效能이 뛰어나 肝氣鬱滯로 인한 脇痛과 月經不調, 痛經등에 多用","․木香은 腸胃氣滯를 調和하고 또 消食作用이 있어 腸胃寒食氣滯로 脘腹脹痛하고 瀉痢後重하는데 效能","․烏藥은 下焦의 氣를 善行시키고 溫腎散寒하여 膀胱의 冷氣를 치료하여 小便頻數에 效力이"]}],["sec",{"key":"qna","label":"본초문답","lines":["-烏藥色紫, 入血分, 又溫氣, 入肝, 肝主血室, 故烏藥入血室而散寒. 『本經』言治膀胱腎間冷氣, 則指血室中之冷氣也(p154)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-腸胃의 유동을 촉진하고 가스를 배출하며 경련을 완해하여 止痛効果를 나타낸다.","-情緖憂鬱, 焦慮상태는 胸脇悶脹, 식욕부진증상을 초래하여 식후의 脹悶이 더욱 심해진다. 이런증상에는 烏藥을 사용하여 解鬱, 通氣, 消脹의 효과를 올리도록 한다.","-소아의 야뇨증이나 노인의 체허로 인한 요척추통증 및 頻尿를 치료하는데 효과가 있다. 축천환은 烏藥을 君藥으로 하고 익지인을 加味하는 것이다.","-烏藥의 揮發油를 內服했을때는 대뇌피질을 흥분시키는 작용이 있으며 또 호흡촉진, 심근흥분, 혈액순환가속, 혈압상승, 發汗등 작용이 일어난다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百五五 氣味辛溫하야 善行諸氣하니 入脾‧胃‧肝‧腎‧三焦‧膀胱諸經이라 療中惡鬼氣蠱毒하며 開胸膈하며 除一切冷氣하야 止心腹疼痛, 喘急霍亂, 反胃脹滿하며 溫腸胃, 行宿食, 止瀉痢라 除天行疫瘴, 氣厥頭痛, 膀胱腎氣攻衝心腹, 疝氣脚氣, 癰疽疥癩, 及婦人血氣, 小兒蟲積하며 亦止小便頻數, 氣淋帶濁하며 幷猫犬百病에 俱可磨汁灌治之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하며[溫] 맛이 맵고[辛] 독이 없다. 모든 기병과 냉병을 낫게 하며 중악으로 명치 아래가 아픈 것, 주오와 헛것에 들린 것을 낫게 하고 방광과 신의 냉기가 등심으로 치미는 것을 낫게 한다. 곽란과 반위, 구토, 설사, 이질, 옹종, 옴, 문둥병을 낫게 하고 오줌이 술술 자주 나가는 것, 부인의 혈, 기로 오는 통증 등을 낫게 하며 어린이 뱃속의 여러 가지 충을 죽인다.","-천태(天台)에서 나는 것이 좋다. 희면서 퍼석퍼석하여[虛軟] 뿌리의 무늬가 수레바퀴 비슷하며 생김새가 구슬을 꿰놓은 것 같은 것이 좋다[본초]","-족양명경, 족소음경에 들어간다. 영남 지방에서 나는 것은 빛이 갈색이면서 단단하다. 다른 지방에서 나는 것도 좋다. 껍질과 심을 버리고 약간 닦아서[略炒] 쓴다. 갈아서 달임약에 타 먹기도 한다[입문]"]}]],"searchText":"烏藥 분류 理氣藥 기원 樟科(녹나무과) 상록관목인 오약의 塊根 性味 歸經 效能 主治 備考 辛 溫 脾 肺 腎 膀胱 順氣<br>開鬱<br>散寒<br>止痛 氣逆胸腹脹痛, 宿食不消, 反胃吐食, 寒疝, 脚氣, 小便頻數  약물특징/비교 -위로는 脾肺로 들어가서 胸腹의 氣滯를 疏暢시키고 -아래로는 腎 膀胱에 達하여 능히 溫腎散寒 -香附子 木香 烏藥은 모두 理氣止痛의 常用藥이나 ․香附子는 疏肝解鬱과 調經止痛의 效能이 뛰어나 肝氣鬱滯로 인한 脇痛과 月經不調, 痛經등에 多用 ․木香은 腸胃氣滯를 調和하고 또 消食作用이 있어 腸胃寒食氣滯로 脘腹脹痛하고 瀉痢後重하는데 效能 ․烏藥은 下焦의 氣를 善行시키고 溫腎散寒하여 膀胱의 冷氣를 치료하여 小便頻數에 效力이 본초문답 -烏藥色紫, 入血分, 又溫氣, 入肝, 肝主血室, 故烏藥入血室而散寒. 『本經』言治膀胱腎間冷氣, 則指血室中之冷氣也(p154) 진존인본초 -腸胃의 유동을 촉진하고 가스를 배출하며 경련을 완해하여 止痛効果를 나타낸다. -情緖憂鬱, 焦慮상태는 胸脇悶脹, 식욕부진증상을 초래하여 식후의 脹悶이 더욱 심해진다. 이런증상에는 烏藥을 사용하여 解鬱, 通氣, 消脹의 효과를 올리도록 한다. -소아의 야뇨증이나 노인의 체허로 인한 요척추통증 및 頻尿를 치료하는데 효과가 있다. 축천환은 烏藥을 君藥으로 하고 익지인을 加味하는 것이다. -烏藥의 揮發油를 內服했을때는 대뇌피질을 흥분시키는 작용이 있으며 또 호흡촉진, 심근흥분, 혈액순환가속, 혈압상승, 發汗등 작용이 일어난다. 경악전서 百五五 氣味辛溫하야 善行諸氣하니 入脾‧胃‧肝‧腎‧三焦‧膀胱諸經이라 療中惡鬼氣蠱毒하며 開胸膈하며 除一切冷氣하야 止心腹疼痛, 喘急霍亂, 反胃脹滿하며 溫腸胃, 行宿食, 止瀉痢라 除天行疫瘴, 氣厥頭痛, 膀胱腎氣攻衝心腹, 疝氣脚氣, 癰疽疥癩, 及婦人血氣, 小兒蟲積하며 亦止小便頻數, 氣淋帶濁하며 幷猫犬百病에 俱可磨汁灌治之라 동의보감 -성질은 따뜻하며[溫] 맛이 맵고[辛] 독이 없다. 모든 기병과 냉병을 낫게 하며 중악으로 명치 아래가 아픈 것, 주오와 헛것에 들린 것을 낫게 하고 방광과 신의 냉기가 등심으로 치미는 것을 낫게 한다. 곽란과 반위, 구토, 설사, 이질, 옹종, 옴, 문둥병을 낫게 하고 오줌이 술술 자주 나가는 것, 부인의 혈, 기로 오는 통증 등을 낫게 하며 어린이 뱃속의 여러 가지 충을 죽인다. -천태(天台)에서 나는 것이 좋다. 희면서 퍼석퍼석하여[虛軟] 뿌리의 무늬가 수레바퀴 비슷하며 생김새가 구슬을 꿰놓은 것 같은 것이 좋다[본초] -족양명경, 족소음경에 들어간다. 영남 지방에서 나는 것은 빛이 갈색이면서 단단하다. 다른 지방에서 나는 것도 좋다. 껍질과 심을 버리고 약간 닦아서[略炒] 쓴다. 갈아서 달임약에 타 먹기도 한다[입문]"},{"id":219,"name":"龍眼肉","aliases":[],"category":"補益藥-補血藥","origin":"無患子科에 속한 常綠喬木인 龍眼의 假種皮","initial":"기타","sortName":"龍眼肉","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","心 脾","補益心脾<br>養血安神","氣血不足, 心悸怔忡<br>健忘失眠, 血虛萎黃",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補血藥"]} 痛이 풍습에 의해 일어난 경우에 거습진통의 효과가 있다. 특히 요부에서 하지에 걸친 통증에 비교적 확실한 효과가 나타난다.","-소화흡수를 돕고 穢濁의 氣를 배설하며 下痢, 嘔吐를 멎게하는 효능이 있다. 여름에 더위나 습기 때문에 급격히 嘔吐, 下痢, 腹痛이 일어나고 심해서 배복근경련을 일으켰을 때에는 苡仁, 蠶砂, 黃蓮, 吳茱萸등과 함께 服用한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二一三 味酸, 氣溫하며 用此者는 用其酸斂이니 酸能走筋하며 斂能固脫이며 入脾肺肝腎四經하며 亦善和胃라. 得木味之正, 故로 尤專入肝하야 益筋走血하니 療腰膝無力하며 脚氣引經에 所不可缺이라 氣滯能和하고 氣脫能固하야 以能平胃, 故로 除嘔逆霍亂轉筋하며 降痰去濕行水하며 以其酸收, 故로 可斂肺禁痢하며 止煩滿하며 止渴이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하며[溫] 맛이 시고[酸] 독은 없다. 곽란으로 몹시 토하고 설사하며 계속 쥐가 이는 것을 치료하며 소화를 잘 시키고 이질 뒤의 갈증을 멎게 한다. 또한 분돈(奔豚), 각기(脚氣), 수종(水腫), 소갈, 구역,담연이 있는 것 등을 치료한다. 또한 힘줄과 뼈를 든든하게 하고 다리와 무릎에 힘이 없는 것을 낫게 한다.","-모과는 남방에서 나는데 그 나뭇가지의 생김새는 벚꽃과 같으며 열매 속의 칸이 막혔으며 그 속에 씨가 있다. 씨모양은 하늘타리씨(과루인)와 같다. 불에 말려 쓰는데 아주 향기롭다. 음력 9월에 딴다.","-열매는 작은 참외 같으며 시큼하기는 하나 먹을 수 있다. 그러나 이와 뼈를 상하기 때문에 많이 먹지 말아야 한다.","-이것은 간에 들어가기 때문에 힘줄과 혈을 보한다.","-쇠붙이에 대지 말고 구리칼로 껍질과 씨를 긁어 버리고 얇게 썰어서 볕에 말린다.","-모과는 나무의 정기를 받았기 때문에 힘줄에 들어간다. 연백상을 바르면 신맛이 없어진다. 이것은 금(金)의 억제를 받기 때문이다[본초]","-모과의 열매는 박 같은 것이 좋다. 수족태음경(手足太陰經)에 들어가기 때문에 폐를 도와주고 습을 없애며 위를 고르게 하고 비(脾)를 자양한다[입문]"]}]],"searchText":"木瓜 모과 분류 祛風濕藥-舒筋活絡藥 기원 장미과 落葉관목인 모과나무와 명자꽃의 성숙한 과실 性味 歸經 效能 主治 備考 酸 溫 肝 脾 舒筋活絡<br>和胃化濕 濕痺拘攣, 腰膝關節酸重疼痛, 吐瀉轉筋, 脚氣水腫  약물특징/비교 -비교적 良好한 舒筋活絡의 作用 -吐利過多로 인한 足痺攣急을 緩解 본초문답 -凡脚氣, 寒澁者多, 宜以溫藥爲主, 再加木瓜‧薏苡仁‧牛膝爲引導, 所以利脚下之濕也(p163) 진존인본초 -關節痠痛이 풍습에 의해 일어난 경우에 거습진통의 효과가 있다. 특히 요부에서 하지에 걸친 통증에 비교적 확실한 효과가 나타난다. -소화흡수를 돕고 穢濁의 氣를 배설하며 下痢, 嘔吐를 멎게하는 효능이 있다. 여름에 더위나 습기 때문에 급격히 嘔吐, 下痢, 腹痛이 일어나고 심해서 배복근경련을 일으켰을 때에는 苡仁, 蠶砂, 黃蓮, 吳茱萸등과 함께 服用한다. 경악전서 二一三 味酸, 氣溫하며 用此者는 用其酸斂이니 酸能走筋하며 斂能固脫이며 入脾肺肝腎四經하며 亦善和胃라. 得木味之正, 故로 尤專入肝하야 益筋走血하니 療腰膝無力하며 脚氣引經에 所不可缺이라 氣滯能和하고 氣脫能固하야 以能平胃, 故로 除嘔逆霍亂轉筋하며 降痰去濕行水하며 以其酸收, 故로 可斂肺禁痢하며 止煩滿하며 止渴이라 동의보감 -성질은 따뜻하며[溫] 맛이 시고[酸] 독은 없다. 곽란으로 몹시 토하고 설사하며 계속 쥐가 이는 것을 치료하며 소화를 잘 시키고 이질 뒤의 갈증을 멎게 한다. 또한 분돈(奔豚), 각기(脚氣), 수종(水腫), 소갈, 구역,담연이 있는 것 등을 치료한다. 또한 힘줄과 뼈를 든든하게 하고 다리와 무릎에 힘이 없는 것을 낫게 한다. -모과는 남방에서 나는데 그 나뭇가지의 생김새는 벚꽃과 같으며 열매 속의 칸이 막혔으며 그 속에 씨가 있다. 씨모양은 하늘타리씨(과루인)와 같다. 불에 말려 쓰는데 아주 향기롭다. 음력 9월에 딴다. -열매는 之良劑라 至如斷瘧疾, 安久痢, 活血治風하며 療癰腫瘰癧, 風濕瘡瘍, 及一切冷氣 腸風宿疾하니 總由其溫固收斂之功이며 血氣固則眞元復하며 眞元復則邪自散也라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-何首烏(湯液-草部,1957)","․강원도에서는 은조롱이라고 하고 황해도에서는 새박뿌리라 하는데 성질은 평(平)하고 따뜻하며[溫] 맛은 쓰고 떫고[苦澁](달다[甘]고도 한다) 독이 없다. 나력, 옹종과 5가지 치질을 낫게 하며 여러 해 된 허로로 여윈 것, 담벽, 풍허(風虛)로 몸이 몹시 상한 것을 낫게 한다. 부인이 몸푼 뒤에 생긴 여러 가지 병과 적백대하를 멎게 한다. 혈기를 보하며 힘줄과 뼈를 든든하게 하고 정수(精髓)를 보충하며 머리털을 검게 한다. 또 얼굴빛을 좋게 하고 늙지 않게 하며 오래 살게 한다.","․원래 이름은 야교등(夜交藤)인데 하수오(何首烏)라는 사람이 먹고 큰 효과를 본 데서 하수오라는 이름을 붙이게 되었다. 이 사람은 본래 몸이 약하였고 늙어서는 아내도 자식들도 없었다. 하루는 취해서 밭에 누워 있었는데 한 덩굴에 2줄기가 따로 난 풀의 잎과 줄기가 서너번 서로 감겼다 풀렸다 하는 것이 보였다. 마음에 이상하게 생각되어 마침내 그 뿌리를 캐어 햇볕에 말려 짓찧은 다음 가루내어 술에 타서 7일 동안 먹었더니 그리운 사람이 있었고 백일이 지나서는 오랜 병들이 다 나았다. 10년 후에는 여러 명의 아들을 낳았고 130살이나 살았다.","․덩굴은 자줏빛이고 꽃은 황백색이며 잎은 마와 비슷한데 광택은 없으며 반드시 맞대서 난다. 뿌리가 주먹만하여 붉은 빛, 흰빛의 2가지 종류가 있는데 붉은 것은 수컷이고 흰 것은 암컷이다. 뿌리의 생김새가 아름다운 산처럼 생긴 것이 아주 좋은 것이다.","․늦은 봄, 초가을에 날씨가 맑은 날에 암컷, 수컷을 다 캐어 참대칼이나 구리칼로 겉껍질을 긁어 버리고 얇게 썰어 쪄서 햇볕에 말린다. 일명 교등(交藤), 야합(夜合), 구진등(九眞藤)이라고도 하는데 이 약을 다룰 때는 처음부터 마지막까지 쇠를 대지 말아야 한다. 파, 마늘, 무, 돼지피, 양의 피, 비늘없는 생선을 먹지 말아야 한다. 법제하여 약을 쓸 때는 반드시 붉은 빛이 나는 것과 흰 빛이 나는 것을 합하여 먹어야 효과가 있다[본초]","․쌀 씻은 물에 하룻밤 담갔다가 조각나게 썰어서 햇볕에 말려 짓찧어 부스러뜨린다. 알약을 지으려면 검정콩(흑두) 달인 물에 버무려 찐 다음 햇볕에 말려서 쓴다[입문]"]}]],"searchText":"何首烏 白何首烏 赤何首烏 분류 補益藥-補血藥 기원 蓼科(마디풀과)에 속한 多年生 纏繞草本인 하수오의 塊根 性味 歸經 效能 主治 備考 苦甘澀 溫 肝 心 腎 補肝<br>益腎<br>養血<br>祛風 肝腎陰虧, 血虛頭暈, 慢性肝炎<br>鬚髮早白, 腰膝軟弱, 筋骨酸痛, 遺精<br>崩帶, 久瘧, 久痢<br>癰腫, 瘰癧, 腸風, 痔疾  약물특징/비교 -效能이 熟地黃과 비숫하여 肝腎의 精血이 不足한 證에 兩者를 相須하여 應用 ․熟地黃은 味厚滋膩하여 滋陰作用이 비교적 强 ․何首烏는 性質이 溫和하고 燥하여 肝經에 들어가 養血하고, 腎經에 들어가 精을 補하며, 補하되 膩滯하지 않고 虛證에 대하여 補하지 않는 것이 없어 더욱 適用함이 마땅하다. -生用하면 補益시키는 效能이 弱, 收斂시키는 效能이 없어 → 臨床에선 生用으로 使用 × 진존인본초 -자양보혈의 효능을 가지며 약성은 은화하고 조열하지도 않고 胃에 부담을 주지도 않으므로 補身劑로서 널리 사용한다. -建腦安神의 효능이 있어서 신경쇠약치료의 要藥이 된다. -허약한 부인으로 월경이 조속히 오고 量多하여 5일이상 계속되며 經色紅淡인 것은 빈혈기허에 속하며 固經이 안되는 상태이므로 치료에는 熟地, 生地, 當歸, 黃芪를 쓰지만 何首烏를 추가하면 補血固經의 효능이 더욱더 강해진다. -腸의 콜레스테롤 흡수량을 감소하고 콜레스테롤이 간장내에 침착하는 것을 저하는 작용이 있다. 경악전서 百八 味甘澁微苦하며 陰中有陽이며 性溫이라 此其甘은 能補하며 澁은 能固하며 溫은能養陽이라 雖曰肝腎之藥이라하나 然이나 白者는 入氣分, 赤者는 入血分하 /* 본초요약 2004 본초사전 — 클라이언트 로직 */
"use strict";

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

const ENTRIES = DATA;
const TOTAL = ENTRIES.length;
$('#counter').textContent = '총 ' + TOTAL + ' 항목';

const state = { query: '', cat: '', initial: '', sort: 'book', active: 0 };

/* ---------- 유틸 ---------- */
function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
/* <u>, <br> 인라인 태그는 보존한 채 이스케이프 */
function escKeep(s) {
  return esc(s).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>')
                .replace(/&lt;br&gt;/g, '<br>');
}
function stripU(s) {
  let t = String(s);
  while (t.startsWith('<u>')) t = t.slice(3);
  if (t.endsWith('</u>')) t = t.slice(0, -4);
  return t;
}

const BULLET = /^([-\u2010-\u2015\u2024\u2022\u2027\u00B7\u25AA\u25CF\u25A0\u25C6\u25CB\u25B8\u25BA]|\u2295|\u25C9|\u2605|\u2731|\u2023)/;

/* ---------- 섹션 내용(hwp 줄 배열) → HTML ---------- */
function renderLines(lines) {
  const out = [], items = [], paras = [];
  const flushItems = () => { if (items.length) { out.push('<ul>' + items.join('') + '</ul>'); items.length = 0; } };
  const flushParas = () => { if (paras.length) { out.push('<p>' + paras.join('<br>') + '</p>'); paras.length = 0; } };
  for (const raw of lines || []) {
    const s = String(raw);
    const body = stripU(s).trim();
    if (!body) { continue; }
    if (BULLET.test(body)) {
      flushParas();
      const wasU = s.trim().startsWith('<u>');
      let text = body.replace(BULLET, '').replace(/^[\s:：\u00A0]+/, '');
      if (wasU) text = '<u>' + text + '</u>';
      items.push('<li>' + escKeep(text) + '</li>');
    } else {
      flushItems();
      paras.push(escKeep(s.trim()));
    }
  }
  flushItems(); flushParas();
  return out.join('');
}
/* ---------- 표 ---------- */
function renderTable(t) {
  if (!t) return '';
  const head = t.header || [], body = t.body || [];
  const thead = head.length
    ? '<thead><tr>' + head.map(c => '<th>' + escKeep(c || '') + '</th>').join('') + '</tr></thead>' : '';
  const tbody = body.length
    ? '<tbody>' + body.map(row =>
        '<tr>' + (row || []).map(c => '<td>' + escKeep(c || '') + '</td>').join('') + '</tr>'
      ).join('') + '</tbody>' : '';
  if (!thead && !tbody) return '';
  return '<table class="spec">' + thead + tbody + '</table>';
}

/* ---------- 항목 본문 ---------- */
function renderItems(items) {
  const html = [];
  for (const it of items || []) {
    const kind = it[0], pl = it[1];
    if (kind === 'sec') {
      if (pl.key === 'category' || pl.key === 'origin' || pl.key === 'efficacy') continue;
      const cls = (pl.key === 'etc') ? 'sec etc' : 'sec';
      html.push('<section class="' + cls + '"><h3>' + esc(pl.label) +
                '</h3><div class="body">' + renderLines(pl.lines) + '</div></section>');
    } else if (kind === 'table') {
      html.push(renderTable(pl));
    } else if (kind === 'sub') {
      html.push('<div class="subhead">' + escKeep(pl) + '</div>');
    } else if (kind === 'para') {
      html.push('<p class="sec-para">' + escKeep(pl) + '</p>');
    }
  }
  return html.join('');
}

/* ---------- 항목 상세 ---------- */
function renderEntry(id) {
  const e = ENTRIES[Math.max(0, Math.min(id, TOTAL - 1))];
  state.active = e.id;
  const h = [];
  h.push('<div class="ent-head">');
  h.push('<div class="numline">本經疏證 순서 제 ' + (e.id + 1) + ' / ' + TOTAL + '</div>');
  h.push('<h2>' + esc(e.name) + '</h2>');
  if (e.aliases && e.aliases.length) {
    h.push('<div class="alias">' + e.aliases.map(esc).join(' · ') + '</div>');
  }
  let cats = '';
  if (e.category) { cats += '<span class="cat main">' + esc(e.category) + '</span>'; }
  let origin = '';
  for (const it of e.items || []) {
    if (it[0] === 'sec' && it[1].key === 'origin') {
      origin = escKeep((it[1].lines || []).join(' '));
      break;
    }
  }
  if (origin) { h.push('<p class="origin"><b>기원</b> · ' + origin + '</p>'); }
  if (!e.table && e.items) {
    for (const it of e.items) {
      if (it[0] === 'sec' && it[1].key === 'efficacy') {
        h.push('<p class="origin"><b>효능</b> · ' + escKeep((it[1].lines || []).join(' ')) + '</p>');
        break;
      }
    }
  }
  if (cats) { h.push('<div class="catrow">' + cats + '</div>'); }
  h.push('</div>');

  const body = renderItems(e.items);

  const prevBtn = e.id > 0
    ? '<button data-nav="' + (e.id - 1) + '">‹ 이전　' + esc(ENTRIES[e.id - 1].name) + '</button>' : '';
  const nextBtn = e.id < TOTAL - 1
    ? '<button data-nav="' + (e.id + 1) + '">' + esc(ENTRIES[e.id + 1].name) + '　다음 ›</button>' : '';
  const nav = (prevBtn || nextBtn) ? '<div class="footnav">' + prevBtn + nextBtn + '</div>' : '';

  const box = $('#entry');
  box.className = '';
  box.innerHTML = h.join('') + body + nav;
  $$('#herbList li').forEach(li => li.className = (li.dataset.id == e.id) ? 'on' : '');
  $('#main').scrollTo({ top: 0, behavior: 'smooth' });
}
/* ---------- 목록 ---------- */
function filtered() {
  let list = ENTRIES.filter(e => {
    if (state.cat && !(e.category || '').includes(state.cat)) return false;
    if (state.initial && e.initial !== state.initial) return false;
    if (state.query) {
      const q = state.query.toLowerCase();
      if (e.name.toLowerCase().includes(q) ||
          (e.aliases || []).some(a => a.toLowerCase().includes(q)) ||
          e.searchText.toLowerCase().includes(q)) return true;
      return false;
    }
    return true;
  });
  if (state.sort === 'alpha') {
    list = list.slice().sort((a, b) => String(a.sortName).localeCompare(String(b.sortName), 'ko'));
  }
  return list;
}

function liFor(e, withNum) {
  const li = document.createElement('li');
  li.dataset.id = e.id;
  if (e.id === state.active) li.className = 'on';
  const num = withNum ? '<span class="idx">' + (e.id + 1) + '</span>' : '';
  const al = (e.aliases && e.aliases.length)
    ? '<span class="al">' + esc(e.aliases.join(', ')) + '</span>' : '';
  li.innerHTML = num + '<span class="nm">' + esc(e.name) + '</span>' + al;
  li.addEventListener('click', () => select(e.id));
  return li;
}

function renderList() {
  const list = filtered();
  const ul = $('#herbList');
  ul.innerHTML = '';
  $('#listEmpty').style.display = list.length ? 'none' : 'block';
  if (!list.length) return;
  if (state.sort === 'alpha') {
    let lastInit = null;
    for (const e of list) {
      if (e.initial !== lastInit) {
        lastInit = e.initial;
        const hd = document.createElement('li');
        hd.className = 'hd';
        hd.textContent = e.initial || '기타';
        ul.appendChild(hd);
      }
      ul.appendChild(liFor(e, false));
    }
  } else {
    for (const e of list) ul.appendChild(liFor(e, true));
  }
}
/* ---------- 색인 / 카테고리 ---------- */
function buildIdx() {
  const order = 'ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
  const set = new Set(ENTRIES.map(e => e.initial));
  const nav = $('#idxRow');
  nav.innerHTML = '';
  const mk = (label, val) => {
    const c = document.createElement('span');
    c.className = 'chip' + (state.initial === val ? ' on' : '');
    c.dataset.v = val;
    c.textContent = label;
    c.addEventListener('click', () => {
      state.initial = (state.initial === val) ? '' : val;
      buildIdx(); renderList();
    });
    nav.appendChild(c);
  };
  mk('전체', '');
  for (const ch of order) if (set.has(ch)) mk(ch, ch);
  if (set.has('기타')) mk('기타', '기타');
}

function buildCats() {
  const m = {};
  ENTRIES.forEach(e => {
    if (!e.category) return;
    const top = e.category.split(/[-,(（\/]/)[0].trim();
    m[top] = (m[top] || 0) + 1;
  });
  const sel = $('#catFilter');
  sel.innerHTML = '<option value="">전체 분류</option>';
  Object.keys(m).sort((a, b) => a.localeCompare(b, 'ko')).forEach(k => {
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k + ' (' + m[k] + ')';
    sel.appendChild(opt);
  });
}

/* ---------- 제어 ---------- */
function select(id) {
  renderEntry(id);
  renderList();
  if (window.innerWidth <= 960) closeSidebar();
}

function closeSidebar() {
  document.body.classList.remove('sidebar-open');
  $('#mask').style.display = 'none';
}
/* ---------- 이벤트 ---------- */
$('#search').addEventListener('input', e => {
  state.query = e.target.value.trim();
  state.initial = '';
  buildIdx(); renderList();
});
$('#catFilter').addEventListener('change', e => {
  state.cat = e.target.value;
  renderList();
});
$$('#sortSeg button').forEach(btn => {
  btn.addEventListener('click', () => {
    state.sort = btn.dataset.sort;
    $$('#sortSeg button').forEach(b => b.className = (b === btn) ? 'on' : '');
    renderList();
  });
});
document.addEventListener('click', e => {
  const t = e.target;
  if (t.matches && t.matches('button[data-nav]')) select(Number(t.dataset.nav));
});
$('#menuBtn').addEventListener('click', () => {
  document.body.classList.add('sidebar-open');
  $('#mask').style.display = 'block';
});
$('#mask').addEventListener('click', closeSidebar);
$('#main').addEventListener('scroll', () => {
  $('#toTop').style.display = $('#main').scrollTop > 400 ? 'block' : 'none';
});
$('#toTop').addEventListener('click', () => $('#main').scrollTo({ top: 0, behavior: 'smooth' }));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') select(Math.min(state.active + 1, TOTAL - 1));
  if (e.key === 'ArrowUp') select(Math.max(state.active - 1, 0));
});

/* ---------- 초기화 ---------- */
buildCats();
buildIdx();
renderList();
renderEntry(0);

</script>
</body>
</html>
