 治療하며 痰이 經絡에 停滯하여 肢體가 麻木하거나 拘急한 證에도 또한 通用하여 治療한다. 그러나 性이 寒하여 傷胃滑腸시키므로 寒嗽便溏者는 服用을 忌"]}],["sec",{"key":"qna","label":"본초문답","lines":["-其用汁者, 或取象人之水津, 如薑汁‧竹瀝, 以去痰飮, 從水津治之也.","-用筋者, ..竹茹象筋脈, 則淸脈絡之熱以和血(p107)"]}],["sec",{"key":"jin","label":"진존인본초","lines":[]}],["sub","竹茹"],["para","-化痰效果가 뛰어나 小兒가 吐痰이 어려워 呼吸困難을 일으킨 경우 +貝母‧遠志‧九節蒼蒲"],["para","-老人이 寒飮하거나 추위에 떨어 딸꾹질이 날 경우 竹茹‧丁香‧柿蒂"],["sub","竹瀝"],["para","-淸熱化痰‧鎭驚止痙의 효능이 있어 痰熱이 차서 일어나는 질환에 효과가 있다."],["para","․腦溢血에 의한 中風으로 神志昏迷‧開口障碍‧痰涎壅盛 등, 癲癎發作의 前兆, 小兒의 驚厥, 破傷風에 의한 肢體痙攣, 小兒의 高熱不退‧汗多口渴 등"],["sec",{"key":"gyeong","label":"경악전서","lines":["竹瀝 百四七 味甘, 性微凉, 陰也, 降也. 治暴中風痰, 失音不語, 胸中煩熱하며 止煩悶消渴이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-죽여(竹茹, 참대속껍질)는 구역, 딸꾹질, 기침하면서 기운이 치미는 것, 폐위로 피를 뱉거나 토하는 것, 코피나는 것, 붕루 등을 낫게 한다. 즉 참대의 푸픈 껍질을 긁어 낸 것이다[본초]","-죽력(竹瀝, 참대기름)은 갑자기 중풍이 된 것, 가슴 속의 심한 열을 주로 낫게 한다. 속이 답답한 것, 갑자기 중풍으로 소리를 내지 못하거나 말 못하는 것, 담열로 정신을 잃는 것 등을 낫게 한다. 또한 소갈을 멎게 하며 파상풍과 몸푼 뒤 열이 나는 것, 어린이 경간 등 모든 위급한 병을 낫게 한다","-고죽력(苦竹瀝)은 입 안이 헌 것을 낫게 하고 눈을 밝게 하며 9규를 잘 통하게 한다[본초]","-참대기름은 생강즙이 아니면 경락에 가지 못한다. 참대기름 6, 생강즙 1의 비례로 배합하여 쓴다[입문]","-기름내는 방법은 잡방에 있다.","-죽황(竹黃)은 즉 참대마디 속에 있는 누르고 흰빛의 물질이다. 맛은 달다[甘]. 광물성 약재의 독으로 나는 열을 없앤다[본초]"]}]],"searchText":"竹茹, 竹瀝 분류 化痰止咳平喘藥-淸化熱痰藥 기원 竹茹는 竹科 솜대의 外皮 제거한 中間層, 竹瀝은 솜대의 莖을 불에 구어서 빼낸 汁液 性味 歸經 效能 主治 備考 甘 微寒 肺 胃 膽 淸熱化痰<br>除煩止嘔 痰熱咳嗽, 膽火挾痰煩熱嘔吐, 驚悸失眠, 中風痰迷, 舌强不語, 胃熱嘔吐, 姙娠惡阻, 胎動不安 竹茹 甘 寒 心 肺 胃 淸熱滑痰<br>鎭痙通竅 熱咳痰稠, 痰熱蒙弊淸竅諸證, 中風痰迷, 驚癎癲狂 竹瀝 약물특징/비교 -(竹茹)脾胃가 虛寒한 者는 服用을 忌 -(竹瀝)效能이 竹茹와 비슷하나 淸熱化痰시키는 作用이 竹茹보다 우수하고 또한 經絡의 停滯된 痰을 透達시켜 痰熱咳嗽를 治療하는 외에 中風不語와 昏迷, 癲癎, 驚厥 등 痰涎이 壅塞된 者에 生薑汁과 同用하여 治療하며 痰이 經絡에 停滯하여 肢體가 麻木하거나 拘急한 證에도 또한 通用하여 治療한다. 그러나 性이 寒하여 傷胃滑腸시키므로 寒嗽便溏者는 服用을 忌 본초문답 -其用汁者, 或取象人之水津, 如薑汁‧竹瀝, 以去痰飮, 從水津治之也. -用筋者, ..竹茹象筋脈, 則淸脈絡之熱以和血(p107) 진존인본초 竹茹 -化痰效果가 뛰어나 小兒가 吐痰이 어려워 呼吸困難을 일으킨 경우 +貝母‧遠志‧九節蒼蒲 -老人이 寒飮하거나 추위에 떨어 딸꾹질이 날 경우 竹茹‧丁香‧柿蒂 竹瀝 -淸熱化痰‧鎭驚止痙의 효능이 있어 痰熱이 차서 일어나는 질환에 효과가 있다. ․腦溢血에 의한 中風으로 神志昏迷‧開口障碍‧痰涎壅盛 등, 癲癎發作의 前兆, 小兒의 驚厥, 破傷風에 의한 肢體痙攣, 小兒의 高熱不退‧汗多口渴 등 경악전서 竹瀝 百四七 味甘, 性微凉, 陰也, 降也. 治暴中風痰, 失音不語, 胸中煩熱하며 止煩悶消渴이라 동의보감 -죽여(竹茹, 참대속껍질)는 구역, 딸꾹질, 기침하면서 기운이 치미는 것, 폐위로 피를 뱉거나 토하는 것, 코피나는 것, 붕루 등을 낫게 한다. 즉 참대의 푸픈 껍질을 긁어 낸 것이다[본초] -죽력(竹瀝, 참대기름)은 갑자기 중풍이 된 것, 가슴 속의 심한 열을 주로 낫게 한다. 속이 답답한 것, 갑자기 중풍으로 소리를 내지 못하거나 말 못하는 것, 담열로 정신을 잃는 것 등을 낫게 한다. 또한 소갈을 멎게 하며 파상풍과 몸푼 뒤 열이 나는 것, 어린이 경간 등 모든 위급한 병을 낫게 한다 -고죽력(苦竹瀝)은 입 안이 헌 것을 낫게 하고 눈을 밝게 하며 9규를 잘 통하게 한다[본초] -참대기름은 생강즙이 아니면 경락에 가지 못한다. 참대기름 6, 생강즙 1의 비례로 배합하여 쓴다[입문] -기름내는 방법은 잡방에 있다. -죽황(竹黃)은 즉 참대마디 속에 있는 누르고 흰빛의 물질이다. 맛은 달다[甘]. 광물성 약재의 독으로 나는 열을 없앤다[본초]"},{"id":87,"name":"吳茱萸","aliases":[],"category":"溫裏藥","origin":"芸香科 吳茱萸의 미성숙한 果實","initial":"기타","sortName":"吳茱萸","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫 有毒","肝 胃","溫中<br>止痛<br>理氣<br>燥濕","嘔逆呑酸, 厥陰頭痛, 臟寒吐瀉, 脘腹脹痛, 脚氣, 疝氣, 口瘡潰瘍, 齒痛, 濕疹",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["溫裏藥"]}],["sec",{"key":"origin","label":"기원","lines":["芸香科 吳茱萸의 미성숙한 果實"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫 有毒","肝 胃","溫中<br>止痛<br>理氣<br>燥濕","嘔逆呑酸, 厥陰頭痛, 臟寒吐瀉, 脘腹脹痛, 脚氣, 疝氣, 口瘡潰瘍, 齒痛, 濕疹",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-厥陰肝經의 主藥으로 肝經鬱火와 胃氣上逆時에 苦寒瀉火하는 黃連과 配伍하여 降逆止嘔하는 反佐의 作用","-溫中散寒의 效能이 있어 乾薑과 비슷한 까닭에 寒鬱中焦로 脘腹疼痛에 乾薑과 같이 사용한다.","․乾薑은 溫上焦하고 溫肺시켜서 化飮, 止咳하고,","․吳茱萸는 溫下焦하여 暖厥陰해서 寒疝을 治하고 助腎陽하여 寒瀉하고 溫營血하여 治經閉(乾薑과 다른점)","-吳茱萸 黃連 乾薑은 모두 止嘔의 效能이 있는데,","․吳茱萸는 肝寒犯胃의 嘔酸을 治療하고","․黃連은 胃中實熱의 嘔苦를 治療하며","․生薑은 胃寒上逆의 嘔水를 治한다"]}],["sec",{"key":"qna","label":"본초문답","lines":["-吳萸小茴, 皆得辛溫木之氣(p55)","-吳萸辛而帶苦, 子性又主下降, 故主降水飮, 行滯氣(p55)","-肝脈亦入腦髓 故仲景用吳茱萸 治腦髓寒痛(p151)","-用吳萸 助腎陽兼達肝陽 陽氣暢卽寒散痛止(p153)","-吳萸等 辛燥之品 正治其寒化之濕(p162)","-呑酸吐酸, ..一是寒濕 .... 宜吳萸 蒼朮 桂枝 生薑(p162)","-吳萸亦辛燥 熟於九月 正得燥金之氣 故去水飮 以燥勝濕也(p171)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-暖胃止痛 : 消化器系 受寒으로 인한 증상에 적합하며, 高熱이 있는 者의 사용은 不可하다.","․胃寒 : 吳茱萸湯 / 制酸작용 : 左金丸(黃芩,吳茱萸 : 上熱下寒)","․腹疝 : 吳茱萸+小茴香‧柴胡‧烏藥","․慢性泄瀉, 새벽臍下隱痛, 腹鳴, 泄瀉, 腹部膨脹 : 四神丸(吳茱萸‧補骨脂‧荳蔲‧五味子)","․부녀의 月經痛에 효과가 있다.","-임상 : 苦味의 하강으로 下腹部질환에 多用"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二二一 味辛苦하며 氣味俱厚하니 升少降多하며 有小毒이라 能助陽健脾하야 治胸膈停寒, 脹滿痞寒하며 化滯消食하야 除呑酸嘔逆霍亂, 心腹畜冷, 中惡絞痛, 寒痰逆氣하며 殺諸蟲鬼魅邪疰하며 及下焦肝腎膀胱寒疝, 陰毒疼痛, 止痛하며 瀉血痢에 厚腸胃하며 去濕氣腸風痔漏, 脚氣水腫이라 然이나 其性苦하야 善降하니 若氣陷而元氣虛者는 當以甘補諸藥으로制而用之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-속을 덥히고 기를 내리게 하며 통증을 멎게 한다. 명치 밑에 냉이 쌓여 비트는 듯이 아픈 것, 여러 가지 냉이 뭉쳐 삭지 않는 것, 中惡으로 명치 밑이 아픈 것 등을 낫게 한다. 곽란으로 토하고 설사하며 쥐가 이는 것을 낫게 하며 담을 삭이고 징벽을 헤치며 습과 어혈로 감각을 모르는 것을 낫게 한다. 腎氣, 脚氣, 胃속의 냉기를 낫게 한다","-잎은 가죽나무 비슷한데 넓고 두터우며 자줏빛이다. 음력 3월에 자줏빛의 꽃이 피고 7-8월에 조피열매(椒子) 비슷한 열매가 열리는데 어릴 때는 약간 노랗고 다 익으면 진한 자줏빛으로 된다. 9월초에 따서 그늘에 말린다[본초]","-족태음경, 소음경, 궐음경에 들어간다. 많이 먹으면 기가 막히고 입을 벌리며 눈을 치뜬다[탕액]","-빛은 청록색이다. 더운물에 담가서 쓴 물을 예닐곱번 우려버린 다음에 쓴다. 혹 소금물이나 황련 우린 물에 축여 볶아서도 쓴다","-법제하는 법은 끓는 물에 한나절 동안 황련과 같이 담가 두었다가 볶아 따로따로 가려서 쓴다[입문]","-우리나라에는 오직 경주에만 있으며 다른 곳에는 없다[속방]"]}]],"searchText":"吳茱萸 분류 溫裏藥 기원 芸香科 吳茱萸의 미성숙한 果實 性味 歸經 效能 主治 備考 辛苦 溫 有毒 肝 胃 溫中<br>止痛<br>理氣<br>燥濕 嘔逆呑酸, 厥陰頭痛, 臟寒吐瀉, 脘腹脹痛, 脚氣, 疝氣, 口瘡潰瘍, 齒痛, 濕疹  약물특징/비교 -厥陰肝經의 主藥으로 肝經鬱火와 胃氣上逆時에 苦寒瀉火하는 黃連과 配伍하여 降逆止嘔하는 反佐의 作用 -溫中散寒의 效能이 있어 乾薑과 비슷한 까닭에 寒鬱中焦로 脘腹疼痛에 乾薑과 같이 사용한다. ․乾薑은 溫上焦하고 溫肺시켜서 化飮, 止咳하고, ․吳茱萸는 溫下焦하여 暖厥陰해서 寒疝을 治하고 助腎陽하여 寒瀉하고 溫營血하여 治經閉(乾薑과 다른점) -吳茱萸 黃連 乾薑은 모두 止嘔의 效能이 있는데, ․吳茱萸는 肝寒犯胃의 嘔酸을 治療하고 ․黃連은 胃中實熱의 嘔苦를 治療하며 ․生薑은 胃寒上逆의 嘔水를 治한다 본초문답 -吳萸小茴, 皆得辛溫木之氣(p55) -吳萸辛而帶苦, 子性又主下降, 故主降水飮, 行滯氣(p55) -肝脈亦入腦髓 故仲景用吳茱萸 治腦髓寒痛(p151) -用吳萸 助腎陽兼達肝陽 陽氣暢卽寒散痛止(p153) -吳萸等 辛燥之品 正治其寒化之濕(p162) -呑酸吐酸, ..一是寒濕 .... 宜吳萸 蒼朮 桂枝 生薑(p162) -吳萸亦辛燥 熟於九月 正得燥金之氣 故去水飮 以燥勝濕也(p171) 진존인본초 -暖胃止痛 : 消化器系 受寒으로 인한 증상에 적합하며, 高熱이 있는 者의 사용은 不可하다. ․胃寒 : 吳茱萸湯 / 制酸작용 : 左金丸(黃芩,吳茱萸 : 上熱下寒) ․腹疝 : 吳茱萸+小茴香‧柴胡‧烏藥 ․慢性泄瀉, 새벽臍下隱痛, 腹鳴, 泄瀉, 腹部膨脹 : 四神丸(吳茱萸‧補骨脂‧荳蔲‧五味子) ․부녀의 月經痛에 효과가 있다. -임상 : 苦味의 하강으로 下腹部질환에 多用 경악전서 二二一 味辛苦하며 氣味俱厚하니 升少降多하며 有小毒이라 能助陽健脾하야 治胸膈停寒, 脹滿痞寒하며 化滯消食하야 除呑酸嘔逆霍亂, 心腹畜冷, 中惡絞痛, 寒痰逆氣하며 殺諸蟲鬼魅邪疰하며 及下焦肝腎膀胱寒疝, 陰毒疼痛, 止痛하며 瀉血痢에 厚腸胃하며 去濕氣腸風痔漏, 脚氣水腫이라 然이나 其性苦하야 善降하니 若氣陷而元氣虛者는 當以甘補諸藥으로制而用之라 동의보감 -속을 덥히고 기를 내리게 하며 통증을 멎게 한다. 명치 밑에 냉이 쌓여 비트는 듯이 아픈 것, 여러 가지 냉이 뭉쳐 삭지 않는 것, 中惡으로 명치 밑이 아픈 것 등을 낫게 한다. 곽란으로 토하고 설사하며 쥐가 이는 것을 낫게 하며 담을 삭이고 징벽을 헤치며 습과 어혈로 감각을 모르는 것을 낫게 한다. 腎氣, 脚氣, 胃속의 냉기를 낫게 한다 -잎은 가죽나무 비슷한데 넓고 두터우며 자줏빛이다. 음력 3월에 자줏빛의 꽃이 피고 7-8월에 조피열매(椒子) 비슷한 열매가 열리는데 어릴 때는 약간 노랗고 다 익으면 진한 자줏빛으로 된다. 9월초에 따서 그늘에 말린다[본초] -족태음경, 소음경, 궐음경에 들어간다. 많이 먹으면 기가 막히고 입을 벌리며 눈을 치뜬다[탕액] -빛은 청록색이다. 더운물에 담가서 쓴 물을 예닐곱번 우려버린 다음에 쓴다. 혹 소금물이나 황련 우린 물에 축여 볶아서도 쓴다 -법제하는 법은 끓는 물에 한나절 동안 황련과 같이 담가 두었다가 볶아 따로따로 가려서 쓴다[입문] -우리나라에는 오직 경주에만 있으며 다른 곳에는 없다[속방]"},{"id":88,"name":"梔子","aliases":[],"category":"淸熱藥-淸熱瀉火藥","origin":"茜草科에 속한 常綠灌木인 치자나무 또는 同屬植物의 成熟한 果實.","initial":"기타","sortName":"梔子","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","心 肺 胃 三焦","淸熱<br>瀉火<br>凉血","熱病虛煩不眠, 黃疸, 淋病, 消渴, 目赤, 咽痛, 吐血, 衄血, 血痢, 尿血, 熱毒瘡瘍, 扭傷腫痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱瀉火藥"]}],["sec",{"key":"origin","label":"기원","lines":["茜草科에 속한 常綠灌木인 치자나무 또는 同屬植物의 成熟한 果實."]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","心 肺 胃 三焦","淸熱<br>瀉火<br>凉血","熱病虛煩不眠, 黃疸, 淋病, 消渴, 目赤, 咽痛, 吐血, 衄血, 血痢, 尿血, 熱毒瘡瘍, 扭傷腫痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-近代에는 梔子를 ⊕肝膽濕熱을 淸利시키는 藥物","․急性黃疸性肝炎, 膽囊炎, 膽石症, 혹은 腎盂腎炎, 尿道炎 등 疾患에 일정한 治療效果를 보고 있다.","-生用하면, 淸熱瀉火의 作用이 强하고, 炒黑하면 止血한다.","-梔子皮는 表에 達하여 肌熱을 去, 梔子仁은 裏로 走하여, 內熱을 淸하게 된다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-梔子味苦象心包, 故瀉心包絡之火(p46)","-梔子苦寒, 有皮膈象心包, 內之子赤, 正屬心之色, 其花色白, 當屬肺金, 結子成赤, 當屬心火, 是爲從肺入心, 正治心中煩熱之藥(p176)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-淸熱瀉火","․고열에 의한 번조불안, 혼황, 섬어 : 黃連‧黃芩‧大黃‧梔子","․口腔‧鼻孔炎症, 咽喉腫痛, 耳道炎症 : 梔子黃連‧金銀花‧連翹","-利膽消黃 : 실험에 의하면 담즙분비를 촉진하고 혈중 빌리루빈 상승을 억제한다.","-利濕消腫의 君藥 : 茵蔯蒿湯(梔子‧茵蔯‧大黃)","-骨折 患部 靑紫色 疼痛, 관절탈구등에 內服 및 外用","-임상 : 火病으로 잠못들 때"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百七六 味苦, 氣寒이나 味厚氣薄하야 氣浮味降하며 陰中有陽이라","因其氣浮, 故로 能淸心肺之火하야 解消渴, 除熱鬱하며 療時疾躁煩, 心中懊憹, 熱悶不得眠, 熱厥頭疼, 耳目風熱赤腫疼痛, 霍亂轉筋하며","因其味降, 故로 能瀉肝腎膀胱之火하야 通五淋하며 治大小腸熱秘熱結, 五種黃疸‧三焦鬱火, 臍下熱鬱疝氣, 吐血衄血, 血痢血淋, 小腹損傷瘀血이라","若用佐使로 治有不同하니 加茵陳이면 除濕熱疸黃하며 加豆豉하면 除心火煩躁하며 加厚朴‧枳實이면 可除煩滿하며 加生薑‧陳皮하면 可除嘔噦하며 同玄胡索이면 破熱滯瘀血腹痛이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-가슴과 대소장에 있는 심한 열과 위 안에 있는 열[胃中熱氣] 그리고 속이 답답한 것[煩悶]을 낫게 한다. 열독을 없애고 5림을 낫게 하며 오줌을 잘 나가게 하고 5가지 황달을 낫게 하며 소갈을 멎게 한다. 입 안이 마르고 눈에 피서며 붓고 아픈 것, 얼굴까지 벌개지는 주사비, 문둥병, 창양(瘡瘍)을 낫게 하고 지충의 독을 없앤다","-잎은 추리나무잎 비슷한데 두껍고 굳으며 음력 2-3월에 흰 꽃이 핀다. 꽃은 다 6잎이며 아주 향기롭다. 늦은 여름, 초가을에 열매가 열린다. 처음에는 푸르다가 익으면 노래지는데 속은 진한 벌건색이다. 음력 9월에 열매를 따서 햇볕에 말린다","-약으로 쓰이는 산치자는 의학책에 나와 있는 월도(越桃)라는 것을 말한다. 껍질이 엷고 둥글며 작고 거푸집에 도드라진 금이 7모[稜] 또는 9모 나는 것이 좋다[본초]","-작고 7모가 난 것이 좋다. 길고 큰 것도 쓸 수 있는데 약 효과가 못하다[단심]","-수태음경에 들어가며 가슴이 답답하고 안타까워 잠 못 자는 증을 낫게 하고 폐화(肺火)를 사한다[탕액]","-속씨를 쓰면 가슴 속의 열을 없애고 껍질을 쓰면 피부의 열을 없앤다. 보통 때는 생것을 쓰고 허화(虛火)에는 동변에 축여 새까맣게 되도록 일곱번정도 볶아서 쓰고 피를 멈추는 데는 먹같이 검게 닦아서 쓴다. 폐와 위를 시원하게 하려면 술에 우려서 쓴다[입문]"]}]],"searchText":"梔子 분류 淸熱藥-淸熱瀉火藥 기원 茜草科에 속한 常綠灌木인 치자나무 또는 同屬植物의 成熟한 果實. 性味 歸經 效能 主治 備考 苦 寒 心 肺 胃 三焦 淸熱<br>瀉火<br>凉血 熱病虛煩不眠, 黃疸, 淋病, 消渴, 目赤, 咽痛, 吐血, 衄血, 血痢, 尿血, 熱毒瘡瘍, 扭傷腫痛  약물특징/비교 -近代에는 梔子를 ⊕肝膽濕熱을 淸利시키는 藥物 ․急性黃疸性肝炎, 膽囊炎, 膽石症, 혹은 腎盂腎炎, 尿道炎 등 疾患에 일정한 治療效果를 보고 있다. -生用하면, 淸熱瀉火의 作用이 强하고, 炒黑하면 止血한다. -梔子皮는 表에 達하여 肌熱을 去, 梔子仁은 裏로 走하여, 內熱을 淸하게 된다. 본초문답 -梔子味苦象心包, 故瀉心包絡之火(p46) -梔子苦寒, 有皮膈象心包, 內之子赤, 正屬心之色, 其花色白, 當屬肺金, 結子成赤, 當屬心火, 是爲從肺入心, 正治心中煩熱之藥(p176) 진존인본초 -淸熱瀉火 ․고열에 의한 번조불안, 혼황, 섬어 : 黃連‧黃芩‧大黃‧梔子 ․口腔‧鼻孔炎症, 咽喉腫痛, 耳道炎症 : 梔子黃連‧金銀花‧連翹 -利膽消黃 : 실험에 의하면 담즙분비를 촉진하고 혈중 빌리루빈 상승을 억제한다. -利濕消腫의 君藥 : 茵蔯蒿湯(梔子‧茵蔯‧大黃) -骨折 患部 靑紫色 疼痛, 관절탈구등에 內服 및 外用 -임상 : 火病으로 잠못들 때 경악전서 百七六 味苦, 氣寒이나 味厚氣薄하야 氣浮味降하며 陰中有陽이라 因其氣浮, 故로 能淸心肺之火하야 解消渴, 除熱鬱하며 療時疾躁煩, 心中懊憹, 熱悶不得眠, 熱厥頭疼, 耳目風熱赤腫疼痛, 霍亂轉筋하며 因其味降, 故로 能瀉肝腎膀胱之火하야 通五淋하며 治大小腸熱秘熱結, 五種黃疸‧三焦鬱火, 臍下熱鬱疝氣, 吐血衄血, 血痢血淋, 小腹損傷瘀血이라 若用佐使로 治有不同하니 加茵陳이면 除濕熱疸黃하며 加豆豉하면 除心火煩躁하며 加厚朴‧枳實이면 可除煩滿하며 加生薑‧陳皮하면 可除嘔噦하며 同玄胡索이면 破熱滯瘀血腹痛이라 동의보감 -가슴과 대소장에 있는 심한 열과 위 안에 있는 열[胃中熱氣] 그리고 속이 답답한 것[煩悶]을 낫게 한다. 열독을 없애고 5림을 낫게 하며 오줌을 잘 나가게 하고 5가지 황달을 낫게 하며 소갈을 멎게 한다. 입 안이 마르고 눈에 피서며 붓고 아픈 것, 얼굴까지 벌개지는 주사비, 문둥병, 창양(瘡瘍)을 낫게 하고 지충의 독을 없앤다 -잎은 추리나무잎 비슷한데 두껍고 굳으며 음력 2-3월에 흰 꽃이 핀다. 꽃은 다 6잎이며 아주 향기롭다. 늦은 여름, 초가을에 열매가 열린다. 처음에는 푸르다가 익으면 노래지는데 속은 진한 벌건색이다. 음력 9월에 열매를 따서 햇볕에 말린다 -약으로 쓰이는 산치자는 의학책에 나와 있는 월도(越桃)라는 것을 말한다. 껍질이 엷고 둥글며 작고 거푸집에 도드라진 금이 7모[稜] 또는 9모 나는 것이 좋다[본초] -작고 7모가 난 것이 좋다. 길고 큰 것도 쓸 수 있는데 약 효과가 못하다[단심] -수태음경에 들어가며 가슴이 답답하고 안타까워 잠 못 자는 증을 낫게 하고 폐화(肺火)를 사한다[탕액] -속씨를 쓰면 가슴 속의 열을 없애고 껍질을 쓰면 피부의 열을 없앤다. 보통 때는 생것을 쓰고 허화(虛火)에는 동변에 축여 새까맣게 되도록 일곱번정도 볶아서 쓰고 피를 멈추는 데는 먹같이 검게 닦아서 쓴다. 폐와 위를 시원하게 하려면 술에 우려서 쓴다[입문]"},{"id":89,"name":"枳實, 枳殼","aliases":[],"category":"理氣藥","origin":"芸香科 常綠소교목 酸橙의 미성숙과","initial":"기타","sortName":"枳實, 枳殼","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛酸 微寒","脾 胃","破氣<br>散痞<br>瀉痰<br>消積","胸腹脹滿, 胸痺, 痞痛, 痰癖, 水腫, 食積, 便秘, 胃下垂, 子宮下垂, 脫肛","枳實"],["苦辛 凉","肺 脾 大腸","破氣<br>行痰<br>消積","胸膈痰滯, 胸痞, 脇脹, 食積, 噫氣, 嘔逆, 下痢後重, 脫肛, 子宮脫垂","枳殼"]]},"items":[["sec",{"key":"category","label":"분류","lines":["理氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["芸香科 常綠소교목 酸橙의 미성숙과"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛酸 微寒","脾 胃","破氣<br>散痞<br>瀉痰<br>消積","胸腹脹滿, 胸痺, 痞痛, 痰癖, 水腫, 食積, 便秘, 胃下垂, 子宮下垂, 脫肛","枳實"],["苦辛 凉","肺 脾 大腸","破氣<br>行痰<br>消積","胸膈痰滯, 胸痞, 脇脹, 食積, 噫氣, 嘔逆, 下痢後重, 脫肛, 子宮脫垂","枳殼"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":[]}],["sub","枳實,枳殼"],["para","-破氣消積의 要藥"],["para","-破氣作用이 비교적 强하므로 正氣를 傷케 할 우려가 있어서 邪實이 아니면 應用×"],["para","-生用하면 그 作用이 더욱 猛烈하므로 麩炒해서 쓰면 비교적 緩慢해진다."],["para","-枳實과 厚朴은 行氣消積藥으로 常用하고, 二者를 配合해서 사용하지만 단 다르게 應用될 때도 있다."],["para","․厚朴은 溫하여 溫中, 燥濕, 散滿하는 特長(寒症에 :寒濕積滯로 胸腹脹滿證을 主로 治療)"],["para","․枳實은 寒하여 消痞除熱하는 效能(寒證에 :濕熱積滯와 胸脘痞滿의 證狀)"],["para","-枳實과 枳殼은 效能이 비슷하나"],["para","․枳實은 破氣作用이 强하고(그래서 消積除痞와 導滯通便에 쓰고)"],["para","․枳殼은 비교적 和緩한다(그래서 理氣寬胸中, 消除脹滿에 사용)"],["sec",{"key":"qna","label":"본초문답","lines":["-..枳殼..皆主降矣(p76)","-枳殼木實, 味比厚朴稍輕, 故理胃氣. 厚朴木皮, 味比枳殼更重, 故理脾氣. 觀仲景用枳殼治心下滿, 用厚朴治腹痛, 可知枳殼厚朴輕重之別(p81)","-脾停飮食, 則濕不化, 宜神曲以散濕, 枳殼/陳皮/木香行氣以行濕(p163)"]}],["sec",{"key":"jin","label":"진존인본초","lines":[]}],["sub","枳實"],["para","-枳實에는 지속기간은 비교적 긴 昇壓作用이 있으며 反射性의 心拍數減慢과 不整脈의 발생을 減한다. 昇壓時 冠狀脈‧腦‧腎臟의 血流量이 增加, 쇼크상태에서 기관으로 혈액공급을 개선하는데 유효하다."],["para","-枳實‧枳殼에는 胃腸의 平滑筋에 대한 一定한 興奮作用이 있고 胃腸의 收縮運動을 규칙적이고 강력하게 한다."],["para","-胃腸의 積氣를 배제하여 脹痛을 消散하고 消化液의 分泌를 촉진하여 消化吸收를 개선한다."],["para","-化痰緩瀉 : 痰積을 제거하는 효과가 있다."],["sec",{"key":"gyeong","label":"경악전서","lines":[]}],["sub","枳實"],["para","百六九 味苦微酸, 微寒하고 氣味俱厚하며 陰中微陽이며 其性沈하야 急於枳殼이니 除脹滿, 消宿食, 削堅積, 化稠痰, 破滯氣, 平欬喘하며 逐瘀血停水, 解傷寒結胸, 去胃中濕熱이라 佐白朮이면 亦可健脾하며 佐大黃이면 大能推蕩이나 能損眞元하니 虛羸엔 勿用이라"],["sub","枳殼"],["para","百六八 卽枳實之遲收而大者니 較之枳實이면 其氣略散하고 性亦稍緩이나 功與枳實大類라 但枳實性重하니 多主下行削堅이나 而此之氣輕, 故로 多主上行破氣하며 通利關節, 健脾開胃, 平肺氣하야 止嘔逆反胃霍亂欬嗽하며 消痰消食하며 破心腹結氣, 癥瘕痃癖하며 開胸脇脹滿痰滯하며 逐水腫水濕瀉痢, 腸風痔漏, 肛門腫痛이라"],["para","因此稍緩, 故로 可用之束胎安胎하며 炙熱하야 可熨痔腫이라 虛者는 少用이니 恐傷元氣라"],["sec",{"key":"dong","label":"동의보감","lines":["-지실(枳實, 탱자열매)은 성질은 차며[寒](약간 차다[微寒]고도 한다) 맛은 쓰고[苦] 시며[酸](쓰고[苦] 맵다[辛]고도 한다) 독이 없다. 피부의 심한 가려운 증과 담벽(痰癖)을 낫게 하며 창만과 명치 밑이 트직하면서 아픈 것을 낫게 하고 오랜 식체를 삭인다","․나무는 귤나무 비슷한데 약간 작다. 잎은 문설주와 비슷하고 가시가 많다. 봄에 흰 꽃이 피고 가을에 열매가 익는다. 음력 7-8월에 따서 햇볕에 말린다","․배 껍데기가 뒤집어진 것이 마치 물동이의 아가리 비슷한데 오래 묵혀 둔 것이 좋다","․옛말에 귤나무가 회수(淮水)를 건너가면 탱자나무가 된다고 하였고 또한 양자강 남쪽에서는 귤나무가 되고 강북쪽에서는 탱자나무가 된다고 하였다. 그러나 지금 양자강 남쪽에는 귤나무와 탱자나무가 다 있고 강북쪽에는 탱자나무만 있다. 귤나무가 없는 것으로 보아 딴 종류이며 변해서 된 것이 아니라는 것을 알 수 있다[본초]","․지실은 담을 삭이는 데서 담장을 찌르고 벽을 넘어 뜨릴 만큼 힘이 세다. 물에 담갔다가 속을 긁어 버리고 밀기울과 함께 볶아서 쓴다[입문]","․속을 버리지 않은 지실은 효력을 더 빨리 나타낸다[단심]","-지경피(枳莖皮, 탱자나무줄기의 껍질)는 수창(水脹), 갑자기 생긴 풍증, 뼈마디가 몹시 가드라드는 것을 낫게 한다[본초]","-지근피(枳根皮, 탱자나무뿌리껍질)는 5가지 치질과 대변에 피가 섞여 나오는 것을 낫게 한다[본초]","-지각(枳殼)은 성질은 차고[寒](혹은 약간 차다[微寒]고도 한다) 맛이 쓰며[苦] 시고[酸](쓰고[苦] 맵다[辛]고도 한다) 독이 없다. 폐기로 기침하는 것을 낫게 하며 가슴 속에 몰려 있는 담을 헤치고 대소장을 잘 통하게 하며 창만하여 막히고 관격(關格)으로 몰리고 막힌 것을 열어 준다. 담을 삭이고 물을 몰아내며 징벽(癥癖)과 몰려 있는 사기를 헤치고 풍으로 가렵고 마비된 것, 장풍, 치질을 낫게 한다","․음력 7-8월에 열매를 따서 햇볕에 말린다. 배껍데기가 뒤집어진 것이 마치 물동이의 아가리와 비슷하면서 오래 묵혀 둔 것이 좋다[본초]","․지각의 약 기운은 주로 올라가고 지실의 약 기운은 주로 내려간다. 지각은 올라가서 피부와 흉격의 병을 낫게 하고 지실은 내려가서 명치와 위(胃)의 병을 낫게 하는데 그 맞음증은 거의 같다[탕액]","․탱자는 즉 귤의 종류인데 물에 담갔다가 속을 버리고 밀기울과 함께 볶아서 쓴다[입문]","․우리나라에는 오직 제주도에서만 난다. 왜귤(倭橘)이라고도 한다[속방]"]}]],"searchText":"枳實, 枳殼 분류 理氣藥 기원 芸香科 常綠소교목 酸橙의 미성숙과 性味 歸經 效能 主治 備考 苦辛酸 微寒 脾 胃 破氣<br>散痞<br>瀉痰<br>消積 胸腹脹滿, 胸痺, 痞痛, 痰癖, 水腫, 食積, 便秘, 胃下垂, 子宮下垂, 脫肛 枳實 苦辛 凉 肺 脾 大腸 破氣<br>行痰<br>消積 胸膈痰滯, 胸痞, 脇脹, 食積, 噫氣, 嘔逆, 下痢後重, 脫肛, 子宮脫垂 枳殼 약물특징/비교 枳實,枳殼 -破氣消積의 要藥 -破氣作用이 비교적 强하므로 正氣를 傷케 할 우려가 있어서 邪實이 아니면 應用× -生用하면 그 作用이 더욱 猛烈하므로 麩炒해서 쓰면 비교적 緩慢해진다. -枳實과 厚朴은 行氣消積藥으로 常用하고, 二者를 配合해서 사용하지만 단 다르게 應用될 때도 있다. ․厚朴은 溫하여 溫中, 燥濕, 散滿하는 特長(寒症에 :寒濕積滯로 胸腹脹滿證을 主로 治療) ․枳實은 寒하여 消痞除熱하는 效能(寒證에 :濕熱積滯와 胸脘痞滿의 證狀) -枳實과 枳殼은 效能이 비슷하나 ․枳實은 破氣作用이 强하고(그래서 消積除痞와 導滯通便에 쓰고) ․枳殼은 비교적 和緩한다(그래서 理氣寬胸中, 消除脹滿에 사용) 본초문답 -..枳殼..皆主降矣(p76) -枳殼木實, 味比厚朴稍輕, 故理胃氣. 厚朴木皮, 味比枳殼更重, 故理脾氣. 觀仲景用枳殼治心下滿, 用厚朴治腹痛, 可知枳殼厚朴輕重之別(p81) -脾停飮食, 則濕不化, 宜神曲以散濕, 枳殼/陳皮/木香行氣以行濕(p163) 진존인본초 枳實 -枳實에는 지속기간은 비교적 긴 昇壓作用이 있으며 反射性의 心拍數減慢과 不整脈의 발생을 減한다. 昇壓時 冠狀脈‧腦‧腎臟의 血流量이 增加, 쇼크상태에서 기관으로 혈액공급을 개선하는데 유효하다. -枳實‧枳殼에는 胃腸의 平滑筋에 대한 一定한 興奮作用이 있고 胃腸의 收縮運動을 규칙적이고 강력하게 한다. -胃腸의 積氣를 배제하여 脹痛을 消散하고 消化液의 分泌를 촉진하여 消化吸收를 개선한다. -化痰緩瀉 : 痰積을 제거하는 효과가 있다. 경악전서 枳實 百六九 味苦微酸, 微寒하고 氣味俱厚하며 陰中微陽이며 其性沈하야 急於枳殼이니 除脹滿, 消宿食, 削堅積, 化稠痰, 破滯氣, 平欬喘하며 逐瘀血停水, 解傷寒結胸, 去胃中濕熱이라 佐白朮이면 亦可健脾하며 佐大黃이면 大能推蕩이나 能損眞元하니 虛羸엔 勿用이라 枳殼 百六八 卽枳實之遲收而大者니 較之枳實이면 其氣略散하고 性亦稍緩이나 功與枳實大類라 但枳實性重하니 多主下行削堅이나 而此之氣輕, 故로 多主上行破氣하며 通利關節, 健脾開胃, 平肺氣하야 止嘔逆反胃霍亂欬嗽하며 消痰消食하며 破心腹結氣, 癥瘕痃癖하며 開胸脇脹滿痰滯하며 逐水腫水濕瀉痢, 腸風痔漏, 肛門腫痛이라 因此稍緩, 故로 可用之束胎安胎하며 炙熱하야 可熨痔腫이라 虛者는 少用이니 恐傷元氣라 동의보감 -지실(枳實, 탱자열매)은 성질은 차며[寒](약간 차다[微寒]고도 한다) 맛은 쓰고[苦] 시며[酸](쓰고[苦] 맵다[辛]고도 한다) 독이 없다. 피부의 심한 가려운 증과 담벽(痰癖)을 낫게 하며 창만과 명치 밑이 트직하면서 아픈 것을 낫게 하고 오랜 식체를 삭인다 ․나무는 귤나무 비슷한데 약간 작다. 잎은 문설주와 비슷하고 가시가 많다. 봄에 흰 꽃이 피고 가을에 열매가 익는다. 음력 7-8월에 따서 햇볕에 말린다 ․배 껍데기가 뒤집어진 것이 마치 물동이의 아가리 비슷한데 오래 묵혀 둔 것이 좋다 ․옛말에 귤나무가 회수(淮水)를 건너가면 탱자나무가 된다고 하였고 또한 양자강 남쪽에서는 귤나무가 되고 강북쪽에서는 탱자나무가 된다고 하였다. 그러나 지금 양자강 남쪽에는 귤나무와 탱자나무가 다 있고 강북쪽에는 탱자나무만 있다. 귤나무가 없는 것으로 보아 딴 종류이며 변해서 된 것이 아니라는 것을 알 수 있다[본초] ․지실은 담을 삭이는 데서 담장을 찌르고 벽을 넘어 뜨릴 만큼 힘이 세다. 물에 담갔다가 속을 긁어 버리고 밀기울과 함께 볶아서 쓴다[입문] ․속을 버리지 않은 지실은 효력을 더 빨리 나타낸다[단심] -지경피(枳莖皮, 탱자나무줄기의 껍질)는 수창(水脹), 갑자기 생긴 풍증, 뼈마디가 몹시 가드라드는 것을 낫게 한다[본초] -지근피(枳根皮, 탱자나무뿌리껍질)는 5가지 치질과 대변에 피가 섞여 나오는 것을 낫게 한다[본초] -지각(枳殼)은 성질은 차고[寒](혹은 약간 차다[微寒]고도 한다) 맛이 쓰며[苦] 시고[酸](쓰고[苦] 맵다[辛]고도 한다) 독이 없다. 폐기로 기침하는 것을 낫게 하며 가슴 속에 몰려 있는 담을 헤치고 대소장을 잘 통하게 하며 창만하여 막히고 관격(關格)으로 몰리고 막힌 것을 열어 준다. 담을 삭이고 물을 몰아내며 징벽(癥癖)과 몰려 있는 사기를 헤치고 풍으로 가렵고 마비된 것, 장풍, 치질을 낫게 한다 ․음력 7-8월에 열매를 따서 햇볕에 말린다. 배껍데기가 뒤집어진 것이 마치 물동이의 아가리와 비슷하면서 오래 묵혀 둔 것이 좋다[본초] ․지각의 약 기운은 주로 올라가고 지실의 약 기운은 주로 내려간다. 지 다. 경악전서 百六一 味酸澁, 主收斂, 氣平微溫, 陰中陽也. 入肝腎二臟하야 能固陰補精, 煖腰膝, 壯陰氣하며 澁帶濁, 節小便, 益髓興陽하며 調經收血이라 若脾氣大弱而畏酸者는 姑暫止之커나 或和以甘草, 煨薑이면 亦可라 동의보감 -성질은 약간 따뜻하며[微溫] 맛은 시고[酸] 떫으며[澁] 독이 없다. 음(陰)을 왕성하게 하며 신정[精]과 신기(腎氣)를 보하고 성기능을 높이며 음경을 딴딴하고 크게 한다. 또한 정수(精髓)를 보해 주고 허리와 무릎을 덥혀 주어 신[水藏]을 돕는다. 오줌이 잦은 것을 낫게 하며 늙은이가 때없이 오줌 누는 것을 낫게 하고 두풍과 코가 메는 것, 귀먹는 것을 낫게 한다. -곳곳에서 난다. 잎은 느릅나무 비슷하고 꽃은 희다. 열매가 처음 익어 마르지 않았을 때는 색이 벌건데 크기가 구기자만하며 씨가 있는데 또한 먹을 수 있다. 마른 것은 껍질이 몹시 얇다. 매 600g에서 씨를 빼버리고 살이 160g되는 것이 기준이다 -살은 원기를 세게 하며 정액을 굳건하게 한다. 그런데 씨는 정(精)을 미끄러져 나가게 하기 때문에 쓰지 않는다. 음력 9-10월에 따서 그늘에서 말린다[본초] -술에 담갔다가 씨를 버리고 약한 불에 말려서 쓴다. 일명 석조(石棗)라고도 한다[입문]"},{"id":93,"name":"紫葳","aliases":["凌霄花의 뿌리"],"category":"活血祛瘀藥","origin":"능소화과에 속한 落葉藤本인 능소화의 花(능소화), 뿌리","initial":"ㅇ","sortName":"凌霄花의 뿌리","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸 寒","肝 心包","行血祛瘀<br>凉血祛風","經閉癥瘕, 産後乳腫<br>血熱風痒, 皮膚瘙痒","凌霄花"]]},"items":[["sec",{"key":"category","label":"분류","lines":["活血祛瘀藥(꽃)"]}],["sec",{"key":"origin","label":"기원","lines":["능소화과에 속한 落葉藤本인 능소화의 花(능소화), 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸 寒","肝 心包","行血祛瘀<br>凉血祛風","經閉癥瘕, 産後乳腫<br>血熱風痒, 皮膚瘙痒","凌霄花"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":[]}],["sub","凌霄花"],["para","-肝經血分에 들어가 血中의 伏火를 去하여 破血祛瘀시키는 效能(血滯經閉와 癥瘕를 治療)"],["para","-凉血祛風의 效能이 있어 血熱로 인한 風痒과 皮膚瘙痒 등 證 治療하는데 多用"],["para","-【本草求眞】에 血中에 伏火하여 나타나는 氣結血閉와 風痒, 崩帶, 癥瘕 및 모든 瘀血이나 血熱로 된 疾患을 治療 한다고 하였다"],["para","-肺廱에도 君藥으로 多用"],["sec",{"key":"dong","label":"동의보감","lines":["-자위(紫葳)는 성질은 약간 차며[微寒] 맛이 시고[酸](달다[甘]고도 한다) 독이 없다. 몸푼 뒤에 깨끗지 못한 것, 붕루, 징가, 월경이 중단된 것 등을 낫게 한다. 또한 몸푼 뒤에 어혈이 이리저리 돌아다니는 것과 붕루대하를 낫게 하며 혈을 보하고 안태시킨다. 주사비와 열독과 풍자(風刺)를 낫게 하며 대소변을 잘 나가게 한다","-일명 능소화(凌霄花)라고도 하는데 곳곳에 있다. 처음 덩굴로 뻗으면서 큰 나무에 감겨 의지해 자라는데 오랜 세월을 지나면 나무꼭대기까지 올라가서 꽃이 핀다. 그 꽃은 누르고 붉은 색이다. 여름에 꽃이 활짝 휫때 따서 말려 쓴다[본초]","-능소화는 혈병으로 오는 통증을 낫게 하는데 주요하게 쓰는 약이다. 또한 음을 보하는 효능이 아주 빠르다[단심]","-자위경엽(紫葳莖葉, 자위줄기와 잎)은 팔다리에 힘이 없어서 쓰지 못하고 싸늘해지는 것을 낫게 한다. 기를 돕고 다리힘을 세게 한다[본초]","-자위근(紫葳根, 자위뿌리)은 열풍으로 몸이 가려운 것과 풍진13)(風疹), 어혈, 대하를 낫게 한다 은팥)는 성질이 평(平)하고(약간 차다[微寒]고도 하고 따뜻하다[溫]고도 한다) 맛이 달면서 시고[甘酸] 독이 없다. 물을 빠지게 하며 옹종의 피고름[癰腫膿血]을 빨아낸다. 소갈(消渴)을 치료하고 설사와 이질을 멎게 하며 오줌을 나가게 하고 수종과 창만을 내린다[본초]","․열기와 옹종을 삭히고 어혈을 헤친다[散惡血][본초]","․붉은팥은 진액을 뽑아내는 성질이 있기 때문에 수기병(水氣病)과 각기(脚氣)를 치료하는 약에서 제일 중요하다. 수기를 잘 돌게 하고 기를 통하게 하며 비장을 확 씻어내는 약이다. 오랫동안 먹으면 몸이 거멓게 되고 몹시 마른다[입문]","․약으로는 올종자(早種者)로써 빛이 붉은 것이 좋다. 늦종자(晩種者)는 효과가 적다[본초]","․붉은팥은 음가운데 양이 속하는데 밀에 중독된 것[小麥毒]을 푼다[탕액]","-적소두엽(赤小豆葉, 팥잎)은 일명 곽(藿)이라고도 한다. 오줌이 잦은 것을 멎게 하고 번열을 없애며 눈이 밝아지게 한다[본초]. 어린 콩잎을 보고도 역시 곽이라고 하는데 나물을 만들어 먹는다[입문]","-적소두화(赤小豆花, 팥꽃)는 성질이 평(平)하고 맛이 매우며[辛] 독이 없다. 오랫동안 술에 취하여 갈증이 나는 것을 치료한다[본초]","․소갈병과 술을 마셔서 생긴 두통을 잘 멎게 하는데 술독[酒毒]을 푼다. 그러므로 술을 마셔서 생긴 병에 좋다[본초]","․붉은팥의 꽃을 일명 부비(腐婢)라고도 하는데 음력 7월에 따서 그늘에 말려 쓴다[본초]"]}]],"searchText":"赤小豆 분류 利水滲濕藥-利水退腫藥 기원 豆科 덩굴팥(赤小豆) 혹은 팥(赤豆)의 성숙종자 性味 歸經 效能 主治 備考 甘酸 平 心 小腸 利水消腫<br>解毒排膿 水腫脹滿,脚氣浮腫,黃疸尿赤,風濕熱痺<br>癰腫瘡毒,腸癰腹痛  약물특징/비교 -下行하는 效能이 있어 ․內服에는 通利水道하며 水濕을 泄하므로 消腫되며, 滋養性 利水消腫藥이 되어 水腫과 脚氣가 虛證에 偏한 者에게 適合 ․外用으로는 血分의 熱毒을 淸하고 寒性은 血分에 들어가 降火行血케 하므로 熱毒瘡瘍의 證을 治療한다. 진존인본초 -利水祛濕 : 下行性에 大量의 단백질‧지방을 함유한 滋養性 利水藥이다. ․急‧慢性 腎炎에 의한 浮腫 ․脚氣 : 赤小豆煮 또는 赤小豆+薏苡仁‧현미 煮 ․風濕性 關節 : 赤小豆+五加皮‧秦艽‧木瓜 -解毒排膿 ․腫氣가 發熱疼痛, 化膿 時 : 赤小豆+金銀花‧天花粉‧生地 동의보감 -적소두(赤小豆, 붉은팥)는 성질이 평(平)하고(약간 차다[微寒]고도 하고 따뜻하다[溫]고도 한다) 맛이 달면서 시고[甘酸] 독이 없다. 물을 빠지게 하며 옹종의 피고름[癰腫膿血]을 빨아낸다. 소갈(消渴)을 치료하고 설사와 이질을 멎게 하며 오줌을 나가게 하고 수종과 창만을 내린다[본초] ․열기와 옹종을 삭히고 어혈을 헤친다[散惡血][본초] ․붉은팥은 진액을 뽑아내는 성질이 있기 때문에 수기병(水氣病)과 각기(脚氣)를 치료하는 약에서 제일 중요하다. 수기를 잘 돌게 하고 기를 통하게 하며 비장을 확 씻어내는 약이다. 오랫동안 먹으면 몸이 거멓게 되고 몹시 마른다[입문] ․약으로는 올종자(早種者)로써 빛이 붉은 것이 좋다. 늦종자(晩種者)는 효과가 적다[본초] ․붉은팥은 음가운데 양이 속하는데 밀에 중독된 것[小麥毒]을 푼다[탕액] -적소두엽(赤小豆葉, 팥잎)은 일명 곽(藿)이라고도 한다. 오줌이 잦은 것을 멎게 하고 번열을 없애며 눈이 밝아지게 한다[본초]. 어린 콩잎을 보고도 역시 곽이라고 하는데 나물을 만들어 먹는다[입문] -적소두화(赤小豆花, 팥꽃)는 성질이 평(平)하고 맛이 매우며[辛] 독이 없다. 오랫동안 술에 취하여 갈증이 나는 것을 치료한다[본초] ․소갈병과 술을 마셔서 생긴 두통을 잘 멎게 하는데 술독[酒毒]을 푼다. 그러므로 술을 마셔서 생긴 병에 좋다[본초] ․붉은팥의 꽃을 일명 부비(腐婢)라고도 하는데 음력 7월에 따서 그늘에 말려 쓴다[본초]"},{"id":101,"name":"麥芽","aliases":[],"category":"消食藥","origin":"벼과에 속한 一年生 草本인 보리의 成熟한 果實(麥芽)을 발아건조 시킨것.","initial":"기타","sortName":"麥芽","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["平 甘","脾 胃 肝","消食<br>和中<br>下氣","食積不消, 脘腹脹滿<br>食欲不振, 嘔吐泄瀉<br>乳脹不消","麥芽"]]},"items":[["sec",{"key":"category","label":"분류","lines":["消食藥(麥芽)"]}],["sec",{"key":"origin","label":"기원","lines":["벼과에 속한 一年生 草本인 보리의 成熟한 果實(麥芽)을 발아건조 시킨것."]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["平 甘","脾 胃 肝","消食<br>和中<br>下氣","食積不消, 脘腹脹滿<br>食欲不振, 嘔吐泄瀉<br>乳脹不消","麥芽"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":[]}],["sub","麥芽"],["para","-飮食物의 消化를 促進"],["para","-乳汁分泌를 抑制하는 作用이 있어"],["para","․婦人이 小兒에게 斷乳코자 할 때,"],["para","․乳汁의 찌꺼기가 쌓여 乳房이 脹痛한 者에게 사용하면 回乳하고 消脹의 效力"],["para","-그러므로 授乳기간에 服用하는 것은 좋지 못하다(乳汁을 減少시키기 때문)"],["para","-回乳에는 生用하고, 消食에는 炒用한다."],["sec",{"key":"jin","label":"진존인본초","lines":[]}],["sub","麥芽"],["para","-糖質食品의 積滯를 消除할 수 있고 각종 消化不良에 사용하며 麥芽에 함유된 消化酵素와 비타민B는 消化液分泌를 促進한다."],["para","-消化器 潰瘍이나 胃下垂 등의 질환치료작용이 있다."],["para","-離乳期 母乳蓄積에 의한 乳房腫痛에 生麥芽 3兩을 3日 水煎服用하면 乳汁分泌가 中止된다."],["para","-麥芽中 디아스타제는 微炒하면 영향이 없으나 過炒하거나 長時間 煎하면 파괴된다."],["sec",{"key":"dong","label":"동의보감","lines":["-갱미(粳米, 멥쌀)는 성질이 평(平)하고 맛이 달면서 쓰고[甘苦] 독이 없다. 위기(胃氣)를 고르게 하고 살찌게 하며 속을 덥히고 이질을 멎게 하는데 기를 보하고 답답한 것[煩]을 없앤다[본초]","-멥쌀이라는‘갱(粳)’자에는 굳다는 뜻(硬, 즉 堅)이 들어 있는데 그것은 찹쌀보다 굳기 때문이다. 이것의 기운은 수태음경과 수소음경으로 들어간다. 기(氣)와 정(精)은 다 쌀을 먹어서 그것이 변화되어 생긴 것이기 때문에 ‘기(氣)’자와 ‘정(精)’자에는 다 쌀‘미(米)’자가 들어 있다[입문]","-밥이나 죽을 만들어 먹는데 약간 설익어도 비장(脾臟)에 좋지 못하다. 잘 익혀 먹어야 좋다[본초]","-멥쌀은 늦벼쌀(白晩米)이 제일 좋다. 올벼쌀(早熟米)은 이것만 못하다[본초]","-이것은 바로 늦벼쌀을 말하는데 서리가 온 뒤에 가을한 것이 좋다[일용]","-진름미(陳廩米, 묵은 쌀)는 성질이 따뜻하고 맛이 짜면서 시고 독이 없다. 답답한 것[煩]을 없애고 胃를 조화시키고 설사를 멎게 하며 5장을 보하고 장위를 수렴하게 하는데 끓여서 먹는 것이 좋다[본초]. 이것이 바로 陳倉米이다. 그러나 여러 학자들이 멥쌀인가 좁쌀인가에 대해서는 말하지 않았다. 그러나 멥쌀과 좁쌀 이 두 가지는 다 묵으면 성질이 차진다. 그러므로 이것을 자주 먹으면 설사가 나게 된다. 그러니 『내경』에 씌어 있는 것과는 약간 틀린다. 달이거나 삶으면 기름기와 찰기가 없어진다. 때문에 요즘 사람들은 흔히 햇멥쌀(新粳)이나 햇좁쌀(新粟)을 쓴다. 대체로 오랫동안 묵으면 냄새와 맛이다 변한다. 그러니 『내경』에 묵었다는 것은 3-5년이 지난 것을 말한다고 쓴 이유가 있다[본초]","-나미(糯米, 찹쌀)는 성질이 차고(약간 차다고도 하고 서늘하다고도 한다) 맛이 달면서 쓰고 독이 없다. 중초를 보하고 기를 생기게 하여 곽란을 멎게 한다. 그러나 열을 많이 생기게 하여 대변을 굳어지게 한다[본초]","-여러 경락을 막히게 하여 팔다리를 잘 쓰지 못하게 하며 풍(風)을 일으키고 기(氣)를 동(動)하게 하며 정신이 얼떨떨하게 하여 자게 하므로[昏昏多睡] 많이 먹어서는 안 된다. 오랫동안 먹으면 몸이 약해진다. 개가 먹으면 다리가 굽어 들어 잘 다니지 못하게 된다. 그리고 사람은 힘줄이 늘어지게 된다[본초]","-찹쌀이라는 글자는 연할‘연(軟)’자의 뜻을 땄는데 그것은 쌀이 차분차분하고 풀기가 있기 때문이다. 즉 찰벼쌀을 말한다. 요즘 사람들은 이것으로 술과 엿을 만든다[입문]","-찹쌀은 찰진 벼의 쌀이고 멥쌀은 찰지지 않은 벼의 쌀이다. 그러므로 멥쌀과 찹쌀은 거의 비슷하다. 그러나 찰지고 찰지지 않은 것이 다르다[본초]","-벼는 가스랭이(芒)가 있는 곡식인데 멥벼와 찰벼를 통틀어 벼라고 한다[본초]","-찹쌀은 성질이 차지만[寒] 술을 만들면 성질이 열(熱)해진다. 그리고 술지게미(糟)는 성질이 따뜻하고[溫] 평(平)하다. 이것은 마치 약전국과 장의 성질이 같지 않은 것과 같다[본초]"]}]],"searchText":"麥芽 분류 消食藥(麥芽) 기원 벼과에 속한 一年生 草本인 보리의 成熟한 果實(麥芽)을 발아건조 시킨것. 性味 歸經 效能 主治 備考 平 甘 脾 胃 肝 消食<br>和中<br>下氣 食積不消, 脘腹脹滿<br>食欲不振, 嘔吐泄瀉<br>乳脹不消 麥芽 약물특징/비교 麥芽 -飮食物의 消化를 促進 -乳汁分泌를 抑制하는 作用이 있어 ․婦人이 小兒에게 斷乳코자 할 때, ․乳汁의 찌꺼기가 쌓여 乳房이 脹痛한 者에게 사용하면 回乳하고 消脹의 效力 -그러므로 授乳기간에 服用하는 것은 좋지 못하다(乳汁을 減少시키기 때문) -回乳에는 生用하고, 消食에는 炒用한다. 진존인본초 麥芽 -糖質食品의 積滯를 消除할 수 있고 각종 消化不良에 사용하며 麥芽에 함유된 消化酵素와 비타민B는 消化液分泌를 促進한다. -消化器 潰瘍이나 胃下垂 등의 질환치료작용이 있다. -離乳期 母乳蓄積에 의한 乳房腫痛에 生麥芽 3兩을 3日 水煎服用하면 乳汁分泌가 中止된다. -麥芽中 디아스타제는 微炒하면 영향이 없으나 過炒하거나 長時間 煎하면 파괴된다. 동의보감 -갱미(粳米, 멥쌀)는 성질이 평(平)하고 맛이 달면서 쓰고[甘苦] 독이 없다. 위기(胃氣)를 고르게 하고 살찌게 하며 속을 덥히고 이질을 멎게 하는데 기를 보하고 답답한 것[煩]을 없앤다[본초] -멥쌀이라는‘갱(粳)’자에는 굳다는 뜻(硬, 즉 堅)이 들어 있는데 그것은 찹쌀보다 굳기 때문이다. 이것의 기운은 수태음경과 수소음경으로 들어간다. 기(氣)와 정(精)은 다 쌀을 먹어서 그것이 변화되어 생긴 것이기 때문에 ‘기(氣)’자와 ‘정(精)’자에는 다 쌀‘미(米)’자가 들어 있다[입문] -밥이나 죽을 만들어 먹는데 약간 설익어도 비장(脾臟)에 좋지 못하다. 잘 익혀 먹어야 좋다[본초] -멥쌀은 늦벼쌀(白晩米)이 제일 좋다. 올벼쌀(早熟米)은 이것만 못하다[본초] -이것은 바로 늦벼쌀을 말하는데 서리가 온 뒤에 가을한 것이 좋다[일용] -진름미(陳廩米, 묵은 쌀)는 성질이 따뜻하고 맛이 짜면서 시고 독이 없다. 답답한 것[煩]을 없애고 胃를 조화시키고 설사를 멎게 하며 5장을 보하고 장위를 수렴하게 하는데 끓여서 먹는 것이 좋다[본초]. 이것이 바로 陳倉米이다. 그러나 여러 학자들이 멥쌀인가 좁쌀인가에 대해서는 말하지 않았다. 그러나 멥쌀과 좁쌀 이 두 가지는 다 묵으면 성질이 차진다. 그러므로 이것을 자주 먹으면 설사가 나게 된다. 그러니 『내경』에 씌어 있는 것과는 약간 틀린다. 달이거나 삶으면 기름기와 찰기가 없어진다. 때문에 요즘 사람들은 흔히 햇멥쌀(新粳)이나 햇좁쌀(新粟)을 쓴다. 대체로 오랫동안 묵으면 냄새와 맛이다 변한다. 그러니 『내경』에 묵었다는 것은 3-5년이 지난 것을 말한다고 쓴 이유가 있다[본초] -나미(糯米, 찹쌀)는 성질이 차고(약간 차다고도 하고 서늘하다고도 한다) 맛이 달면서 쓰고 독이 없다. 중초를 보하고 기를 생기게 하여 곽란을 멎게 한다. 그러나 열을 많이 생기게 하여 대변을 굳어지게 한다[본초] -여러 경락을 막히게 하여 팔다리를 잘 쓰지 못하게 하며 풍(風)을 일으키고 기(氣)를 동(動)하게 하며 정신이 얼떨떨하게 하여 자게 하므로[昏昏多睡] 많이 먹어서는 안 된다. 오랫동안 먹으면 몸이 약해진다. 개가 먹으면 다리가 굽어 들어 잘 다니지 못하게 된다. 그리고 사람은 힘줄이 늘어지게 된다[본초] -찹쌀이라는 글자는 연할‘연(軟)’자의 뜻을 땄는데 그것은 쌀이 차분차분하고 풀기가 있기 때문이다. 즉 찰벼쌀을 말한다. 요즘 사람들은 이것으로 술과 엿을 만든다[입문] -찹쌀은 찰진 벼의 쌀이고 멥쌀은 찰지지 않은 벼의 쌀이다. 그러므로 멥쌀과 찹쌀은 거의 비슷하다. 그러나 찰지고 찰지지 않은 것이 다르다[본초] -벼는 가스랭이(芒)가 있는 곡식인데 멥벼와 찰벼를 통틀어 벼라고 한다[본초] -찹쌀은 성질이 차지만[寒] 술을 만들면 성질이 열(熱)해진다. 그리고 술지게미(糟)는 성질이 따뜻하고[溫] 평(平)하다. 이것은 마치 약전국과 장의 성질이 같지 않은 것과 같다[본초]"},{"id":102,"name":"小麥(밀), 麴(누룩), 大麥(보리)","aliases":[],"category":"消食藥","origin":"(神麯)밀가루와 밀기울 赤小豆末 杏仁泥 靑蒿汁 蒼耳汁 野蓼汁등을 반죽하여 溫室에서 醱酵","initial":"ㅁ","sortName":"小麥(밀), 麴(누룩), 大麥(보리)","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["溫 甘辛","脾 胃","健脾和胃<br>消食調中","飮食停滯, 胸痞腹脹, 嘔吐瀉痢<br>産後瘀血腹痛, 小兒腹大堅積","神麯"],["甘鹹 凉","心","益氣<br>除熱<br>止汗","骨蒸勞熱<br>自汗盜汗","浮小麥"]]},"items":[["sec",{"key":"category","label":"분류","lines":["(神麯)消食藥/"]}],["sec",{"key":"origin","label":"기원","lines":["(神麯)밀가루와 밀기울 赤小豆末 杏仁泥 靑蒿汁 蒼耳汁 野蓼汁등을 반죽하여 溫室에서 醱酵"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["溫 甘辛","脾 胃","健脾和胃<br>消食調中","飮食停滯, 胸痞腹脹, 嘔吐瀉痢<br>産後瘀血腹痛, 小兒腹大堅積","神麯"],["甘鹹 凉","心","益氣<br>除熱<br>止汗","骨蒸勞熱<br>自汗盜汗","浮小麥"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":[]}],["sub","神麯"],["para","-多種의 解表藥과 麯粉이 醱酵해서 만든 것"],["para","-무릇 醱酵한 藥品은 健脾胃, 助消化하는 效能"],["para","-傷食積滯와 더불어 外感 또는 泄瀉의 證狀에 적용"],["para","-消食和胃에는 炒用, 丸劑에 들어갈 때에는 生用"],["sec",{"key":"jin","label":"진존인본초","lines":[]}],["sub","神麯"],["para","-健胃消食作用이 광범위하며, 止瀉消滯, 化痰의 효과가 있다"],["para","․嬰‧幼兒의 乳食不化에 신곡2錢 煎水 搗爛한 것을 1일 2회 복용시킨다."],["para","․夏季 暑濕에 의한 頭痛‧胸腹痛‧吐氣‧食慾不振 등에 신곡煎湯에 六一散을 복용한다."],["sec",{"key":"dong","label":"동의보감","lines":["-소맥(小麥, 밀)은 성질이 약간 차고[微寒] (平하다고도 한다) 맛이 달며 독이 없다. 번열을 없애고 잠이 적어지게 하며 조갈(燥渴)을 멎게 하고 오줌을 잘 나가게 하며 肝氣를 보양한다[본초]","-밀껍질(小麥皮)은 성질이 차고 쌀알은 성질이 열하다. 달임약[湯]에 넣을 때에는 껍질채로 넣어서 껍질이 터지지 않게 달여야 한다. 그것은 껍질이 터지면 성질이 따뜻해지기[溫] 때문이다. 이것으로 보아 껍질을 버린 밀가루는 열과 답답한 것[煩]을 없애지 못한다는 것을 알 수 있다[본초]","-가을에 심으면 여름에 익기 때문에 4철의 기운을 받게 된다. 그러므로 자연히 차고 따뜻한[寒溫] 성질을 겸하게 된다. 가루는 성질이 熱하고 밀기울은 성질이 찬데 이것은 당연한 일이다[본초]","-밀은 가을에 심고 겨울에 자라서 봄에 이삭이 패고 여름에 익기 때문에 4철의 고른 기운을 갖게 된다. 그러므로 5곡에서 제일 귀한 것이다. 기후가 따뜻한 곳에서는 봄에 심었다가 여름에 걷어들이기도 하나 이것멎기를 부족하게 받기 때문에 독이 있다. 그리고 이것으로 낸 가루는 성질이 또한 차다[본초]","-면(麵, 밀가루)은 성질이 따뜻하고 맛이 달다. 중초를 보하고 기를 도우며 장위를 든든하게 하고 기력이 세지게 하며 5장을 돕는다. 또한 오랫동안 먹으면 몸이 든든해진다[본초]","-밀은 성질이 차다[寒]. 가루를 만들면 성질이 따뜻해지는데[溫] 독이 있다[본초]","-열독이 있는 밀가루는 흔히 묵은 것인데 빛은 검누렇다. 또한 가루를 만들 때 돌가루가 섞인 것이므로 절구에 빻아 먹는 것이 좋다[본초]","-밀가루는 열을 몰리게 하고 풍기[風]를 동(動)하게 하는 성질이 있다[본초]","-한식면(寒食麵)은 한식날에 만든 밀국수인데 약한 불기운에 말려서 두고 쓴다. 이것은 적을 헤치고[破積] 기(氣)를 잘 돌게 한다[강목]","-국(麴, 누룩)은 성질이 몹시 따뜻하고[大煖] (따뜻하다[溫]고도 한다) 맛이 달다[甘]. 위를 조화시키고 음식이 소화되게 하며 이질을 멎게 한다[본초]","-여곡(女麴)은 통밀(完小麥)로 만든 것인데 일명 환자(䴷子)라고도 한다. 누렇게 쪄서 간 밀로 만든 것은 일명 황의(黃衣)라고 한다. 이것들은 다 음식이 소화되게 한다[본초]","-밀누룩(麥麵)은 민물고기를 먹고 생긴 배탈을 낫게 한다[좌전]","-음력 6월에 만든 것이 좋은데 오랫동안 묵은 것을 약으로 쓴다. 향기가 나도록 고소하게 닦아서[炒] 써야 한다[본초]","-신국(神麴, 약누룩)은 성질은 덥고[煖] (따뜻하다[溫]고도 한다) 맛이 달며[甘] 독이 없다. 입맛이 나게 하고 비(脾)를 든든하게 하며 음식이 소화되게 하고 곽란, 설사, 적백이질을 멎게 한다. 징결(癥結, 뱃속에 덩어리가 생긴 것)을 헤쳐 담이 치밀어 올라 가슴이 그득한 것[痰逆胸滿]을 내리며 장위 속에 음식이 막혀서 내리지 않는 것[腸胃中塞]을 내리게 하고 유산되게 하며 귀태(鬼胎)를 나오게 한다[본초]","-약에 넣을 때에는 고소한 냄새가 나게 닦아서 넣는다. 불에 닦은 것은 자연계의 5기를 돕고 양명경으로 들어간다[탕액]","-홍국(紅麴)은 피를 잘 돌게 하고 음식이 소화되게 하며 이질을 멎게 한다. 홍국이라는 것도 신국인 것 같다.","-신국을 만드는 방법은 잡방(雜方)에 자세하게 씌어 있다."]}]],"searchText":"小麥(밀), 麴(누룩), 大麥(보리) 분류 (神麯)消食藥/ 기원 (神麯)밀가루와 밀기울 赤小豆末 杏仁泥 靑蒿汁 蒼耳汁 野蓼汁등을 반죽하여 溫室에서 醱酵 性味 歸經 效能 主治 備考 溫 甘辛 脾 胃 健脾和胃<br>消食調中 飮食停滯, 胸痞腹脹, 嘔吐瀉痢<br>産後瘀血腹痛, 小兒腹大堅積 神麯 甘鹹 凉 心 益氣<br>除熱<br>止汗 骨蒸勞熱<br>自汗盜汗 浮小麥 약물특징/비교 神麯 -多種의 解表藥과 麯粉이 醱酵해서 만든 것 -무릇 醱酵한 藥品은 健脾胃, 助消化하는 效能 -傷食積滯와 더불어 外感 또는 泄瀉의 證狀에 적용 -消食和胃에는 炒用, 丸劑에 들어갈 때에는 生用 진존인본초 神麯 -健胃消食作用이 광범위하며, 止瀉消滯, 化痰의 효과가 있다 ․嬰‧幼兒의 乳食不化에 신곡2錢 煎水 搗爛한 것을 1일 2회 복용시킨다. ․夏季 暑濕에 의한 頭痛‧胸腹痛‧吐氣‧食慾不振 등에 신곡煎湯에 六一散을 복용한다. 동의보감 -소맥(小麥, 밀)은 성질이 약간 차고[微寒] (平하다고도 한다) 맛이 달며 독이 없다. 번열을 없애고 잠이 적어지게 하며 조갈(燥渴)을 멎게 하고 오줌을 잘 나가게 하며 肝氣를 보양한다[본초] -밀껍질(小麥皮)은 성질이 차고 쌀알은 성질이 열하다. 달임약[湯]에 넣을 때에는 껍질채로 넣어서 껍질이 터지지 않게 달여야 한다. 그것은 껍질이 터지면 성질이 따뜻해지기[溫] 때문이다. 이것으로 보아 껍질을 버린 밀가루는 열과 답답한 것[煩]을 없애지 못한다는 것을 알 수 있다[본초] -가을 微風宜散, 薄荷‧荊芥‧防風‧紫蘇‧柴胡之類是矣. 陰氣遏抑之暴風則宜溫, 附子‧川烏‧白附子之類是矣(p143) -紫蘇性同桂枝, 然較輕, 不如桂枝之大溫(p149) 진존인본초 -皮膚血管을 擴張하여 汗腺의 分泌를 促進하여 發汗解熱의 效果를 갖는다. -氣管支의 分泌物을 減少시켜 氣管支의 痙攣을 緩解하는 작용과 健胃작용이 있다. -蘇葉은 理氣作用이 있어 氣滯에 의한 上腹部 脹痛‧噯氣‧嘔吐에 우수한 효과가 있다. -寒冷에 의한 呃逆에 紫蘇煎湯을 溫服하고 重症인 경우 沈香‧薑半夏‧厚朴을 배합하며, 寒冷性인 게나 고동에 의한 食中毒에 生薑을 加한다. -蘇葉에는 胎兒를 보호하여 遺産을 防止하며, 임신중 惡心‧嘔吐에도 사용한다. 경악전서 九十 味辛, 氣溫하며 氣味香竄者 佳니 用此者는 用其溫散이라. 解肌發汗하니 祛風寒에 甚捷하며 開胃下食하니 治脹滿에 亦佳하며 順氣宜用이니 口臭亦辟, 除霍亂轉筋, 祛脚氣, 通大小腸, 消痰利肺, 止痛溫中, 安胎定喘, 解魚蟹毒, 治蛇犬傷하야 或作羹커나 或生食도 俱可라. 동의보감 -성질이 따뜻하고[溫] 맛이 매우며[辛] 독이 없다. 명치끝이 불러 오르고 그득한 것과[心腹脹滿] 곽란, 각기등을 치료하며, 대소변이 잘 나오게 한다. 일체 냉기를 없애고 풍한 때 표사[表邪]를 헤친다. 또한 가슴에 있는 痰과 기운을 내려가게 한다. -밭에 심는다. 잎의 뒷면이 자줏빛이고 주름이 있으며, 냄새가 몹시 향기로운 것을 약으로 쓴다. 자줓빛이 나지 않고 향기롭지 못한 것은 들차조기[野蘇]인데, 약으로 쓰지 못한다. 잎의 뒷면과 앞면이 다 자줏빛인 것은 더 좋다. 여름에는 줄기와 잎을 따고, 가을에는 씨를 받는다. -잎은 날것으로 먹을 수 있다. 여러 가지 생선이나 고기와 같이 국을 끓여 먹으면 좋다[본초]"},{"id":107,"name":"伏龍肝","aliases":[],"category":"止血藥-溫經止血藥","origin":"釜臍의 眞下에 오래 熏燒된 竈底중심의 황토","initial":"기타","sortName":"伏龍肝","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","脾 胃","溫中燥濕<br>止嘔止血","嘔吐反胃, 腹痛泄瀉, 吐血, 衄血, 便血, 尿血, 婦女姙娠惡阻, 崩漏帶下, 癰腫潰瘍",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["止血藥-溫經止血藥"]}],["sec",{"key":"origin","label":"기원","lines":["釜臍의 眞下에 오래 熏燒된 竈底중심의 황토"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","脾 胃","溫中燥濕<br>止嘔止血","嘔吐反胃, 腹痛泄瀉, 吐血, 衄血, 便血, 尿血, 婦女姙娠惡阻, 崩漏帶下, 癰腫潰瘍",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-一切의 失血證이 虛寒에 속한 者에게 모두 適用하여 治療하고, 胃腸出血과 姙娠嘔吐에 常用한다.","-出血과 嘔吐가 熱에 속한 者에게는 마땅×","-煎劑에 넣을 때는 本品을 먼저 煎湯하고 去渣하여 沈澱된 후에 澄淸水만 取하여 煎藥한다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 약간 따뜻하고[微溫] 맛은 매우며[辛], 짜다고도 한다[鹹]. 독이없다[無毒], 성질이 열[熱]하고 약간 독이 있다고도 한다[微毒]","-코피가 나는 것[衄血]‧피를 토하는 것[吐血]‧붕루[崩漏]‧대소변에 피가 섞여 나오는것[便血, 尿血.]을 치료하는데 피를 잘 멎게 한다. 그리고 옹종[癰腫]과 독기[毒氣]를 삭히고 해산을 쉽게 하게 하며 태반을 나오게 한다. 어린이가 밤에 우는 증[小兒夜啼]도 치료한다[본초]","-이것은 가마밑 아궁이바닥의 누런 흙이다. 10년 이상된 아궁이바닥을 1자 깊이로 파면 자줏빛이 나는 진흙이 나오는데 그것을 쓴다. 아궁이에는 신[神]이 있기 때문에 복룡간이라고 이름지었다[본초]"]}]],"searchText":"伏龍肝 분 다[입문]","-옛사람들이 금은 황금(黃金)이라 하고 은은 백금(白金)이라 하며 구리는 적금(赤金)이라 하고 연은 청금(靑金)이라 하며 쇠는 흑금(黑金)이라 하였다[본초]","-연상(鉛霜)의 성질은 차며 독이 없다. 담을 삭이고 경계증을 멎게 하며 술독을 풀어 준다. 또 熱涎이 가슴에 막혀 안타깝게 답답한 것[煩悶], 중풍으로 담이 성한 것과 어린이의 경풍을 낫게 한다.","-일명 연백상(鉛白霜)이라고도 하는데 그 제법은 연에 수은 15분의 1을 두고 섞은 다음 녹여 조각을 만들어 식초를 둔 항아리에 넣고 봉하여 오래 두었다가 서릿발처럼 올라 붙은 것을 긁어서 쓴다[본초]","-연분(鉛粉)의 성질은 차며[寒](서늘하다고도 한다) 맛은 맵고[辛] 독이 없다. 복시(伏尸)나 독한 벌레에게 쏘인 것을 낫게 하고 3충을 죽이며 별가를 없앤다. 또 악창을 낫게 하며 유산시키고 징가, 적취, 오랜 이질로 된 것, 옹종에 누관[瘻]이 생기고 물크러지는 것을 낫게 한다","-즉 지금 연을 녹여 만든 호분(胡粉)이다. 일명 정분(定粉), 일명 광분(光粉), 와분(瓦粉)이라고도 한다[본초,탕액]","-호분은 즉 진짜 연분이다. 소주(韶州)에서 나는 것은 소분(韶粉)이고 정주(定州)에서 나는 것은 정분(定粉)이며 통틀어 말할 때 광분(光粉)인데 수렴하는 성질이 있기 때문에 창자를 수렴하여 이질을 낫게 한다[성옹]","-연회(鉛灰)는 나력을 낫게 한다. 그 제법은 연 120g을 쇠그릇에 넣고 오래 닦으면 검은 재처럼 된 찌꺼기가 생긴다. 이 재를 거두어 돼지기름에 개어 붙인다[본초]"]}]],"searchText":"鉛丹 분류 外用藥 기원 순수 鉛을 가공한 사산화삼연 性味 歸經 效能 主治 備考 辛鹹 寒 有毒 心 脾 肝 解毒<br>生肌<br>墮痰鎭驚 癰疽潰瘍, 金瘡出血, 口瘡, 目翳<br>湯火灼傷, 瘧疾, 痢疾, 吐逆反胃<br>驚癎癲狂  약물특징/비교 -外科疾患에 適用하는 主要한 藥材. -植物性油로 調和하여 膏藥으로 만들어 外貼하면 拔毒, 收斂, 生肌의 作用이 비교적 良好 -內服하면 墮痰鎭驚의 效能이 있으나 性이 寒有毒하므로 臨床應用에는 극히 드물며 適用할 때는 中毒에 注意 동의보감 -황단(黃丹)의 성질은 약간 차며[微寒](서늘하다고도 한다) 맛은 맵고[辛] 독이 없다. 마음과 정신을 진정시키며 경간, 전질, 독열(毒熱), 경계증, 미쳐 날뛰는 증을 낫게 하고 구토, 반위, 피를 토하는 것, 기침 등을 멎게 한며 또 쇠붙이에 다친 것, 끓는 물이나 불에 덴 것을 낫게 한다. 수염을 검게 하며 고약을 만들어 쓰면 통증을 멎게 하고 새살을 살아나게 한다 -일명 연단(鉛丹)이라고 하는데 즉 황단(黃丹)이다. 또 연화(鉛華)라고도 하는데 연으로 만든다[본초] -연을 달구어 단을 만드는데 그 빛이 누렇기 때문에 황단이라 한다. 약에 넣을 때는 닦아 빛이 자줏빛으로 변한 다음 보드랍게 갈아서 두번 수비하여 쓴다[입문] -연(鉛, 납)은 성질은 서늘하며 맛은 달고[甘] 독이 없다. 마음을 진정시키고 정신을 안정하게 하며 반위, 구역, 딸꾹질과 뱀, 전갈한테 물린 독을 낫게 한다[본초] -연과 주석은 북방임계(北方壬癸)에 속하고 극도에 다다른 음의 정기를 다 갖추었으므로 성질은 부드럽고 미끄러우며 음독(陰毒)이 많다. 많이 먹으면 사람의 심장과 위를 상하게 한다. 약에 넣을 때는 쇠냄비에 녹여서 새기왓장 위에 쏟아 찌꺼기를 버린다. 이렇게 두세번 해서 깨끗하게 하여 쓴다[입문] -옛사람들이 금은 황금(黃金)이라 하고 은은 백금(白金)이라 하며 구리는 적금(赤金)이라 하고 연은 청금(靑金)이라 하며 쇠는 흑금(黑金)이라 하였다[본초] -연상(鉛霜)의 성질은 차며 독이 없다. 담을 삭이고 경계증을 멎게 하며 술독을 풀어 준다. 또 熱涎이 가슴에 막혀 안타깝게 답답한 것[煩悶], 중풍으로 담이 성한 것과 어린이의 경풍을 낫게 한다. -일명 연백상(鉛白霜)이라고도 하는데 그 제법은 연에 수은 15분의 1을 두고 섞은 다음 녹여 조각을 만들어 식초를 둔 항아리에 넣고 봉하여 오래 두었다가 서릿발처럼 올라 붙은 것을 긁어서 쓴다[본초] -연분(鉛粉)의 성질은 차며[寒](서늘하다고도 한다) 맛은 맵고[辛] 독이 없다. 복시(伏尸)나 독한 벌레에게 쏘인 것을 낫게 하고 3충을 죽이며 별가를 없앤다. 또 악창을 낫게 하며 유산시키고 징가, 적취, 오랜 이질로 된 것, 옹종에 누관[瘻]이 생기고 물크러지는 것을 낫게 한다 -즉 지금 연을 녹여 만든 호분(胡粉)이다. 일명 정분(定粉), 일명 광분(光粉), 와분(瓦粉)이라고도 한다[본초,탕액] -호분은 즉 진짜 연분이다. 소주(韶州)에서 나는 것은 소분(韶粉)이고 정주(定州)에서 나는 것은 정분(定粉)이며 통틀어 말할 때 광분(光粉)인데 수렴하는 성질이 있기 때문에 창자를 수렴하여 이질을 낫게 한다[성옹] -연회(鉛灰)는 나력을 낫게 한다. 그 제법은 연 120g을 쇠그릇에 넣고 오래 닦으면 검은 재처럼 된 찌꺼기가 생긴다. 이 재를 거두어 돼지기름에 개어 붙인다[본초]"},{"id":109,"name":"代赭石","aliases":[],"category":"平肝藥-平肝潛陽藥","origin":"적철광의 광석","initial":"기타","sortName":"代赭石","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","肝 心","平肝潛陽<br>降逆<br>止血","頭痛眩暈<br>噯氣, 呃逆, 嘔吐<br>吐血, 衄血, 崩漏",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["平肝藥-平肝潛陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["적철광의 광석"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","肝 心","平肝潛陽<br>降逆<br>止血","頭痛眩暈<br>噯氣, 呃逆, 嘔吐<br>吐血, 衄血, 崩漏",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-血分에 熱이 있어서 나타나는 吐血과 衄血 등 證에 適用하여 모두 良好한 治療效果","-質重性墮하고 苦寒한 藥物이므로 虛寒證과 孕婦는 服用을 忌"]}],["sec",{"key":"qna","label":"본초문답","lines":["-代赭石 主降(p76)","-代赭石亦重鎭, 而色赤又入血分, 故一名血師, 以其能降血也. 血爲氣所宅. 旋覆花代赭石湯, 止噯氣者, 正是行血以降其氣也(p83)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-質重하고 性降하여 熱勢가 盛한데 적응하며 高血壓‧高熱‧痙攣‧嘔吐등을 治療하며, 天然代赭石의 降壓效果는 煆劑보다 강하다.","-血壓이 오르고 頭暈頭痛‧眼花‧耳鳴‧面紅‧行路飄浮‧舌紅‧脈弦數 수반에 最適이다.","-降壓作用이 顯著 大量으로 血壓을 내린 後 減量하거나 安定性 있는 藥으로 바꾸어야 한다.","-횡경막의 痙攣을 緩和시키는 작용이 있어 呃逆에 사용한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二五八 味微甘, 性凉而降하며 血分藥也라 能下氣降痰淸火하니 除胸腹邪毒하며 殺鬼物精氣하며 止反胃吐血衄血, 血痺血痢, 血中邪熱, 大人小兒驚癎, 狂熱入臟, 腸風痔漏, 脫精遺尿, 及婦人赤白帶下, 難産胞衣不出, 月經不止하니 俱可爲散調服이라 亦治金瘡하며 生肌長肉이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 차며[寒](평(平)하다고도 한다) 맛은 쓰고 달며[苦甘] 독이 없다. 헛것과 꿈에 성교하는 것을 낫게 하며 여자의 누하(漏下), 적백대하와 온갖 병을 낫게 하며 피를 토하는 것과 코피를 멎게 하고 장풍, 치루, 월경이 멎지 않는 증, 붕루를 낫게 한다. 또한 혈비(血痺), 어혈, 설사, 이질, 오줌에 피가 섞여 나오는 것, 오줌 나가는 줄 모르는 것을 낫게 하며 음위증을 낫게 하고 쇠붙이에 다친 것을 낫게 한다. 또 살이 살아나며 유산시킨다.","-일명 혈사(血師)라고도 하는데 대군(代郡)에서 난다. 붉고 푸른 빛인데 닭의 볏 비슷하고 윤기가 나며 손톱에 물들이면 지지 않는다. 덩이 위에 무늬가 문고리쇠와 같은 것을 정두대자(丁頭代赭)라 하며 가장 좋다.","-소와 말에 바르면 돌림병을 예방한다[본초]","-수소음경, 족궐음경에 들어간다. 이것은 지금의 좋은 적토(赤土, 빛이 붉은 흙)다. 불에 달구어 식초에 담그기를 일곱번 반복하여 가루낸 다음 수비하여 햇볕에 말려 쓴다[입문]"]}]],"searchText":"代赭石 분류 平肝藥-平肝潛陽藥 기원 적철광의 광석 性味 歸經 效能 主治 備考 苦 寒 肝 心 平肝潛陽<br>降逆<br>止血 頭痛眩暈<br>噯氣, 呃逆, 嘔吐<br>吐血, 衄血, 崩漏  약물특징/비교 -血分에 熱이 있어서 나타나는 吐血과 衄血 등 證에 適用하여 모두 良好한 治療效果 -質重性墮하고 苦寒한 藥物이므로 虛寒證과 孕婦는 服用을 忌 본초문답 -代赭石 主降(p76) -代赭石亦重鎭, 而色赤又入血分, 故一名血師, 以其能降血也. 血爲氣所宅. 旋覆花代赭石湯, 止噯氣者, 正是行血以降其氣也(p83) 진존인본초 -質重하고 性降하여 熱勢가 盛한데 적응하며 高血壓‧高熱‧痙攣‧嘔吐등을 治療하며, 天然代赭石의 降壓效果는 煆劑보다 강하다. -血壓이 오르고 頭暈頭痛‧眼花‧耳鳴‧面紅‧行路飄浮‧舌紅‧脈弦數 수반에 最適이다. -降壓作用이 顯著 大量으로 血壓을 내린 後 減量하거나 安定性 있는 藥으로 바꾸어야 한다. -횡경막의 痙攣을 緩和시키는 작용이 있어 呃逆에 사용한다. 경악전서 二五八 味微甘, 性凉而降하며 血分藥也라 能下氣降痰淸火하니 除胸腹邪毒하며 殺鬼物精氣하며 止反胃吐血衄血, 血痺血痢, 血中邪熱, 大人小兒驚癎, 狂熱入臟, 腸風痔漏, 脫精遺尿, 及婦人赤白帶下, 難産胞衣不出, 月經不止하니 俱可爲散調服이라 亦治金瘡하며 生肌長肉이라 동의보감 -성질은 차며[寒](평(平)하다고도 한다) 맛은 쓰고 달며[苦甘] 독이 없다. 헛것과 꿈에 성교하는 것을 낫게 하며 여자의 누하(漏下), 적백대하와 온갖 병을 낫게 하며 피를 토하는 것과 코피를 멎게 하고 장풍, 치루, 월경이 멎지 않는 증, 붕루를 낫게 한다. 또한 혈비(血痺), 어혈, 설사, 이질, 오줌에 피가 섞여 나오는 것, 오줌 나가는 줄 모르는 것을 낫게 하며 음위증을 낫게 하고 쇠붙이에 다친 것을 낫게 한다. 또 살이 살아나며 유산시킨다. -일명 혈사(血師)라고도 하는데 대군(代郡)에서 난다. 붉고 푸른 빛인데 닭의 볏 비슷하고 윤기가 나며 손톱에 물들이면 지지 않는다. 덩이 위에 무늬가 문고리쇠와 같은 것을 정두대자(丁頭代赭)라 하며 가장 좋다. -소와 말에 바르면 돌림병을 예방한다[본초] -수소음경, 족궐음경에 들어간다. 이것은 지금의 좋은 적토(赤土, 빛이 붉은 흙)다. 불에 달구어 식초에 담그기를 일곱번 반복하여 가루낸 다음 수비하여 햇볕에 말려 쓴다[입문]"},{"id":110,"name":"附子","aliases":[],"category":"溫裏藥","origin":"毛茛科 附子의 子根","initial":"기타","sortName":"附子","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 熱 有毒","心 脾 腎","回陽補火<br>散寒除濕","陰盛格陽, 大汗亡陽, 吐利厥逆, 心腹冷痛<br>脾泄冷痢, 脚氣水腫, 小兒慢驚, 風寒濕痺<br>踒躄拘攣, 陰疽瘡漏, 一切沈寒痼冷",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["溫裏藥"]}],["sec",{"key":"origin","label":"기원","lines":["毛茛科 附子의 子根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 熱 有毒","心 脾 腎","回陽補火<br>散寒除濕","陰盛格陽, 大汗亡陽, 吐利厥逆, 心腹冷痛<br>脾泄冷痢, 脚氣水腫, 小兒慢驚, 風寒濕痺<br>踒躄拘攣, 陰疽瘡漏, 一切沈寒痼冷",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-走而不守하며 純陽의 性質","․上으로는 心陽을 도와 通脈, 中으로는 脾陽을 溫하게 하여 健運, 下로는 腎陽을 補하여 益火하며","․外로는 衛陽을 固하여 祛寒하므로 溫裏, 扶陽, 祛寒의 要藥","-“開辟群陰 迎陽歸舍” “果有眞寒 無所不治”","-散失된 亡陽을 쫓아서 능히 元陽의 不足한 것을 資助하여 表裏의 寒濕을 除去하는 藥"]}],["sec",{"key":"qna","label":"본초문답","lines":["-極陽極陰, 皆有毒, 附子之烈, 正以其純是坎陽之性, 可以大毒, 附子與肉桂之性不同. 肉桂是補火, 秉於地二之火氣者也. 附子是助熱, 熱生於水中, 是得天水之陽, 故附子純入氣分以助陽, 爲腎與膀胱之藥. 火煆則無毒, 水中之陽毒, 遇火則散, 亦陰陽相引之義.","-今用鹽醃以去毒, 使附子之性不全, 非法也(p6)","-陽氣怫鬱之微風宜散, 荷‧荊‧防‧紫蘇‧柴胡之類是矣. 陰氣遏抑之暴風則宜溫, 附子‧川烏‧白附子之類是矣(p143)","-寒入骨節, 腰膝周身疼痛, 手足厥冷, 宜附子以溫腎. 腎主骨, 用細辛以引經入骨驅寒. 寒循太陽經, 發爲痙, 用葛根引桂麻, 循經脈以散之(p150)","-寒入腦髓, 名眞頭痛, 用細辛以引經上達, 用附子以助陽上行, 皆屬督脈以上入於腦也(p151)","-四肢厥冷者, 由於腎陽不達, 附子溫水中之陽, 故治之. (破)故紙溫腎, 但能溫斂 而不伸達, 故但治腰痛, 而不治手足厥冷...(p153)","-又小便自利, 大便反硬者, 仲景用附子白朮, 又是以火蒸水, 通致津液之法(p174)","-附子補命門眞火, 是以火化水(p211)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-溫暖, 散寒, 强壯작용이 있어 脈微細‧沈遲‧虛大하고 舌質이 柔, 淡色, 四肢不溫, 惡寒, 권태감, 구토, 설사 등에 적용한다.","-强心作用이 있어 輕度의 心臟機能 弱化를 치료한다. (眞武湯의 附子)","-성기능 强壯을 돕는작용이 있어 遺精‧早漏 억제한다.(+補骨脂‧肉蓗蓉‧免絲子)","-風濕病 장기화한 關節痛, 각종 신경통, 좌골신경통 만성화로 痠痛時 祛風濕藥과 同用한다.","-알레르기 脾炎에 麻黃‧附子‧細辛","-과학문헌 : 뇌하수체‧부신피질계통에 대한 흥분작용과, 부신피질호르몬양작용‧미주신경중추흥분작용‧강심작용이 있다.","-임상 : 만성 허약증(心臟弱)으로 인한 浮腫 등에 强心."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百二六 氣味는 辛甘이나 醃者는 大鹹하며 性은 大熱하야 陽中之陽也며 有毒이라 其性은浮中有沈하며 走而不守라","因其善走諸經, 故로 曰與酒로 同功이라하니 能除表裏沈寒하고 厥逆寒噤하며 溫中强陰하고 煖五臟하며 回陽氣하야 除嘔噦霍亂, 反胃噎膈, 心腹疼痛, 脹滿瀉痢, 肢體拘攣, 寒邪濕氣, 胃寒蛔蟲, 寒痰寒疝, 風濕麻痺, 陰疽癰毒, 久漏冷瘡, 格陽喉痺, 陽虛二便不通, 及婦人經寒不調, 小兒慢驚等證이라 大能引火歸源하야 制伏虛熱하며 善助參‧芪하야 成功하며 尤贊朮‧地하야 建效하니 無論表證裏證하고 但脈細無神하며 氣虛無熱者엔 所當急用이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 몹시 열하고[大熱] 맛은 매우며 달고[辛甘] 독이 많다. 3초를 보하고 궐역(厥逆)과 6부(府)에 있는 한랭과 한습으로 위벽증(證)이 생긴 것을 낫게 한다. 유산시키는 데는 모든 약 가운데서 가장 좋다","-오두(烏頭), 오훼(烏喙), 천웅(天雄), 부자(附子), 측자(側子)가 다 한 가지 식물이다. 모양이 까마귀 대가리 같은 것을 오두라 하고 두가닥진 것은 오훼라 한다. 가늘고 길이가 3-4치 되는 것을 천웅이라 하며 뿌리겉에 토란과 같이 붙어 있는 것을 부자라 한다. 겉에 연달아 난 것을 측자라고 한다. 이 5가지 약은 같은 데 생기는데 이름만 다르다[본초]","-부자가 작은 것은 약 힘이 약하고 큰 것은 성질이 사납고 20g쯤 되는 것이 좋다[단심]","-옛날 의학책에는 큰 부자로서 무게가 40g인 것을 쓰면 그 힘이 크다고 하였다. 대개 쓸 때에는 반드시 싸서 터지도록 구워 껍질과 배꼽을 버리고 쓴다[단심]","-쓸 때에 동변에 담갔다가 달여셔 쓰면 내려가는 힘이 좋아진다","-본래 수소양명문(手少陽命門)과 三焦의 약이다. 모든 경맥을 다 돌기 때문에 높은 데나 중간이나 낮은 데나 가지 못하는 곳이 없다[입문]","-감초, 인삼, 생강을 배합하면 그 毒이 없어진다[입문]"]}]],"searchText":"附子 분류 溫裏藥 기원 毛茛科 附子의 子根 性味 歸經 效能 主治 備考 辛甘 熱 有毒 心 脾 腎 回陽補火<br>散寒除濕 陰盛格陽, 大汗亡陽, 吐利厥逆, 心腹冷痛<br>脾泄冷痢, 脚氣水腫, 小兒慢驚, 風寒濕痺<br>踒躄拘攣, 陰疽瘡漏, 一切沈寒痼冷  약물특징/비교 -走而不守하며 純陽의 性質 ․上으로는 心陽을 도와 通脈, 中으로는 脾陽을 溫하게 하여 健運, 下로는 腎陽을 補하여 益火하며 ․外로는 衛陽을 固하여 祛寒하므로 溫裏, 扶陽, 祛寒의 要藥 -“開辟群陰 迎陽歸舍” “果有眞寒 無所不治” -散失된 亡陽을 쫓아서 능히 元陽의 不足한 것을 資助하여 表裏의 寒濕을 除去하는 藥 본초문답 -極陽極陰, 皆有毒, 附子之烈, 正以其純是坎陽之性, 可以大毒, 附子與肉桂之性不同. 肉桂是補火, 秉於地二之火氣者也. 附子是助熱, 熱生於水中, 是得天水之陽, 故附子純入氣分以助陽, 爲腎與膀胱之藥. 火煆則無毒, 水中之陽毒, 遇火則散, 亦陰陽相引之義. -今用鹽醃以去毒, 使附子之性不全, 非法也(p6) -陽氣怫鬱之微風宜散, 荷‧荊‧防‧紫蘇‧柴胡之類是矣. 陰氣遏抑之暴風則宜溫, 附子‧川烏‧白附子之類是矣(p143) -寒入骨節, 腰膝周身疼痛, 手足厥冷, 宜附子以溫腎. 腎主骨, 用細辛以引經入骨驅寒. 寒循太陽經, 發爲痙, 用葛根引桂麻, 循經脈以散之(p150) -寒入腦髓, 名眞頭痛, 用細辛以引經上達, 用附子以助陽上行, 皆屬督脈以上入於腦也(p151) -四肢厥冷者, 由於腎陽不達, 附子溫水中之陽, 故治之. (破)故紙溫腎, 但能溫斂 而不伸達, 故但治腰痛, 而不治手足厥冷...(p153) -又小便自利, 大便反硬者, 仲景用附子白朮, 又是以火蒸水, 通致津液之法(p174) -附子補命門眞火, 是以火化水(p211) 진존인본초 -溫暖, 散寒, 强壯작용이 있어 脈微細‧沈遲‧虛大하고 舌質이 柔, 淡色, 四肢不溫, 惡寒, 권태감, 구토, 설사 등에 적용한다. -强心作用이 있어 輕度의 心臟機能 弱化를 치료한다. (眞武湯의 附子) -성기능 强壯을 돕는작용이 있어 遺精‧早漏 억제한다.(+補骨脂‧肉蓗蓉‧免絲子) -風濕病 장기화한 關節痛, 각종 신경통, 좌골신경통 만성화로 痠痛時 祛風濕藥과 同用한다. -알레르기 脾炎에 麻黃‧附子‧細辛 -과학문헌 : 뇌하수체‧부신피질계통에 대한 흥분작용과, 부신피질호르몬양작용‧미주신경중추흥분작용‧강심작용이 있다. -임상 : 만성 허약증(心臟弱)으로 인한 浮腫 등에 强心. 경악전서 百二六 氣味는 辛甘이나 醃者는 大鹹하며 性은 大熱하야 陽中之陽也며 有毒이라 其性은浮中有沈하며 走而不守라 因其善走諸經, 故로 曰與酒로 同功이라하니 能除表裏沈寒하고 厥逆寒噤하며 溫中强陰하고 煖五臟하며 回陽氣하야 除嘔噦霍亂, 反胃噎膈, 心腹疼痛, 脹滿瀉痢, 肢體拘攣, 寒邪濕氣, 胃寒蛔蟲, 寒痰寒疝, 風濕麻痺, 陰疽癰毒, 久漏冷瘡, 格陽喉痺, 陽虛二便不通, 及婦人經寒不調, 小兒慢驚等證이라 大能引火歸源하야 制伏虛熱하며 善助參‧芪하야 成功하며 尤贊朮‧地하야 建效하니 無論表證裏證하고 但脈細無神하며 氣虛無熱者엔 所當急用이라 동의보감 -성질은 몹시 열하고[大熱] 맛은 매우며 달고[辛甘] 독이 많다. 3초를 보하고 궐역(厥逆)과 6부(府)에 있는 한랭과 한습으로 위벽증(證)이 생긴 것을 낫게 한다. 유산시키는 데는 모든 약 가운데서 가장 좋다 -오두(烏頭), 오훼(烏喙), 천웅(天雄), 부자(附子), 측자(側子)가 다 한 가지 식물이다. 모양이 까마귀 대가리 같은 것을 오두라 하고 두가닥진 것은 오훼라 한다. 가늘고 길이가 3-4치 되는 것을 천웅이라 하며 뿌리겉에 토란과 같이 붙어 있는 것을 부자라 한다. 겉에 연달아 난 것을 측자라고 한다. 이 5가지 약은 같은 데 생기는데 이름만 다르다[본초] -부자가 작은 것은 약 힘이 약하고 큰 것은 성질이 사납고 20g쯤 되는 것이 좋다[단심] -옛날 의학책에는 큰 부자로서 무게가 40g인 것을 쓰면 그 힘이 크다고 하였다. 대개 쓸 때에는 반드시 싸서 터지도록 구워 껍질과 배꼽을 버리고 쓴다[단심] -쓸 때에 동변에 담갔다가 달여셔 쓰면 내려가는 힘이 좋아진다 -본래 수소양명문(手少陽命門)과 三焦의 약이다. 모든 경맥을 다 돌기 때문에 높은 데나 중간이나 낮은 데나 가지 못하는 곳이 없다[입문] -감초, 인삼, 생강을 배합하면 그 毒이 없어진다[입문]"},{"id":111,"name":"(川)烏頭","aliases":[],"category":"溫裏藥","origin":"毛茛科 다년생 초본인 오두의 塊根","initial":"기타","sortName":"烏頭","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 熱 有毒","脾 命門","祛寒濕<br>散風邪<br>溫經<br>止痛","風寒濕痺, 歷節風痛, 四肢拘攣, 半身不遂, 頭風頭痛, 心腹冷痛, 陰疽腫毒",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["溫裏藥"]}],["sec",{"key":"origin","label":"기원","lines":["毛茛科 다년생 초본인 오두의 塊根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 熱 有毒","脾 命門","祛寒濕<br>散風邪<br>溫經<br>止痛","風寒濕痺, 歷節風痛, 四肢拘攣, 半身不遂, 頭風頭痛, 心腹冷痛, 陰疽腫毒",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-性味가 附子와 유사한데","․附子는 治寒에 長이 있어 補藥 중에 사용하고,","․烏頭는 治風에 長이며, 燥散하는 性質이 비교적 附子보다 우수"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-散寒化濕‧溫經止痛 : 關節痛‧神經痛‧筋肉痛의 止痛藥으로 常用되며 옛날 局部痲醉劑","․坐骨神經痛이 3個月이상 경과時 : 烏頭+地龍‧當歸尾‧羌活‧獨活을 配合한다.","․腰椎肥大 및 腰部椎間板헤르니아 원인인 坐骨神經痛에 川烏에 蟲類 및 蛇類를 배합한다.","․만성적인 關節痛이 오래되어 體虛해진 경우 補身養血藥에 溫暖散寒의 川烏를 배합한다.","-川烏","․發散力은 麻黃이나 荊芥에는 미치지 못하므로 한열의 發散을 위한 君藥으로 사용할 수는 없고, 필히 辛溫하고 發散力이 강한 약과 配合하여 사용할 필요가 있다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-오두(烏頭)의 성질은 몹시 열하고[大熱] 맛은 매우며 달고[辛甘] 독이 없다. 풍, 한, 습으로 생긴 비증(痺證)을 낫게 하고 가슴 위에 있는 냉담(冷痰)을 삭게 하며 명치 아래가 몹시 아픈 것을 멎게 하고 적취(積聚)를 헤치며 유산시킨다","-즉 천오(川烏)이다. 부자와 같은 종류로서 법제하는 방법도 같다. 일명 근(菫) 또는 해독(奚毒)이라고도 하는데 그의 모양은 길고 뾰족한 것이 좋다[본초]","-오두와 천웅은 모두 기가 웅장하고 형세가 세어서 하부의 약에 좌사약이 될 수 있다. 그런데 사람을 해하는 것이 잘 나타나지 않으므로 이것을 알지 못하며 사람을 죽이는 일이 많다. 때문에 반드시 동변에 달여서 담가 두어 그 독을 없애는 동시에 내려가는 힘을 돕게 하여야 한다. 소금을 넣으면 더욱 빠르다[단심]"]}]],"searchText":"(川)烏頭 분류 溫裏藥 기원 毛茛科 다년생 초본인 오두의 塊根 性味 歸經 效能 主治 備考 辛 熱 有毒 脾 命門 祛寒濕<br>散風邪<br>溫經<br>止痛 風寒濕痺, 歷節風痛, 四肢拘攣, 半身不遂, 頭風頭痛, 心腹冷痛, 陰疽腫毒  약물특징/비교 -性味가 附子와 유사한데 ․附子는 治寒에 長이 있어 補藥 중에 사용하고, ․烏頭는 治風에 長이며, 燥散하는 性質이 비교적 附子보다 우수 진존인본초 -散寒化濕‧溫經止痛 : 關節痛‧神經痛‧筋肉痛의 止痛藥으로 常用되며 옛날 局部痲醉劑 ․坐骨神經痛이 3個月이상 경과時 : 烏頭+地龍‧當歸尾‧羌活‧獨活을 配合한다. ․腰椎肥大 및 腰部椎間板헤르니아 원인인 坐骨神經痛에 川烏에 蟲類 및 蛇類를 배합한다. ․만성적인 關節痛이 오래되어 體虛해진 경우 補身養血藥에 溫暖散寒의 川烏를 배합한다. -川烏 ․發散力은 麻黃이나 荊芥에는 미치지 못하므로 한열의 發散을 위한 君藥으로 사용할 수는 없고, 필히 辛溫하고 發散力이 강한 약과 配合하여 사용할 필요가 있다. 동의보감 -오두(烏頭)의 성질은 몹시 열하고[大熱] 맛은 매우며 달고[辛甘] 독이 없다. 풍, 한, 습으로 생긴 비증(痺證)을 낫게 하고 가슴 위에 있는 냉담(冷痰)을 삭게 하며 명치 아래가 몹시 아픈 것을 멎게 하고 적취(積聚)를 헤치며 유산시킨다 -즉 천오(川烏)이다. 부자와 같은 종류로서 법제하는 방법도 같다. 일명 근(菫) 또는 해독(奚毒)이라고도 하는데 그의 모양은 길고 뾰족한 것이 좋다[본초] -오두와 천웅은 모두 기가 웅장하고 형세가 세어서 하부의 약에 좌사약이 될 수 있다. 그런데 사람을 해하는 것이 잘 나타나지 않으므로 이것을 알지 못하며 사람을 죽이는 일이 많다. 때문에 반드시 동변에 달여서 담가 두어 그 독을 없애는 동시에 내려가는 힘을 돕게 하여야 한다. 소금을 넣으면 더욱 빠르다[단심]"},{"id":112,"name":"半夏","aliases":[],"category":"化痰止咳平喘藥-溫化寒痰藥","origin":"天南星科 半夏의 塊莖","initial":"기타","sortName":"半夏","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫 有毒","脾 胃 肺","燥濕化痰<br>降逆止嘔<br>消痞散結","痰多喘咳, 痰飮眩悸, 風痰眩暈, 痰厥頭痛, 嘔吐反胃, 胸脘痞悶, 梅核氣症<br>(生用 外治) 癰腫痰核",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["化痰止咳平喘藥-溫化寒痰藥"]}],["sec",{"key":"origin","label":"기원","lines":["天南星科 半夏의 塊莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫 有毒","脾 胃 肺","燥濕化痰<br>降逆止嘔<br>消痞散結","痰多喘咳, 痰飮眩悸, 風痰眩暈, 痰厥頭痛, 嘔吐反胃, 胸脘痞悶, 梅核氣症<br>(生用 外治) 癰腫痰核",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-化痰止嘔시키는 效能이 있어 脾 胃二經의 要藥","-溫燥한 藥物로 陰液을 損傷하기 쉬우므로 陰虛肺熱로 인한 燥痰咯血者는 服用×","-炮製의 方法에 따라서 效能에 차이","․淸半夏는 燥濕化痰에 特長","․薑汁炒한 半夏는 降逆止嘔에 偏重되게 作用","․法半夏는 和胃燥濕","․半夏麯은 化痰消食","․生半夏는 有毒하여 外用에 많이 應用하며 消腫散結의 效能","-근래에는 生半夏를 內服하는 경우가 있는데, 生薑을 반드시 같이 사용"]}],["sec",{"key":"qna","label":"본초문답","lines":["-至於半夏, 雖生當夏之半, 而其根成於秋時, 得燥金辛烈之氣味, 故主降利水飮, 爲陽明之藥(p40)","-腸胃所以化飮食, 皆以其燥能消耗之也. 燥化不足, 則不消水, 爲嘔吐‧泄利, 用半夏‧陳皮‧白朮爲主, 然此皆燥氣不足之濕病也(p171)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-현저한 化痰鎭咳의 효능이 있어 呼吸器疾患에 常用藥이다.","-內耳性眩暈으로 回轉性眩氣‧耳鳴‧吐氣가 있을 때 半夏에 柴胡‧澤瀉‧旋覆花‧枳實을 배합하면 水腫을 消退시키고 化痰‧止暈한다.","-健胃止嘔 : 胃虛寒症으로 맑은 胃液을 吐하고 食慾減少‧飽脹등이나 胃疾患의 嘔吐에 사용"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百三十 味大辛微苦하며 氣溫하야 可升可降하며 陽中陰也며 有毒이라 其質은 滑潤하며 其性은 燥濕降痰하며 入脾胃膽經이라 生嚼이면 戟喉하니 制用生薑이라","下肺氣, 開胃健脾, 消痰飮痞滿하며 止欬嗽上氣, 心痛脇痛하며 除嘔吐反胃, 霍亂轉筋, 頭眩腹脹, 不眠氣結, 痰核腫突하며 去痰厥頭痛, 散風閉喉瘖하며 治脾濕泄瀉, 遺精帶濁, 消癰疽腫毒, 殺蜈蚣蜂蠆蟲毒이라 性能墮胎하야 孕婦雖忌하나 然이나 胃不和而嘔吐不止면 加薑汁하야 微炒면 但用無妨이며 若消渴煩熱, 及陰虛血證엔 最忌勿加라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-상한(傷寒)에 추웠다 열이 났다 하는 것을 낫게 하고 명치 아래에 담열(痰熱)이 그득하게 몰린 것과 기침하고 숨이 찬 것을 낫게 하며 담연(痰涎)을 삭이며 음식을 잘 먹게 한다. 비(脾)를 든든하게 하고 토하는 것을 멎게 하며 가슴 속에 담연을 없앤다. 또 학질을 낮게 하며 유산시킨다","-곳곳에 있으며 밭과 들에서 자라는데 음력 5월, 8월에 뿌리를 캐 햇볕에 말린다. 둥글고 희며 오래 묵은 것이 좋다[본초]","-끓는 물에 담갔다가 조각이 나게 썰어 일곱번을 씻어 침 같은 진이 다 없어진 다음 생강즙에 담가 하룻밤 두었던 것을 약한 불기운에 말려 쓴다[본초]","-족양명경과 태음경, 소양경에 들어간다. 음력 12월에 물에 우려서 밖에 내놓아 얼쿤다[氷]. 이렇게 일곱번 우려 오래 두었던 것이 가장 좋다[입문]","-3가지 소갈과 혈허(血虛)한 사람, 목구멍이 마르면서 아픈 사람, 장이 말라 대변을 보기 힘든 사람, 땀이 많은 사람에게는 모두 쓰지 말아야 한다[단심]"]}]],"searchText":"半夏 분류 化痰止咳平喘藥-溫化寒痰藥 기원 天南星科 半夏의 塊莖 性味 歸經 效能 主治 備考 辛 溫 有毒 脾 胃 肺 燥濕化痰<br>降逆止嘔<br>消痞散結 痰多喘咳, 痰飮眩悸, 風痰眩暈, 痰厥頭痛, 嘔吐反胃, 胸脘痞悶, 梅核氣症<br>(生用 外治) 癰腫痰核  약물특징/비교 -化痰止嘔시키는 效能이 있어 脾 胃二經의 要藥 -溫燥한 藥物로 陰液을 損傷하기 쉬우므로 陰虛肺熱로 인한 燥痰咯血者는 服用× -炮製의 方法에 따라서 效能에 차이 ․淸半夏는 燥濕化痰에 特長 ․薑汁炒한 半夏는 降逆止嘔에 偏重되게 作用 ․法半夏는 和胃燥濕 ․半夏麯은 化痰消食 ․生半夏는 有毒하여 外用에 많이 應用하며 消腫散結의 效能 -근래에는 生半夏를 內服하는 경우가 있는데, 生薑을 반드시 같이 사용 본초문답 -至於半夏, 雖生當夏之半, 而其根成於秋時, 得燥金辛烈之氣味, 故主降利水飮, 爲陽明之藥(p40) -腸胃所以化飮食, 皆以其燥能消耗之也. 燥化不足, 則不消水, 爲嘔吐‧泄利, 用半夏‧陳皮‧白朮爲主, 然此皆燥氣不足之濕病也(p171) 진존인본초 -현저한 化痰鎭咳의 효능이 있어 呼吸器疾患에 常用藥이다. -內耳性眩暈으로 回轉性眩氣‧耳鳴‧吐氣가 있을 때 半夏에 柴胡‧澤瀉‧旋覆花‧枳實을 배합하면 水腫을 消退시키고 化痰‧止暈한다. -健胃止嘔 : 胃虛寒症으로 맑은 胃液을 吐하고 食慾減少‧飽脹등이나 胃疾患의 嘔吐에 사용 경악전서 百三十 味大辛微苦하며 氣溫하야 可升可降하며 陽中陰也며 有毒이라 其質은 滑潤하며 其性은 燥濕降痰하며 入脾胃膽經이라 生嚼이면 戟喉하니 制用生薑이라 下肺氣, 開胃健脾, 消痰飮痞滿하며 止欬嗽上氣, 心痛脇痛하며 除嘔吐反胃, 霍亂轉筋, 頭眩腹脹, 不眠氣結, 痰核腫突하며 去痰厥頭痛, 散風閉喉瘖하며 治脾濕泄瀉, 遺精帶濁, 消癰疽腫毒, 殺蜈蚣蜂蠆蟲毒이라 性能墮胎하야 孕婦雖忌하나 然이나 胃不和而嘔吐不止면 加薑汁하야 微炒면 但用無妨이며 若消渴煩熱, 及陰虛血證엔 最忌勿加라 동의보감 -상한(傷寒)에 추웠다 열이 났다 하는 것을 낫게 하고 명치 아래에 담열(痰熱)이 그득하게 몰린 것과 기침하고 숨이 찬 것을 낫게 하며 담연(痰涎)을 삭이며 음식을 잘 먹게 한다. 비(脾)를 든든하게 하고 토하는 것을 멎게 하며 가슴 속에 담연을 없앤다. 또 학질을 낮게 하며 유산시킨다 -곳곳에 있으며 밭과 들에서 자라는데 음력 5월, 8월에 뿌리를 캐 햇볕에 말린다. 둥글고 희며 오래 묵은 것이 좋다[본초] -끓는 물에 담갔다가 조각이 나게 썰어 일곱번을 씻어 침 같은 진이 다 없어진 다음 생강즙에 담가 하룻밤 두었던 것을 약한 불기운에 말려 쓴다[본초] -족양명경과 태음경, 소양경에 들어간다. 음력 12월에 물에 우려서 밖에 내놓아 얼쿤다[氷]. 이렇게 일곱번 우려 오래 두었던 것이 가장 좋다[입문] -3가지 소갈과 혈허(血虛)한 사람, 목구멍이 마르면서 아 헤치고 유산시킨다.","․중풍으로 이를 악문 것을 낫게 하며 노채충을 죽인다.","․곳곳에서 난다. 나무의 키는 높고 가지 사이에서 큰 가시가 돋아 있다. 음력 9-10월에 열매를 따서 그늘에서 말린다. 장조협, 저아조협 등 두 가지가 있는데 지금 의사들은 풍기를 없애는 알약이나 가루약에는 장조협을 쓰고 이빨의 병과 적을 낫게 하는 약에는 저아조협을 많이 쓴다. 성질과 맛은 대체로 비슷하다.","․좀 안 먹고 잘 여문 것이 좋다. 주염열매 달인 물로 목욕하면 때가 아주 잘 씻어진다[본초]","․궐음경으로 들어가는 약이다. 껍질과 씨를 버리고 졸인 젖을 발라 굽거나 꿀을 발라 구워서 쓴다[입문]","․쇠모루에 금, 은을 두드리면 천백 년까지도 깨지지 않는데 주염열매를 놓고 두드리면 곧 부서진다. 일명 조각이라고도 한다[단심]","-조협자(皂莢子, 주염열매씨)","․5장에 풍열이 옹체(癰滯)된 것을 내보낸다. 또한 폐병약으로도 쓴다. 대장에 풍사가 있어 변비가 된 것을 풀리게 한다. 싸서 구워 속에 있는 씨를 꺼내어 씹어 먹으면 가슴에 담이 있는 것과 신물이 올라오는 것을 낫게 한다[본초]","-조각자(皂角刺, 주염나무가시)","․일명 천정(天丁)이라고도 한다. 터지지 않은 옹종을 터지게 한다. 이미 터진 때에는 약 기운을 끌고 종처에까지 가므로 모든 악창과 문둥병에 좋은 약으로 된다[입문]","-귀조협(鬼皂莢)","․못가에서 난다. 주염나무와 비슷한데 높이가 1-2자이다. 이것을 달인 물로 목욕하면 풍창(風瘡)과 옴과 버짐이 낫게 되고 옷의 때도 잘 진다. 또 머리를 감으면 머리털이 잘 자란다[본초]"]}]],"searchText":"皂莢 분류 化痰止咳平喘藥-溫化寒痰藥 기원 豆科 낙엽교목 조각자나무의 不育한 과실 性味 歸經 效能 主治 備考 辛 溫 有小毒 肺 大腸 祛痰開竅<br>散結消腫 中風口噤, 昏迷不醒, 癲癎痰盛, 關竅不通, 喉痺痰阻, 頑痰喘咳, 咯痰不爽, 大便燥結 (外治) 癰腫  약물특징/비교 -頑痰이 阻塞되어 胸悶喘咳하고 咯痰이 不爽한 證에 비교적 强한 祛痰作用 -갑자기 昏迷하여 口噤不開커나 癲癎에 痰의 壅盛으로 關竅가 阻閉한 證과 腸燥便秘에 쓴다. -瘡腫未潰에 熬膏로 만들어 患部에 塗敷하면 散結消腫 동의보감 -조협(주염열매) ․성은 따뜻하며[溫] 맛은 맵고[辛] 짜며 조금 독이 있다. 뼈마디를 잘 쓰게 하고 두풍(頭風)을 낫게 하며 9규를 잘 통하게 하고 담연을 삭게 한다. 기침을 멈추며 창만을 낫게 하며 징가를 헤치고 유산시킨다. ․중풍으로 이를 악문 것을 낫게 하며 노채충을 죽인다. ․곳곳에서 난다. 나무의 키는 높고 가지 사이에서 큰 가시가 돋아 있다. 음력 9-10월에 열매를 따서 그늘에서 말린다. 장조협, 저아조협 등 두 가지가 있는데 지금 의사들은 풍기를 없애는 알약이나 가루약에는 장조협을 쓰고 이빨의 병과 적을 낫게 하는 약에는 저아조협을 많이 쓴다. 성질과 맛은 대체로 비슷하다. ․좀 안 먹고 잘 여문 것이 좋다. 주염열매 달인 물로 목욕하면 때가 아주 잘 씻어진다[본초] ․궐음경으로 들어가는 약이다. 껍질과 씨를 버리고 졸인 젖을 발라 굽거나 꿀을 발라 구워서 쓴다[입문] ․쇠모루에 금, 은을 두드리면 천백 년까지도 깨지지 않는데 주염열매를 놓고 두드리면 곧 부서진다. 일명 조각이라고도 한다[단심] -조협자(皂莢子, 주염열매씨) ․5장에 풍열이 옹체(癰滯)된 것을 내보낸다. 또한 폐병약으로도 쓴다. 대장에 풍사가 있어 변비가 된 것을 풀리게 한다. 싸서 구워 속에 있는 씨를 꺼내어 씹어 먹으면 가슴에 담이 있는 것과 신물이 올라오는 것을 낫게 한다[본초] -조각자(皂角刺, 주염나무가시) ․일명 천정(天丁)이라고도 한다. 터지지 않은 옹종을 터지게 한다. 이미 터진 때에는 약 기운을 끌고 종처에까지 가므로 모든 악창과 문둥병에 좋은 약으로 된다[입문] -귀조협(鬼皂莢) ․못가에서 난다. 주염나무와 비슷한데 높이가 1-2자이다. 이것을 달인 물로 목욕하면 풍창(風瘡)과 옴과 버짐이 낫게 되고 옷의 때도 잘 진다. 또 머리를 감으면 머리털이 잘 자란다[본초]"},{"id":130,"name":"訶子 치료하고 유산시키며 오줌을 잘 나가게 한다. 월경이 나오지 않다가 혈로(血勞)가 되려고 하는 것도 치료한다.","․못에서 사는데 음력 5-6월에 잡아서 햇볕에 말린다.","․일명 마기, 마황이라고도 한다. 혹 큰 것도 있는데 작은 것이 좋다. 사람이나 소, 말의 피를 빨아 먹어서 배가 똥똥해진 것이 좋다.","․거머리를 잡아 길게 늘어서 배에 있는 알을 버려야 한다. 거머리를 죽이기는 힘들다. 불에 구워서 1년 동안 두었던 것도 물을 만나면 다시 살아난다고 한다[본초]","․쌀 씻은 물에 하룻밤 담가 두었다가 햇볕에 말린 다음 잘게 썰어서 석회와 함께 누렇게 볶아 쓴다[득효]"]}]],"searchText":"水蛭 분류 活血祛瘀藥 기원 水蛭科(거머리과) 거머리 및 柳葉螞蟥(말거머리)의 燙死 건조체 性味 歸經 效能 主治 備考 辛鹹苦 平 有小毒 肝 破血<br>逐瘀<br>通經 癥瘕痞塊<br>跌打損傷<br>血瘀經閉  약물특징/비교 -血瘀로 인한 經閉와 癥瘕積聚, 蓄血發狂 및 跌撲損傷의 重證을 治療하는데 適用. -破血逐瘀하고 通經消癥하는 效能이 强하므로 孕婦와 瘀血이 없는 者는 服用을 忌. 본초문답 -水蛭銳而善入, 又能吮(빨연)血 故主攻血積(p114) 경악전서 二八四 味鹹苦, 性微寒하며 有毒이라 能逐惡血瘀血하며 破血癥積聚하며 通經閉하며 和水道하며 墮胎하며 咂赤白遊, 癰疽腫毒, 及折傷跌撲瘀血不散이라 동의보감 -수질(水蛭, 거머리) ․성질이 평(平)하고(약간 차다[微寒]고도 한다) 맛이 짜면서 쓰고 독이 있다. 어혈(瘀血), 적취(積聚), 징가를 치료하고 유산시키며 오줌을 잘 나가게 한다. 월경이 나오지 않다가 혈로(血勞)가 되려고 하는 것도 치료한다. ․못에서 사는데 음력 5-6월에 잡아서 햇볕에 말린다. ․일명 마기, 마황이라고도 한다. 혹 큰 것도 있는데 작은 것이 좋다. 사람이나 소, 말의 피를 빨아 먹어서 배가 똥똥해진 것이 좋다. ․거머리를 잡아 길게 늘어서 배에 있는 알을 버려야 한다. 거머리를 죽이기는 힘들다. 불에 구워서 1년 동안 두었던 것도 물을 만나면 다시 살아난다고 한다[본초] ․쌀 씻은 물에 하룻밤 담가 두었다가 햇볕에 말린 다음 잘게 썰어서 석회와 함께 누렇게 볶아 쓴다[득효]"},{"id":132,"name":"桃核仁","aliases":["桃仁"],"category":"活血祛瘀藥","origin":"장미과 낙엽 小교목인 복사나무와 산복사의 성북한 종자(종인)","initial":"기타","sortName":"桃核仁","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦甘 平","心 肝 大腸","活血祛瘀<br>潤腸通便","經閉, 痛經, 癥瘕痞塊, 跌撲損傷<br>腸燥便秘",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["活血祛瘀藥"]}],["sec",{"key":"origin","label":"기원","lines":["장미과 낙엽 小교목인 복사나무와 산복사의 성북한 종자(종인)"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦甘 平","心 肝 大腸","活血祛瘀<br>潤腸通便","經閉, 痛經, 癥瘕痞塊, 跌撲損傷<br>腸燥便秘",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-破瘀行血에 常用하는 藥物이 되며, 紅花와 同用하여 治療效果를 增加","-모든 瘀血阻滯로 인한 證에 쓴다","-腸癰이나 肺癰에 適用하면 活血消癰의 效果가 있고, 桃仁에도 止咳逆上氣의 效能이 있다고 함","-良好한 鎭咳作用이 證明되었으므로 杏仁의 代替藥으로 應用가능(다만 祛瘀藥이므로 더 硏究가 필요)"]}],["sec",{"key":"qna","label":"본초문답","lines":["牧丹皮 참조"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-血管壁凝血症으로 인한 下腹痛‧月經痛에 輕證이면 單用하고 重症에 紅花를 加味한다.","․月經痛에 桃仁3‧紅花2‧香附3‧烏藥3을, 예방을 위해 四物湯에 桃仁등을 加味 사용한다.","-桃仁에는 瘀血을 留滯없이 循環시키고, 腫瘍細胞를 破壞하는 작용이 있다.","-腦溢血이나 腦血栓症의 초기에 桃仁을 사용하면 血管 밖으로 溢出된 瘀血을 점차 消失시키며 血栓의 溶解 및 瘀血을 제거하여 痲痺의 回復을 促進시킬 수 있다.","-지방유를 함유 노인의 변비나 수술후 변비에 사용된다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二一二 味苦辛微甘하며 氣平하며 陰中有陽이며 入手足厥陰經이라","去皮尖하야 用하며 善治瘀血血閉, 血結血燥하며 通血隔, 破血癥, 殺三蟲, 潤大便, 逐鬱滯하며 止鬼疰血逆疼痛膨脹하며 療跌撲損傷이나 若血枯經閉者엔 不可妄用이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-도핵인(桃核仁, 복숭아씨)","․성은 평(平)하며(따뜻하다[溫]고도 한다) 맛이 달고[甘] 쓰며[苦] 독이 없다. 어혈과 월경이 막힌 것을 치료하며 징가를 헤치고 월경을 통하게 하며 가슴앓이를 멎게 하고 3충을 죽인다.","․어느 곳에나 있으며 음력 7월에 따서 씨를 깨뜨려 받은 알맹이를 그늘에 말려 쓴다[본초]","․피가 막힌 것을 헤치고 새로운 피가 생기게 하며 어혈을 몰아내고 피를 잘 돌게 한다[의감]","․간은 혈이 모이는 곳인데 혈에 사기가 있으면 간기가 건조해진다. 『내경』에 간이 몹시 조여들면 빨리 단것을 먹어서 완화하게 하라고 하였는데 도인은 맛이 쓰고 달며 매워서 피를 헤치고 간을 완화시킨다[강목]","․手足厥陰經에 들어가는데 끓는 물에 담갔다가 두알들이와 꺼풀과 끝을 버리고 찰지게 갈아서 쓴다[탕액]","-도화(桃花, 복숭아꽃)","․성은 平하고 맛이 쓰며[苦] 독이 없다. 석림(石淋)을 치료하며 대소변을 잘 나가게 하고 3충을 밀어내며 시주와 악귀(惡鬼)를 죽이고 얼굴빛을 좋게 한다.","․꽃받침은 적취(積聚)를 치료한다. 꽃이 떨어질 때 대바구니에 주어 담아 그늘에서 말려 밀가루로 반죽한 다음 떡을 만든다. 이것을 빈속에 먹으면 오래된 적취를 몰아낸다[의설]","․음력 3월 3일에 꽃을 모아 그늘에서 말린다. 여러 겹 둘러싸인 꽃은 쓰지 못한다[본초]","-도효(桃梟, 나무에 달린 마른 복숭아)","․성은 약간 따뜻하며[微溫] 맛은 쓰다[苦]. 온갖 헛것에 들린 것과 5가지 독을 없애며 나쁜 기운에 감촉되며 명치 밑에 아픈 것을 치료하고 피를 헤친다. 또한 악기, 독기에 감촉된 것과 고주를 없앤다.","․일명 桃奴라고도 한다. 복숭아가 나무에 달려 말라서 겨울이 지나도록 떨어지지 않는 것을 도효라고 한다. 음력 정월에 따며 속이 실한 것이 좋다. 혹 음력 12월에 딴다고도 한다.","․일명 귀촉루라고도 하는데 이는 여러 겹 둘러싸인 복숭아꽃이 피는 나무에 달려 마른 것을 음력 12월에 따서 쓴다[본초]","․술에 버무려 쪄서 구리칼로 살을 긁어 내서 약한 불기운에 말려 쓴다[입문]","-도모(桃毛, 복숭아털)","․성은 平한데 혈가와 적취를 몰아내고 악귀와 邪氣를 없애며 붕루를 치료하고 癖氣를 헤친다.","-도두(복숭아나무벌레)","․헛것에 들린 것과 사기를 없앤다. 도두는 복숭아나무의 좀벌레이다[본초]","-도경백피(桃莖白皮, 복숭아나무속껍질)","․邪鬼를 없애고 중악(中惡)으로 명치 밑이 아픈 것을 치료한다[본초]","-도엽(桃葉, 복숭아나무잎)","․시충(尸蟲)과 헌데의 벌레를 죽이며 어린이의 중악, 객오등을 치료한다[본초]","-도교(桃膠, 복숭아나무진)","․석림을 몰아내고 어혈을 헤치며 중악과 시주, 객오를 치료한다[본초]","-도실(桃實, 복숭아열매)","․성은 열(熱)하고 맛이 시며[酸] 약간 독이 있다. 얼굴빛을 좋게 하는데 많이 먹으면 열이 난다[본초]","-급성자(急性子, 붉은 빛 작은 복숭아씨)","․어린이의 벽질(癖疾)15)을 치료한다. 이것은 작은 홍도의 씨다[회춘] (주: 15) 벽질(癖疾) : 적병의 한 가지인데 옆구리에 덩어리(혹같이)가 생긴 병)"]}]],"searchText":"桃核仁 桃仁 분류 活血祛瘀藥 기원 장미과 낙엽 小교목인 복사나무와 산복사의 성북한 종자(종인) 性味 歸經 效能 主治 備考 苦甘 平 心 肝 大腸 活血祛瘀<br>潤腸通便 經閉, 痛經, 癥瘕痞塊, 跌撲損傷<br>腸燥便秘  약물특징/비교 -破瘀行血에 常用하는 藥物이 되며, 紅花와 同用하여 治療效果를 增加 -모든 瘀血阻滯로 인한 證에 쓴다 -腸癰이나 肺癰에 適用하면 活血消癰의 效果가 있고, 桃仁에도 止咳逆上氣의 效能이 있다고 함 -良好한 鎭咳作用이 證明되었으므로 杏仁의 代替藥으로 應用가능(다만 祛瘀藥이므로 더 硏究가 필요) 본초문답 牧丹皮 참조 진존인본초 -血管壁凝血症으로 인한 下腹痛‧月經痛에 輕證이면 單用하고 重症에 紅花를 加味한다. ․月經痛에 桃仁3‧紅花2‧香附3‧烏藥3을, 예방을 위해 四物湯에 桃仁등을 加味 사용한다. -桃仁에는 瘀血을 留滯없이 循環시키고, 腫瘍細胞를 破壞하는 작용이 있다. -腦溢血이나 腦血栓症의 초기에 桃仁을 사용하면 血管 밖으로 溢出된 瘀血을 점차 消失시키며 血栓의 溶解 및 瘀血을 제거하여 痲痺의 回復을 促進시킬 수 있다. -지방유를 함유 노인의 변비나 수술후 변비에 사용된다. 경악전서 二一二 味苦辛微甘하며 氣平하며 陰中有陽이며 入手足厥陰經이라 去皮尖하야 用하며 善治瘀血血閉, 血結血燥하며 通血隔, 破血癥, 殺三蟲, 潤大便, 逐鬱滯하며 止鬼疰血逆疼痛膨脹하며 療跌撲損傷이나 若血枯經閉者엔 不可妄用이라 동의보감 -도핵인(桃核仁, 복숭아씨) ․성은 평(平)하며(따뜻하다[溫]고도 한다) 맛이 달고[甘] 쓰며[苦] 독이 없다. 어혈과 월경이 막힌 것을 치료하며 징가를 헤치고 월경을 통하게 하며 가슴앓이를 멎게 하고 3충을 죽인다. ․어느 곳에나 있으며 음력 7월에 따서 씨를 깨뜨려 받은 알맹이를 그늘에 말려 쓴다[본초] ․피가 막힌 것을 헤치고 새로운 피가 생기게 하며 어혈을 몰아내고 피를 잘 돌게 한다[의감] ․간은 혈이 모이는 곳인데 혈에 사기가 있으면 간기가 건조해진다. 『내경』에 간이 몹시 조여들면 빨리 단것을 먹어서 완화하게 하라고 하였는데 도인은 맛이 쓰고 달며 매워서 피를 헤치고 간을 완화시킨다[강목] ․手足厥陰經에 들어가는데 끓는 물에 담갔다가 두알들이와 꺼풀과 끝을 버리고 찰지게 갈아서 쓴다[탕액] -도화(桃花, 복숭아꽃) ․성은 平하고 맛이 쓰며[苦] 독이 없다. 석림(石淋)을 치료하며 대소변을 잘 나가게 하고 3충을 밀어내며 시주와 악귀(惡鬼)를 죽이고 얼굴빛을 좋게 한다. ․꽃받침은 적취(積聚)를 치료한다. 꽃이 떨어질 때 대바구니에 주어 담아 그늘에서 말려 밀가루로 반죽한 다음 떡을 만든다. 이것을 빈속에 먹으면 오래된 적취를 몰아낸다[의설] ․음력 3월 3일에 꽃을 모아 그늘에서 말린다. 여러 겹 둘러싸인 꽃은 쓰지 못한다[본초] -도효(桃梟, 나무에 달린 마른 복숭아) ․성은 약간 따뜻하며[微溫] 맛은 쓰다[苦]. 온갖 헛것에 들린 것과 5가지 독을 없애며 나쁜 기운에 감촉되며 명치 밑에 아픈 것을 치료하고 피를 헤친다. 또한 악기, 독기에 감촉된 것과 고주를 없앤다. ․일명 桃奴라고도 한다. 복숭아가 나무에 달려 말라서 겨울이 지나도록 떨어지지 않는 것을 도효라고 한다. 음력 정월에 따며 속이 실한 것이 좋다. 혹 음력 12월에 딴다고도 한다. ․일명 귀촉루라고도 하는데 이는 여러 겹 둘러싸인 복숭아꽃이 피는 나무에 달려 마른 것을 음력 12월에 따서 쓴다[본초] ․술에 버무려 쪄서 구리칼로 살을 긁어 내서 약한 불기운에 말려 쓴다[입문] -도모(桃毛, 복숭아털) ․성은 平한데 혈가와 적취를 몰아내고 악귀와 邪氣를 없애며 붕루를 치료하고 癖氣를 헤친다. -도두(복숭아나무벌레) ․헛것에 들린 것과 사기를 없앤다. 도두는 복숭아나무의 좀벌레이다[본초] -도경백피(桃莖白皮, 복숭아나무속껍질) ․邪鬼를 없애고 중악(中惡)으로 명치 밑이 아픈 것을 치료한다[본초] -도엽(桃葉, 복숭아나무잎) ․시충(尸蟲)과 헌데의 벌레를 죽이며 어린이의 중악, 객오등을 치료한다[본초] -도교(桃膠, 복숭아나무진) ․석림을 몰아내고 어혈을 헤치며 중악과 시주, 객오를 치료한다[본초] -도실(桃實, 복숭아열매) ․성은 열(熱)하고 맛이 시며[酸] 약간 독이 있다. 얼굴빛을 좋게 하는데 많이 먹으면 열이 난다[본초] -급성자(急性子, 붉은 빛 작은 복숭아씨) ․어린이의 벽질(癖疾)15)을 치료한다. 이것은 작은 홍도의 씨다[회춘] (주: 15) 벽질(癖疾) : 적병의 한 가지인데 옆구리에 덩어리(혹같이)가 생긴 병)"},{"id":133,"name":"杏仁","aliases":[],"category":"化痰止咳平喘藥-止咳平喘藥","origin":"장미과에 속한 落葉喬木인 살구 및 同屬 近綠植物의 成熟한 種子","initial":"기타","sortName":"杏仁","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦微辛 微溫","肺 大腸","降氣止咳平喘<br>潤腸通便","咳嗽氣喘, 胸滿痰多<br>血虛津枯, 腸燥便秘","有小毒"]]},"items":[["sec",{"key":"category","label":"분류","lines":["化痰止咳平喘藥-止咳平喘藥"]}],["sec",{"key":"origin","label":"기원","lines":["장미과에 속한 落葉喬木인 살구 및 同屬 近綠植物의 成熟한 種子"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦微辛 微溫","肺 大腸","降氣止咳平喘<br>潤腸通便","咳嗽氣喘, 胸滿痰多<br>血虛津枯, 腸燥便秘","有小毒"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-咳喘證을 治療하는 要藥","-喘咳證의 原因에 따라","․熱이 있는 者는 淸熱藥을 配伍","․寒이 있는 者는 溫化藥을 配伍","․表證을 兼한 者는 解表藥을 配伍","․虛咳證에는 應用×","-杏仁은 苦甛의 二種이 있어 性味가 같지 않아 適用할 때 구별(潤腸通便의 效能은 서로 같다)","․苦杏仁은 苦辛宣肺하여 性이 疏泄에 속하여 外感으로 인한 肺實의 咳喘을 治療하는데 多用","․甛杏仁은 甘平潤肺하고 性이 滋養에 속하여 肺虛로 인한 勞嗽에 多用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-杏仁主降矣(p76)","-杏仁亦有油, 但得苦味, 而無辛烈之氣, 故降而不急(p80)","-杏仁利肺, 葶藶子瀉肺(p96)","-水津不騰於上, 口乾‧肺痿‧痰鬱‧咳逆, 宜阿膠/貝母/麥冬/紫苑/百合/白蜜/蛤蚧/玉竹/杏仁, 生津以潤之(p172)","-氣滯便澁, 肉蓯蓉/當歸/火麻仁/杏仁以滑之(p207)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-杏仁중 아미그달린의 가수분해산물은 呼吸中樞를 抑制하여 呼吸運動이 安定되고 止咳平喘의 효과가 있으나 過多하면 中毒을 일으키며, 2\\~3錢이면 매일 복용해도 된다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二一一 味苦辛微甘하고 味厚於氣하며 降中有升하며 有毒하며 入肺胃大腸經이라","其味辛, 故로 能入肺하야 潤肺, 散風寒, 止頭痛하며 退寒熱欬嗽, 上氣喘急하며 發表解邪하며 療溫病脚氣라","其味苦, 故로 降性最疾하니 觀其澄水면 極速可知라 故로 能定氣逆上衝하며 消胸腹急滿脹痛하며 解喉痺하며 消痰下氣하며 除驚癎煩熱하며 通大腸氣閉乾結하며 亦殺狗毒이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-행핵인(杏核仁, 살구씨)","․성은 따뜻하며[溫] 맛이 달고[甘] 쓰며[苦] 독이 있다(조금 독이 있다고도 한다). 기침이 나면서 기가 치미는 것, 폐기로 숨이 찬 것 등을 치료하고 해기(解肌)16)하여 땀이 나게 하며 개의 독을 없앤다 (주: 16) 해기(解肌) : 땀을 갑자기 많이 내지 않고 축축하게 약간 내는 땀내는 방법의 한 가지)","․어느 곳에나 다 있는데 산살구(山杏)는 약에 쓸 수 없고 반드시 집 근처에 심은 살구나무의 열매를 음력 5월에 따서 쓴다","․수태음경에 들어간다. 씨를 깨뜨려 속의 알맹이를 발라 끓는 물에 담갔다가 꺼풀과 끝과 두알들이를 버리고 밀기울과 함께 노랗게 볶아서 쓴다","․두알들이는 사람을 죽일 수 있으며 개도 죽인다. 복숭아씨나 살구씨의 두알들이가 사람을 죽일 수 있다. 꽃잎은 본래 다섯잎인데 만일 여섯잎이면 반드시 두알들이로 된다. 풀과 나무의 꽃이 다 다섯잎인데 오직 설화(雪花)만이 여섯잎이다. 이것은 자연의 법칙이다. 그런데 복숭아나 살구도 꽃이 다섯잎이지만 만일 여섯잎이면 그것은 두알들이로 된다. 두 알이 들어 있는 것은 음양의 원리를 벗어난 것이기 때문에 사람을 죽이는 것이다[입문]","․날것으로 먹으나 익혀 먹어도 다 좋은데 절반은 익고 절반은 설게 하여 먹으면 사람을 죽인다[본초]","․화기(火氣)가 있거나 땀이 나는 환자에게는 동변에 3일 동안 담갔다가 쓴다[입문]","-행실(杏實, 살구열매)","․성은 열(熱)하고 맛이 시며[酸] 독이 있다. 많이 먹으면 정신이 상하고 힘줄과 뼈가 상한다[본초]"]}]],"searchText":"杏仁 분류 化痰止咳平喘藥-止咳平喘藥 기원 장미과에 속한 落葉喬木인 살구 및 同屬 近綠植物의 成熟한 種子 性味 歸經 效能 主治 備考 苦微辛 微溫 肺 大腸 降氣止咳平喘<br>潤腸通便 咳嗽氣喘, 胸滿痰多<br>血虛津枯, 腸燥便秘 有小毒 약물특징/비교 -咳喘證을 治療하는 要藥 -喘咳證의 原因에 따라 ․熱이 있는 者는 淸熱藥을 配伍 ․寒이 있는 者는 溫化藥을 配伍 ․表證을 兼한 者는 解表藥을 配伍 ․虛咳證에는 應用× -杏仁은 苦甛의 二種이 있어 性味가 같지 않아 適用할 때 구별(潤腸通便의 效能은 서로 같다) ․苦杏仁은 苦辛宣肺하여 性이 疏泄에 속하여 外感으로 인한 肺實의 咳喘을 治療하는데 多用 ․甛杏仁은 甘平潤肺하고 性이 滋養에 속하여 肺虛로 인한 勞嗽에 多用 본초문답 -杏仁主降矣(p76) -杏仁亦有油, 但得苦味, 而無辛烈之氣, 故降而不急(p80) -杏仁利肺, 葶藶子瀉肺(p96) -水津不騰於上, 口乾‧肺痿‧痰鬱‧咳逆, 宜阿膠/貝母/麥冬/紫苑/百合/白蜜/蛤蚧/玉竹/杏仁, 生津以潤之(p172) -氣滯便澁, 肉蓯蓉/當歸/火麻仁/杏仁以滑之(p207) 진존인본초 -杏仁중 아미그달린의 가수분해산물은 呼吸中樞를 抑制하여 呼吸運動이 安定되고 止咳平喘의 효과가 있으나 過多하면 中毒을 일으키며, 2\\~3錢이면 매일 복용해도 된다. 경악전서 二一一 味苦辛微甘하고 味厚於氣하며 降中有升하며 有毒하며 入肺胃大腸經이라 其味辛, 故로 能入肺하야 潤肺, 散風寒, 止頭痛하며 退寒熱欬嗽, 上氣喘急하며 發表解邪하며 療溫病脚氣라 其味苦, 故로 降性最疾하니 觀其澄水면 極速可知라 故로 能定氣逆上衝하며 消胸腹急滿脹痛하며 解喉痺하며 消痰下氣하며 除驚癎煩熱하며 通大腸氣閉乾結하며 亦殺狗毒이라 동의보감 -행핵인(杏核仁, 살구씨) ․성은 따뜻하며[溫] 맛이 달고[甘] 쓰며[苦] 독이 있다(조금 독이 있다고도 한다). 기침이 나면서 기가 치미는 것, 폐기로 숨이 찬 것 등을 치료하고 해기(解肌)16)하여 땀이 나게 하며 개의 독을 없앤다 (주: 16) 해기(解肌) : 땀을 갑자기 많이 내지 않고 축축하게 약간 내는 땀내는 방법의 한 가지) ․어느 곳에나 다 있는데 산살구(山杏)는 약에 쓸 수 없고 반드시 집 근처에 심은 살구나무의 열매를 음력 5월에 따서 쓴다 ․수태음경에 들어간다. 씨를 깨뜨려 속의 알맹이를 발라 끓는 물에 담갔다가 꺼풀과 끝과 두알들이를 버리고 밀기울과 함께 노랗게 볶아서 쓴다 ․두알들이는 사람을 죽일 수 있으며 개도 죽인다. 복숭아씨나 살구씨의 두알들이가 사람을 죽일 수 있다. 꽃잎은 본래 다섯잎인데 만일 여섯잎이면 반드시 두알들이로 된다. 풀과 나무의 꽃이 다 다섯잎인데 오직 설화(雪花)만이 여섯잎이다. 이것은 자연의 법칙이다. 그런데 복숭아나 살구도 꽃이 다섯잎이지만 만일 여섯잎이면 그것은 두알들이로 된다. 두 알이 들어 있는 것은 음양의 원리를 벗어난 것이기 때문에 사람을 죽이는 것이다[입문] ․날것으로 먹으나 익혀 먹어도 다 좋은데 절반은 익고 절반은 설게 하여 먹으면 사람을 죽인다[본초] ․화기(火氣)가 있거나 땀이 나는 환자에게는 동변에 3일 동안 담갔다가 쓴다[입문] -행실(杏實, 살구열매) ․성은 열(熱)하고 맛이 시며[酸] 독이 있다. 많이 먹으면 정신이 상하고 힘줄과 뼈가 상한다[ 키고 化膿을 억지하는 效果가 있다.","-석창포의 揮發油가 鎭定效果를 가지고 있다.","-內服하면 消化液의 分泌를 促進하여 胃腸내의 異狀醱酵를 抑制한다. 또 腸管平滑筋의 痙攣을 弛緩시킨다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百四二 味辛微苦, 性溫.","散風寒濕痺하고 除煩悶欬逆上氣하며 止心腹痛, 霍亂轉筋, 癲癎客忤하며 開心氣胃氣하야 行滯氣하며 通九竅, 益心智, 明耳目하며 去頭風淚下, 出聲音, 溫腸胃하며 煖丈夫水臟, 婦人血海하야 禁止小便, 避邪逐鬼, 及中惡卒死, 殺蟲, 療惡瘡瘙疥라 欲散癰毒이면 宜擣汁服用하고 渣貼之하며 若治耳痛이면 宜作末炒熱絹裏罯之하며 亦解巴豆, 大戟等毒이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-창포(菖蒲, 석창포)","․성질은 따뜻하고[溫](평(平)하다고도 한다) 맛이 매우며[辛] 독이 없다. 심규[心孔]를 열어 주고 5장을 보하며 9규를 잘 통하게 하고 귀와 눈을 밝게 하며 목청을 좋게 하고 풍습으로 전혀 감각이 둔해진 것을 치료하며 뱃속의 벌레를 죽인다. 이와 벼룩 등을 없애며 건망증을 치료하고 지혜를 나게 하며 명치 밑이 아픈 것을 낫게 한다.","․산골짜기의 개울가, 바위틈이나 자갈 밑에서 나고 자란다. 그 잎의 한가운데는 등심이 있고 칼날 모양으로 되어 있다. 한치 되는 뿌리에 9개의 마디 혹은 12개의 마디로 된 것도 있다. 음력 5월, 12월에 뿌리를 캐어 그늘에서 말린다. 지금 5월초에 바깥쪽으로 드러난 뿌리는 쓰지 않는다.","․처음 캤을 때에는 뿌리가 무르다가 볕에 말리면 딴딴해진다. 썰면 한가운데가 약간 붉으며 씹어 보면 맵고 향기로우며 찌꺼기가 적다.","․걸고 습한 땅에서 자라는데 뿌리가 큰 것을 창양(昌陽)이라 한다. 풍습병을 주로 치료한다. 또한 이창(泥菖)과 하창(夏菖)이라는 종류가 있는데 서로 비슷하다. 이것은 다 이와 벼룩을 없애기는 하나 약으로는 쓰지 않는다. 또한 수창(水菖)이 있는데 못에서 자라며 잎이 서로 비슷하나 다만 잎 한가운데에 등줄이 없다[본초]","․손(蓀)은 잎에 등심줄이 없고 부추잎 같은 것이다. 석창포에는 등심줄이 있는데 꼭 칼날처럼 되어 있다[단심]"]}]],"searchText":"菖蒲 石蒼蒲 분류 開竅藥 기원 천남성과 다년생 초본인 石蒼蒲의 根莖 性味 歸經 效能 主治 備考 辛苦 溫 心 胃 化濕開胃<br>開竅豁痰<br>醒神益智 脘痞不飢<br>噤口下痢<br>神昏癲癎, 健忘耳聾  약물특징/비교 -痰濕이 蒙閉하였다든가 淸陽의 氣가 不升(神識昏迷와 耳聾不聰, 頭目不淸, 精神遲鈍등) -濕濁이 中阻하여 나타나는 脘痞不飢와 噤口下痢 등 證에 常用하는 要藥 -性이 燥散하므로 陰虧血虛와 精滑多汗者에게 適用 × 본초문답 -..神爲血亂, 則癲狂亂語, 以行氣者, 入心導之, 則遠志‧菖蒲‧麝香皆能開心竅,... (p196-197) 진존인본초 -方香辛散하므로 意識覺醒, 祛痰, 定癎의 效能이 있어 昏瘚증 治療에 좋은 效果가 있다. -燥狂形의 精神病을 治療하는데 效果가 있다. -석창포를 濃煎하여 氷片 1分을 加味 服用시키면 咽喉의 急性炎症에 대해 痛症을 鎭定시키고 化膿을 억지하는 效果가 있다. -석창포의 揮發油가 鎭定效果를 가지고 있다. -內服하면 消化液의 分泌를 促進하여 胃腸내의 異狀醱酵를 抑制한다. 또 腸管平滑筋의 痙攣을 弛緩시킨다. 경악전서 百四二 味辛微苦, 性溫. 散風寒濕痺하고 除煩悶欬逆上氣하며 止心腹痛, 霍亂轉筋, 癲癎客忤하며 開心氣胃氣하야 行滯氣하며 通九竅, 益心智, 明耳目하며 去頭風淚下, 出聲音, 溫腸胃하며 煖丈夫水臟, 婦人血海하야 禁止小便, 避邪逐鬼, 及中惡卒死, 殺蟲, 療惡瘡瘙疥라 欲散癰毒이면 宜擣汁服用하고 渣貼之하며 若治耳痛이면 宜作末炒熱絹裏罯之하며 亦解巴豆, 大戟等毒이라 동의보감 -창포(菖蒲, 석창포) ․성질은 따뜻하고[溫](평(平)하다고도 한다) 맛이 매우며[辛] 독이 없다. 심규[心孔]를 열어 주고 5장을 보하며 9규를 잘 통하게 하고 귀와 눈을 밝게 하며 목청을 좋게 하고 풍습으로 전혀 감각이 둔해진 것을 치료하며 뱃속의 벌레를 죽인다. 이와 벼룩 등을 없애며 건망증을 치료하고 지혜를 나게 하며 명치 밑이 아픈 것을 낫게 한다. ․산골짜기의 개울가, 바위틈이나 자갈 밑에서 나고 자란다. 그 잎의 한가운데는 등심이 있고 칼날 모양으로 되어 있다. 한치 되는 뿌리에 9개의 마디 혹은 12개의 마디로 된 것도 있다. 음력 5월, 12월에 뿌리를 캐어 그늘에서 말린다. 지금 5월초에 바깥쪽으로 드러난 뿌리는 쓰지 않는다. ․처음 캤을 때에는 뿌리가 무르다가 볕에 말리면 딴딴해진다. 썰면 한가운데가 약간 붉으며 씹어 보면 맵고 향기로우며 찌꺼기가 적다. ․걸고 습한 땅에서 자라는데 뿌리가 큰 것을 창양(昌陽)이라 한다. 풍습병을 주로 치료한다. 또한 이창(泥菖)과 하창(夏菖)이라는 종류가 있는데 서로 비슷하다. 이것은 다 이와 벼룩을 없애기는 하나 약으로는 쓰지 않는다. 또한 수창(水菖)이 있는데 못에서 자라며 잎이 서로 비슷하나 다만 잎 한가운데에 등줄이 없다[본초] ․손(蓀)은 잎에 등심줄이 없고 부추잎 같은 것이다. 석창포에는 등심줄이 있는데 꼭 칼날처럼 되어 있다[단심]"},{"id":136,"name":"免絲子","aliases":[],"category":"補益藥-補陽藥","origin":"旋花科(메꽃과) 일년생 기생초본인 갯실새삼, 새삼, 실새삼 등의 성숙한 종자","initial":"기타","sortName":"免絲子","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 溫","肝 腎 脾","補肝腎<br>益精髓<br>明目<br>止瀉","腰膝酸痛, 遺精, 消渴, 尿有餘瀝<br>目暗<br>脾虛泄瀉",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["旋花科(메꽃과) 일년생 기생초본인 갯실새삼, 새삼, 실새삼 등의 성숙한 종자"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 溫","肝 腎 脾","補肝腎<br>益精髓<br>明目<br>止瀉","腰膝酸痛, 遺精, 消渴, 尿有餘瀝<br>目暗<br>脾虛泄瀉",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-肝腎을 平補시키는 良藥(固精,明目,止瀉의 效能)","-陰虛와 陽虛로 인한 病證에 모두 應用가능하나 補陽시키는데 偏重(∴腎陽不足으로 인한 病證에 多用)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-『內經』云 ; 腎惡燥. 腎精不足, 宜枸杞‧免絲‧熟地‧龜膠‧阿膠(p174)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-免絲子는 柔潤多液하며 不熱不燥로 壯陽固腎의 效能이있다. 陽痿, 早漏 및 精子의 減少나 運動能力 저하에 따라 일어나는 男性의 불임에 治療에 사용된다.","-虛弱성 尿多, 頻尿, 尿失禁에 대하여 治療效果가 있다. 藥理實驗에서도 免絲子에는 腎기능을 강화하고 症狀을 개선하는 效果가 있다는 것이 증명되고 있다.","-安胎의 效能을 가지므로 習慣性遺産의 治療에 사용된다. 만약 아직 姙娠하고 있지 않은 시기라면 桑寄生, 肉蓯蓉, 杜仲, 當歸등의 補益藥을 配合하여 사용하면 受精卵의 吸收能力을 증강하는 效果가 있다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百六 味甘辛, 氣微溫하며 其性能固하며 人肝脾腎三經이라","先用甛水하야 淘洗淨하고 浸脹 次用酒漬, 煮熟晒乾, 炒之更炒라","補髓添精, 助陽固泄, 續絶傷, 滋消渴, 縮小便하며 止夢遺帶濁餘瀝하며 煖腰膝寒疼하며 壯氣力筋骨하며 明目開胃하며 進食肥肌하며 禁止鬼交하며 尤安夢寐라 湯液丸散으로 任意可用이나 古人不入煎劑하니 亦一失也라 欲止消渴이면 煎湯하야 任意飮之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-토사자(兎絲子, 새삼씨)","․성질은 평(平)하며 맛이 맵고[辛] 달며[甘] 독이 없다. 주로 음경 속이 찬 것, 정액이 절로 나오는 것, 오줌을 누고 난 다음에 방울방울 떨어지는 것을 치료한다. 또한 입맛이 쓰고 입이 마르며 갈증이 나는데 쓴다.","․정액을 돕고 골수를 불쿠어 주며 허리가 아프고 무릎이 찬 것을 낫게 한다","․어디에나 있는데 흔히 콩밭 가운데서 자란다. 뿌리가 없이 다른 식물에 기생하며 가늘게 뻗어 올라간다. 빛은 누르며 음력 6-7월에 씨가 여무는데 몹시 잘아서 누에씨와 같다. 9월에 씨를 받아서 볕에 말린다. 술과 같이 쓰면 좋다. 『선경(仙經), 속방(俗方)』에는 다 보약으로 되어 있다.","․고르고 온전한 양기를 받아 씨가 달리는데 위기(衛氣)를 보하고 근맥을 좋게 한다[본초]","․물에 씻어서 모래와 흙을 버린 다음 햇볕에 말려 봄에는 5일 여름에는 3일, 가을에는 7일, 겨울에는 10일간 술에 담가 두었다가 꺼내어 쪄서 익힌 다음 짓찧어 덩어리를 만든다. 이것을 햇볕에 말린다. 그리고 다시 줌짓찧어 가루내서 약에 넣는다. 만일 급하게 쓰려면 술에 넣고 푹 무르게 달여 볕에 말린다. 이것을 짓찧어 가루내어 써도 좋다[입문]"]}]],"searchText":"免絲子 분류 補益藥-補陽藥 기원 旋花科(메꽃과) 일년생 기생초본인 갯실새삼, 새삼, 실새삼 등의 성숙한 종자 性味 歸經 效能 主治 備考 辛甘 溫 肝 腎 脾 補肝腎<br>益精髓<br>明目<br>止瀉 腰膝酸痛, 遺精, 消渴, 尿有餘瀝<br>目暗<br>脾虛泄瀉  약물특징/비교 -肝腎을 平補시키는 良藥(固精,明目,止瀉의 效能) -陰虛와 陽虛로 인한 病證에 모두 應用가능하나 補陽시키는데 偏重(∴腎陽不足으로 인한 病證에 多用) 본초문답 -『內經』云 ; 腎惡燥. 腎精不足, 宜枸杞‧免絲‧熟地‧龜膠‧阿膠(p174) 진존인본초 -免絲子는 柔潤多液하며 不熱不燥로 壯陽固腎의 效能이있다. 陽痿, 早漏 및 精子의 減少나 運動能力 저하에 따라 일어나는 男性의 불임에 治療에 사용된다. -虛弱성 尿多, 頻尿, 尿失禁에 대하여 治療效果가 있다. 藥理實驗에서도 免絲子에는 腎기능을 강화하고 症狀을 개선하는 效果가 있다는 것이 증명되고 있다. -安胎의 效能을 가지므로 習慣性遺産의 治療에 사용된다. 만약 아직 姙娠하고 있지 않은 시기라면 桑寄生, 肉蓯蓉, 杜仲, 當歸등의 補益藥을 配合하여 사용하면 受精卵의 吸收能力을 증강하는 效果가 있다. 경악전서 百六 味甘辛, 氣微溫하며 其性能固하며 人肝脾腎三經이라 先用甛水하야 淘洗淨하고 浸脹 次用酒漬, 煮熟晒乾, 炒之更炒라 補髓添精, 助陽固泄, 續絶傷, 滋消渴, 縮小便하며 止夢遺帶濁餘瀝하며 煖腰膝寒疼하며 壯氣力筋骨하며 明目開胃하며 進食肥肌하며 禁止鬼交하며 尤安夢寐라 湯液丸散으로 任意可用이나 古人不入煎劑하니 亦一失也라 欲止消渴이면 煎湯하야 任意飮之라 동의보감 -토사자(兎絲子, 새삼씨) ․성질은 평(平)하며 맛이 맵고[辛] 달며[甘] 독이 없다. 주로 음경 속이 찬 것, 정액이 절로 나오는 것, 오줌을 누고 난 다음에 방울방울 떨어지는 것을 치료한다. 또한 입맛이 쓰고 입이 마르며 갈증이 나는데 쓴다. ․정액을 돕고 골수를 불쿠어 주며 허리가 아프고 무릎이 찬 것을 낫게 한다 ․어디에나 있는데 흔히 콩밭 가운데서 자란다. 뿌리가 없이 다른 식물에 기생하며 가늘게 뻗어 올라간다. 빛은 누르며 음력 6-7월에 씨가 여무는데 몹시 잘아서 누에씨와 같다. 9월에 씨를 받아서 볕에 말린다. 술과 같이 쓰면 좋다. 『선경(仙經), 속방(俗方)』에는 다 보약으로 되어 있다. ․고르고 온전한 양기를 받아 씨가 달리는데 위기(衛氣)를 보하고 근맥을 좋게 한다[본초] ․물에 씻어서 모래와 흙을 버린 다음 햇볕에 말려 봄에는 5일 여름에는 3일, 가을에는 7일, 겨울에는 10일간 술에 담가 두었다가 꺼내어 쪄서 익힌 다음 짓찧어 덩어리를 만든다. 이것을 햇볕에 말린다. 그리고 다시 줌짓찧어 가루내서 약에 넣는다. 만일 급하게 쓰려면 술에 넣고 푹 무르게 달여 볕에 말린다. 이것을 짓찧어 가루내어 써도 좋다[입문]"},{"id":137,"name":"牛膝","aliases":[],"category":"活血祛瘀藥","origin":"莧科(비름과) 다년생 초본인 우슬과 馬우슬 및 甛우슬의 근.","initial":"기타","sortName":"牛膝","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦酸 平","肝 腎","生用 散瘀血<br>消癰腫<br>熟用 補肝腎<br>强筋骨","淋病尿血, 經閉<br>癥瘕, 癰腫<br>難産,胞衣不下,産後血瘀腹痛,喉痺<br>跌打損傷",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["活血祛瘀藥"]}],["sec",{"key":"origin","label":"기원","lines":["莧科(비름과) 다년생 초본인 우슬과 馬우슬 및 甛우슬의 근."]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦酸 平","肝 腎","生用 散瘀血<br>消癰腫<br>熟用 補肝腎<br>强筋骨","淋病尿血, 經閉<br>癥瘕, 癰腫<br>難産,胞衣不下,産後血瘀腹痛,喉痺<br>跌打損傷",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-臨床에서 血熱이 上炎하여 된 病證과 淋病尿血 및 尿道澁痛을 治療하는데 適用","-宣導下行하는 效能이 主가 되고 肝腎을 補益하는 效能은 川續斷과 杜仲보다 弱","-川牛膝과 懷牛膝로 分類하여 應用","․川牛膝 : 活血祛瘀하여 關節을 通利시키는 데 生用","․懷牛膝 : 肝腎을 補益하고 筋骨을 强壯시키는 데 炒用","-牛膝과 麻牛膝은 袪風, 利濕, 活血, 通經시키는 效能"]}],["sec",{"key":"qna","label":"본초문답","lines":["-牛膝之降, 則以形味爲治, 因其根深味苦, 故能引水火下行(p83)","-性之速者, 如大黃‧巴豆‧牛膝, 則直走下焦(p87)","-若牛膝等, 根旣堅實, 而形不空, 則無升達之孔道, 味旣苦瀉, 而氣不發, 則無升發之力, 且其氣味旣降, 而根又深入, 是又引氣歸根以下達, 如升麻等之上行者, 義正相反,...(p92)","-凡脚氣, 寒澁者多, 宜以溫藥爲主, 再加木瓜‧薏苡仁‧牛膝爲引導, 所以利脚下之濕也...(p163)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-藥性은 下行性이며 月經을 통하게 하고 止痛하며 瘀血을 消散하는 效能이 있다. 藥理實驗에서 牛膝은 子宮에 대한 弛緩作用이 있으며 月經을 정상으로 回復시킬 뿐만 아니라 그 후에는 子宮收縮作用도 있다. 牛膝의 通經作用은 隱和하며 紅花, 三棱과 같이 강하지는 않다.","-腰部 및 하반신 腰腿疼痛과 軟弱無力한 경우에 특효가 있다. 坐骨神經痛이 장기간 治療되지않으면 牛膝에 黃芪, 當歸, 川芎, 桃仁, 白朮을 配合 사용하면 脊髓神經을 興奮시키고 痲痺를예방할 수 있으며 效果가 좋다. 牛膝은 痲痺治療의 要藥이다. 小兒痲痺 初期, 脊髓炎初期의 痲痺, 腦血管阻塞으로 인한 半身不隨에는 모두 牛膝을 君藥으로 사용하면 좋다.","-姙娠, 習慣性遺産者, 月經過多者에게는 服用을 忌한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["四二 味苦甘, 氣微凉, 性降而滑, 陰也. 忌牛肉이며 酒漬하야 㕮咀라","走十二經絡하야 助一身元氣하며 主手足血熱痿痺, 血燥拘攣; 通膀胱澁秘, 大腸乾結; 補髓塡精, 益陰活血; 治腰膝痠疼, 滋鬚髮枯白이라","其性이 下走如奔, 故로 能通經閉, 破血癥하며 引諸藥下降이라 同麝香用이면 墮胎尤速하며 凡臟寒便滑하며 下元不固者는 當忌用之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-우슬(牛膝, 쇠무릎)","․성은 평(平)하고 맛은 쓰며[苦] 시고[酸] 독이 없다. 주로 한습으로 痿證과 痺證이 생겨 무릎이 아파서 굽혔다 폈다 하지 못하는 것과 남자의 음소(陰消)17)증과 늙은이가 오줌이 나오는 것을 참지 못하는 것 등을 치료한다. 골수를 보충하고 음기(陰氣)를 잘 통하게 하며 머리털이 희지 않게 하고 음위증(陰痿證)과 허리와 등뼈가 아픈 것을 낫게 한다. 유산시키고 월 s":["-設刺不銳而鉤曲, 刺不長而細軟, 則不破利而和散, 能熄風治筋, 如鉤藤刺, 紅毛五加皮, 白蒺藜之類是也(p106)","-桑皮‧蒺藜之利濕, 以金行水也(p165)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-動脈硬化로 인한 高血壓으로 回轉性頭暈, 頭痛, 耳鳴, 顔紅, 舌質紅, 脈弦數 등의 症狀이 있을 경우에는 白蒺藜를 君藥으로 하여 決明子, 釣鉤藤, 夏枯草, 菊花를 加味한 것을 기본방제로 해서 사용한다.","-外科의 濕毒症治療에 常用되는 약으로써 各種 皮膚濕疹 예컨데 陰囊濕疹, 肛門濕疹, 外陰濕疹 등의 경우에는 白蒺藜1兩, 蛇床子1兩, 白礬5錢의 煎液으로 每夜 一次 洗淨하든가 坐浴을 하면 좋다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["四七 味苦微辛微甘, 微凉. 能破癥瘕結聚하며 止遺溺 泄精하며 療肺痿肺癰, 翳膜 目赤하며 除喉痺癬疥痔瘰癜風, 通身濕爛惡瘡하며 乳巖帶下에 俱宜하며 催生止煩에도 亦用하며 凉血養血하니 亦善補陰이라 用補엔 宜炒熟去刺하며 用凉엔 宜連刺生搗하며 去風解毒엔 白者最良이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-백질려(白蒺藜, 남가새열매)","․性은 따뜻하며[溫] 맛이 쓰고[苦] 매우며[辛] 독이 없다. 여러 가지 풍증, 몸이 풍으로 가려운 것, 두통, 폐위로 고름을 뱉는 것, 신[水藏]이 차서 오줌을 많이 누는 분돈(奔豚), 신기(腎氣)와 퇴산등을 치료한다.","․벌판과 들에서 자라는데 땅에 덩굴이 뻗으며 잎은 가늘고 씨에는 삼각으로 된 가시가 있어 찌르며 모양이 마름[菱] 비슷한데 작다. 음력 7월, 8월, 9월에 씨를 받아 볕에 말린다","․질려에는 2가지 종류가 있다. 두질려(杜蒺藜)는 씨에 가시가 있으며 풍증에 많이 쓰고 백질려는 동주사원(同州沙苑)에서 나는데 씨가 양의 콩팥 비슷하며 신(腎)을 보하는 약에 쓴다","․지금 많이 쓰는 것은 가시가 있는 것인데 닦아서[炒] 가시를 없애고 짓찧어 쓴다[본초]"]}]],"searchText":"白蒺藜 납가새 분류 平肝藥-平肝潛陽藥 기원 蒺藜科(납가새과)일년생 또는 다년생 납가새의 성숙한 과실 性味 歸經 效能 主治 備考 辛苦 微溫(平) 肝 平肝解鬱<br>活血祛風<br>明目<br>止痒 頭痛眩暈, 胸脇脹痛<br>乳閉乳癰<br>目赤翳障<br>風疹瘙痒 有小毒 약물특징/비교 -辛苦平하여 辛味는 發散하고 苦味는 降泄하여 肝經에 들어가 能升能降하고 能疏能利하므로 平肝解鬱하여 祛風明目하게 되어 肝陽이 上亢하여 나타나는 頭痛眩暈과 風熱로 인한 目赤多泪을 治療. -肝氣鬱滯로 胸脇이 舒暢되지 못하여 나타나는 胸脇脹痛과 乳汁不下를 治療. -祛風止痒시키는 效能이 있어 風疹瘙痒證에도 適用하여 治療. 본초문답 -設刺不銳而鉤曲, 刺不長而細軟, 則不破利而和散, 能熄風治筋, 如鉤藤刺, 紅毛五加皮, 白蒺藜之類是也(p106) -桑皮‧蒺藜之利濕, 以金行水也(p165) 진존인본초 -動脈硬化로 인한 高血壓으로 回轉性頭暈, 頭痛, 耳鳴, 顔紅, 舌質紅, 脈弦數 등의 症狀이 있을 경우에는 白蒺藜를 君藥으로 하여 決明子, 釣鉤藤, 夏枯草, 菊花를 加味한 것을 기본방제로 해서 사용한다. -外科의 濕毒症治療에 常用되는 약으로써 各種 皮膚濕疹 예컨데 陰囊濕疹, 肛門濕疹, 外陰濕疹 등의 경우에는 白蒺藜1兩, 蛇床子1兩, 白礬5錢의 煎液으로 每夜 一次 洗淨하든가 坐浴을 하면 좋다. 경악전서 四七 味苦微辛微甘, 微凉. 能破癥瘕結聚하며 止遺溺 泄精하며 療肺痿肺癰, 翳膜 目赤하며 除喉痺癬疥痔瘰癜風, 通身濕爛惡瘡하며 乳巖帶下에 俱宜하며 催生止煩에도 亦用하며 凉血養血하니 亦善補陰이라 用補엔 宜炒熟去刺하며 用凉엔 宜連刺生搗하며 去風解毒엔 白者最良이라 동의보감 -백질려(白蒺藜, 남가새열매) ․性은 따뜻하며[溫] 맛이 쓰고[苦] 매우며[辛] 독이 없다. 여러 가지 풍증, 몸이 풍으로 가려운 것, 두통, 폐위로 고름을 뱉는 것, 신[水藏]이 차서 오줌을 많이 누는 분돈(奔豚), 신기(腎氣)와 퇴산등을 치료한다. ․벌판과 들에서 자라는데 땅에 덩굴이 뻗으며 잎은 가늘고 씨에는 삼각으로 된 가시가 있어 찌르며 모양이 마름[菱] 비슷한데 작다. 음력 7월, 8월, 9월에 씨를 받아 볕에 말린다 ․질려에는 2가지 종류가 있다. 두질려(杜蒺藜)는 씨에 가시가 있으며 풍증에 많이 쓰고 백질려는 동주사원(同州沙苑)에서 나는데 씨가 양의 콩팥 비슷하며 신(腎)을 보하는 약에 쓴다 ․지금 많이 쓰는 것은 가시가 있는 것인데 닦아서[炒] 가시를 없애고 짓찧어 쓴다[본초]"},{"id":151,"name":"肉蓯蓉","aliases":[],"category":"補益藥-補陽藥","origin":"列當科 寄生草本인 肉蓗蓉과 同屬 近緣植物의 肉質莖","initial":"기타","sortName":"肉蓯蓉","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸鹹 溫","腎 大腸","補腎益精<br>潤燥滑腸","男子陽痿, 女子不孕, 帶下, 崩漏, 腰膝冷痛<br>血枯便閉",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["列當科 寄生草本인 肉蓗蓉과 同屬 近緣植物의 肉質莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘酸鹹 溫","腎 大腸","補腎益精<br>潤燥滑腸","男子陽痿, 女子不孕, 帶下, 崩漏, 腰膝冷痛<br>血枯便閉",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-補腎壯陽의 要藥이 되어 精血을 補益하는 效能","-대개 補陽藥은 燥性을 가지고 있으며 滋陰藥은 滋膩한데, 肉蓯蓉은 溫하되 燥하지 않고 滋膩하되 膩滯하지 않는 性質을 가지고 있어 補暘하고 또한 補陰하며, 補하되 峻하지 않아 藥力이 비교적 緩和한 特點이 있어 蓯蓉이란 名稱이 붙게 되었다.","-質이 비교적 油膩하고 또한 潤腸通便의 作用이 있으나 腎火가 旺盛하다든가 脾虛泄瀉 및 實熱便秘者는 應用함이 마땅하지 않다.","-藥力이 緩和하므로 入藥時에는 적게 쓰면 효과가 없기 때문에 投與量을 많이 하여야 한다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-藥中肉蓗蓉, 初爲馬精滴之所生, 後乃傳苗, 又象人陰, 且味鹹入腎, 故溫潤而强陰, 以其助腎中之陽, 而能益命火也(p64)","-水不濡火則成火燥, 血液不流於下, 則腸中乾枯, 膈食不下, 糞如羊屎, 宜黑豆‧脂麻‧肉蓗蓉‧當歸‧麻仁‧生地‧山藥, 生液以潤之(p172)","-小便燥澁, 薏苡仁‧滑石‧冬葵子‧肉蓗蓉 以滑利之(p174)","-氣滯便澁, 肉蓗蓉‧當歸‧火麻仁‧杏仁以滑之(p207)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-장기간 喘息이 不治하고 寒冷氣候時에는 늘 發作이 일어나며 움직이면 곧 심하여지며 平臥도 곤란하고 腰痠腿軟한 경우의 根治法은 壯陽藥을 君藥으로 하다.","-老人이 體虛하면 津液이 不足하여 腸이 건조하므로 便秘가 일어나는데, 육종용에 當歸를 加味하여 사용하면 좋다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["七 味甘鹹하고 微辛酸하며 氣微溫하며 味重하야 陰也며 降也니 其性滑이라","以其味重而甘溫, 故로 助相火, 補精興陽, 益子嗣, 治女人血虛不孕, 煖腰膝, 堅筋骨, 除下焦寒痛하며","以其補陰助陽, 故로 禁虛寒遺瀝洩精하고 止血崩尿血하며","以其性滑, 故로 可除莖中寒熱澀痛이나","但驟服이면 反動大便하니 若虛하야 不可攻而大便閉結不通者는 洗淡하야 暫用三四錢이면 一劑卽通하니 神效니라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-육종용(肉蓯蓉)","․성질은 약간 따뜻하며[微溫] 맛이 달고[甘] 시며[酸] 짜고[鹹] 독이 없다. 5로 7상(五勞七傷)을 치료하며 음경 속이 찼다 더웠다 하면서 아픈 것을 낫게 하며 양기를 세게 하고 정기를 불쿠어 아이를 많이 낳게 한다.","․남자의 양기가 끊어져서 음위증이 된 것과 여자의 음기가 끊어져서 임신하지 못하는 것을 치료한다. 5장을 눅여 주고 살찌게 하며 허리와 무릎을 덥게 하고 남자의 몽설과 유정, 피오줌이 나오는 것, 오줌이 방울방울 떨어지는 것, 여자의 대하와 음부가 아픈 데 쓴다","․겉은 잣송이처럼 비늘이 있고 길이는 1자가 넘는다. 음력 3월에 뿌리를 캐어 그늘에서 말려 쓴다. 술에 담갔다가 비늘 같은 것을 벗겨버린다[본초]","․정혈(精血)을 세게 보하는데 갑자기 많이 쓰면 도리어 오줌이 잘 나오지 않게 된다[단심]"]}]],"searchText":"肉蓯蓉 분류 補益藥-補陽藥 기원 列當科 寄生草本인 肉蓗蓉과 同屬 近緣植物의 肉質莖 性味 歸經 效能 主治 備考 甘酸鹹 溫 腎 大腸 補腎益精<br>潤燥滑腸 男子陽痿, 女子不孕, 帶下, 崩漏, 腰膝冷痛<br>血枯便閉  약물특징/비교 -補腎壯陽의 要藥이 되어 精血을 補益하는 效能 -대개 補陽藥은 燥性을 가지고 있으며 滋陰藥은 滋膩한데, 肉蓯蓉은 溫하되 燥하지 않고 滋膩하되 膩滯하지 않는 性質을 가지고 있어 補暘하고 또한 補陰하며, 補하되 峻하지 않아 藥力이 비교적 緩和한 特點이 있어 蓯蓉이란 名稱이 붙게 되었다. -質이 비교적 油膩하고 또한 潤腸通便의 作用이 있으나 腎火가 旺盛하다든가 脾虛泄瀉 및 實熱便秘者는 應用함이 마땅하지 않다. -藥力이 緩和하므로 入藥時에는 적게 쓰면 효과가 없기 때문에 投與量을 많이 하여야 한다. 본초문답 -藥中肉蓗蓉, 初爲馬精滴之所生, 後乃傳苗, 又象人陰, 且味鹹入腎, 故溫潤而强陰, 以其助腎中之陽, 而能益命火也(p64) -水不濡火則成火燥, 血液不流於下, 則腸中乾枯, 膈食不下, 糞如羊屎, 宜黑豆‧脂麻‧肉蓗蓉‧當歸‧麻仁‧生地‧山藥, 生液以潤之(p172) -小便燥澁, 薏苡仁‧滑石‧冬葵子‧肉蓗蓉 以滑利之(p174) -氣滯便澁, 肉蓗蓉‧當歸‧火麻仁‧杏仁以滑之(p207) 진존인본초 -장기간 喘息이 不治하고 寒冷氣候時에는 늘 發作이 일어나며 움직이면 곧 심하여지며 平臥도 곤란하고 腰痠腿軟한 경우의 根治法은 壯陽藥을 君藥으로 하다. -老人이 體虛하면 津液이 不足하여 腸이 건조하므로 便秘가 일어나는데, 육종용에 當歸를 加味하여 사용하면 좋다. 경악전서 七 味甘鹹하고 微辛酸하며 氣微溫하며 味重하야 陰也며 降也니 其性滑이라 以其味重而甘溫, 故로 助相火, 補精興陽, 益子嗣, 治女人血虛不孕, 煖腰膝, 堅筋骨, 除下焦寒痛하며 以其補陰助陽, 故로 禁虛寒遺瀝洩精하고 止血崩尿血하며 以其性滑, 故로 可除莖中寒熱澀痛이나 但驟服이면 反動大便하니 若虛하야 不可攻而大便閉結不通者는 洗淡하야 暫用三四錢이면 一劑卽通하니 神效니라 동의보감 -육종용(肉蓯蓉) ․성질은 약간 따뜻하며[微溫] 맛이 달고[甘] 시며[酸] 짜고[鹹] 독이 없다. 5로 7상(五勞七傷)을 치료하며 음경 속이 찼다 더웠다 하면서 아픈 것을 낫게 하며 양기를 세게 하고 정기를 불쿠어 아이를 많이 낳게 한다. ․남자의 양기가 끊어져서 음위증이 된 것과 여자의 음기가 끊어져서 임신하지 못하는 것을 치료한다. 5장을 눅여 주고 살찌게 하며 허리와 무릎을 덥게 하고 남자의 몽설과 유정, 피오줌이 나오는 것, 오줌이 방울방울 떨어지는 것, 여자의 대하와 음부가 아픈 데 쓴다 ․겉은 잣송이처럼 비늘이 있고 길이는 1자가 넘는다. 음력 3월에 뿌리를 캐어 그늘에서 말려 쓴다. 술에 담갔다가 비늘 같은 것을 벗겨버린다[본초] ․정혈(精血)을 세게 보하는데 갑자기 많이 쓰면 도리어 오줌이 잘 나오지 않게 된다[단심]"},{"id":152,"name":"續斷","aliases":[],"category":"補益藥-補陽藥","origin":"續斷科(산토끼꽃과) 川續斷 및 산토끼꽃의 뿌리","initial":"기타","sortName":"續斷","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛 微溫","肝 腎","補肝腎<br>續筋骨<br>調血脈","腰背酸痛, 遺精, 癰疽瘡腫<br>足膝無力, 跌打損傷<br>胎漏, 崩漏, 帶下, 痔漏, 金瘡",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["續斷科(산토끼꽃과) 川續斷 및 산토끼꽃의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦辛 微溫","肝 腎","補肝腎<br>續筋骨<br>調血脈","腰背酸痛, 遺精, 癰疽瘡腫<br>足膝無力, 跌打損傷<br>胎漏, 崩漏, 帶下, 痔漏, 金瘡",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-補하는 效能은 있으나 滯하지 않고, 行氣시키나 瀉하지 않으며, 溫하되 燥하지 않는 點이 特長","-杜仲과 續斷은 모두 補肝腎 强筋骨하는 效能이 있어 肝腎不足으로 인한 腰膝痠痛의 要藥이 되며 安胎","․續斷은 苦溫하여 血脈을 通利하여 筋骨의 損傷을 治療하는 傷科의 要藥이 되고,","․杜仲은 甘溫하여 오로지 腎臟을 補하는 效能이 强하여 腎虛腰痛에 가장 좋으며, 또한 血壓을 降下"]}],["sec",{"key":"qna","label":"본초문답","lines":["-續斷亦有筋, 故皆主治筋脈. 但秦艽紋左右紐轉, 利於左右相交; 續斷筋紋如骨節相連, 故主接筋骨, 去骨節間之風寒(p139)","-寒入於筋脈, 或拘急不能屈伸, 或享單(늘어져)緩不能收引, 或疼痛不可忍耐, 總宜續斷秦艽, 引入筋脈(p150)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-류머티즘등 風濕病이 장기간 치유되지 않고 體質이 虛弱해졌을때의 治療에 良好하며 虛弱을補하고 또 風濕을 제거하는 作用도 한다.","-安胎의 效能이 있어서 婦人科에서 胎兒를 보호하는데 사용하는 良藥이다.","-함유성분은 續斷알칼로이드, 揮發油, 비타민E 및 有色物質이다.","-藥理的 作用은 癰痒에 대하여 排膿, 止血, 鎭痛, 組織再生을 促進시킨다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["四四 味苦而澁, 苦重澁輕, 氣微凉. 凡用此者는 用其苦澁이며 其味苦而重, 故로 能入血分하야 調血脈, 消腫毒乳癰, 瘰癧痔瘻, 治金損跌傷, 續筋骨血脈하며 其味澁, 故로 能止吐血衄血, 崩淋胎漏, 便血尿血, 調血痢, 縮小便, 止遺精帶濁이나 佐之以甘, 如甘草‧地黃‧人參‧山藥之類이면 其效尤捷이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["․속단(續斷)의 성질은 약간 따뜻하며[微溫] 맛이 쓰고[苦] 매우며[辛] 독이 없다. 경맥을 잘 통하게 하고 힘줄과 뼈를 이어주며 기를 도와주고 혈맥을 고르게 하며 해산후의 일체병(一切病)에 쓴다","․산이나 들에서 자란다. 음력 3월 후에 싹이 돋아서 화살대 같은데 네모져 있다. 잎은 모시잎 같은데 2개씩 맞붙어서 난다. 음력 4월에 붉은 빛과 흰빛의 꽃이 피고 뿌리는 엉겅퀴 뿌리(大薊)와 같은데 붉고 누른빛이다. 음력 7월, 8월에 뿌리를 캐어 그늘에서 말린다. 마디마디가 끊어지고 껍질이 누르고 주름진 것이 좋은 품종이다[본초]","․아픈 것을 잘 멎게 하고 살이 살아나오게 하며 힘줄과 뼈를 이어주므로 속단이라고 한다. 붕루, 대하, 피오줌을 누는 것들에 매우 좋다. 마디마디가 끊어지면서 연기 같은 먼지가 나는 것이 좋은 것이다. 술에 담구어 약한 불기운에 말려 쓴다. 뽕나무겨우살이(桑寄生)와 효력이 같다[입문]"]}]],"searchText":"續斷 분류 補益藥-補陽藥 기원 續斷科(산토끼꽃과) 川續斷 및 산토끼꽃의 뿌리 性味 歸經 效能 主治 備考 苦辛 微溫 肝 腎 補肝腎<br>續筋骨<br>調血脈 腰背酸痛, 遺精, 癰疽瘡腫<br>足膝無力, 跌打損傷<br>胎漏, 崩漏, 帶下, 痔漏, 金瘡  약물특징/비교 -補하는 效能은 있으나 滯하지 않고, 行氣시키나 瀉하지 않으며, 溫하되 燥하지 않는 點이 特長 -杜仲과 續斷은 모두 補肝腎 强筋骨하는 效能이 있어 肝腎不足으로 인한 腰膝痠痛의 要藥이 되며 安胎 ․續斷은 苦溫하여 血脈을 通利하여 筋骨의 損傷을 治療하는 傷科의 要藥이 되고, ․杜仲은 甘溫하여 오로지 腎臟을 補하는 效能이 强하 다.","-白蔲仁은 위액의 분비를 촉진하고 장의 유동을 흥분시키고 장내의 이상발효를 억제하며 위장내 가스를 제거한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["白豆蔲 八二 味辛, 氣溫하며 味薄氣厚하며 陽也라 入脾肺兩經이나 別有淸爽之氣하야 散胸中之冷滯하며 溫胃口하야 止疼하며 除嘔逆飜胃하며 消宿食膨脹하며 治噎膈, 除瘧疾, 解酒毒, 祛穢惡하며 能退翳膜하며 亦消痰氣라 欲其速效엔 嚼嚥이면 甚良하며 或爲散도 亦妙라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-초두구","․성질은 열(熱)하고 맛은 매우며[辛] 독이 없다. 모든 냉기를 낫게 하고 속을 따뜻이 하며 기를 내리고 가슴앓이와 곽란으로 토하는 것을 멎게 하며 입 안의 냄새를 없앤다.","․용안씨(龍眼子)와 비슷한데 뾰족하며 껍질에 비늘이 없다. 속의 씨는 석류 쪽과 비슷한데 맛이 몹시 매운 것이 좋은 품종이다[본초]","․풍한의 사기[風寒客邪]가 위(胃)의 윗구멍에 있는 것을 낫게 하고 비위에 침범한 한사를 없애며 가슴과 위가 아픈 것을 잘 멎게 한다[탕액]","․위가 차고 아픈 것[胃脘冷痛]을 낫게 한다. 족태음경과 양명경에 들어간다. 밀가루반죽한 것으로 싸서 약한 불에 구운 다음 밀가루 반죽은 버리고 쓴다[입문]","-백두구","․성질은 몹시 더우며[大溫] 맛은 맵고[辛] 독이 없다. 냉적(冷積)을 낫게 하고 구토와 반위증(反胃證)을 멎게 하며 음식을 삭게 하고 기를 내리게 한다.","․포도송이와 같은 씨가 달리며 생것은 푸르고 익으면 희다. 음력 7월에 따서 껍질을 버리고 쓴다[본초]","․폐에 몰린 기를 발산시키고 주로 폐경에만 들어간다. 눈 흰자위에 생긴 예막(翳膜)을 없앤다[탕액]","․수태음경과 수태양경으로 들어간다. 이 약에는 청고(淸高)한 기가 따로 있어서 상초에 원기를 보한다. 껍질은 버리고 갈아서 쓴다[입문]"]}]],"searchText":"草豆蔲, 白豆蔲 분류 3가지 모두 芳香化濕藥 기원 생강과 草豆蔲의 成熟한 種子//육두구과 肉豆蔲樹의 成熟한 果實//白荳蔲와 爪哇白荳蔲의 果實 性味 歸經 效能 主治 備考 辛 溫 脾 胃 燥濕健脾<br>溫中止嘔 寒濕內阻, 脘腹脹滿冷痛, 噯氣嘔逆, 不思飮食, 泄瀉腹痛 草豆蔲 辛 溫 肺 脾 胃 化濕消痞<br>行氣溫中<br>開胃消食 濕濁中阻, 不思飮食, 濕溫初起<br>胸悶不飢, 寒濕嘔逆<br>胸腹脹痛, 食積不消 白豆蔲 약물특징/비교 -白豆蔲와 砂仁은 性味가 서로 같고 效能 또한 유사하여 化濕醒脾시키고 行氣寬中의 要藥이되나, ․白豆蔲는 芳香의 氣가 淸하고 溫燥의 性이 弱하여 主로 上中二焦에 들어가 濕阻中滿과 胃寒嘔吐에 多用 ․砂仁은 芳香의 氣가 濁하고 濕燥의 性은 强하여 主로 中下二焦에 들어가 脾寒泄瀉에 多用 -豆蔲殼은 效能이 白豆蔲와 비슷하나, 단 溫性이 軟弱하고 效能도 弱하나 寒濕氣滯로 인한 脘腹脹悶과 嘔吐등 證에 適用하여 治療한다. -辛燥의 性은 助熱耗氣하므로 火升作嘔者에게는 마땅하지 않다. 본초문답 -白豆蔲 寒水犯中宮, 上吐下泄 爲霍亂洞泄, 乾薑溫中故主之, 砂仁‧白(荳)寇‧(高)良薑亦治之(p152) -白(荳)蔲‧乾薑等, 皆治寒濕(p161) -其臟寒者, 水不化氣而停飮, 宜砂仁‧白(荳)蔲‧莞花‧茯笭, 以溫利之(p212) 진존인본초 -위산분비를 촉진하는 작용이 있다. -위산과다로 식욕부진, 식욕포창 및 소화불량증이 있을시에는 常服하면 좋다. -白蔲仁은 위액의 분비를 촉진하고 장의 유동을 흥분시키고 장내의 이상발효를 억제하며 위장내 가스를 제거한다. 경악전서 白豆蔲 八二 味辛, 氣溫하며 味薄氣厚하며 陽也라 入脾肺兩經이나 別有淸爽之氣하야 散胸中之冷滯하며 溫胃口하야 止疼하며 除嘔逆飜胃하며 消宿食膨脹하며 治噎膈, 除瘧疾, 解酒毒, 祛穢惡하며 能退翳膜하며 亦消痰氣라 欲其速效엔 嚼嚥이면 甚良하며 或爲散도 亦妙라 동의보감 -초두구 ․성질은 열(熱)하고 맛은 매우며[辛] 독이 없다. 모든 냉기를 낫게 하고 속을 따뜻이 하며 기를 내리고 가슴앓이와 곽란으로 토하는 것을 멎게 하며 입 안의 냄새를 없앤다. ․용안씨(龍眼子)와 비슷한데 뾰족하며 면 效果가 좋다. 경악전서 百七十 味苦辛, 氣淸, 性溫, 升也, 陽也. 入足太陽, 陽明, 厥陰經하야 主散風邪, 利七竅, 通關節하며 去諸風頭痛腦鳴, 頭沈昏悶하며 搜肝風하며 止目睛內痛淚出하며 明目堅齒하며 療筋骨間寒熱濕痺拘攣하며 亦去寸白蟲이라 동의보감 -만형실 ․성질은 약간 차며[微寒](평(平)하다고도 한다) 맛이 쓰고[苦] 맵고[辛] 독이 없다. 풍으로 머리가 아프며 골 속이 울리는 것, 눈물이 나는 것을 낫게 하며 눈을 밝게 하고 이빨을 든든히 하며 9규를 잘 통하게 하고 수염과 머리털을 잘 자라게 한다. 습비(濕痺)로 살이 오그라드는 것을 낫게 하며 촌백충과 회충을 없앤다. ․덩굴이 뻗으면서 자라는데 줄기의 높이는 4-5자 정도이다. 마디에서 가지가 마주나고 잎은 살구잎 비슷하다. 가을에 벽오동씨만한 열매가 달리는데 가볍고 속이 비었다. 음력 8-9월에 딴다[본초] ․태양경약인데 술에 축여 쪄서 햇볕에 말린 다음 짓찧어서 쓴다[입문]"},{"id":172,"name":"辛夷","aliases":[],"category":"解表藥-發散風寒藥","origin":"木蘭科에 속한 落葉灌木인 자목련 혹은 백목련의 花蕾","initial":"기타","sortName":"辛夷","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","肺 胃","散風寒<br>通鼻竅","風寒頭痛<br>鼻淵, 鼻塞不通, 鼻流濁涕, 齒痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風寒藥"]}],["sec",{"key":"origin","label":"기원","lines":["木蘭科에 속한 落葉灌木인 자목련 혹은 백목련의 花蕾"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","肺 胃","散風寒<br>通鼻竅","風寒頭痛<br>鼻淵, 鼻塞不通, 鼻流濁涕, 齒痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-肺經에 들어가 위로는 鼻를 通하게 하므로써 風寒을 散하여 鼻淵을 治療하는 要藥","-風寒을 發散시키는 作用이 있으나 일반적으로는 外感表證에는 많이 應用×","-가끔 齒痛을 治療하는데 應用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-辛夷花在樹梢, 其性極升, 而味辛氣散, 故能散腦與鼻間之風寒(p52)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-神經性高血壓증 환자에게는 辛夷5錢, 釣鉤藤5錢, 天麻1錢, 菊花3錢을 煎水 服用시키면 아주 좋은 效果가 있다.","-鼻腔疾患을 治療하는 중요한 약물이다.","-急性鼻炎이나 傷風鼻塞에 의한 流涕를 治療하는데는 辛夷2錢, 薄荷1錢, 金銀花8錢을 煎水하여 服用시키면 效果가 있다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百八十 一名木筆, 一名迎春. 氣味辛溫하니 乃手太陰, 足陽明之藥이라","能解寒熱憎寒體噤하며 散風熱, 利九竅하며 除頭風腦痛, 眩冒瘙癢하며 療面腫引齒疼痛이라 若治鼻塞涕出, 鼻淵鼻鼽鼻瘡 及痘後鼻瘡이면 並宜爲末하야 入麝香少許하고 以葱白蘸藥點入數次면 甚良이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하며[溫] 맛은 맵고[辛] 독이 없다. 풍으로 속골이 아픈 것을 낫게 하며 얼굴의 주근깨를 없애고 코가 메는 것, 콧물이 흐르는 것 등을 낫게 한다. 얼굴이 부은 것을 내리게 하며 치통을 멎게 하고 눈을 밝게 하며 수염과 머리털을 나게 한다. 얼굴에 바르는 기름을 만들면 광택이 난다.","-음력 정월과 2월에 꽃이 피는데 털이 부시시한 작은 복숭아 비슷하며 흰빛에 자줏빛을 띤다. 꽃 피기 전에 따야 한다. 활짝 핀 것은 약 기운이 떨어진다.","-북쪽 찬 지방에서는 음력 2월에 꽃이 피는데 목필(木筆)이라 하고 남쪽 따뜻한 지방에서는 정월에 피는데 영춘(迎春)이라
