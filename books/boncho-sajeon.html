한다. 또 6천 년 내지 7천 년이 되면 덩어리가 된다[오행상류]."]}]],"searchText":"丹沙 朱砂 靈砂(수은86.2%, 유황13.8%) 분류 安神藥 기원 硫化物類의 鑛物인 辰砂族에 속한 辰砂 Cinnbar의 鑛石으로 硫化水銀 HgS을 含有 性味 歸經 效能 主治 備考 甘 微寒 心 鎭心安神<br>定驚解毒 心悸易驚, 失眠多夢, 癲癎發狂<br>小兒驚風, 視物昏花, 口瘡, 喉痺, 瘡瘍腫毒 有毒 약물특징/비교 -本品의 質은 重하여 鎭怯하고, 寒性은 淸熱시켜 心經에 들어가 -心經의 邪熱을 下降시켜 除去하여 心神을 安定시키는 鎭心‧安神‧定驚의 主藥 -心火가 亢盛하여 나타나는 心神不安과 驚悸失眠 및 癲狂등 證에 應用. ․⊕龍骨‧茯笭 → 心氣養 ․⊕當歸‧丹蔘 → 心血養 ․⊕黃連‧生地黃 → 心火淸, 解毒하여 外科疾患에 外用 -內服時함 過量이나 지속적인 服用×, 火煆×(見火하면 水銀이 析出되어 中毒되기 쉽다) 본초문답 生於南方, 有陽中之陰藥, 如朱砂是. 丹砂則屬火中之陰, 其有補坎塡離之功(p16) 경악전서 二三八 味微甘하고 性寒하며 有大毒이라 通稟五行之氣하니 其色屬火也며 其液屬水也며 其體屬土也며 其氣屬木也며 其入屬金也 故로 能通五臟이라 동의보감 -성질은 약간 차고 맛은 달고 독이 없다(약간 독이 있다고도 한다). 모든 병을 낫게 하며 정신을 좋게 하고 안정시키며 눈을 밝게 하고 얼굴에 윤기가 돌게 한다. 또한 혈맥을 잘 돌게 하며 마음을 진정시키고 정신을 흐리게 하는 사기와 가위 눌리는 것, 악귀를 몰아낸다. 中惡, 명치 아래가 아픈 것, 옴, 여러 가지 헌데를 낫게 하고 군살을 없애며 심과 폐를 눅여 준다. 오래 먹으면 정신을 좋게 하며 늙지 않게 하고 몸이 가벼워진다. -일명 단사(丹砂)라고도 하는데 부릉산(符陵山)에서 나며 또 진주에서도 나기 때문에 진사(辰砂)라고도 한다. 아무 때나 캔다. 주사는 광택이 있고 투명하며 깨뜨리면 격지 벽처럼 되어 있다. 또한 운모조각 같고 꺾어지는 것이 좋다. 대개 주사 중에서 좋은 것을 광명사(光明砂)라고 한다. -생으로 쓰는 것이 좋으며 다시 구워서 먹을 때는 조금 먹어야 병이 나지 않는다. 옛날에 어떤 사람이 불에 구운 단사를 몇 알 먹고 며칠밤 심한 열이 나다가 죽었다고 한다. 생주사는 갓난아이에게도 먹일 수 있다. 그러나 불에 의하여 주사의 성질이 변해서 독이 생기면 사람이 죽을 수 있으므로 반드시 주의해야 한다[본초]. -보드랍게 가루내어 수비한 뒤에 재를 넣은 사발에 두터운 종이를 깔고 그 종이 위에 수비한 주사를 놓아 습기를 빨아낸 다음 말려서 쓴다[입문]. -천지의 기운이 쌓여서 1천 년에 처음 어울린 것이 현수(玄水)이고 2천 년이 된 것은 현주(玄珠)이며 3천 년에야 수은(水銀)이 된다. 수은은 푸른 빛을 띠었기 때문에 목(木)에 속하고 4천 년이 되면 주사가 되는데 빛이 붉기 때문에 화(火)에 속한다. 또 6천 년 내지 7천 년이 되면 덩어리가 된다[오행상류]."},{"id":1,"name":"礬石","aliases":["白礬"],"category":"收澀藥-澀精縮尿止帶藥","origin":"硫酸鹽類鑛物인 明礬石 Alunitum을 煎煉하여 만든 것으로 황산알루미늄 칼륨【KAI(SO4)2‧12H2O】을 含有","initial":"기타","sortName":"礬石","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["酸澀 寒","肺 脾 肝 大腸","(外用) 解毒殺蟲<br>燥濕止痒<br>(內服) 止血止瀉<br>祛除風痰","(外用)<br>濕疹, 疥癬, 聤耳流膿<br>陰痒帶下<br>(內服)<br>久瀉不止, 便血, 崩漏<br>癲癎發狂",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["收澀藥-澀精縮尿止帶藥"]}],["sec",{"key":"origin","label":"기원","lines":["硫酸鹽類鑛物인 明礬石 Alunitum을 煎煉하여 만든 것으로 황산알루미늄 칼륨【KAI(SO4)2‧12H2O】을 含有"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["酸澀 寒","肺 脾 肝 大腸","(外用) 解毒殺蟲<br>燥濕止痒<br>(內服) 止血止瀉<br>祛除風痰","(外用)<br>濕疹, 疥癬, 聤耳流膿<br>陰痒帶下<br>(內服)<br>久瀉不止, 便血, 崩漏<br>癲癎發狂",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-內服하면 止瀉‧止血‧祛痰의 效能 → 久瀉‧便血‧崩漏 및 風痰으로 인한 癲癎을 治療","-外用하면 燥濕止痒시키는 效能 → 濕疹疥癬과 口耳諸疾를 治療","-內服에는 生用하고, 外用에 煆하여 枯白礬으로 쓴다."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-痔核腐蝕 : 15% 주사액을 痔核에 직접 주입하면 1분후 괴사변화.","-解毒殺蟲 : 황색포도구균 억제작용.","-과학문헌 : 일부 불용성 황산알루미늄은 收斂‧燥濕‧止瀉‧固脫의 작용이 강하여 潰瘍‧膿瘍‧慢性痢疾‧脫肛등에 효과적이며, 水中溶解가 쉽고 消毒‧防腐작용이 있어 咽喉炎의 含漱劑나 膣炎‧膀胱炎등의 세정제로 사용."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二四五 味酸澁, 性凉, 有小毒하며 所用에 有四니라","其味酸苦하야 可以涌泄 故로 能吐下痰涎하며 治癲癎黃疸이라","其性收澁하야 可固脫滑 故로 能治崩淋帶下, 腸風下血, 脫肛陰挺하며 斂金瘡止血하며 燒枯用之면 能止牙縫出血하며 辟狐腋氣하며 收陰汗脚汗이라","其性燥하야 可治濕邪 故로 能止瀉痢하며 斂浮腫하며 湯洗爛弦風眼이라","其性毒하야 大能解毒定痛 故로 可療癰疽疔腫, 鼻齆息肉, 喉痺瘰癧, 惡瘡疥癬하며 去腐肉하며 生新肉하며 及虎犬蛇蟲蠱毒이라."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 차며[寒] 맛은 시고[酸] 떫으며[澁] 독이 없다. 담을 삭이고 이질을 멎게 하며 음식창과 악창을 낫게 하고 코의 군살을 없애고 갑자기 목구멍이 막힌 것을 낫게 한다. 뼈와 이빨을 든든하게 하며 나력, 서루(鼠瘻), 옴 등을 낫게 한다.","-빛이 희고 광택이 있고 말간 것이 좋다. 보드랍게 갈아서 질그릇에 넣고 한나절 동안 불에 달구워 빛이 분같이 희게 된 것을 고백반[枯礬]이라고 한다. 여러 가지 헌데를 낫게 하고 새살이 살아나게 하는 좋은 약이다. 다만 가래를 삭이는 데는 생것을 쓴다. 또한 녹반(綠礬), 흑반(黑礬), 홍반(紅礬) 등이 있다.","-백반을 물에 풀어 종이에 글을 쓰면 그 물기가 마를 때부터 거기에 물이 묻지 않는다. 이것으로 백반의 성질이 습한 것을 없앤다는 것을 알 수 있다. 그러므로 담연을 치료하는 데 쓴다[본초]."]}]],"searchText":"礬石 白礬 분류 收澀藥-澀精縮尿止帶藥 기원 硫酸鹽類鑛物인 明礬石 Alunitum을 煎煉하여 만든 것으로 황산알루미늄 칼륨【KAI(SO4)2‧12H2O】을 含有 性味 歸經 效能 主治 備考 酸澀 寒 肺 脾 肝 大腸 (外用) 解毒殺蟲<br>燥濕止痒<br>(內服) 止血止瀉<br>祛除風痰 (外用)<br>濕疹, 疥癬, 聤耳流膿<br>陰痒帶下<br>(內服)<br>久瀉不止, 便血, 崩漏<br>癲癎發狂  약물특징/비교 -內服하면 止瀉‧止血‧祛痰의 效能 → 久瀉‧便血‧崩漏 및 風痰으로 인한 癲癎을 治療 -外用하면 燥濕止痒시키는 效能 → 濕疹疥癬과 口耳諸疾를 治療 -內服에는 生用하고, 外用에 煆하여 枯白礬으로 쓴다. 진존인본초 -痔核腐蝕 : 15% 주사액을 痔核에 직접 주입하면 1분후 괴사변화. -解毒殺蟲 : 황색포도구균 억제작용. -과학문헌 : 일부 불용성 황산알루미늄은 收斂‧燥濕‧止瀉‧固脫의 작용이 강하여 潰瘍‧膿瘍‧慢性痢疾‧脫肛등에 효과적이며, 水中溶解가 쉽고 消毒‧防腐작용이 있어 咽喉炎의 含漱劑나 膣炎‧膀胱炎등의 세정제로 사용. 경악전서 二四五 味酸澁, 性凉, 有小毒하며 所用에 有四니라 其味酸苦하야 可以涌泄 故로 能吐下痰涎하며 治癲癎黃疸이라 其性收澁하야 可固脫滑 故로 能治崩淋帶下, 腸風下血, 脫肛陰挺하며 斂金瘡止血하며 燒枯用之면 能止牙縫出血하며 辟狐腋氣하며 收陰汗脚汗이라 其性燥하야 可治濕邪 故로 能止瀉痢하며 斂浮腫하며 湯洗爛弦風眼이라 其性毒하야 大能解毒定痛 故로 可療癰疽疔腫, 鼻齆息肉, 喉痺瘰癧, 惡瘡疥癬하며 去腐肉하며 生新肉하며 及虎犬蛇蟲蠱毒이라. 동의보감 -성질은 차며[寒] 맛은 시고[酸] 떫으며[澁] 독이 없다. 담을 삭이고 이질을 멎게 하며 음식창과 악창을 낫게 하고 코의 군살을 없애고 갑자기 목구멍이 막힌 것을 낫게 한다. 뼈와 이빨을 든든하게 하며 나력, 서루(鼠瘻), 옴 등을 낫게 한다. -빛이 희고 광택이 있고 말간 것이 좋다. 보드랍게 갈아서 질그릇에 넣고 한나절 동안 불에 달구워 빛이 분같이 희게 된 것을 고백반[枯礬]이라고 한다. 여러 가지 헌데를 낫게 하고 새살이 살아나게 하는 좋은 약이다. 다만 가래를 삭이는 데는 생것을 쓴다. 또한 녹반(綠礬), 흑반(黑礬), 홍반(紅礬) 등이 있다. -백반을 물에 풀어 종이에 글을 쓰면 그 물기가 마를 때부터 거기에 물이 묻지 않는다. 이것으로 백반의 성질이 습한 것을 없앤다는 것을 알 수 있다. 그러므로 담연을 치료하는 데 쓴다[본초]."},{"id":2,"name":"芒硝","aliases":["朴硝"],"category":"瀉下藥-攻下藥","origin":"함수황산나트륨, Na2SO4, 10‧H2O, 돌소금, 무기염","initial":"기타","sortName":"芒硝","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹苦 寒","胃 大腸","瀉熱通便<br>潤燥軟堅<br>淸火消腫","實熱便秘, 大便燥結<br>積滯腹痛, 腸癰腫痛<br>(外治) 乳癰, 痔瘡腫痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["瀉下藥-攻下藥"]}],["sec",{"key":"origin","label":"기원","lines":["함수황산나트륨, Na2SO4, 10‧H2O, 돌소금, 무기염"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹苦 寒","胃 大腸","瀉熱通便<br>潤燥軟堅<br>淸火消腫","實熱便秘, 大便燥結<br>積滯腹痛, 腸癰腫痛<br>(外治) 乳癰, 痔瘡腫痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-鹹味로 軟堅케 하고, 苦味로 泄降케 하며, 寒性은 勝熱 → 實熱積滯와 大便燥結의 證을 治療","-大黃과 相須하여 사용하면 瀉熱通便의 效果를 增强","-瀉熱蕩滌시키는 藥力이 비교적 强하므로 孕婦는 服用을 忌","-芒硝를 朴硝 芒硝 玄明粉으로 분류하는데 모두 效能이 비슷","․朴硝 : 잡질多","․芒硝 : 박초보다 순수하며 사하작용이 强.","․玄明粉(감초와 煎湯) : 질이 가장 순수하여 口腔, 眼科질환에 外用, 단 瀉下力은 緩.","-腸粘膜을 刺戟하여 腸의 蠕動을 增加하여 泄瀉를 일으키게 된다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-芒硝本得水氣, 然得水中陰凝之性, 而味鹹能軟堅, 下氣分之熱, 以其得水之陰味, 而未得水中之陽氣, 故降而不升(p77)","-火太甚, 有燥屎, 急下之, 用芒硝以潤滌, 用大黃以功利(p173)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-과학문헌 : 장내에서 황산이온 흡수×, 높은 삼투압유지, 체액 중 수분흡수 → 腸內水分이 장벽자극 瀉下作用"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["朴硝","二五四 味苦鹹辛, 氣寒. 陰也, 降也, 有毒.","其性峻速. 鹹能軟堅하니 推逐陳積하며 化金石藥毒하며 去六腑壅滯脹急, 大小便不通하며 破瘀血堅癥實痰하며 却濕熱疫痢, 傷寒脹閉熱狂하며 消癰腫排膿이라","凡屬各經實熱이면 悉可瀉除나 孕婦忌用이니 最易墮胎하며 虛損誤呑이면 傷生反掌이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-박초(朴硝)는 성질은 몹시 차고[大寒] 맛은 쓰며[苦] 조금 독이 잇다. 배가 팽팽하게 불러 오른 것, 대소변이 나오지 않는 것, 월경이 중단된 것을 낫게 한다. 五臟의 온갖 병과 六腑의 積聚를 치료할 때 설사시킨다. 일명 초석박(硝石朴)이라고도 한다. 지상(地霜, 초석)을 쓸어모아 한번 달여 내었을 뿐 다시 제련하지 않았기 때문에 박초라고 한다. 그 맛이 몹시 떫어서 소나 말가죽을 이기는 데 쓴다. 그렇기 때문에 피초(皮硝)라고도 한다. 72가지 돌을 녹여 물이 되게 하기 때문에 초석이라고 한다[본초]","-초석이라 하는 것은 초의 총칭이다. 불에 법제하지 않은 것을 생초(生硝), 박초라고 하고 불에 법제한 것을 분초(盆硝), 망초(芒硝)라고 한다. 옛사람들은 매운 것을 알고 썼고 지금 사람들은 짠 것으로 알고 쓴다[탕액]","-망초(芒硝)는 성질은 몹시 차며[大寒] 맛은 짜고 조금 독이 있다. 五臟의 積聚와 癥痂를 헤치며 5림을 낫게 하고 대소변을 잘 나가게 하며 뱃속에 담이 찬 것, 상한에서 속에 열이 있는 것, 위가 막힌 증과 황달을 낫게 한다. 나력, 옻이 오른 것을 낫게 하고 어혈을 헤치며 유산시키고 월경이 중단된 것을 하게 한다. 박초를 더운물로 녹여 걸러서 그 물을 절반쯤 졸여 그릇에 담아 하룻밤 두면 가는 결정체로 된다. 이것이 즉 망초이다. 또한 분초(盆硝)라고도 한다[본초]"]}]],"searchText":"芒硝 朴硝 분류 瀉下藥-攻下藥 기원 함수황산나트륨, Na2SO4, 10‧H2O, 돌소금, 무기염 性味 歸經 效能 主治 備考 鹹苦 寒 胃 大腸 瀉熱通便<br>潤燥軟堅<br>淸火消腫 實熱便秘, 大便燥結<br>積滯腹痛, 腸癰腫痛<br>(外治) 乳癰, 痔瘡腫痛  약물특징/비교 -鹹味로 軟堅케 하고, 苦味로 泄降케 하며, 寒性은 勝熱 → 實熱積滯와 大便燥結의 證을 治療 -大黃과 相須하여 사용하면 瀉熱通便의 效果를 增强 -瀉熱蕩滌시키는 藥力이 비교적 强하므로 孕婦는 服用을 忌 -芒硝를 朴硝 芒硝 玄明粉으로 분류하는데 모두 效能이 비슷 ․朴硝 : 잡질多 ․芒硝 : 박초보다 순수하며 사하작용이 强. ․玄明粉(감초와 煎湯) : 질이 가장 순수하여 口腔, 眼科질환에 外用, 단 瀉下力은 緩. -腸粘膜을 刺戟하여 腸의 蠕動을 增加하여 泄瀉를 일으키게 된다. 본초문답 -芒硝本得水氣, 然得水中陰凝之性, 而味鹹能軟堅, 下氣分之熱, 以其得水之陰味, 而未得水中之陽氣, 故降而不升(p77) -火太甚, 有燥屎, 急下之, 用芒硝以潤滌, 用大黃以功利(p173) 진존인본초 -과학문헌 : 장내에서 황산이온 흡수×, 높은 삼투압유지, 체액 중 수분흡수 → 腸內水分이 장벽자극 瀉下作用 경악전서 朴硝 二五四 味苦鹹辛, 氣寒. 陰也, 降也, 有毒. 其性峻速. 鹹能軟堅하니 推逐陳積하며 化金石藥毒하며 去六腑壅滯脹急, 大小便不通하며 破瘀血堅癥實痰하며 却濕熱疫痢, 傷寒脹閉熱狂하며 消癰腫排膿이라 凡屬各經實熱이면 悉可瀉除나 孕婦忌用이니 最易墮胎하며 虛損誤呑이면 傷生反掌이라 동의보감 -박초(朴硝)는 성질은 몹시 차고[大寒] 맛은 쓰며[苦] 조금 독이 잇다. 배가 팽팽하게 불러 오른 것, 대소변이 나오지 않는 것, 월경이 중단된 것을 낫게 한다. 五臟의 온갖 병과 六腑의 積聚를 치료할 때 설사시킨다. 일명 초석박(硝石朴)이라고도 한다. 지상(地霜, 초석)을 쓸어모아 한번 달여 내었을 뿐 다시 제련하지 않았기 때문에 박초라고 한다. 그 맛이 몹시 떫어서 소나 말가죽을 이기는 데 쓴다. 그렇기 때문에 피초(皮硝)라고도 한다. 72가지 돌을 녹여 물이 되게 하기 때문에 초석이라고 한다[본초] -초석이라 하는 것은 초의 총칭이다. 불에 법제하지 않은 것을 생초(生硝), 박초라고 하고 불에 법제한 것을 분초(盆硝), 망초(芒硝)라고 한다. 옛사람들은 매운 것을 알고 썼고 지금 사람들은 짠 것으로 알고 쓴다[탕액] -망초(芒硝)는 성질은 몹시 차며[大寒] 맛은 짜고 조금 독이 있다. 五臟의 積聚와 癥痂를 헤치며 5림을 낫게 하고 대소변을 잘 나가게 하며 뱃속에 담이 찬 것, 상한에서 속에 열이 있는 것, 위가 막힌 증과 황달을 낫게 한다. 나력, 옻이 오른 것을 낫게 하고 어혈을 헤치며 유산시키고 월경이 중단된 것을 하게 한다. 박초를 더운 bel":"약물특징/비교","lines":["-脾肺를 補하여 元氣를 補","-陽生陰長하여 生津止渴 ⇒ 元氣가 虛脫한 危急증에 응용 補虛救急의 요약."]}],["sec",{"key":"qna","label":"본초문답","lines":["-人蔘秉水中之陽, 而補氣; 朱砂秉火中之陰, 而養血. 一生北方; 一生南方. 就此二物, 便知南北水火陰陽氣血之理矣(p18)","-蓋得天水之氣而生者, 入氣分, 人蔘黑芪, 最顯者也(p25)","-人身之氣陽也, 而生於腎水之中, 由陰出陽, 如蔘之生於陰而成爲陽者, 皆無以異, 故蔘爲化津補氣之聖藥. 蓋卽其數知其氣, 而人蔘之本性乃見, 至於色白入肺, 味甘入脾, 味苦生津, 微溫益氣, 其說猶淺(p112)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-强心補身","․藥理硏究上 인삼의 强心작용은 强心性배당체와 흡사하고 强心승압작용이 현저하며, 또한 호흡중추를 흥분케 하여 호흡빈도와 호흡심도를 증강하는 작용이 증명","․壯陽의 효능을 지녀 性腺의 기능을 왕성하게 한다.","․滋養生津‧피로제거‧夜間뇨량감소‧혈당저하의 작용이 있다.","․콜레스테롤대사를 조절하고 콜레스테롤 생성을 억제한다.","-임상응용","․고려삼과 천화분을 함께 사용하면 암세포의 생장을 억제하는 작용이 생긴다.","-과학문헌","․인삼의 유효성분이 임파세포의 분열을 촉진하는 작용이 증명되어 인체의 면역기능을 증진한다는 것이 입증"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["一 反藜蘆 味甘微苦, 微溫하며 氣味頗厚하며 陽中微陰하니 氣虛血虛에 俱能補라","凡虛而發熱, 虛而自汗, 虛而眩運, 虛而困倦하며 虛而驚懼, 虛而短氣, 虛而遺泄, 虛而瀉利하며 虛而頭疼, 虛而腹痛하며 虛而飮食不運, 虛而痰涎壅滯하며 虛而嗽血吐血, 虛而淋瀝便閉하며 虛而嘔逆躁煩, 虛而下血失氣等證에 是皆必不可缺者라 第欲以氣血로 相較 則人參氣味는 頗輕而屬陽者多라 所以로 得氣分者六, 得血分者四라","總之면 不失爲氣分之藥이며 而血分之所不可缺者니 爲未有氣不至 而血能自至者也라","故로 扁鵲曰 損其肺者는 益其氣요 須用人參以益之라 하니 肺氣卽王이면 餘臟之氣도 皆王矣라 所以로 人參之性이 多主於氣하야 而凡臟腑之有氣虛者엔 皆能補之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-곽란으로 딸꾹질하는 것을 멎게 하며 폐위로 고름을 뱉는 것을 치료하며 담을 삭힌다.","-산삼은 깊은 산 속에서 흔히 자라는데 응달쪽 박달나무나 옻나무 아래의 습한 곳에서 자란다. 인삼 가운데는 하나의 줄기가 위로 올라갔는데 마치 도라지(길경)와 비슷하다. 꽃은 음력 3-4월에 피고 씨는 늦은 가을에 여문다. 음력 2월, 4월, 8월 상순에 뿌리를 캐어 대칼로 겉껍질을 벗긴 다음 햇볕에 말린다.","-인삼은 좀이 나기 쉬운데 다만 그릇에 넣고 꼭 봉해 두면 몇 해 지나도 변하지 않는다. 또는 족두리풀(세신)과 같이 넣어서 꼭 봉해 두어도 역시 오래도록 변하지 않는다.","-인삼은 폐화(肺火)를 동하게 하므로 피를 토하거나 오랫동안 기침을 하거나 얼굴빛이 검고 기가 실하며 혈이 허하고 음이 허해진 사람에게는 쓰지 말고 더덕(사삼)을 대용으로 쓰는 것이 좋다[단심]","-인삼은 쓰고[苦] 성질이 약간 따뜻한데[微溫] 5장의 양을 보하고 더덕은 쓰고 성질이 약간 찬데 5장의 음을 보한다[단심]","-여름철에는 적게 써야 한다. 그것은 심현1)이 생기기 때문이다[본초] (주: 1) 심현 ; 명치 밑이 그득하고 아픈 것)"]}]],"searchText":"人蔘 분류 補益藥-補氣藥 기원 五加科에 속한 多年生 草本인 人蔘의 뿌리로, 栽植 4\\~6年後 캐어 曬乾한 것이 白蔘, 鬚根을 除去하고 쪄서 乾燥한 것이 紅蔘. 性味 歸經 效能 主治 備考 甘微苦 微溫 脾 肺 心 大補元氣<br>固脫生津<br>安神 勞傷虛損,食少,倦怠,陽痿,<br>大便滑泄,消渴,自汗暴脫,頻尿,婦女崩漏<br>小兒慢驚,驚悸,健忘,眩暈頭痛  약물특징/비교 -脾肺를 補하여 元氣를 補 -陽生陰長하여 生津止渴 ⇒ 元氣가 虛脫한 危急증에 응용 補虛救急의 요약. 본초문답 -人蔘秉水中之陽, 而補氣; 朱砂秉火中之陰, 而養血. 一生北方; 一生南方. 就此二物, 便知南北水火陰陽氣血之理矣(p18) -蓋得天水之氣而生者, 入氣分, 人蔘黑芪, 最顯者也(p25) -人身之氣陽也, 而生於腎水之中, 由陰出陽, 如蔘之生於陰而成爲陽者, 皆無以異, 故蔘爲化津補氣之聖藥. 蓋卽其數知其氣, 而人蔘之本性乃見, 至於色白入肺, 味甘入脾, 味苦生津, 微溫益氣, 其說猶淺(p112) 진존인본초 -强心補身 ․藥理硏究上 인삼의 强心작용은 强心性배당체와 흡사하고 强心승압작용이 현저하며, 또한 호흡중추를 흥분케 하여 호흡빈도와 호흡심도를 증강하는 작용이 증명 ․壯陽의 효능을 지녀 性腺의 기능을 왕성하게 한다. ․滋養生津‧피로제거‧夜間뇨량감소‧혈당저하의 작용이 있다. ․콜레스테롤대사를 조절하고 콜레스테롤 생성을 억제한다. -임상응용 ․고려삼과 천화분을 함께 사용하면 암세포의 생장을 억제하는 작용이 생긴다. -과학문헌 ․인삼의 유효성분이 임파세포의 분열을 촉진하는 작용이 증명되어 인체의 면역기능을 증진한다는 것이 입증 경악전서 一 反藜蘆 味甘微苦, 微溫하며 氣味頗厚하며 陽中微陰하니 氣虛血虛에 俱能補라 凡虛而發熱, 虛而自汗, 虛而眩運, 虛而困倦하며 虛而驚懼, 虛而短氣, 虛而遺泄, 虛而瀉利하며 虛而頭疼, 虛而腹痛하며 虛而飮食不運, 虛而痰涎壅滯하며 虛而嗽血吐血, 虛而淋瀝便閉하며 虛而嘔逆躁煩, 虛而下血失氣等證에 是皆必不可缺者라 第欲以氣血로 相較 則人參氣味는 頗輕而屬陽者多라 所以로 得氣分者六, 得血分者四라 總之면 不失爲氣分之藥이며 而血分之所不可缺者니 爲未有氣不至 而血能自至者也라 故로 扁鵲曰 損其肺者는 益其氣요 須用人參以益之라 하니 肺氣卽王이면 餘臟之氣도 皆王矣라 所以로 人參之性이 多主於氣하야 而凡臟腑之有氣虛者엔 皆能補之라 동의보감 -곽란으로 딸꾹질하는 것을 멎게 하며 폐위로 고름을 뱉는 것을 치료하며 담을 삭힌다. -산삼은 깊은 산 속에서 흔히 자라는데 응달쪽 박달나무나 옻나무 아래의 습한 곳에서 자란다. 인삼 가운데는 하나의 줄기가 위로 올라갔는데 마치 도라지(길경)와 비슷하다. 꽃은 음력 3-4월에 피고 씨는 늦은 가을에 여문다. 음력 2월, 4월, 8월 상순에 뿌리를 캐어 대칼로 겉껍질을 벗긴 다음 햇볕에 말린다. -인삼은 좀이 나기 쉬운데 다만 그릇에 넣고 꼭 봉해 두면 몇 해 지나도 변하지 않는다. 또는 족두리풀(세신)과 같이 넣어서 꼭 봉해 두어도 역시 오래도록 변하지 않는다. -인삼은 폐화(肺火)를 동하게 하므로 피를 토하거나 오랫동안 기침을 하거나 얼굴빛이 검고 기가 실하며 혈이 허하고 음이 허해진 사람에게는 쓰지 말고 더덕(사삼)을 대용으로 쓰는 것이 좋다[단심] -인삼은 쓰고[苦] 성질이 약간 따뜻한데[微溫] 5장의 양을 보하고 더덕은 쓰고 성질이 약간 찬데 5장의 음을 보한다[단심] -여름철에는 적게 써야 한다. 그것은 심현1)이 생기기 때문이다[본초] (주: 1) 심현 ; 명치 밑이 그득하고 아픈 것)"},{"id":8,"name":"天門冬","aliases":[],"category":"補益藥-補陰藥","origin":"百合科 천문동 Asparagus cochincninesis의 塊根","initial":"기타","sortName":"天門冬","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘苦 寒","<u>肺 腎<\/u>","滋陰潤燥<br>淸肺降火","陰虛發熱, 咳嗽吐血, 消渴, 便秘<br>肺痿, 肺癰, 咽喉腫痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陰藥"]}],["sec",{"key":"origin","label":"기원","lines":["百合科 천문동 Asparagus cochincninesis의 塊根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘苦 寒","<u>肺 腎<\/u>","滋陰潤燥<br>淸肺降火","陰虛發熱, 咳嗽吐血, 消渴, 便秘<br>肺痿, 肺癰, 咽喉腫痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-肺腎陰虛로 熱이 있는 證을 治療하는 要藥(肺熱傷陰으로 생긴 燥咳咯血하는 症狀에 適用)","-肺陰을 養하여 潤肺止咳하고 또한 陰虛內熱로 津液이 損傷되어 생기는 消渴과 腸燥便秘症"]}],["sec",{"key":"qna","label":"본초문답","lines":["-麥冬‧天冬‧忍冬‧冬靑, 皆凌冬不凋(겨울동안 시들지 않는다), 感水津之氣, 故二冬能淸肺金(p40)","-心腎陰虛則生熱 天王補心丹 用二冬 二地 丹參 元參 皆是益水陰 其濟心中之熱(p179)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-滋養生津","․폐와 기관의 진액이 乾涸하여 나타나는 증후에 효과가 있다.","․질이 윤택하고 수분이 많아 약효를 방해할 우려가 있어 咳嗽初期에 사용하는 일은 드물다.","․藥理硏究上 천동은 폐염쌍구균‧백일해균‧황색포도구균 등에 항균작용이 있으며 백일해치료에 현저한 효과가 있다.(천동 + 백부‧패모‧氷砂糖을 膏狀이 되도록 鰲하여 복용)","․老年 體弱便秘나 産前産後의 便秘치료."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百五 味苦微甘, 氣大寒하며 味厚氣薄하며 沈也며 陰也라","入肺腎兩經하야 除虛勞內熱하며 其味苦寒 故로 上定熱喘, 下去熱淋하며","苦는 殺三蟲, 潤滋骨髓, 解渴除煩, 消痰止嗽, 降火保肺, 退熱滋陰, 大潤血熱燥結이나 虛寒假熱, 脾腎溏泄엔 最忌라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 차며[寒] 맛이 쓰고[苦] 달며[甘] 독이 없다. 폐에 기가 차서 숨이 차고 기침하는 것을 치료한다. 또는 담을 삭이고 피를 토하는 것을 멎게 하며 폐위를 낫게 한다. 뿐만 아니라 신기(腎氣)를 통하게 하고 폐기를 진정시키며 오줌이 잘 나가게 한다. 성질이 차나 보하고 3충을 죽이며 얼굴빛을 좋게 하고 소갈증을 멎게 하며 5장을 눅여 준다[潤]","-음력 2월, 3월, 7월, 8월에 뿌리를 캐어 볕에 말린다. 쓸 때에 뜨거운 물에 담갔다가 쪼개어 심을 버린다. 뿌리가 크고 맛이 단것이 좋은 것이다[본초]","-천문동은 수태음경과 족소음경에 들어간다[탕액]","-우리나라에는 다만 충청도, 전라도, 경상도에서만 난다[속방]"]}]],"searchText":"天門冬 분류 補益藥-補陰藥 기원 百合科 천문동 Asparagus cochincninesis의 塊根 性味 歸經 效能 主治 備考 甘苦 寒 <u>肺 腎<\/u> 滋陰潤燥<br>淸肺降火 陰虛發熱, 咳嗽吐血, 消渴, 便秘<br>肺痿, 肺癰, 咽喉腫痛  약물특징/비교 -肺腎陰虛로 熱이 있는 證을 治療하는 要藥(肺熱傷陰으로 생긴 燥咳咯血하는 症狀에 適用) -肺陰을 養하여 潤肺止咳하고 또한 陰虛內熱로 津液이 損傷되어 생기는 消渴과 腸燥便秘症 본초문답 -麥冬‧天冬‧忍冬‧冬靑, 皆凌冬不凋(겨울동안 시들지 않는다), 感水津之氣, 故二冬能淸肺金(p40) -心腎陰虛則生熱 天王補心丹 用二冬 二地 丹參 元參 皆是益水陰 其濟心中之熱(p179) 진존인본초 -滋養生津 ․폐와 기관의 진액이 乾涸하여 나타나는 증후에 효과가 있다. ․질이 윤택하고 수분이 많아 약효를 방해할 우려가 있어 咳嗽初期에 사용하는 일은 드물다. ․藥理硏究上 천동은 폐염쌍구균‧백일해균‧황색포도구균 등에 항균작용이 있으며 백일해치료에 현저한 효과가 있다.(천동 + 백부‧패모‧氷砂糖을 膏狀이 되도록 鰲하여 복용) ․老年 體弱便秘나 産前産後의 便秘치료. 경악전서 百五 味苦微甘, 氣大寒하며 味厚氣薄하며 沈也며 陰也라 入肺腎兩經하야 除虛勞內熱하며 其味苦寒 故로 上定熱喘, 下去熱淋하며 苦는 殺三蟲, 潤滋骨髓, 解渴除煩, 消痰止嗽, 降火保肺, 退熱滋陰, 大潤血熱燥結이나 虛寒假熱, 脾腎溏泄엔 最忌라 동의보감 -성질은 차며[寒] 맛이 쓰고[苦] 달며[甘] 독이 없다. 폐에 기가 차서 숨이 차고 기침하는 것을 치료한다. 또는 담을 삭이고 피를 토하는 것을 멎게 하며 폐위를 낫게 한다. 뿐만 아니라 신기(腎氣)를 통하게 하고 폐기를 진정시키며 오줌이 잘 나가게 한다. 성질이 차나 보하고 3충을 죽이며 얼굴빛을 좋게 하고 소갈증을 멎게 하며 5장을 눅여 준다[潤] -음력 2월, 3월, 7월, 8월에 뿌리를 캐어 볕에 말린다. 쓸 때에 뜨거운 물에 담갔다가 쪼개어 심을 버린다. 뿌리가 크고 맛이 단것이 좋은 것이다[본초] -천문동은 수태음경과 족소음경에 들어간다[탕액] -우리나라에는 다만 충청도, 전라도, 경상도에서만 난다[속방]"},{"id":9,"name":"甘草","aliases":[],"category":"補益藥-補氣藥","origin":"豆科 감초, 脹果감초(만주, 몽고산), 光果감초(유럽산 질기고 甘↓)의 根 및 根莖.       (甘味↑, 수분함량↑, 윤기↑, 휘어지는 것이 良品, 딱감초는 약용×)","initial":"기타","sortName":"甘草","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 平","心 肺 脾 胃","和中緩急<br>潤肺<br>解毒<br>調和諸藥","(炙用)脾胃虛弱, 食少, 腹痛便溏, 勞倦發熱, 肺痿咳嗽, 心悸, 驚癎<br>(生用)咽喉腫痛, 消化性潰瘍, 癰疽瘡瘍, 解藥毒, 食物中毒",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["豆科 감초, 脹果감초(만주, 몽고산), 光果감초(유럽산 질기고 甘↓)의 根 및 根莖.       (甘味↑, 수분함량↑, 윤기↑, 휘어지는 것이 良品, 딱감초는 약용×)"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 平","心 肺 脾 胃","和中緩急<br>潤肺<br>解毒<br>調和諸藥","(炙用)脾胃虛弱, 食少, 腹痛便溏, 勞倦發熱, 肺痿咳嗽, 心悸, 驚癎<br>(生用)咽喉腫痛, 消化性潰瘍, 癰疽瘡瘍, 解藥毒, 食物中毒",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-蜜炙하면 性이 微溫하여 甘溫은 補脾益氣, 潤肺止咳하여 脾胃虛弱과 肺虛喘咳의 病證을 治療","-生用하면 性이 平하여 解毒하는 效能이 있어 瘡瘍腫毒, 咽喉腫痛, 脘腹四肢攣急作痛을 治療","-諸藥을 調和하는 效能이 있어 熱藥과 같이 사용하면 그 熱性을 緩和하고, 寒藥과 같이 쓰면 그 寒性을 緩和하며, 補性을 急하게 이르지 않게 하고, 瀉性을 急하게 이르지 않게 한다.","-通行十二經하는 藥物로 指稱(方中에서 補助의 藥)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-甘草味正甘, 入脾胃, 守而不走, 補中氣, 和諸藥(p37)","-如仲景炙甘草湯, 取其益胃, 則用炙而氣升. 芍藥甘草湯, 取其平胃, 則用生而氣平(p122)","-甘草入太陰以爲引經報使2)(p128) (주: 2) 引經報使 ; 어떤 약물이 다른 약물을 병변 부위에 도달케하는 인도작용이 마치 향도와 같으므로 引經報使라고 한다. 두 종류가 있다. 한 종류는 경맥으로 인도하는 것이다. 예컨대 太陽經病에 강활 방풍을 써서 인도하는 것이며, 다른 하나는 질병이 소재하는 곳으로 인도하는 것이다. 예컨대 咽喉病에는 길경을 써서 그 載藥上浮하는 작용을 이용하여 咽喉部에 도달하게 하는 것이다.)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-補益滋養","․강심작용이 있어, 心臟이 弱해지고 심기능부전으로 動悸‧虛脈‧弱脈이 나타날 경우 신체를 補하고 心臟을 강화(炙감초탕)","․健胃‧消食‧止血의 효능이 있어 潰瘍 치료효과가 뛰어나며 海螵蛸를 배합 사용한다.","-淸熱解毒 : 인후종통, 음성의 啞嘶(울시), 유선염, 모든 외과적 창상에 적용","-祛痰止咳","․抗염증‧抗알레르기 작용에 의해 氣管평활근의 경련을 완화하고 염증을 일으킨 점막을 덮어 자극을 감소하여 염증을 소산 止咳‧化痰한다.","-緩急止痛 : 경련성 통증을 완화한다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["五 味甘氣平하고 生凉灸溫하며 可升可降하며 善於解毒이나 反甘遂‧海藻‧大戟‧芫花라","祛邪熱, 堅筋骨, 健脾胃, 長肌肉하며 隨氣藥이면 入氣하고 隨血藥이면 入血하야 無往不可 故로 稱國老나 惟中滿者엔 勿加니 恐其作脹이며 速下者에 勿入은 恐其緩功이니 不可不知也라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-감초(甘草)는 온갖 약의 독을 풀어 준다. 9가지 흙의 기운을 받아 72가지의 광물성 약재와 1,200가지의 초약(草藥)등 모든 약을 조화시키는 효과가 있으므로 국로(國老)라고 한다. 5장 6부에 寒熱邪氣가 있는데 쓰며 9竅를 통하게 하고 모든 혈맥을 잘 돌게 한다. 또한 힘줄과 뼈를 든든하게 하고 살찌게 한다. 음력 2월, 8월에 뿌리를 캐어 볕에 말려서 딴딴하고 잘 꺾어지는 것이 좋다. 꺾을 때 가루가 나오기 때문에 분초(粉草)라고 한다[본초]. 감초는 족삼음경(足三陰經)에 들어가며 구우면 비위를 조화시키고 生으로 쓰면 화(火)를 사(瀉)한다[탕액]","-吐하거나 속이 그득하거나 술을 즐기는 사람은 오랫동안 먹거나 많이 먹는 것은 좋지 않다[정전]","-중국으로부터 들여다가 우리나라의 여러 지방에 심었으나 잘 번식되지 않았다. 다만 함경북도에서 나는 것이 가장 좋았다[속방]","-감초소(甘草梢, 감초초)는 즉 감초의 잔뿌리이다. 가늘고 단맛은 없으며 슴슴하다. 오줌이 잘 나가지 않으면서 요도[尿管]가 아픈 것과 음경이 아픈 것을 치료한다[입문]","-감초절(甘草節, 감초마디)는 옹종(癰腫)을 삭게 하며 생것으로 쓰면 부은 것을 내리게 하고 독을 푼다[입문]"]}]],"searchText":"甘草 분류 補益藥-補氣藥 기원 豆科 감초, 脹果감초(만주, 몽고산), 光果감초(유럽산 질기고 甘↓)의 根 및 根莖.       (甘味↑, 수분함량↑, 윤기↑, 휘어지는 것이 良品, 딱감초는 약용×) 性味 歸經 效能 主治 備考 甘 平 心 肺 脾 胃 和中緩急<br>潤肺<br>解毒<br>調和諸藥 (炙用)脾胃虛弱, 食少, 腹痛便溏, 勞倦發熱, 肺痿咳嗽, 心悸, 驚癎<br>(生用)咽喉腫痛, 消化性潰瘍, 癰疽瘡瘍, 解藥毒, 食物中毒  약물특징/비교 -蜜炙하면 性이 微溫하여 甘溫은 補脾益氣, 潤肺止咳하여 脾胃虛弱과 肺虛喘咳의 病證을 治療 -生用하면 性이 平하여 解毒하는 效能이 있어 瘡瘍腫毒, 咽喉腫痛, 脘腹四肢攣急作痛을 治療 -諸藥을 調和하는 效能이 있어 熱藥과 같이 사용하면 그 熱性을 緩和하고, 寒藥과 같이 쓰면 그 寒性을 緩和하며, 補性을 急하게 이르지 않게 하고, 瀉性을 急하게 이르지 않게 한다. -通行十二經하는 藥物로 指稱(方中에서 補助의 藥) 본초문답 -甘草味正甘, 入脾胃, 守而不走, 補中氣, 和諸藥(p37) -如仲景炙甘草湯, 取其益胃, 則用炙而氣升. 芍藥甘草湯, 取其平胃, 則用生而氣平(p122) -甘草入太陰以爲引經報使2)(p128) (주: 2) 引經報使 ; 어떤 약물이 다른 약물을 병변 부위에 도달케하는 인도작용이 마치 향도와 같으므로 引經報使라고 한다. 두 종류가 있다. 한 종류는 경맥으로 인도하는 것이다. 예컨대 太陽經病에 강활 방풍을 써서 인도하는 것이며, 다른 하나는 질병이 소재하는 곳으로 인도하는 것이다. 예컨대 咽喉病에는 길경을 써서 그 載藥上浮하는 작용을 이용하여 咽喉部에 도달하게 하는 것이다.) 진존인본초 -補益滋養 ․강심작용이 있어, 心臟이 弱해지고 심기능부전으로 動悸‧虛脈‧弱脈이 나타날 경우 신체를 補하고 心臟을 강화(炙감초탕) ․健胃‧消食‧止血의 효능이 있어 潰瘍 치료효과가 뛰어나며 海螵蛸를 배합 사용한다. -淸熱解毒 : 인후종통, 음성의 啞嘶(울시), 유선염, 모든 외과적 창상에 적용 -祛痰止咳 ․抗염증‧抗알레르기 작용에 의해 氣管평활근의 경련을 완화하고 염증을 일으킨 점막을 덮어 자극을 감소하여 염증을 소산 止咳‧化痰한다. -緩急止痛 : 경련성 통증을 완화한다. 경악전서 五 味甘氣平하고 生凉灸溫하며 可升可降하며 善於解毒이나 反甘遂‧海藻‧大戟‧芫花라 祛邪熱, 堅筋骨, 健脾胃, 長肌肉하며 隨氣藥이면 入氣하고 隨血藥이면 入血하야 無往不可 故로 稱國老나 惟中滿者엔 勿加니 恐其作脹이며 速下者에 勿入은 恐其緩功이니 不可不知也라 동의보감 -감초(甘草)는 온갖 약의 독을 풀어 준다. 9가지 흙의 기운을 받아 72가지의 광물성 약재와 1,200가지의 초약(草藥)등 모든 약을 조화시키는 효과가 있으므로 국로(國老)라고 한다. 5장 6부에 寒熱邪氣가 있는데 쓰며 9竅를 통하게 하고 모든 혈맥을 잘 돌게 한다. 또한 힘줄과 뼈를 든든하게 하고 살찌게 한다. 음력 2월, 8월에 뿌리를 캐어 볕에 말려서 딴딴하고 잘 꺾어지는 것이 좋다. 꺾을 때 가루가 나오기 때문에 분초(粉草)라고 한다[본초]. 감초는 족삼음경(足三陰經)에 들어가며 구우면 비위를 조화시키고 生으로 쓰면 화(火)를 사(瀉)한다[탕액] -吐하거나 속이 그득하거나 술을 즐기는 사람은 오랫동안 먹거나 많이 먹는 것은 좋지 않다[정전] -중국으로부터 들여다가 우리나라의 여러 지방에 심었으나 잘 번식되지 않았다. 다만 함경북도에서 나는 것이 가장 좋았다[속방] -감초소(甘草梢, 감초초)는 즉 감초의 잔뿌리이다. 가늘고 단맛은 없으며 슴슴하다. 오줌이 잘 나가지 않으면서 요도[尿管]가 아픈 것과 음경이 아픈 것을 치료한다[입문] -감초절(甘草節, 감초마디)는 옹종(癰腫)을 삭게 하며 생것으로 쓰면 부은 것을 내리게 하고 독을 푼다[입문]"},{"id":10,"name":"熟地黃","aliases":[],"category":"補益藥-補血藥","origin":"玄蔘科 地黃과 懷慶地黃의 新鮮한 뿌리를 9蒸한 것","initial":"기타","sortName":"熟地黃","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 微溫","肝 腎","滋陰補血<br>益精塡髓","肝腎陰虛, 腰膝酸軟, 骨蒸潮熱, 盜汗遺精, 內熱消渴, 血虛萎黃, 心悸怔忡, 月經不調, 崩漏下血, 眩暈, 耳鳴, 鬚髮早白","熟地黃"]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補血藥"]}],["sec",{"key":"origin","label":"기원","lines":["玄蔘科 地黃과 懷慶地黃의 新鮮한 뿌리를 9蒸한 것"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 微溫","肝 腎","滋陰補血<br>益精塡髓","肝腎陰虛, 腰膝酸軟, 骨蒸潮熱, 盜汗遺精, 內熱消渴, 血虛萎黃, 心悸怔忡, 月經不調, 崩漏下血, 眩暈, 耳鳴, 鬚髮早白","熟地黃"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-養陰凉血","․생지황 : 苦味 〉甘味, 大寒→淸熱凉血→급성열병","․건지황 : 甘味 〉苦味→滋陰養血→慢性陰虛血少"]}],["sec",{"key":"qna","label":"본초문답","lines":["-生地質潤, 中含水液; 阿膠濟水煎成, 性本水陰, 二藥皆能生血. 阿膠生地, 以水濟火, 正是以坎塡離(p33)","-河南平原, 土厚水深, 故地黃得中央濕土之氣而生, 內含潤澤土之濕也. 人徒見地黃蒸成黑色, 爲能滋腎之陰, 而不知 實滋脾陰. [內經]云 脾爲陰中之至陰. 地黃以濕歸脾, 脾陰足, 則肝腎自受其灌漑(p35)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-滋養補血","․補血의 要藥이며 각종 빈혈증 치료에 적절.","․소화흡수 잘 되도록 통상량 3\\~5錢에 砂仁末 8分 또는 陳皮 2錢을 加味한다.","․철 결핍성 빈혈(顔面黃色‧脣舌蒼白‧無氣力‧四肢冷)에는 ⊕당귀‧아교‧하수오","․출혈(토혈,객혈,비혈등의 출혈과다)에 당삼‧원삼‧생지‧황기에 ⊕숙지황","․補血安胎의 효능과 滋養에 의한 退微熱의 작용이 있다.","․급만성 신염으로 빈뇨‧다뇨‧단백뇨증상에","급성신염; ⊕산약‧황백‧황련‧비해","만성신염; ⊕육계‧보골지‧육종용‧산약","․遺精早漏에 상용약.","-과학문헌","․[六味地黃湯]은 신성고혈압에 대해 강압‧신기능 개선‧병사율 저하의 현저한 作用有","․건강한 신장의 代償作用 촉진뿐 아니라 소화장애가 있는 신장의 배설기능을 촉진"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["味甘微苦하며 味厚氣薄하며 沈也며 陰中有陽이라","且夫人之所以有生者는 氣與血耳나 氣主陽而動하며 血主陰而靜하니 補氣는 以人參爲主, 而芪朮로 但可爲之佐하며 補血은 以熟地爲主, 而芎‧歸로 但可爲之佐라 然이나 在芪‧朮‧芎‧歸, 則又有所當避나 而人參‧熟地, 則氣血之必不可無라 故로 凡諸經之陽氣虛者는 非人參이면 不可하고 諸經之陰血虛者는 非熟地면 不可하며 人參엔 有健運之功하며 熟地엔稟靜順之德하니 此熟地之與人參은 一陰一陽으로 相爲表裏며 一形一氣로 互主生成하며 性味中正하야 無逾於此니 誠有不可假借而更代者矣라","凡諸眞陰虧損者는 有爲發熱, 爲頭疼, 爲焦渴, 爲喉痺, 爲嗽痰, 爲喘氣커나 或脾腎寒逆爲嘔吐하며 或虛火載血於口鼻하며 或水泛於皮膚하며 或陰虛而泄利하며 或陽浮而狂躁하며 或陰脫而仆地하니 陰虛而神散者는 非熟地之守면 不足以聚之하고 陰虛而火升者는 非熟地之重이면 不足以降之하며 陰虛而躁動者는 非熟地之靜이면 不足以鎭之하며 陰虛而剛急者는 非熟地之甘이면 不足以緩之하며 陰虛而水邪泛濫者는 舍熟地하고 何以自制하며? 陰虛而眞氣散失者는 舍熟地하고 何以歸源하며? 陰虛而精血俱損으로 脂膏殘薄者는 舍熟地하고 何以厚腸胃리오?"]}],["sec",{"key":"dong","label":"동의보감","lines":["-熟地黃(찐지황)은 성질은 따뜻하고[溫] 맛이 달며[甘] 약간 쓰고[微苦] 독이 없다. 부족한 혈을 크게 보하고 수염과 머리털을 검게 하며 골수를 보충해 주고 살찌게 하며 힘줄과 뼈를 든든하게 한다. 뿐만 아니라 虛損證을 補하고 혈맥을 통하게 하며 기운을 더 나게 하고 귀와 눈을 밝게 한다.","-쪄서 만드는 법[蒸造法]은 잡방(雜方)에 자세히 씌어 있다[본초]","-생지황은 위(胃)를 상하므로 위기(胃氣)가 약한 사람은 오랫동안 먹지 못한다. 찐지황은 가슴이 막히게 하므로 담화가 성(盛)한 사람은 역시 오랫동안 먹을 수 없다[정전]","-찐지황은 手足少陰經과 厥陰經에 들어가며 성질은 따뜻하여 腎을 보한다[입문]","-찐지황을 생강즙(薑汁)으로 법제하면 가슴이 답답해지는 일이 없다[의감]"]}]],"searchText":"熟地黃 분류 補益藥-補血藥 기원 玄蔘科 地黃과 懷慶地黃의 新鮮한 뿌리를 9蒸한 것 性味 歸經 效能 主治 備考 甘 微溫 肝 腎 滋陰補血<br>益精塡髓 肝腎陰虛, 腰膝酸軟, 骨蒸潮熱, 盜汗遺精, 內熱消渴, 血虛萎黃, 心悸怔忡, 月經不調, 崩漏下血, 眩暈, 耳鳴, 鬚髮早白 熟地黃 약물특징/비교 -養陰凉血 ․생지황 : 苦味 〉甘味, 大寒→淸熱凉血→급성열병 ․건지황 : 甘味 〉苦味→滋陰養血→慢性陰虛血少 본초문답 -生地質潤, 中含水液; 阿膠濟水煎成, 性本水陰, 二藥皆能生血. 阿膠生地, 以水濟火, 正是以坎塡離(p33) -河南平原, 土厚水深, 故地黃得中央濕土之氣而生, 內含潤澤土之濕也. 人徒見地黃蒸成黑色, 爲能滋腎之陰, 而不知 實滋脾陰. [內經]云 脾爲陰中之至陰. 地黃以濕歸脾, 脾陰足, 則肝腎自受其灌漑(p35) 진존인본초 -滋養補血 ․補血의 要藥이며 각종 빈혈증 치료에 적절. ․소화흡수 잘 되도록 통상량 3\\~5錢에 砂仁末 8分 또는 陳皮 2錢을 加味한다. ․철 결핍성 빈혈(顔面黃色‧脣舌蒼白‧無氣力‧四肢冷)에는 ⊕당귀‧아교‧하수오 ․출혈(토혈,객혈,비혈등의 출혈과다)에 당삼‧원삼‧생지‧황기에 ⊕숙지황 ․補血安胎의 효능과 滋養에 의한 退微熱의 작용이 있다. ․급만성 신염으로 빈뇨‧다뇨‧단백뇨증상에 급성신염; ⊕산약‧황백‧황련‧비해 만성신염; ⊕육계‧보골지‧육종용‧산약 ․遺精早漏에 상용약. -과학문헌 ․[六味地黃湯]은 신성고혈압에 대해 강압‧신기능 개선‧병사율 저하의 현저한 作用有 ․건강한 신장의 代償作用 촉진뿐 아니라 소화장애가 있는 신장의 배설기능을 촉진 경악전서 味甘微苦하며 味厚氣薄하며 沈也며 陰中有陽이라 且夫人之所以有生者는 氣與血耳나 氣主陽而動하며 血主陰而靜하니 補氣는 以人參爲主, 而芪朮로 但可爲之佐하며 補血은 以熟地爲主, 而芎‧歸로 但可爲之佐라 然이나 在芪‧朮‧芎‧歸, 則又有所當避나 而人參‧熟地, 則氣血之必不可無라 故로 凡諸經之陽 咳 빈번, 咽喉가려움에 生津止咳 ⊕원삼‧행인‧석곡 등","․津液不足에 의한 便秘(고열후의 흔한 변비)에 ⊕麥冬‧火麻仁(임상에 당귀,지황군약↑)","-淸熱解毒","․소아의 鵝口瘡, 구강점막 糜爛 ⊕금은화‧치자‧황련","-淸血止血","․위궤양의 급성 다량출혈시 ⊕포황‧측백엽‧선학초","․돌연한 선홍색의 鼻출혈시 ⊕포황‧괴화","․咯血‧咳血에 ⊕우절‧패모"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["四一 生地黃 味苦甘, 氣凉하며 氣薄味厚하며 沈也며 陰也라","鮮者는 更凉하며 乾者는 微凉하야 能生血補血하며 凉心火, 退血熱하며 去煩躁骨蒸, 熱痢下血하며 止嘔血衄血, 脾中濕熱, 或婦人血熱而經枯, 或上下三消而熱渴이나 總之면 其性頗凉, 若脾胃有寒者, 用宜斟酌이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 차고[寒] 맛이 달며[甘](쓰다[苦]고도 한다) 독이 없다. 모든 열을 내리며 뭉친 피를 헤치고 어혈을 삭게 한다. 또한 월경을 잘 통하게 한다. 부인이 붕루증으로 피가 멎지 않는 것과 태동(胎動)으로 하혈하는 것과 코피, 피를 토하는 것 등에 쓴다.","-어느 곳에나 심을 수 있는데 음력 2월이나 8월에 뿌리를 캐어 그늘에 말린다. 물에 넣으면 가라앉고 살이 찌고 큰 것이 좋은 것이다. 일명 지수(地髓) 또는 하라고도 하는데 누런 땅에 심은 것이 좋다.","-『신농본초경[本經]』에는 生乾이라는 말과 蒸乾이라는 말은 하지 않았는데 쪄서 말리면 그 성질이 따뜻하고[溫] 생으로 말리면 그 성질이 평순해진다[平宣]","-금방 캔 것을 물에 담그어 뜨는 것을 인황(人黃)이라 하며 가라앉는 것을 지황(地黃)이라고 한다. 가라앉는 것은 효력이 좋아서 약으로 쓰며 절반쯤 가라앉는 것은 그 다음이며 뜨는 것은 약으로 쓰지 않는다. 캘 때 구리나 쇠붙이로 만든 도구를 쓰지 않는 것이 좋다[본초]","-생지황은 혈을 생기게 하고 혈의 열을 식히며 수태양과 수소음경에 들어가며 술에 담그면 약성이 위로 올라가고 겉으로 나간다[탕액]"]}]],"searchText":"生地黃 분류 淸熱藥-淸熱凉血藥 기원 玄蔘科 地黃과 懷慶地黃의 新鮮한 뿌리를 鮮地黃(生地黃), 塊根을 천천히 불에 쪼여 乾燥한 것을 生地黃(乾地黃)이라 한다. 性味 歸經 效能 主治 備考 甘苦 寒 心 肝 腎 淸熱生津<br>凉血止血 熱風傷陰, 舌絳煩渴, 發斑發疹, 吐血, 衄血, 咽喉腫痛 乾地黃 甘 寒 心 肝 腎 淸熱凉血<br>養陰生津 熱病舌絳煩渴, 陰虛內熱, 骨蒸勞熱, 內熱消渴, 吐血, 衄血, 發斑發疹 生地黃 약물특징/비교 -養陰凉血 ․생지황 : 苦味 〉甘味, 大寒→淸熱凉血→급성열병 ․건지황 : 甘味 〉苦味→滋陰養血→慢性陰虛血少 본초문답 -生地質潤, 中含水液; 阿膠濟水煎成, 性本水陰, 二藥皆能生血. 阿膠生地, 以水濟火, 正是以坎塡離(p33) -河南平原, 土厚水深, 故地黃得中央濕土之氣而生, 內含潤澤土之濕也. 人徒見地黃蒸成黑色, 爲能滋腎之陰, 而不知 實滋脾陰. [內經]云 脾爲陰中之至陰. 地黃以濕歸脾, 脾陰足, 則肝腎自受其灌漑(p35) 진존인본초 -滋養生津 ․高熱후 진액소모로 口渴多飮‧煩燥不安‧面紅‧舌乾‧脣焦‧脈數 등에 ⊕元蔘‧麥冬 ․氣管炎의 초‧중기에 乾咳 빈번, 咽喉가려움에 生津止咳 ⊕원삼‧행인‧석곡 등 ․津液不足에 의한 便秘(고열후의 흔한 변비)에 ⊕麥冬‧火麻仁(임상에 당귀,지황군약↑) -淸熱解毒 ․소아의 鵝口瘡, 구강점막 糜爛 ⊕금은화‧치자‧황련 -淸血止血 ․위궤양의 급성 다량출혈시 ⊕포황‧측백엽‧선학초 ․돌연한 선홍색의 鼻출혈시 ⊕포황‧괴화 ․咯血‧咳血에 ⊕우절‧패모 경악전서 四一 生地黃 味苦甘, 氣凉하며 氣薄味厚하며 沈也며 陰也라 鮮者는 更凉하며 乾者는 微凉하야 能生血補血하며 凉心火, 退血熱하며 去煩躁骨蒸, 熱痢下血하며 止嘔血衄血, 脾中濕熱, 或婦人血熱而經枯, 或上下三消而熱渴이나 總之면 其性頗凉, 若脾胃有寒者, 用宜斟酌이라 동의보감 -성질은 차고[寒] 맛이 달며[甘](쓰다[苦]고도 한다) 독이 없다. 모든 열을 내리며 뭉친 피를 헤치고 어혈을 삭게 한다. 또한 월경을 잘 통하게 한다. 부인이 붕루증으로 피가 멎지 않는 것과 태동(胎動)으로 하혈하는 것과 코피, 피를 토하는 것 등에 쓴다. -어느 곳에나 심을 수 있는데 음력 2월이나 8월에 뿌리를 캐어 그늘에 말린다. 물에 넣으면 가라앉고 살이 찌고 큰 것이 좋은 것이다. 일명 지수(地髓) 또는 하라고도 하는데 누런 땅에 심은 것이 좋다. -『신농본초경[本經]』에는 生乾이라는 말과 蒸乾이라는 말은 하지 않았는데 쪄서 말리면 그 성질이 따뜻하고[溫] 생으로 말리면 그 성질이 평순해진다[平宣] -금방 캔 것을 물에 담그어 뜨는 것을 인황(人黃)이라 하며 가라앉는 것을 지황(地黃)이라고 한다. 가라앉는 것은 효력이 좋아서 약으로 쓰며 절반쯤 가라앉는 것은 그 다음이며 뜨는 것은 약으로 쓰지 않는다. 캘 때 구리나 쇠붙이로 만든 도구를 쓰지 않는 것이 좋다[본초] -생지황은 혈을 생기게 하고 혈의 열을 식히며 수태양과 수소음경에 들어가며 술에 담그면 약성이 위로 올라가고 겉으로 나간다[탕액]"},{"id":12,"name":"蒼朮","aliases":[],"category":"芳香化濕藥","origin":"菊花科 삽주의 根莖","initial":"기타","sortName":"蒼朮","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫","脾 胃 肝","<u>燥濕健脾<\/u><br><u>祛風散寒<\/u><br><u>明目<\/u>","脘腹脹滿,泄瀉,水腫,脚氣痿躄 風濕痺痛,風寒感冒<br><u>雀目夜盲<\/u>","蒼朮"]]},"items":[["sec",{"key":"category","label":"분류","lines":["芳香化濕藥"]}],["sec",{"key":"origin","label":"기원","lines":["菊花科 삽주의 根莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫","脾 胃 肝","<u>燥濕健脾<\/u><br><u>祛風散寒<\/u><br><u>明目<\/u>","脘腹脹滿,泄瀉,水腫,脚氣痿躄 風濕痺痛,風寒感冒<br><u>雀目夜盲<\/u>","蒼朮"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-性燥하며 辛香發散하여 外로는 風濕의 邪氣를 除去하고, 內로는 脾胃의 濕邪를 化濕","-燥濕健脾시키고 祛風시키는 要藥(濕邪로 인해 病이 된 證에 上下表裏를 莫論하고 隨證配用)","-그러나 性이 溫燥하여 陰液을 耗損하기 쉬우므로 陰虛內熱者나 汗多者는 服用을 忌","-수치에 따른 효능의 차","․生用 : 辛散의 性이 强 → 祛風發汗에는 生用","․炒用 : 辛散의 性이 弱 → 燥濕健脾에는 炒用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-蒼朮甘而苦燥, 苦燥胃去濕(p42)","-..脚氣 亦有係熱濕者 宜防己 黃柏 蒼朮 木通 膽草等 苦降之品治之(p163)","-蒼朮有汁而味烈 則扶脾之火以燥濕(p164)","-腸胃所以化飮食, 皆以其燥能消耗之也, 蒼朮正燥胃土. 砂仁辛澁, 正入大腸(p171)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-健胃理氣","․창출의 辛溫通氣효능은 위장에 습기가 적체했을 때 健胃‧소화력을 발휘하고(창출이 군약인 平胃散) 습기가 관절이나 下肢에 留滯했을 때에는 습기를 제거","․急性腸炎으로 水樣便을 폭사하여 탈수증상이 나타났을 때, 창출3전에 복령‧차전자‧신곡‧석류피를 加味 사용.","․越鞠丸(=六鬱湯→五積散)중 蒼朮은 濕鬱을 담당","․유행성감기후 수양성 묽은 가래가 특히 많을 때 반하‧패모등 화담약 병행","-化濕止痛 : 下肢습열로 생기는 水腫, 脚氣등","-기타작용 : 비타민A가 풍부하여 비타민A 결핍성 야맹증이나 角膜연화증 치료에 사용"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["四 味苦甘辛하고 性溫而燥하며 氣味俱厚하며 可升可降하며 陽也니 用此者는用其溫散燥濕이라","<u>其性溫散 故로 能發汗寬中하고 調胃進食하야 去心腹脹疼하고 霍亂嘔吐하며 解諸鬱結하며 逐山嵐寒疫하고 散風眩頭疼하며 消痰癖氣塊하고 水腫脹滿이라<\/u>","其性燥濕 故로 治冷痢冷洩하고 滑瀉腸風하며 寒濕諸瘡이라 與黃檗同煎이면 最逐下焦濕熱痿痺라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질은 따뜻하며[溫] 맛이 쓰고[苦] 매우며[辛] 독이 없다. 윗도리, 중간, 아랫도리의 습을 치료하며 속을 시원하게 하고 땀이 나게 하며 고여 있는 담음(痰飮), 현벽, 기괴(氣塊), 산람장기 등을 헤치며 風, 寒, 濕으로 생긴 비증(痺證)과 곽란으로 토하고 설사하는 것이 멎지 않는 것을 낫게 하며 수종과 창만(脹滿)을 없앤다.","-삽주의 길이는 엄지손가락이나 새끼손가락만 하며 살찌고 실한 것은 구슬을 꿴 것 같으며 껍질의 빛은 갈색이고 냄새와 맛이 몹시 맵다. 반드시 쌀 씻은 물에 하룻밤 담갔다가 다시 그 물을 갈아붙여 하루동안 담가 두었다가 겉껍질을 벗기고 노랗게 볶아 써야 한다[본초]","-일명 산정(山精)이라고 하는데 캐는 방법은 흰삽주와 같다[본초]","-족양명과 족태음경에 들어가며 위(胃)를 든든하게[健] 하고 비(脾)를 편안하게 한다[입문]","-삽주는 웅장하여 올라가는 힘이 세고 습을 잘 없애며 비를 안정시킨다[역로]"]}]],"searchText":"蒼朮 분류 芳香化濕藥 기원 菊花科 삽주의 根莖 性味 歸經 效能 主治 備考 辛苦 溫 脾 胃 肝 <u>燥濕健脾<\/u><br><u>祛風散寒<\/u><br><u>明目<\/u> 脘腹脹滿,泄瀉,水腫,脚氣痿躄 風濕痺痛,風寒感冒<br><u>雀目夜盲<\/u> 蒼朮 약물특징/비교 -性燥하며 辛香發散하여 外로는 風濕의 邪氣를 除去하고, 內로는 脾胃의 濕邪를 化濕 -燥濕健脾시키고 祛風시키는 要藥(濕邪로 인해 病이 된 證에 上下表裏를 莫論하고 隨證配用) -그러나 性이 溫燥하여 陰液을 耗損하기 쉬우므로 陰虛內熱者나 汗多者는 服用을 忌 -수치에 따른 효능의 차 ․生用 : 辛散의 性이 强 → 祛風發汗에는 生用 ․炒用 : 辛散의 性이 弱 → 燥濕健脾에는 炒用 본초문답 -蒼朮甘而苦燥, 苦燥胃去濕(p42) -..脚氣 亦有係熱濕者 宜防己 黃柏 蒼朮 木通 膽草等 苦降之品治之(p163) -蒼朮有汁而味烈 則扶脾之火以燥濕(p164) -腸胃所以化飮食, 皆以其燥能消耗之也, 蒼朮正燥胃土. 砂仁辛澁, 正入大腸(p171) 진존인본초 -健胃理氣 ․창출의 辛溫通氣효능은 위장에 습기가 적체했을 때 健胃‧소화력을 발휘하고(창출이 군약인 平胃散) 습기가 관절이나 下肢에 留滯했을 때에는 습기를 제거 ․急性腸炎으로 水樣便을 폭사하여 탈수증상이 나타났을 때, 창출3전에 복령‧차전자‧신곡‧석류피를 加味 사용. ․越鞠丸(=六鬱湯→五積散)중 蒼朮은 濕鬱을 담당 ․유행성감기후 수양성 묽은 가래가 특히 많을 때 반하‧패모등 화담약 병행 -化濕止痛 : 下肢습열로 생기는 水腫, 脚氣등 -기타작용 : 비타민A가 풍부하여 비타민A 결핍성 야맹증이나 角膜연화증 치료에 사용 경악전서 四 味苦甘辛하고 性溫而燥하며 氣味俱厚하며 可升可降하며 陽也니 用此者는用其溫散燥濕이라 <u>其性溫散 故로 能發汗寬中하고 調胃進食하야 去心腹脹疼하고 霍亂嘔吐하며 解諸鬱結하며 逐山嵐寒疫하고 散風眩頭疼하며 消痰癖氣塊하고 水腫脹滿이라<\/u> 其性燥濕 故로 治冷痢冷洩하고 滑瀉腸風하며 寒濕諸瘡이라 與黃檗同煎이면 最逐下焦濕熱痿痺라 동의보감 -성질은 따뜻하며[溫] 맛이 쓰고[苦] 매우며[辛] 독이 없다. 윗도리, 중간, 아랫도리의 습을 치료하며 속을 시원하게 하고 땀이 나게 하며 고여 있는 담음(痰飮), 현벽, 기괴(氣塊), 산람장기 등을 헤치며 風, 寒, 濕으로 생긴 비증(痺證)과 곽란으로 토하고 설사하는 것이 멎지 않는 것을 낫게 하며 수종과 창만(脹滿)을 없앤다. -삽주의 길이는 엄지손가락이나 새끼손가락만 하며 살찌고 실한 것은 구슬을 꿴 것 같으며 껍질의 빛은 갈색이고 냄새와 맛이 몹시 맵다. 반드시 쌀 씻은 물에 하룻밤 담갔다가 다시 그 물을 갈아붙여 하루동안 담가 두었다가 겉껍질을 벗기고 노랗게 볶아 써야 한다[본초] -일명 산정(山精)이라고 하는데 캐는 방법은 흰삽주와 같다[본초] -족양명과 6)","-羌獨活皆一莖直上 有風不動 但味太辛 氣太溫 能散寒風 力甚於天麻 而兼能燥濕 不如天麻之剛柔得中也(p137)","-傷暑變瘧 貴於散濕淸熱 三焦膀胱之小便淸 則瘧自除 土茯苓 猪苓 葛根 獨活 散濕以治太陽膀胱 黃芩 鼈甲 靑皮 膽草 淸熱以利少陽三焦 兩腑兼治爲宜(p168)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-發汗退熱, 祛濕止痛","․發汗作用은 弱하나 祛濕作用이 현저, 多濕地 거주자 感冒時 辛溫藥보다는 祛濕發散藥으로 조금씩 發汗이 효과적이며,","․慢性 류머티즘성關節炎에 가장 많이 사용되며 急‧慢性 어느 關節痛에도 적합하다.","․독활함유 스코폴레틴은 현저한 止痛作用이 있어 각종신경통 치료에 효과가 있으며 특히 좌골신경통에 다용하며, 또한 末梢血管 擴張作用이 있어 말초혈관순환장애에 의한 病症에도 유효"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["獨活 ; 二六 味苦, 氣香하며 性微凉이라","<u>升中有降, 善行滯氣 故로 入腎與膀胱兩經하야 專理下焦風濕이라 兩足痛痺, 濕癢拘攣, 或因風濕而齒痛, 頭眩喘逆, 奔豚疝瘕, 腰腹疼痛等證에 皆宜用之라<\/u>"]}],["sec",{"key":"dong","label":"동의보감","lines":["-독활(獨活, 따두릅)은 온갖 적풍(賊風)과 모든 뼈마디가 아픈 풍증(風證)이 금방 생겼거나 오래되었거나 할 것 없이 다 치료한다.","-중풍으로 목이 쉬고 입과 눈이 비뚤어지고 팔다리를 쓰지 못하며 온몸에 전혀 감각이 없고 힘줄과 뼈가 저리면서 아픈 것을 치료한다.","-따두릅은 산이나 들에서 자라는데 음력 2월과 3월, 9월과 10월에 뿌리를 캐어 볕에 말린다. 이 풀은 바람불 때 흔들리지 않으며 바람이 없을 때는 저절로 움직이므로 독요초(獨搖草)라고도 한다[본초]","-줄기는 하나로 곧게 서서 바람에도 흔들리지 않으므로 독활이라 하며 족소음경으로 들어가는 약[行經藥]이다. 따두릅은 기운이 약하고 강호리(강활)는 기운이 웅장하다[입문]","-풍을 치료하는 데는 따두릅을 써야 하는데 부종을 겸하였을 때에는 강호리(강활)를 써야 한다. 지금 사람들은 자줏빛이고 마디가 빽빽한 것을 강호리(강활)라고 하며 빛이 누르고 덩어리로 된 것을 따두릅이라고 한다[본초]","-따두릅은 기운이 약하고 빛이 희면서 족소음경에 잠복된 풍을 치료하므로 두 다리가 한습으로 생긴 비증(痺證)에 의하여 움직이지 못하는 것은 이것이 아니면 치료할 수 없다[탕액]"]}]],"searchText":"獨活 두릅 분류 祛風濕藥-祛風濕止痺痛藥 기원 미나리과(繖形科) 중치모당귀의 뿌리, 국내에선 五加科(두릅나무과)의 獨活(땃두릅)의 뿌리를 씀 性味 歸經 效能 主治 備考 辛苦 微溫 腎 膀胱 祛風除濕<br>解表止痛 風寒濕痺,腰膝疼痛,關節屈伸不利<br>惡寒發熱,頭痛身痛,肢體沈重 獨活 약물특징/비교 -性이 下行하므로 腰部以下의 痺痛을 治療하는데 더욱 좋은 效果 -羌活과 獨活은 古代에는 分離하지 않아 【神農本草經】에는 “獨活 一名 羌活”이라 하였고, 【名醫別錄】에-는 獨活만 記載되어 있고, 羌活은 없으며, 【本草綱目】에는 “獨活以羌中來者爲良”이라 記錄 -그러나 實際에 있어서는 羌活과 獨活이 形態는 다르나 모두 祛風, 除濕, 止痛의 作用 ․羌活 : 氣味雄烈하고 燥散性大하여 主 膀胱經, 兼 腎經 入→ 發汗解表시켜 病邪가 在上在表者에 마땅. 羌活은 足太陽經에 들어가 游風을 治療한다고 하였다. ․獨活 : 氣味淡薄하고 性亦緩和하여 主 腎經, 兼 膀胱經 入→ 祛風濕(筋骨間)하여 病邪가 在下在裏者에 마땅. 獨活은 足少陰經에 들어가 伏風을 治療 -독활은 風寒濕痺가 肌肉과 關節에 痺着하여 나타나는 痛證에 新久를 막론하고 應用可能 -더욱이 下部의 痺證에 마땅 본초문답 -獨活 升浮之品(p66) -羌獨活皆一莖直上 有風不動 但味太辛 氣太溫 能散寒風 力甚於天麻 而兼能燥濕 不如天麻之剛柔得中也(p137) -傷暑變瘧 貴於散濕淸熱 三焦膀胱之小便淸 則瘧自除 土茯苓 猪苓 葛根 獨活 散濕以治太陽膀胱 黃芩 鼈甲 靑皮 膽草 淸熱以利少陽三焦 兩腑兼治爲宜(p168) 진존인본초 -發汗退熱, 祛濕止痛 ․發汗作用은 弱하나 祛濕作用이 현저, 多濕地 거주자 感冒時 辛溫藥보다는 祛濕發散藥으로 조금씩 發汗이 효과적이며, ․慢性 류머티즘성關節炎에 가장 많이 사용되며 急‧慢性 어느 關節痛에도 적합하다. ․독활함유 스코폴레틴은 현저한 止痛作用이 있어 각종신경통 치료에 효과가 있으며 특히 좌골신경통에 다용하며, 또한 末梢血管 擴張作用이 있어 말초혈관순환장애에 의한 病症에도 유효 경악전서 獨活 ; 二六 味苦, 氣香하며 性微凉이라 <u>升中有降, 善行滯氣 故로 入腎與膀胱兩經하야 專理下焦風濕이라 兩足痛痺, 濕癢拘攣, 或因風濕而齒痛, 頭眩喘逆, 奔豚疝瘕, 腰腹疼痛等證에 皆宜用之라<\/u> 동의보감 -독활(獨活, 따두릅)은 온갖 적풍(賊風)과 모든 뼈마디가 아픈 풍증(風證)이 금방 생겼거나 오래되었거나 할 것 없이 다 치료한다. -중풍으로 목이 쉬고 입과 눈이 비뚤어지고 팔다리를 쓰지 못하며 온몸에 전혀 감각이 없고 힘줄과 뼈가 저리면서 아픈 것을 치료한다. -따두릅은 산이나 들에서 자라는데 음력 2월과 3월, 9월과 10월에 뿌리를 캐어 볕에 말린다. 이 풀은 바람불 때 흔들리지 않으며 바람이 없을 때는 저절로 움직이므로 독요초(獨搖草)라고도 한다[본초] -줄기는 하나로 곧게 서서 바람에도 흔들리지 않으므로 독활이라 하며 족소음경으로 들어가는 약[行經藥]이다. 따두릅은 기운이 약하고 강호리(강활)는 기운이 웅장하다[입문] -풍을 치료하는 데는 따두릅을 써야 하는데 부종을 겸하였을 때에는 강호리(강활)를 써야 한다. 지금 사람들은 자줏빛이고 마디가 빽빽한 것을 강호리(강활)라고 하며 빛이 누르고 덩어리로 된 것을 따두릅이라고 한다[본초] -따두릅은 기운이 약하고 빛이 희면서 족소음경에 잠복된 풍을 치료하므로 두 다리가 한습으로 생긴 비증(痺證)에 의하여 움직이지 못하는 것은 이것이 아니면 치료할 수 없다[탕액]"},{"id":18,"name":"羌活","aliases":["강호리"],"category":"解表藥-發散風寒藥","origin":"산형과에 속한 多年生 草本인 羌活 혹은 寬葉羌活의 根莖","initial":"ㄱ","sortName":"강호리","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦溫(燥)","膀胱 肝 腎","散表寒<br>祛風濕<br>利關節","感冒風寒,頭痛無汗<br>風寒濕痺,項强筋急,風水浮腫,癰疽瘡毒<br>骨節酸痛","羌活"]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風寒藥"]}],["sec",{"key":"origin","label":"기원","lines":["산형과에 속한 多年生 草本인 羌活 혹은 寬葉羌活의 根莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦溫(燥)","膀胱 肝 腎","散表寒<br>祛風濕<br>利關節","感冒風寒,頭痛無汗<br>風寒濕痺,項强筋急,風水浮腫,癰疽瘡毒<br>骨節酸痛","羌活"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-羌活과 獨活은 古代에는 分離하지 않아 神農本草經에서는 “獨活 一名 羌活”이라 하였고, 名醫別錄에서는 獨活만 記載되어 있고, 羌活은 없으며, 本草綱目에서는 “獨活以羌中來者爲良”이라 記錄","-그러나 實際에 있어서는 羌活과 獨活이 形態는 다르나 모두 祛風, 除濕, 止痛의 作用","․羌活 : 氣味雄烈하고 燥散性大하여 主 膀胱經, 兼 腎經 入→ 發汗解表시켜 病邪가 在上在表者에 마땅. 羌活은 足太陽經에 들어가 游風을 治療한다고 하였다.","․獨活 : 氣味淡薄하고 性亦緩和하여 主 腎經, 兼 膀胱經 入→ 祛風濕(筋骨間)하여 病邪가 在下在裏者에 마땅. 獨活은 足少陰經에 들어가 伏風을 治療"]}],["sec",{"key":"qna","label":"본초문답","lines":["-羌活獨活 根極深長 得黃泉之水氣 而上升生苗 象人身太陽經 秉水中之陽 以發於經脈也 味辛氣烈 故入太陽經 散頭頂之風寒 獨活尤有黑色, 故兼入少陰, 以達太陽, 能散背  多年生 草本인 防風의 뿌리로, 봄‧가을 꽃대가 나오지 않은 것을 採取 건조. 우리나라에서는 防風 또는 갯기름나물, 기름나물, 갯방풍의 根을 쓰고 있다. 性味 歸經 效能 主治 備考 辛甘 溫 膀胱 肝 脾 解表祛風<br>勝濕止痛 外感風寒, 頭痛, 目眩, 項强<br>風寒濕痺, 骨節酸痛, 四肢攣急, 破傷風  약물특징/비교 -周身을 善行하면서 風邪를 祛하기 때문에 治風의 要藥 -風藥中 潤劑 : 性味가 微溫하되 燥하지 않고 甘緩하여 峻烈하지 않으며 性이 비교적 緩和해서... -炒炭하면 止血시키는 效能이 있어 便血과 崩漏등 症狀에 表證이 있을 때 마땅 -陰虛火旺이나 風寒濕의 邪가 없을 때에는 服用을 忌 -元防風 ; 海防風, 北沙蔘(肺陰虛하여 熱化) -植防風 ; (갯)기름나물 본초문답 -防風辛而味甘, 故入脾(肌肉), 氣香而溫, 散肌肉之風寒(p53, 149) -陽氣怫鬱之微風宜散, 薄荷/荊芥/防風/紫蘇/柴胡之類是矣(p143) 진존인본초 -發汗解表, 祛濕止痛, 止痙止汗 ․발한해표작용이 극히 우수 : 마황,강활〉방풍 ․풍습에 의한 관절산통을 治하는 常用藥 ․파상풍 치료에 우수한 止痙作用(玉眞散은 방풍이 君藥) ․炒방풍에는 止汗‧止瀉作用 有 경악전서 二三 味甘辛, 氣溫, 升也, 陽也. 用此者는 用其氣平散風이라 雖膀胱脾胃經藥이나 然隨諸經之藥하야 各經皆至라 氣味俱輕 故로 散風邪하야 治一身之痛, 療風眼, 止冷淚하며 風能勝濕 故로 亦去濕, 除遍體濕瘡이라 若隨實表補氣諸藥이면 亦能收汗, 升擧陽氣, 止腸風下血崩漏라 然이나 此는 風藥中之潤劑로 亦能走散上焦元氣하니 誤服久服이면 反能傷人이라 동의보감 -방풍(防風)은 성질은 따뜻하며[溫] 맛이 달고[甘] 매우며[辛] 독이 없다. 36가지 풍증을 치료하며 5장을 좋게 하고 맥풍(脈風)을 몰아내며 어지럼증, 통풍(痛風), 눈에 피지고 눈물이 나는 것, 온몸의 뼈마디가 아프고 저린 것 등을 치료한다. 식은땀을 멈추고 정신을 안정시킨다. -산과 들에서 자라는데 어느 곳에나 다 있다. 음력 2월, 10월에 뿌리를 캐어 볕에 말린다. 뿌리가 실하면서 눅진눅진하고[脂潤] 대가리 마디가 딴딴하면서 지렁이 대가리처럼 된 것이 좋다. 노두와 대가리가 두 가닥인것, 꼬리가 두 가닥인 것들은 버린다. 대가리가 가닥인 것을 쓰면 사람이 미치고 꼬리가 두가닥인 것을 쓰면 고질병이 생기게 된다[본초]. -족양명, 족태음경에 들어가는 약이며 족태양의 본경약이다. 풍을 치료하는 데 두루 쓴다. 몸 윗도리에 있는 풍사에는 노두를 버리고 쓰며 몸 아랫도리에 있는 풍사(風邪)에는 잔뿌리를 버리고 쓴다[탕액]. -상초의 풍사를 없애는 데 아주 좋은 약이다[입문]. -방풍엽(防風葉, 방풍잎)은 중풍과 열로 땀나는 데 쓴다[본초]. -방풍화(防風花, 방풍꽃)는 명치 밑이 아프고 팔다리가 가드라지며 경맥이 허하여 몸이 여윈 데 쓴다[본초]. -방풍자(防風子, 방풍씨)는 고수씨와 비슷하면서 크다. 양념으로 쓰면 향기롭고 풍을 치료하는 데 더욱 좋다[본초]"},{"id":20,"name":"山藥","aliases":[],"category":"補益藥-補氣藥","origin":"薯蕷科 마과 참마의 根莖","initial":"기타","sortName":"山藥","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","脾 肺 腎","健脾補肺<br>固腎益精","脾虛泄瀉, 久痢, 虛勞咳嗽, 消渴<br>遺精, 帶下, 小便頻數",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["薯蕷科 마과 참마의 根莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","脾 肺 腎","健脾補肺<br>固腎益精","脾虛泄瀉, 久痢, 虛勞咳嗽, 消渴<br>遺精, 帶下, 小便頻數",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-原名 : 薯蕷(참마 서, es":["-血中의 氣藥 : 辛溫香竄하여 走하되 守하지 않아 上으로는 頭巓에 行하고 下로는 血海에 倒達하며, 外로는 皮毛를 貫通하고, 옆으로는 四肢에 通行","-活血行氣하고 祛風止痛의 效能이 있어 頭痛을 治療하는 要藥이 된다.","-疼痛의 發生은 대개가 氣滯와 血瘀 및 風寒濕邪의 凝滯로 인함이니 즉 不通則痛.","-그러나 本品은 그 性이 辛溫香竄하므로 陰虛火旺이나 血虛氣弱의 病證에 사용 忌"]}],["sec",{"key":"qna","label":"본초문답","lines":["-川芎辛溫, 溫者陰中之陽, 恰是風木本氣, 故入肝經, 其氣走竄, 而根生又主上升, 故能至於巓頂, 以散風寒(p136)","-川芎辛溫, 得火之氣味, 而無汁液, 故但助火而行血, 而不能生血也(p195)","-氣滯血瘀, 寒熱身疼, 女子經閉不通, 亦當行血中之氣, 香附‧靈脂‧鬱金‧川芎‧乳香‧降香爲主(p198)","-凡積皆是血中氣滯, 而行氣用沈香‧檳郞, 而行血兼用當歸‧川芎(p216)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-補血通經‧行血散瘀","․약리연구 결과 川芎은 혈관을 확장 혈액순환을 돕고, 혈소판凝集을 방지하는 작용이 有","․관상동맥경화성 심장병에 의한 협심증에서 관상혈류량↑ 혈류저항↓ 혈전을 용해","․뇌일혈이나 뇌혈전에 의한 반신불수에 어혈의 용해흡수 → 혈류통창. +적작‧도인","․血瘀氣滯에 의한 月經痛(月經前‧中 下腹脹痛, 경혈량 少, 不暢 및 血塊 혼유)치료. +當歸尾‧赤芍‧香附.","․産後 惡露 예방을 위해 出産 3일후 부터 當歸3‧川芎1‧益母草3‧黃芪2‧桃仁5를 격일로 1첩씩 3첩 복용. 惡露不止 腹脹疼痛있는 경우 川芎2‧當歸尾3‧延胡3‧香附3‧益母草3","-祛濕止痛 : ‧風濕性神經痛의 止痛등에 응용"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["味는 辛微甘하고 氣는 溫하야 升也며 陽也라 其性善散하며 又走肝經하야 氣中之血藥也라 芎‧歸는 俱屬血藥, 而芎之散動은 尤甚於歸라 故로 能散風寒, 治頭痛, 破瘀蓄, 通血脈, 解結氣, 逐疼痛, 排膿消腫, 逐血通經이라","同細辛煎服이면 治金瘡作痛하며 同陳艾煎服이면 驗胎孕有無하니 三四月後, 服此微動者, 胎也.","以其氣升 故로 兼理崩漏眩運하며 以其甘少 故로 散則有餘나 補則不足이라","惟風寒之頭痛엔 極宜用之나 若三陽火壅於上而痛者면 得升이면 反甚이라 令人不明升降, 而但知川芎治頭痛이면 謬亦甚矣요 多服久服이면 令人走散眞氣하야 能致暴亡하니 用者識之라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-궁궁이라고 하며 모든 풍병, 기병, 勞損, 혈병 등을 치료한다. 오래된 어혈을 헤치며 피를 생겨나게 하고 피를 토하는 것, 코피, 피오줌, 피똥 등을 멎게 한다. 풍한사가 뇌에 들어가 머리가 아프고 눈물이 나는 것을 낫게 하며 명치 밑과 옆구리가 냉으로 아픈 것을 치료한다.","-어느 곳에나 다 심는다. 음력 3월, 9월에 뿌리를 캐어 볕에 말린다. 오직 죽은 것은 덩이져 무거우면서 속이 딴딴하고 참새골(雀腦)처럼 생겼다. 이것을 작뇌궁(雀腦芎)이라 하는데 제일 약효가 좋다[본초]","-수, 족궐음경, 소양경에 들어가는 본경 약(本經藥)이다. 혈허로 일체 두통을 치료하는 데 아주 좋은 약이다. 간경(肝經)의 풍사(風邪)를 헤친다.","-관궁(貫芎)은 소양경 두통이 심한 것을 낫게 한다. 또한 약 기운이 위로는 머리와 눈에 가고 아래로는 자궁에까지 간다. 두면풍을 치료하는 데 없어서는 안 된다. 그러므로 정수리와 속골이 아픈 데는 반드시 궁궁이를 써야 한다[탕액]","-무궁(蕪芎)은 싹이 돋아나는 대가리가 적은 것인데 약 힘이 위[上]로 가므로 몰린 것을 잘 흩어지게 한다. 작뇌궁과 효력이 같다[단심]","-궁궁이 한 가지만 먹거나 오랫동안 먹으면 眞氣가 흩어지는데 혹 갑자기 죽게도 한다. 그러므로 반드시 다른 약을 좌사약으로 써야 한다. 골증열이 나거나 땀이 많은 사람은 더욱 오랫동안 먹지 말아야 한다[본초]","-크게 덩어리가 지고 빛이 희며 기름기가 없는 것이 좋은 것이다[본초]","-미무(蘼蕪)는 일명 강리(江籬)라고도 하는데 궁궁이싹이다. 풍사, 두풍, 눈이 아찔한 것[目眩] 등을 치료하며 邪氣, 惡氣를 물리치고 고독을 없애며 3충을 죽인다. 음력 4월, 5월에 잎을 따서 볕에 말린다[본초]"]}]],"searchText":"川芎 분류 活血祛瘀藥 기원 繖形科에 속한 多年生 草本인 川芎의 根莖. 性味 歸經 效能 主治 備考 辛 溫 肝 膽 心包 <u>活血行氣<\/u><br>祛風止痛 月經不調, 經閉痛經<br>癥瘕腹痛,胸脇刺痛,跌撲腫痛,頭痛,風濕痺痛  약물특징/비교 -血中의 氣藥 : 辛溫香竄하여 走하되 守하지 않아 上으로는 頭巓에 行하고 下로는 血海에 倒達하며, 外로는 皮毛를 貫通하고, 옆으로는 四肢에 通行 -活血行氣하고 祛風止痛의 效能이 있어 頭痛을 治療하는 要藥이 된다. -疼痛의 發生은 대개가 氣滯와 血瘀 및 風寒濕邪의 凝滯로 인함이니 즉 不通則痛. -그러나 本品은 그 性이 辛溫香竄하므로 陰虛火旺이나 血虛氣弱의 病證에 사용 忌 본초문답 -川芎辛溫, 溫者陰中之陽, 恰是風木本氣, 故入肝經, 其氣走竄, 而根生又主上升, 故能至於巓頂, 以散風寒(p136) -川芎辛溫, 得火之氣味, 而無汁液, 故但助火而行血, 而不能生血也(p195) -氣滯血瘀, 寒熱身疼, 女子經閉不通, 亦當行血中之氣, 香附‧靈脂‧鬱金‧川芎‧乳香‧降香爲主(p198) -凡積皆是血中氣滯, 而行氣用沈香‧檳郞, 而行血兼用當歸‧川芎(p216) 진존인본초 -補血通經‧行血散瘀 ․약리연구 결과 川芎은 혈관을 확장 혈액순환을 돕고, 혈소판凝集을 방지하는 작용이 有 ․관상동맥경화성 심장병에 의한 협심증에서 관상혈류량↑ 혈류저항↓ 혈전을 용해 ․뇌일혈이나 뇌혈전에 의한 반신불수에 어혈의 용해흡수 → 혈류통창. +적작‧도인 ․血瘀氣滯에 의한 月經痛(月經前‧中 下腹脹痛, 경혈량 少, 不暢 및 血塊 혼유)치료. +當歸尾‧赤芍‧香附. ․産後 惡露 예방을 위해 出産 3일후 부터 當歸3‧川芎1‧益母草3‧黃芪2‧桃仁5를 격일로 1첩씩 3첩 복용. 惡露不止 腹脹疼痛있는 경우 川芎2‧當歸尾3‧延胡3‧香附3‧益母草3 -祛濕止痛 : ‧風濕性神經痛의 止痛등에 응용 경악전서 味는 辛微甘하고 氣는 溫하야 升也며 陽也라 其性善散하며 又走肝經하야 氣中之血藥也라 芎‧歸는 俱屬血藥, 而芎之散動은 尤甚於歸라 故로 能散風寒, 治頭痛, 破瘀蓄, 通血脈, 解結氣, 逐疼痛, 排膿消腫, 逐血通經이라 同細辛煎服이면 治金瘡作痛하며 同陳艾煎服이면 驗胎孕有無하니 三四月後, 服此微動者, 胎也. 以其氣升 故로 兼理崩漏眩運하며 以其甘少 故로 散則有餘나 補則不足이라 惟風寒之頭痛엔 極宜用之나 若三陽火壅於上而痛者면 得升이면 反甚이라 令人不明升降, 而但知川芎治頭痛이면 謬亦甚矣요 多服久服이면 令人走散眞氣하야 能致暴亡하니 用者識之라 동의보감 -궁궁이라고 하며 모든 풍병, 기병, 勞損, 혈병 등을 치료한다. 오래된 어혈을 헤치며 피를 생겨나게 하고 피를 토하는 것, 코피, 피오줌, 피똥 등을 멎게 한다. 풍한사가 뇌에 들어가 머리가 아프고 눈물이 나는 것을 낫게 하며 명치 밑과 옆구리가 냉으로 아픈 것을 치료한다. -어느 곳에나 다 심는다. 음력 3월, 9월에 뿌리를 캐어 볕에 말린다. 오직 죽은 것은 덩이져 무거우면서 속이 딴딴하고 참새골(雀腦)처럼 생겼다. 이것을 작뇌궁(雀腦芎)이라 하는데 제일 약효가 좋다[본초] -수, 족궐음경, 소양경에 들어가는 본경 약(本經藥)이다. 혈허로 일체 두통을 치료하는 데 아주 좋은 약이다. 간경(肝經)의 풍사(風邪)를 헤친다. -관궁(貫芎)은 소양경 두통이 심한 것을 낫게 한다. 또한 약 기운이 위로는 머리와 눈에 가고 아래로는 자궁에까지 간다. 두면풍을 치료하는 데 없어서는 안 된다. 그러므로 정수리와 속골이 아픈 데는 반드시 궁궁이를 써야 한다[탕액] -무궁(蕪芎)은 싹이 돋아나는 대가리가 적은 것인데 약 힘이 위[上]로 가므로 몰린 것을 잘 흩어지게 한다. 작뇌궁과 효력이 같다[단심] -궁궁이 한 가지만 먹거나 오랫동안 먹으면 眞氣가 흩어지는데 혹 갑자기 죽게도 한다. 그러므로 반드시 다른 약을 좌사약으로 써야 한다. 골증열이 나거나 땀이 많은 사람은 더욱 오랫동안 먹지 말아야 한다[ 하면 薑羚拌炒 본초문답 -黃連之味正苦, 故正入心經以爲瀉火(p46) -黃連味苦, 而守而不走, 而大黃獨攻利, 此何也? 同一苦味, 而黃連之質, 枯而不澤; 大黃之質, 滑潤有汁, 故主滑利, 又黃連純於苦味而無氣, 故守而不走; 大黃純於苦味, 而又有雄烈之氣, 以氣行氣苦味, 則走而不守, 所以與黃連別也(p78) <u>-呑酸5)吐酸, 有二病. 一是寒濕, 宜吳萸‧蒼朮‧桂枝‧生薑; 一是熱濕, 宜黃連‧黃柏‧黃芩‧石決明‧靑皮‧膽草等藥, ‧微加吳萸‧花椒, 以反佐之(p162)<\/u> (주: 5) 탄산(呑酸) ; 胃內에 酸이 넘치는 것. 대개 肝氣가 胃를 犯하기 때문으로 傷寒과 傷熱의 구분이 있다.(胃酸이 분비되어 목구멍에 이르는데 吐해지지 않고 삼키면 신맛)) -傷暑變痢, 不可發汗, 更不可利水, 但宜淸熱而濕自化, 黃連/黃芩爲主(p167) -..西醫言是腸胃發炎, 久則腐爛, 按此正是水不濡火之極致, 宜以黃連‧生地爲主, 以白菊‧花粉‧黃芩爲佐(p173) -心中煩熱, 仲景用黃連阿膠鷄子黃湯, 阿膠得阿井伏流之性, 能伏水中之陽; 黃連大寒, 得水之性, 故去熱; 鷄子黃滋補心液, 三味乃塡離淸坎之藥, 故治心內之熱(p176) -皆淸火之藥, 是水交於火也, 故能止血, 黃芩/黃連是矣(p199) -氣結則爲火, 黃連/黃芩以淸之(p216) 진존인본초 -淸熱解毒 : 식물성 항생물질 ․桿菌에 대해 항균작용이 강하여 세균성 赤痢에 적용 ․백일해, 폐결핵의 燥熱, 폐염초기(抗폐염쌍구균), 급성結膜炎의 角膜충혈, 화농성中耳炎, 口角生瘡, 피부의 火傷‧腫氣 등에 효과가 있다. <u>-기타응용 : 소량의 황련으로 胃의 소화기능증진‧胃酸분비억제 효과(左金丸)<\/u> 경악전서 三七 味大苦하고 氣大寒이라味厚氣薄하니 沈也, 降也나 降中微升하니 陰中微陽이라 專治諸火하니 火在上이면 炒以酒하고 火在下이면 炒以童便하며 火而嘔者면 炒以薑汁하며 火而伏者이면 炒以鹽湯하며 同吳茱萸炒하면 可以止火痛하며 同陳壁土炒하면 可止熱瀉하며 同枳實用이면 可消火脹하며 同天花粉用이면 能解煩渴하며 同木香丸이면 和火滯下痢腹痛하며 同吳茱萸丸이면 治胃熱吐呑酸水라 總之면 其性大寒이라 故로 惟平肝凉血, 肅胃淸腸凉膽하니 止驚癎, 瀉心除痞滿하며 上可治吐血衄血하고 下可治腸澼便紅하며 療婦人陰戶腫痛하며 除小兒食積熱疳, 殺蚘虫하며 消惡瘡癰腫하며 除濕熱鬱熱하며 善治火眼하며 亦消痔漏하며 解烏附之熱하며 殺巴豆之毒이라(輕粉의 毒도 解毒,황한의학) 然이나 其善瀉心脾實火나 虛熱에 妄用이면 必致格陽이라 동의보감 -黃連(湯液-草部,1923) ․성질은 寒하고 味는 苦하며 無毒하다. 明目하게하고 止淚出 鎭肝하며 熱毒을 없애고 눈이 붉어져서 잘 보이지 않고 아픈데 넣으며(點赤眼昏痛) 腸癖‧下痢膿血을 치료하고 消渴을 그치게 하고 驚悸‧煩躁를 없애고 膽을 이롭게 하며 口瘡 小兒疳蟲을 다스린다. ․음력 2月8月에 채취하는데, 마디가 구슬을 꿰어 놓은듯하면서 단단하고 무거우며 마주쳐서 다글다글 소리가 나는 것이 좋은 것이다. 어떤 책에는 매발톱같이 생긴 것이 좋은것이라고 하였다쓸때는 去毛하고 쓴다[本草] ․酒浸炒하면 上行頭目‧口舌하고, 薑汁炒하면 辛散衝熱하는 功이 있고 生用하면 實火를 다스리고, 吳茱萸물로 炒하면 調胃‧厚腸하며, 黃土炒하면 食積‧安蛔蟲하며, 鹽水炒하면 下焦伏火를 다스린다[入門] ․生用하면 瀉心‧淸熱하고, 酒炒하면 厚腸胃하고 薑製하면 止嘔吐한다[回春] ․手少陰經으로 들어가는데 苦燥하기 때문에 入心한다. 火는 燥한데를 따라가기 때문이다. 능히 瀉心한다고 하지만 其實은 脾胃中의 濕熱을 瀉하는 것이다[湯液]"},{"id":26,"name":"黃芪","aliases":[],"category":"補益藥-補氣藥","origin":"豆科 黃芪의 뿌리","initial":"기타","sortName":"黃芪","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","肺 脾","(生用) 益衛固表<br>利水消腫<br>托毒生肌<br>(炙用) 補中益氣","(生用)-면역기능을 항진시키는데는 生用이 好<br>自汗, 盜汗, 血痺<br>浮腫<br>癰疽不潰, 潰久不斂<br>(炙用)內傷勞倦,脾虛泄瀉,脫肛,氣虛血脫, 崩漏, 一切氣衰血虛之證",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["豆科 黃芪의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","肺 脾","(生用) 益衛固表<br>利水消腫<br>托毒生肌<br>(炙用) 補中益氣","(生用)-면역기능을 항진시키는데는 生用이 好<br>自汗, 盜汗, 血痺<br>浮腫<br>癰疽不潰, 潰久不斂<br>(炙用)內傷勞倦,脾虛泄瀉,脫肛,氣虛血脫, 崩漏, 一切氣衰血虛之證",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-效能이 溫補에 偏하여 助火斂肺하기 쉬우므로 外에 表邪가 있는 者, 內에 積滯가 있고(뚫는 성질은 떨어지므로) 氣滯濕阻, 熱毒瘡瘍 및 陰虛證(補津液하는 것 보다는 補氣하는 성질이 크므로)에는 適用함이 모두 마땅하지 않다.","․生黃芪는 表에 走하는 作用이 偏勝 → 固表止汗하고 托毒生肌(癌治療 目的에도 生用)","․炙黃芪는 裏에 走한는 作用이 偏勝 → 補氣升陽하고 利水消腫(治浮腫)","-黃芪 人蔘 黨參은 모두 補氣하는데","․人蔘은 補氣作用이 가장 强하고, 또한 능히 生津과 安神시키는 效能이 있으며","․黨參은 甘平性緩하여 오로지 脾肺를 補하여 益氣하고","․黃芪는 補氣作用은 人蔘보다 떨어지나 補氣升陽시키고 固表托毒 및 利水消腫의 作用이 우수(人蔘과 黨參보다)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-蓋黃芪 根長數尺 深入土中 吸引土下黃泉之水 以上生其苗葉 氣卽水也. 引水卽是引氣 根中虛鬆竅大者 所引水氣極多 故氣盛而補氣","-芪之鬆竅 象人身油膜中 亦有通水之鬆竅 油膜者 三焦也 故謂黃芪爲三焦油膜中藥 其能拓裏達表 皆取黃芪從油膜中 而上行外通之義也","-芪之肉理 色黃味甘 土之色味也 黃芪入土最深 又得土氣之厚 所以黃芪 又大補脾(p19)","-黃芪中空屬氣分 是得土中水氣 甘草中實 純得土氣之厚 故深長且實也(p37)","-黃芪內虛鬆通達 象人膜網 能引土下黃泉之水氣 以上貫苗葉 象人元氣 由腎達肺以至 故黃芪能升達元氣 托裏達(p90)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-强壯補身 : 燥熱하지 않아 장기간 복용해도 有益無害","․승제작용 : 胃하수, 腎하수, 子宮하수, 脫肛 등을 치료, 出血證에 지혈약에 황기를 가미.","․經絡을 溫通하여 痲痺나 만성 류머티스성關節痛에 적용","-固表止汗 : 體虛에서 오는 多汗‧盜汗을 치료","-利尿消腫 : 현저한 尿量증가 및 나트륨배설작용이 有.","-托毒生肌 : 潰破前이면 强壯內托作用으로 濃을 배출하고, 상처의 癒合을 촉진"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二 味甘氣平이나 氣味俱輕하야 升多降少하며 陽中微陰이라 生者는 微凉하야 可治癰疽며 蜜炙면 性溫하야 能補虛損이라. 因其味輕 故로 專於氣分而達表라 所以로 能補元陽, 充腠理, 治勞傷, 長肌肉하야 氣虛而難汗者엔 可發하며 表疏而多汗者엔 可止라","其所以止血崩血淋者는 以氣固而血自止也니 故로 曰血脫에 益氣라하며","其所以除瀉痢帶濁者는 以氣固而陷自除也니 故로 曰陷者에 擧之라 하니라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-단너삼이라고 하며 虛損證으로 몹시 여윈 데 쓴다. 氣를 돕고 살찌게 하며 추웠다 열이 나는 것을 멎게 하고 腎이 약해서 귀가 먹은 것을 치료하며 癰疽를 없애고 오래된 헌데에서 고름을 빨아내며 아픈 것을 멎게 한다. 또한 어린이의 온갖 병과 붕루와 대하 등 여러 가지 부인병을 치료한다.","-벌판과 들에서 자라는데 어느 곳에나 다 있다. 음력 2월, 10월에 뿌리를 캐어 그늘에서 말린다[본초]","-氣가 虛하여 나는 盜汗과 自汗을 멎게 하는데 이것은 피부표면에 작용하는 약이다. 또 각혈을 멈추고 비위를 편안하게 한다는 것은 비위의 약[中州之藥]이라는 rtName":"桂枝","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["<u>溫 辛甘<\/u>","心 肺 膀胱","發汗解肌<br>溫經通脈<br>助陽化氣","風寒表證, 肩背肢節酸痛<br>脘腹冷痛, 血寒經閉<br>胸痺痰飮, 水腫, 心悸, 奔豚",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風寒藥"]}],["sec",{"key":"origin","label":"기원","lines":["녹나무과 육계의 어린 가지"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["<u>溫 辛甘<\/u>","心 肺 膀胱","發汗解肌<br>溫經通脈<br>助陽化氣","風寒表證, 肩背肢節酸痛<br>脘腹冷痛, 血寒經閉<br>胸痺痰飮, 水腫, 心悸, 奔豚",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-發汗作用은 麻黃에 비하여 緩和하므로 風寒表證의 無汗/有汗을 莫論하고 適用가능, 특히 體虛感冒로 上肢肩臂가 疼痛한 證 등에 適合","-無汗에는 發汗시키고 有汗에는 止汗시킨다는 說은 配伍된 藥物의 效果이며, 실제로 桂枝는 辛溫發散시키는 藥으로 止汗作用은 없다","-陰虛盜汗에 桂枝를 誤用하면 火邪가 甚해져 盜汗이 더욱 甚하게 되어 亡陽證을 일으킬수 있다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-遠志之性亦同桂枝 但桂枝四達 遠志則係根體又極細 但主內入心經 以散心中滯血而已(p31)","-桂枝能散四肢, 色味同於蘇枝, 而桂枝較堅實, 故桂枝兼能走筋骨, 蘇枝則但能走肌肉耳","-桂枝與麻黃, 同一升散之品, 然氣味各有不同, 枝性四展, 氣亦輕揚, 因桂兼有辛味, 則得地之味矣, 故兼入血分, 能散血脈肌肉中之風寒, 觀仲景麻黃湯, 發皮毛, 桂枝湯, 解肌肉, 便知血分氣分之辨(p68)","-桂枝色赤 味辛散 入血分 故主之 枝又四達 故主四肢(p148)","-寒在膀胱,水停不化, 名曰蓄水, 用笭澤以利之, 而尤必用桂枝以宣水中之陽, 五笭散是也(p153)","-寒水凌心 必用桂枝 遠志 公丁香 以宣心陽(p154)","-火不蒸水, 而津液不升, 如五笭散之有口渴證, 宜用桂枝; 理中湯之有口渴症, 宜用乾薑. 腎氣丸之治下消證, 宜用桂附. 大便寒結者, 用當歸之溫潤, 用巴豆之辛溫, 皆是治火不蒸水之燥(p172)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-계피 알데히드는 汗腺의 분비를 자극하여 皮膚血管을 擴張시켜 發汗解熱의 효과가 있으며 唾液과 胃液의 분비를 촉진 소화를 돕는 健胃작용이 있으며 强心작용이 있다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-지(枝)라는 것은 가는 가지(枝條)이고 굵은 줄기(身幹)가 아니다. 대체로 가지에 붙은 껍질의 기운을 이용하는 것인데 이것은 가벼워 뜨는 성질이 있어 발산(發散)하는 작용이 있기 때문이다. 『내경』에 맵고 단것은 발산하므로 양에 속한다고 하였는데 이것과 뜻이 맞는다.","-족태양경에 들어가며 혈분의 한사[血分寒邪]를 헤친다[본초]","-表가 虛하여 절로 나는 땀은 계지로 사기를 발산시켜야 한다. 그리하여 위기가 고르게 되면 표가 치밀해지므로[密] 땀이 저절로 멎게 된다. 계지가 땀을 거두는 것은 아니다[단심]","-계지는 냄새와 맛이 다 경(輕)하기 때문에 올라가며 겉으로 발산시키는 작용을 한다[단심]","-중경은 계지로 發表시키고 육계로 腎을 補하였는데 위[上]로 뜨는 것은 윗부분에 작용하고 아래에 가라앉는 것은 아랫부분에 작용한다는 자연적인 이치에 의거한 것이다[탕액]","-유계(柳桂)는 작은 가지의 만만한 순(嫩條)이다. 상초에 가서 양기를 잘 보한다. 박계(薄桂)는 가늘고 엷은 햇가지인데 상초에 들어가서 어깨와 팔로 잘 간다[입문]","-계심(桂心), 균계(菌桂), 모계(牡桂)는 다 한 식물이다. 냄새와 맛이 센 것은 반드시 어린것이고 약한 것은 반드시 늙은 것이다. 어린것은 맵고[辛] 향기로우면서 겸하여 둥글게 말린다. 늙은 것은 반드시 맛이 슴슴하고[淡] 자연히 널판처럼 얇게 퍼진다. 얇게 퍼진 것은 모계이고 둥글게 말린 것은 균계이다. 굵게 말린 것은 5장과 하초에 생긴 병에 약으로 쓰는 것이 좋고 가볍고 엷은 것은 머리와 눈에 생긴 병을 치료하는 발산약(發散藥)으로 쓰는 것이 좋다. 또 유계라는 것은 계수나무의 어리고 작은 가지인데 상초에 생긴 병을 치료하는 약으로 쓰는 것이 좋다[본초]","-계심(桂心)은 9가지 가슴앓이를 낫게 하며 3충을 죽인다. 어혈을 헤치고 뱃속이 차고 아픈 것을 멈추며 모든 풍기를 없앤다. 5로 7상(五勞七傷)을 보하고 9규(竅)를 잘 통하게 하며 뼈마디를 잘 놀릴 수 있게 한다. 정(精)을 돕고 눈을 밝게 하며 허리와 무릎을 덥게 하고 풍비(風痺)를 없앤다. 또한 현벽, 징가, 어혈을 삭이고 힘줄과 뼈를 이어 주며 살을 살아나게 하고 태반이 나오게 한다. 이것은 비늘처럼 된 겉껍질을 긁어 버린 다음 그 밑층에 있는 매운 맛을 가진 부분이다. 계피 600g에서 계심 200g을 얻는 것이 기준이다[본초]"]}]],"searchText":"桂枝 분류 解表藥-發散風寒藥 기원 녹나무과 육계의 어린 가지 性味 歸經 效能 主治 備考 <u>溫 辛甘<\/u> 心 肺 膀胱 發汗解肌<br>溫經通脈<br>助陽化氣 風寒表證, 肩背肢節酸痛<br>脘腹冷痛, 血寒經閉<br>胸痺痰飮, 水腫, 心悸, 奔豚  약물특징/비교 -發汗作用은 麻黃에 비하여 緩和하므로 風寒表證의 無汗/有汗을 莫論하고 適用가능, 특히 體虛感冒로 上肢肩臂가 疼痛한 證 등에 適合 -無汗에는 發汗시키고 有汗에는 止汗시킨다는 說은 配伍된 藥物의 效果이며, 실제로 桂枝는 辛溫發散시키는 藥으로 止汗作用은 없다 -陰虛盜汗에 桂枝를 誤用하면 火邪가 甚해져 盜汗이 더욱 甚하게 되어 亡陽證을 일으킬수 있다. 본초문답 -遠志之性亦同桂枝 但桂枝四達 遠志則係根體又極細 但主內入心經 以散心中滯血而已(p31) -桂枝能散四肢, 色味同於蘇枝, 而桂枝較堅實, 故桂枝兼能走筋骨, 蘇枝則但能走肌肉耳 -桂枝與麻黃, 同一升散之品, 然氣味各有不同, 枝性四展, 氣亦輕揚, 因桂兼有辛味, 則得地之味矣, 故兼入血分, 能散血脈肌肉中之風寒, 觀仲景麻黃湯, 發皮毛, 桂枝湯, 解肌肉, 便知血分氣分之辨(p68) -桂枝色赤 味辛散 入血分 故主之 枝又四達 故主四肢(p148) -寒在膀胱,水停不化, 名曰蓄水, 用笭澤以利之, 而尤必用桂枝以宣水中之陽, 五笭散是也(p153) -寒水凌心 必用桂枝 遠志 公丁香 以宣心陽(p154) -火不蒸水, 而津液不升, 如五笭散之有口渴證, 宜用桂枝; 理中湯之有口渴症, 宜用乾薑. 腎氣丸之治下消證, 宜用桂附. 大便寒結者, 用當歸之溫潤, 用巴豆之辛溫, 皆是治火不蒸水之燥(p172) 진존인본초 -계피 알데히드는 汗腺의 분비를 자극하여 皮膚血管을 擴張시켜 發汗解熱의 효과가 있으며 唾液과 胃液의 분비를 촉진 소화를 돕는 健胃작용이 있으며 强心작용이 있다. 동의보감 -지(枝)라는 것은 가는 가지(枝條)이고 굵은 줄기(身幹)가 아니다. 대체로 가지에 붙은 껍질의 기운을 이용하는 것인데 이것은 가벼워 뜨는 성질이 있어 발산(發散)하는 작용이 있기 때문이다. 『내경』에 맵고 단것은 발산하므로 양에 속한다고 하였는데 이것과 뜻이 맞는다. -족태양경에 들어가며 혈분의 한사[血分寒邪]를 헤친다[본초] -表가 虛하여 절로 나는 땀은 계지로 사기를 발산시켜야 한다. 그리하여 위기가 고르게 되면 표가 치밀해지므로[密] 땀이 저절로 멎게 된다. 계지가 땀을 거두는 것은 아니다[단심] -계지는 냄새와 맛이 다 경(輕)하기 때문에 올라가며 겉으로 발산시키는 작용을 한다[단심] -중경은 계지로 發表시키고 육계로 腎을 補하였는데 위[上]로 뜨는 것은 윗부분에 작용하고 아래에 가라앉는 것은 아랫부분에 작용한다는 자연적인 이치에 의거한 것이다[탕액] -유계(柳桂)는 작은 가지의 만만한 순(嫩條)이다. 상초에 가서 양기를 잘 보한다. 박계(薄桂)는 가늘고 엷은 햇가지인데 상초에 들어가서 어깨와 팔로 잘 간다[입문] -계심(桂心), 균계(菌桂), 모계(牡桂)는 다 한 식물이다. 냄새와 맛이 센 것은 반 濁, 瀉痢.","赤茯苓"],["甘淡 平","心 脾","寧心安神<br>利水","心虛驚悸, 健忘, 失眠, 驚癎<br>小便不利","白茯神"],["甘淡 平","心 脾 腎","利水消腫","水腫膚脹","茯苓皮"]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":[]}],["sub","茯苓"],["para","-脾虛로 水濕이 內停되어 나타나는 證에 모두 應用하며, 특히 脾虛濕勝의 證에 더욱 적당"],["para","-臨床에서 廣範圍하게 사용하는데,"],["para","⊕補氣藥인 人蔘과 白朮 등을 配伍하면 健脾하고"],["para","⊕利水藥인 猪苓 澤瀉 등을 配伍하면 滲濕作用이 있다."],["para","-또한 茯苓의 安神作用은 그 機轉이 健脾시키는데 있으며, 脾는 後天의 根本이 되고 生氣化血의 根源이 되기 때문에 脾虛하게 되면 生化가 不足하게 되어 心神을 養營함을 잃게 되어 驚悸不眠의 病證을 일으키게 된다. 그러나 습관상 寧心安神에는 茯苓을 多用하고 있다."],["sub","茯神"],["para","-心 脾二經에 들어가 寧心, 安神利水의 效能이 있어 心虛로 인한 驚悸健忘과 不眠驚癎을 治療하며 開心益智하여 精神을 養하는데 應用한다."],["sub","茯苓皮"],["para","-行水하되 耗氣하지 않아 大腹皮보다 效能이 優秀하다."],["para","-비교"],["para","․白茯苓은 健脾에 偏重하고,"],["para","․赤茯苓은 利濕하며,"],["para","․茯神은 安神시키는데 效能이 偏重"],["sec",{"key":"qna","label":"본초문답","lines":["-茯笭乃松之精汁, 流注於根而生, 是天之陽, 以下返其宅者也. 下有茯笭, 其松顫上, 有茯笭苗, 名威喜芝. 笭在土中, 氣自能上應於苗, 得松之精則有木性, 能疏土也; 凝土之質, 味淡色白, 功主滲利, 能行水也; 其氣不相連接, 自上應於苗, 故能化氣上行而益氣(p26)","-苡仁‧澤瀉‧車前子‧茯笭, 皆味淡氣薄, 皆屬陽中之陰, 不能行在上之淸竅, 故皆行在下之淸竅, 而能利小便(p84)","-茯笭‧扁豆‧苡仁, 其味皆淡, 是爲利濕正藥. 濕甚則土困, 故利濕則能健脾(p160)","-人蔘黃芪之補氣, 而茯笭亦化氣(p205)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-利尿滲濕, 補腎安神","․비뇨계통의 炎症으로 乏尿‧頻尿‧血尿‧排尿痛‧尿液혼탁‧蛋白尿등에 적용→염증제거, 尿量증가, 排尿능력강화효과(五苓散)","․만성腎炎後期 腹水‧浮腫‧乏尿등 腎기능쇠약에 利尿작용","․우수한 滋養보급작용(慢性쇠약성질환 및 병후체질 허약에)","․중년이후 여성의 대사기능 실조‧영양실조에 의한 下肢浮腫치료","․茯神은 動悸, 驚厥, 불면증, 건망증을 치료","-健脾補氣 : 위장기능 약화로 소화불량 및 식후복창, 빈번한 설사 등에 적용","-과학문헌 : 동물실험에서 Na, K, cl 등 전해질 배출촉진 및 요세관 재흡수 억제"]}],["sec",{"key":"gyeong","label":"경악전서","lines":[]}],["sub","茯苓"],["para","百八七 味甘淡하고 氣平이나 性降而滲하니 陽中陰也라"],["para","利竅則開心益智하고 導濁生津하며 去濕則逐水燥脾하고 補中健胃하며 祛驚癎, 厚腸臟하며 治痰之本하며 助藥之降이라"],["para","<u>以其味有微甘 故로 曰補陽이나 但補少利多라 故로 多服이면 最能損目하니 久弱이면 極不相宜라 若以人乳拌晒면 乳粉旣多하니 補陰도 亦妙라<\/u>"],["sub","茯神"],["para","百八八 附根而生近 故로 能入心經하야 通心氣, 補健忘, 止恍惚驚悸라"],["sec",{"key":"dong","label":"동의보감","lines":["-복령(솔풍령)은 입맛을 돋구고 구역을 멈추며 마음과 정신을 안정하게 한다. 폐위로 담이 막힌 것을 낫게 하며 腎에 있는 사기를 몰아내며 오줌을 잘 나가게 한다. 水腫과 淋病으로 오줌이 막힌 것을 잘 나가게 하며 소갈을 멈추고 건망증[健忘]을 낫게 한다.","-『선경(仙經)』에서는 음식 대신 먹어도 좋다고 하였다. 이 약은 정신을 맑게 하고 혼백을 안정시키며 9규를 잘 통하게 하며 살을 찌게 하고 대소장을 좋게 하며 가슴을 시원하게 한다. 또 영기(榮氣)를 고르게 하고 위(胃)를 좋게 하므로[理] 제일 좋은 약이며 곡식을 안 먹어도 배고프지 않다고 하였다.","-산 속의 곳곳에 있다. 송진이 땅에 들어가 천년 지나서 솔풍령이 된다. 소나무뿌리를 싸고 있으면서 가볍고 퍼석퍼석한 것은 복신(茯神)이다. 음력 2월과 8월에 캐서 다 그늘에서 말린다. 크기가 3-4되가 되며 껍질은 검고 가는 주름이 있으며 속은 굳고 희며 생김새가 새, 짐승, 거북, 자라 같은 것이 좋다[본초]","-흰 것, 벌건 것 등 두 종류가 있는데 흰 것은 수태음경, 족태양경, 족소양경에 들어가고 벌건 것은 족태음경, 수태양경, 소음경에 들어간다. 또한 빛이 흰 것은 신수[壬癸]로 들어가고 빛이 벌건 것은 심화[丙丁]경에 들어간다[탕액]","-빛이 흰 것은 보하고 빛이 벌건 것은 사한다[본초]","-쓸 때에 껍질을 벗기고 가루내서 수비(水飛)하여 물 위에 뜨는 잡질을 버리고 햇볕에 말려 쓴다. 이렇게 해서 써야 눈이 상하지 않는다. 음이 허한 사람은 쓰지 말아야 한다[입문]","-복신(茯神)은 풍현(風眩)과 풍허증을 치료하고 경계증과 건망증을 낫게 하며 가슴을 시원하게 하고 머리를 좋게 하며 혼백을 편안히 하고 정신을 안정시키며 마음을 진정시킨다. 주로 경간(驚癎)을 낫게 한다.","-솔풍령은 찍은 지 여러 해 된 소나무뿌리의 기운으로 생겨 나는 것인데 대체로 그 기운이 몰려 있으면서 없어지지 않기 때문에 되는 것이다. 그 진이 차고 넘쳐 뿌리 밖으로 새어나가 뭉친 것이 솔풍령으로 된다. 진이 있기는 해도 그다지 차고 넘치지 못하면 다만 나무뿌리에 맺혀 있기만 하기 때문에 이것을 복신이라 한다[본초]","-소나무는 찍으면 다시 싹이 못 나오나 그 뿌리는 죽지 않고 진이 아래로 흘러내리게 되기 때문에 솔풍령과 복신이 생긴다. 그러므로 솔풍령과 복신을 써서 심(心)과 신(神)의 기능을 좋게 하고 진액을 잘 통하게 한다[입문]"]}]],"searchText":"茯苓 茯神 茯苓皮 분류 利水滲濕藥-利水退腫藥 기원 多孔菌科(구멍쟁이버섯과) 진균인 복령의 균핵. 內部의 水分을 散失시킨 다음 陰乾한 것을 “茯苓個”라 하고 鮮茯苓을 去皮한 다음 切片한 것을 “茯苓片”이라 하며, 方形이나 長方形으로 切片한 것을 “茯苓塊”라 하고, 가운데 松根이 있는 것을 “茯神”, 皮部를 “茯苓皮”, 內部가 淡紅色인 것을 “赤茯苓\", 赤茯苓을 切片한 다음 白色 부분만을 ”白茯苓“이라 한다. 性味 歸經 效能 主治 備考 甘淡 平 心 脾 肺 利水滲濕<br>健脾寧心 水腫尿少,痰飮眩悸,<br>脾虛食少,便溏泄瀉,心神不安,驚悸失眠 白茯苓 甘淡 平 心 脾 膀胱 行水<br>利濕熱 小便不利<br>淋濁, 瀉痢. 赤茯苓 甘淡 平 心 脾 寧心安神<br>利水 心虛驚悸, 健忘, 失眠, 驚癎<br>小便不利 白茯神 甘淡 平 心 脾 腎 利水消腫 水腫膚脹 茯苓皮 약물특징/비교 茯苓 -脾虛로 水濕이 內停되어 나타나는 證에 모두 應用하며, 특히 脾虛濕勝의 證에 더욱 적당 -臨床에서 廣範圍하게 사용하는데, ⊕補氣藥인 人蔘과 白朮 등을 配伍하면 健脾하고 ⊕利水藥인 猪苓 澤瀉 등을 配伍하면 滲濕作用이 있다. -또한 茯苓의 安神作用은 그 機轉이 健脾시키는데 있으며, 脾는 後天의 根本이 되고 生氣化血의 根源이 되기 때문에 脾虛하게 되면 生化가 不足하게 되어 心神을 養營함을 잃게 되어 驚悸不眠의 病證을 일으키게 된다. 그러나 습관상 寧心安神에는 茯苓을 多用하고 있다. 茯神 -心 脾二經에 들어가 寧心, 安神利水의 效能이 있어 心虛로 인한 驚悸健忘과 不眠驚癎을 治療하며 開心益智하여 精神을 養하는데 應用한다. 茯苓皮 -行水하되 耗氣하지 않아 大腹皮보다 效能이 優秀하다. -비교 ․白茯苓은 健脾에 偏重하고, ․赤茯苓은 利濕하며, ․茯神은 安神시키는데 效能이 偏重 본초문답 -茯笭乃松之精汁, 流注於根而生, 是天之陽, 以下返其宅者也. 下有茯笭, 其松顫上, 有茯笭苗, 名威喜芝. 笭在土中, 氣自能上應於苗, 得松之精則有木性, 能疏土也; 凝土之質, 味淡色白, 功主滲利, 能行水也;  자지 못하는 증, 배꼽의 위아래[上下]가 아픈 것, 피가 섞인 설사, 식은땀 등을 낫게 한다. 또한 肝氣를 보하며 힘줄과 뼈를 든든하게 하고 몸을 살찌게 하고 든든하게 한다. 또 힘줄과 뼈의 풍증을 낫게 한다. -산에서 자란다. 생김새는 대추나무 같은데 그렇게 크지는 못하다. 열매는 아주 작다. 음력 8월에 열매를 따서 씨를 빼서 쓴다[본초] -혈(血)이 비(脾)에 잘 돌아오지 못하여 잠을 편안히 자지 못할 때에는 이것을 써서 심과 비를 크게 보하는 것이 좋다. 그러면 혈이 비에 잘 돌아오게 되고 5장이 편안해져서 잠도 잘 잘 수 있게 된다. 쓸 때에는 씀 깨뜨려 알맹이를 쓴다. 잠이 많으면 생것대로 쓰고 잠이 안 오면 닦아 익힌[炒熱] 다음 다시 한나절 가량 쪄서 꺼풀과 끝을 버리고 갈아서 쓴다6)[입문] (주: 6) 이시진은 “胸膈煩燥多面 或不得眠者가 산조인을 먹고 정상으로 회복되었다” 眠‧不眠은 生‧熟과 무관한듯.)"},{"id":38,"name":"黃柏","aliases":[],"category":"淸熱藥-淸熱燥濕藥","origin":"芸香科 황벽나무(關黃柏)와 黃皮樹(川黃柏)의 樹皮","initial":"기타","sortName":"黃柏","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","腎 膀胱 大腸","淸熱燥濕<br>瀉火解毒<br>退虛熱<br>(鹽黃柏) 滋陰降火","濕熱瀉痢, 黃疸, 帶下, 熱淋, 脚氣<br>痿躄, 濕疹瘙痒, 盜汗, 遺精, 瘡瘍腫毒<br>骨蒸勞熱<br>(鹽黃柏)<br>陰虛火旺, 盜汗骨蒸",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱燥濕藥"]}],["sec",{"key":"origin","label":"기원","lines":["芸香科 황벽나무(關黃柏)와 黃皮樹(川黃柏)의 樹皮"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","腎 膀胱 大腸","淸熱燥濕<br>瀉火解毒<br>退虛熱<br>(鹽黃柏) 滋陰降火","濕熱瀉痢, 黃疸, 帶下, 熱淋, 脚氣<br>痿躄, 濕疹瘙痒, 盜汗, 遺精, 瘡瘍腫毒<br>骨蒸勞熱<br>(鹽黃柏)<br>陰虛火旺, 盜汗骨蒸",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-수치에 따라","․生用하면 眸火시키는 作用이 크고, 鹽水炒하면 腎經에 들어가 瀉火시키는 效能이 增加","-黃芩 黃連 黃柏은 같은 苦寒한 瀉火燥濕의 要藥으로 濕熱이나 熱毒火盛으로 인한 病證에 應用하는데 臨床에서는 다른 藥物들과 配伍하므로써 治療效果가 增强된다.","-白頭翁湯에 黃連과 黃柏을 同用 熱毒赤痢를 治療하는데 表裏三焦의 熱盛을 治療하는 三黃石膏湯과 火熱亢盛을 治療하는 黃連解毒湯에 三黃을 同用","․上焦 : 黃芩은 肺火를 瀉하고 安胎시키는 效能(肺熱咳嗽와 痰黃粘稠 및 胎熱不安한 證)","․中焦 : 黃連은 心과 胃經의 火를 瀉하고 止嘔시키는 效能(心煩不眠과 痞滿嘔逆 등 證에 多用)","․下焦 : 黃柏은 腎火를 瀉하는데 主(陰虛陽亢과 濕熱이 下注하여 된 病證에 多用)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-病有內熱外寒, 下熱上寒, 又當用何也? 此以在下在內之熱爲主, 用黃芩‧黃連‧知母‧黃柏, 而兼生薑‧桂枝‧薄荷‧荊芥‧蔥白, 以引之使上(p156)","-凡脚氣, 寒澁者多, 宜以溫藥爲主, 再加木瓜‧薏苡仁‧牛膝爲引導, 所以利脚下之濕也. 然而脚氣, 亦有係熱濕者, 宜防己‧黃柏‧蒼朮‧木通‧膽草等, 苦降之品治之(p163)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-淸熱利濕 : 黃柏에 함유된 베르베린의 抗菌작용은 黃連보다 廣域이나 작용은 弱하다.","․체외실험에서 황색포도구균‧폐염구균‧연쇄상구균‧디프테리아균‧赤痢菌‧대장균‧티푸스균‧콜레라균‧결핵균 및 병원성피부진균 등에 억제작용이 있고","․炎症局部의 혈관을 수축시켜 充血이나 滲出을 감소시키고, 血小板을 파열로부터 보호"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百七五 味苦微辛, 氣寒하며 陰中微陽이나 降也니 善降三焦之火라","制各以類나 但其性多沈하야 尤專肝腎이라 故로 曰足少陰本經이며 足太陽, 厥陰之引經也라","淸胃火嘔噦蛔蟲, 除伏火骨蒸煩熱, 去腸風熱痢下血, 逐 二便邪火結淋하며 上可解熱渴口瘡, 喉痺癰瘍하며 下可去足膝濕熱, 疼痛痿蹶하니 此는 其性寒潤降하야 去火最速이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["<u>-오장과 장위 속에 몰린 열과 황달, 腸痔7)등을 주로 없앤다. 설사와 이질, 적백대하, 음식창을 낫게 하고 감충을 죽이며 옴과 버짐, 눈에 열이 있어 피지고 아픈 것, 입 안이 헌것 등을 낫게 하며 骨蒸勞熱을 없앤다.<\/u> (주: 7) 장치(腸痔) : 치질의 한 가지.)","-산의 곳곳에서 난다. 음력 5월과 6월에 껍질을 벗겨 겉껍질을 긁어 버리고 햇볕에 말린다[본초]","-민간에서 황경피나무껍질(黃栢)이라고 한다. 노란 빛이 선명하고 껍질이 두터운 것이 좋다. 족소음과 수궐음의 本經藥이며 족태양의 引經藥이다. 또한 膀胱의 火를 사하고 腎[龍]의 火도 瀉한다.","-火를 瀉하고 陰을 補하는 효능이 있다[단심]","-구리칼로 겉껍질을 긁어 버리고 꿀물에 한나절 담갔다가 꺼낸 다음 구워 말려 쓴다. 또한 약 기운을 아래로 내려가게 하려면 소금을 푼 술에 축여 볶아서 쓰고 화가 성한 때에는 동변에 담갔다가 쪄서 쓴다[입문]","-구리칼로 썰어 꿀물, 술, 젖, 동변 등에 축여 볶아 쓰고 혹 생것대로도 쓴다. 음이 허한 것을 잘 낫게 한다[회춘]","-황벽근(黃蘗根, 황경피나무뿌리)은 이름을 단환(檀桓)이라 한다. 명치 밑에 생긴 모든 병을 낫게 한다. 오래 먹으면 몸이 가벼워지고 오래 살 수 있게 한다[본초]"]}]],"searchText":"黃柏 분류 淸熱藥-淸熱燥濕藥 기원 芸香科 황벽나무(關黃柏)와 黃皮樹(川黃柏)의 樹皮 性味 歸經 效能 主治 備考 苦 寒 腎 膀胱 大腸 淸熱燥濕<br>瀉火解毒<br>退虛熱<br>(鹽黃柏) 滋陰降火 濕熱瀉痢, 黃疸, 帶下, 熱淋, 脚氣<br>痿躄, 濕疹瘙痒, 盜汗, 遺精, 瘡瘍腫毒<br>骨蒸勞熱<br>(鹽黃柏)<br>陰虛火旺, 盜汗骨蒸  약물특징/비교 -수치에 따라 ․生用하면 眸火시키는 作用이 크고, 鹽水炒하면 腎經에 들어가 瀉火시키는 效能이 增加 -黃芩 黃連 黃柏은 같은 苦寒한 瀉火燥濕의 要藥으로 濕熱이나 熱毒火盛으로 인한 病證에 應用하는데 臨床에서는 다른 藥物들과 配伍하므로써 治療效果가 增强된다. -白頭翁湯에 黃連과 黃柏을 同用 熱毒赤痢를 治療하는데 表裏三焦의 熱盛을 治療하는 三黃石膏湯과 火熱亢盛을 治療하는 黃連解毒湯에 三黃을 同用 ․上焦 : 黃芩은 肺火를 瀉하고 安胎시키는 效能(肺熱咳嗽와 痰黃粘稠 및 胎熱不安한 證) ․中焦 : 黃連은 心과 胃經의 火를 瀉하고 止嘔시키는 效能(心煩不眠과 痞滿嘔逆 등 證에 多用) ․下焦 : 黃柏은 腎火를 瀉하는데 主(陰虛陽亢과 濕熱이 下注하여 된 病證에 多用) 본초문답 -病有內熱外寒, 下熱上寒, 又當用何也? 此以在下在內之熱爲主, 用黃芩‧黃連‧知母‧黃柏, 而兼生薑‧桂枝‧薄荷‧荊芥‧蔥白, 以引之使上(p156) -凡脚氣, 寒澁者多, 宜以溫藥爲主, 再加木瓜‧薏苡仁‧牛膝爲引導, 所以利脚下之濕也. 然而脚氣, 亦有係熱濕者, 宜防己‧黃柏‧蒼朮‧木通‧膽草等, 苦降之品治之(p163) 진존인본초 -淸熱利濕 : 黃柏에 함유된 베르베린의 抗菌작용은 黃連보다 廣域이나 작용은 弱하다. ․체외실험에서 황색포도구균‧폐염구균‧연쇄상구균‧디프테리아균‧赤痢菌‧대장균‧티푸스균‧콜레라균‧결핵균 및 병원성피부진균 등에 억제작용이 있고 ․炎症局部의 혈관을 수축시켜 充血이나 滲出을 감소시키고, 血小板을 파열로부터 보호 경악전서 百七五 味苦微辛, 氣寒하며 陰中微陽이나 降也니 善降三焦之火라 制各以類나 但其性多沈하야 尤專肝腎이라 故로 曰足少陰本經이며 足太陽, 厥陰之引經也라 淸胃火嘔噦蛔蟲, 除伏火骨蒸煩熱, 去腸風熱痢下血, 逐 二便邪火結淋하며 上可解熱渴口瘡, 喉痺癰瘍하며 下可去足膝濕熱, 疼痛痿蹶하니 此는 其性寒潤降하야 去火最速이라 동의보감 <u>-오장과 장위 속에 몰린 열과 황달, 腸痔7)등을 주로 없앤다. 설사와 이질, 적백대하, 음식창을 낫게 하고 감충을 죽이며 옴과 버짐, 눈에 열이 있어 피지고 아픈 것, 입 안이 헌것 등을 낫게 하며 骨蒸勞熱을 없앤다.<\/u> (주: 7) 장치(腸痔) : 치질의 한 가지.) -산의 곳곳에서 난다. 음력 5월과 6월에 껍질을 벗겨 겉껍질을 긁어 버리고 햇볕에 말린다[본초] -민간에서 황경피나무껍질(黃栢)이라고 한다. 노란 빛이 선명하고 껍질이 두터운 것이 좋다. 족소음과 수궐음의 本經藥이며 족태양의 引經藥이다. 또한 膀胱의 火를 사하고 腎[龍]의 火도 瀉한다. -火를 瀉하고 陰을 補하는 효능이 있다[단심] -구리칼로 겉껍질을 긁어 버리고 꿀물에 한나절 담갔다가 꺼낸 다음 구워 말려 쓴다. 또한 약 기운을 아래로 내려가게 하려면 소금을 푼 술에 축여 볶아서 쓰고 화가 성한 때에는 동변에 담갔다가 쪄서 쓴다[입문] -구리칼로 썰어 꿀물, 술, 젖, 동변 등에 축여 볶아 쓰고 혹 생것대로도 쓴다. 음이 허한 것을 잘 낫게 한다[회춘] -황벽근(黃蘗根, 황경피나무뿌리)은 이름을 단환(檀桓)이라 한다. 명치 밑에 생긴 모든 병을 낫게 한다. 오래 먹으면 몸이 가벼워지고 오래 살 수 있게 한다[본초]"},{"id":39,"name":"乾漆","aliases":[],"category":"活血祛瘀藥","origin":"漆樹科(옻나무과) 낙엽교목인 옻나무의 樹脂","initial":"기타","sortName":"乾漆","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫 有小毒","肝 胃","破血祛瘀<br>通經<br>殺蟲","癥瘕, 瘀血<br>婦女經閉<br>蟲積腹痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["活血祛瘀藥"]}],["sec",{"key":"origin","label":"기원","lines":["漆樹科(옻나무과) 낙엽교목인 옻나무의 樹脂"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫 有小毒","肝 胃","破血祛瘀<br>通經<br>殺蟲","癥瘕, 瘀血<br>婦女經閉<br>蟲積腹痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-毒性이 있으므로 修治를 하여 使用하며 煎劑에 넣는 것은 마땅하지 않다"]}],["sec",{"key":"qna","label":"본초문답","lines":["-心中血液, 中含靈光, 卽神也. 神爲血亂, 則癲狂亂語, 以行氣者, 入心導之, 則遠志‧菖蒲‧麝香皆能開心竅, 而丹皮‧桃仁‧乾漆皆能去心血(p196)"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二百 味辛, 性溫, 有毒.","能療絶傷하며 續筋骨하며 殺三蟲하며 去蛔蟲하며 削年深堅結之積滯하며 破日久凝聚之瘀血하니 用須炒熟하야 入藥이면 不爾損人腸胃라 若外著其毒 而生漆瘡者는 惟杉8)木湯, 紫蘇湯, 蟹湯으로 浴之면 可解하며 或用香油調鐵銹하야 塗之라 (주: 8) 杉; 삼나무 삼)"]}],["sec",{"key":"dong","label":"동의보감","lines":["-건칠(乾漆, 마른옻)의 성질은 따뜻하고[溫] 맛이 매우며[辛] 독이 있다. 어혈을 삭이며 월경이 중단된 것, 산가증(疝 證)을 낳게 한다. 소장을 잘 통하게 하고 회충을 없애며 뜬뜬한 적을 헤치고 혈훈을 낫게 하며 3충을 죽인다. 전시노채에도 쓴다.","-그릇에 넣어 둔 옻이 절로 말라서 벌집처럼 구멍이 나고 구멍과 구멍 사이가 쇠나 돌같이 굳어진 것이 좋다. 약에 넣을 때는 반드시 부스러뜨려 연기가 날 때까지 닦아서 쓴다. 그렇지 않으면 사람의 장위(腸胃)를 상하게 한다. 본래 옻을 타는 사람은 먹지 말아야 한다[본초]","-옻을 타는 사람이면 달걀 흰자위에 개어서 약에 넣어 먹는다[정전]","-생칠(生漆, 생옻)은 회충을 죽이는데 오래 먹으면 몸이 가 ><br>潰瘍久不收口",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-煆하여 外用하느데 生肌斂瘡에 應用","-鎭驚潛陽에는 生用하고, 收斂固澁에는 煆用하여야 한다"]}],["sec",{"key":"qna","label":"본초문답","lines":["-龍乃水中之陽物, ...假石以爲質, 潛藏於土中, 秉是天水之陽, 以歸於地下, 故能潛納腎氣, 收斂心神, 皆用其潛納氣之義耳(p26)","-龍骨亦重, 能潛陽氣, 故亦能鎭心神(p115)","-氣泄而盜汗, 生地‧丹皮‧浮麥‧地骨皮‧龍骨, 以淸斂之(p207)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-주성분은 탄산칼슘‧인산칼슘 외에 철‧칼륨‧나트륨과 염소‧황산기 등의 이온을 함유, 內服하면 胃酸에 접촉, 가용성칼슘염으로 변화 혈액의 응고력을 증강시키고, 혈관벽의 치밀성을 강화 혈구 및 혈청이 혈관外에 滲出하는 것을 저지하고. 골격근의 흥분을 경감하는 작용을 함."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二七四 味甘, 平, 性收澁하며 其氣入肝腎이라","故로 能安神志, 定魂魄, 鎭驚悸, 澁腸胃, 逐邪氣하며 除夜夢鬼交, 吐血衄血, 遺精夢洩하며 收虛汗, 止瀉痢, 縮小便, 禁腸風下血尿血, 虛滑脫肛. 女子崩淋帶濁, 失血漏胎, 小兒風熱驚癎이라 亦療腸癰臟毒, 內疽陰蝕하며 斂膿斂瘡, 生肌長肉하야 澁可去脫이니 卽此屬也라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-용골(龍骨)은 정신이 좋아지게 하고 혼백을 안정시키며 5장을 편안하게 하며 사기(邪氣)를 몰아내고 심신(心神)을 진정시키며 설사, 이질, 몽설(夢泄)을 낫게 하고 일체 피흘리는 것[失血]을 멎게 하며 땀이 나지 않게 하고 오줌이 많이 나가는 것을 줄어 들게 한다[본초]","-약으로는 5가지 빛이 나는 것이 좋다. 누렇고 허연 것[黃白色]은 그 다음이고 검은 것은 제일 못한 것이다[본초]","-허여면서 비단무늬 같고 혀에 대면 착 달라 붙는 것이 좋다[본초]","-용골은 삽제(澁劑)이다. 삽제는 빠져 나가는 것을 없애고 기를 든든하게 한다[固氣][탕액]","-불에 달구어 보드랍게 가루내어[細硏] 쓰거나 술에 달여 약한 불기운에 말려서 쓴다. 아무 때나 채취한다[본초]","-용치(龍齒)는 성질이 평(平)하고(몹시 차다[大寒]고도 한다) 맛이 떫다[澁]. 마음을 진정시키고 정신을 편안하게 하는데 전간(癲癎), 경광(驚狂), 헛것에 들린 것[鬼魅]을 낫게 한다[본초]","-놀라는 것을 진정시키고 정신을 안정시킨다. 그러므로 용치는 정신이 얼떨떨한 사람에게 써야 한다[본사]"]}]],"searchText":"龍骨 분류 安神藥 기원 三趾馬, 犀類, 牛類, 象類 等의 遺骸가 地層에 埋沒되어 생긴 骨格, 牙, 齒, 角등의 化石 性味 歸經 效能 主治 備考 甘澀 微寒 心 肝 腎 鎭驚安神<br><u>斂汗固精<\/u><br><u>止血澀腸<\/u><br>生肌斂瘡 驚癎癲狂, 怔忡健忘, 失眠多夢<br><u>自汗盜汗, 遺精淋濁, 崩漏帶下<\/u><br><u>吐衄便血, 瀉痢脫肛<\/u><br>潰瘍久不收口  약물특징/비교 -煆하여 外用하느데 生肌斂瘡에 應用 -鎭驚潛陽에는 生用하고, 收斂固澁에는 煆用하여야 한다 본초문답 -龍乃水中之陽物, ...假石以爲質, 潛藏於土中, 秉是天水之陽, 以歸於地下, 故能潛納腎氣, 收斂心神, 皆用其潛納氣之義耳(p26) -龍骨亦重, 能潛陽氣, 故亦能鎭心神(p115) -氣泄而盜汗, 生地‧丹皮‧浮麥‧地骨皮‧龍骨, 以淸斂之(p207) 진존인본초 -주성분은 탄산칼슘‧인산칼슘 외에 철‧칼륨‧나트륨과 염소‧황산기 등의 이온을 함유, 內服하면 胃酸에 접촉, 가용성칼슘염으로 변화 혈액의 응고력을 증강시키고, 혈관벽의 치밀성을 강화 혈구 및 혈청이 혈관外에 滲出하는 것을 저지하고. 골격근의 흥분을 경감하는 작용을 함. 경악전서 二七四 味甘, 平, 性收澁하며 其氣入肝腎이라 故로 能安神志, 定魂魄, 鎭驚悸, 澁腸胃, 逐邪氣하며 除夜夢鬼交, 吐血衄血, 遺精夢洩하며 收虛
