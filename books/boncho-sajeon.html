고 陽中有陰이라 製는 用蛤粉炒珠하며 入肺肝腎三經이라. 其氣溫 故로 能扶勞傷, 益中氣하며 其性降 故로 能化痰淸肺하야 治肺癰肺痿, 欬唾膿血, 止嗽定喘하며","其性養血 故로 能止吐血衄血, 便血尿血, 腸風下痢, 及婦人崩中帶濁血淋, 經脈不調하며 其味甘緩 故로 能安胎固漏, 養血滋腎, 實腠理, 止虛汗, 托補癰疽腫毒이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-아교(阿膠)는 허로로 여위는 것[虛勞羸瘦], 허리나 배가 아픈 것[腰腹痛], 팔다리가 시글고 아픈 것과 풍증을 치료하는데 허(虛)한 것을 보(補)하고 간기(肝氣)를 돕는다. 그리고 설사, 이질, 기침을 멈추고 여자가 하혈(下血)하는 것을 낫게 하며 안태(安胎)시킨다[본초]","-이것은 소가죽을 고아서 만든 것이다. 나귀가죽으로 만든 갖풀(아교)이 풍증에 제일 좋다. 동아(東阿) 지방에서 만든다고 하여 아교라고 하였다[본초]","-아현성(阿縣城) 북쪽에 있는 우물물로 만든 것이 진짜이다. 아수(阿水)란 제수를 말하는데 이 물은 맑고 아래로 내려가는 성질이 있기 때문에 걸쭉한 가래[濁痰]가 치밀어 오르는 것을 치료한다. 이 약 기운은 수족소음, 족궐음경으로 들어간다. 오랜 기침과 오랜 이질에 다 좋다[입문]","-진짜 나귀가죽으로 만든 갖풀(아교)은 얻기가 힘들기 때문에 차라리 노랗고 투명한 소가죽아교(牛皮膠)을 쓰는 것이 좋은데 진주조개가루(蜂粉)와 함께 닦아서 써야 한다[입문]"]}]],"searchText":"阿膠 분류 補益藥-補血藥 기원 馬科(말과)동물인 당나귀의 皮膚를 煎煮하여 濃縮한 固體狀 膠質 性味 歸經 效能 主治 備考 甘 平 肺 肝 腎 補血滋陰<br>潤燥<br><u>止血<\/u> 血虛萎黃, 眩暈心悸, 肌痿無力, 心煩不眠<br>虛風內動, 肺燥咳嗽<br><u>勞嗽咯血, 吐血尿血, 便血崩漏, 姙娠胎漏<\/u>  약물특징/비교 -脾胃가 虛弱하여 消化가 不良하거나 表證이 있는 경우에는 應用할 수 없다. -止血作用을 增强하려면 蒲黃炒하고, 淸肺作用을 增强게 하려면 蛤粉炒하여 사용한다. 본초문답 -乾脚氣, 是風熱, 宜阿膠‧龜板‧地黃, 益陰氣, 使陽不動, 以還其厥陰之本體. 玉竹有潤熄風, 亦是此意. 故諺云:治風先治血, 血行風自滅, 血足則肝陽不動, 而風自熄(p141) -水津不騰於上, 口乾肺萎, 痰鬱咳逆, 宜阿膠.... 生津以潤之(p173) -故心中煩熱, 仲景用黃連阿膠鷄子黃湯, 阿膠得阿井伏流之水性, 能伏水中之陽...(p176) -余按鐵本水金之性, 當屬腎經, 血有鐵氣, 卽是腎水交於火, 以爲血也. 然或水氣交於心, 而心火不能化之, 則亦不能生血, 故仲景腹脈湯, 旣用阿膠‧地黃以滋水, 而又用桂枝以助心火, 洵得生血之法(p194) 진존인본초 -血液中의 적혈구와 헤모글로빈의 增長을 가속시키는 작용이 있으며, -칼슘의 흡수 및 체내 축적증가작용을 하고 혈중 칼슘을 약간 증가시키며, -진행성 筋肉영양장애를 예방‧치료하는 작용이 있다. 경악전서 二七一 味甘微辛하고 氣平, 微溫하며 氣味頗厚하고 陽中有陰이라 製는 用蛤粉炒珠하며 入肺肝腎三經이라. 其氣溫 故로 能扶勞傷, 益中氣하며 其性降 故로 能化痰淸肺하야 治肺癰肺痿, 欬唾膿血, 止嗽定喘하며 其性養血 故로 能止吐血衄血, 便血尿血, 腸風下痢, 及婦人崩中帶濁血淋, 經脈不調하며 其味甘緩 故로 能安胎固漏, 養血滋腎, 實腠理, 止虛汗, 托補癰疽腫毒이라 동의보감 -아교(阿膠)는 허로로 여위는 것[虛勞羸瘦], 허리나 배가 아픈 것[腰腹痛], 팔다리가 시글고 아픈 것과 풍증을 치료하는데 허(虛)한 것을 보(補)하고 간기(肝氣)를 돕는다. 그리고 설사, 이질, 기침을 멈추고 여자가 하혈(下血)하는 것을 낫게 하며 안태(安胎)시킨다[본초] -이것은 소가죽을 고아서 만든 것이다. 나귀가죽으로 만든 갖풀(아교)이 풍증에 제일 좋다. 동아(東阿) 지방에서 만든다고 하여 아교라고 하였다[본초] -아현성(阿縣城) 북쪽에 있는 우물물로 만든 것이 진짜이다. 아수(阿水)란 제수를 말하는데 이 물은 맑고 아래로 내려가는 성질이 있기 때문에 걸쭉한 가래[濁痰]가 치밀어 오르는 것을 치료한다. 이 약 기운은 수족소음, 족궐음경으로 들어간다. 오랜 기침과 오랜 이질에 다 좋다[입문] -진짜 나귀가죽으로 만든 갖풀(아교)은 얻기가 힘들기 때문에 차라리 노랗고 투명한 소가죽아교(牛皮膠)을 쓰는 것이 좋은데 진주조개가루(蜂粉)와 함께 닦아서 써야 한다[입문]"},{"id":42,"name":"蜂蜜","aliases":[],"category":"補益藥-補氣藥","origin":"벌꿀","initial":"기타","sortName":"蜂蜜","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 平","肺 脾 大腸","補中<br>潤燥<br>止痛<br><u>解毒<\/u>","胃脘疼痛, 腸燥便秘<br>鼻淵, 肺燥咳嗽<br>口瘡, 湯火燙傷<br><u>解烏頭毒<\/u>",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["벌꿀"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 平","肺 脾 大腸","補中<br>潤燥<br>止痛<br><u>解毒<\/u>","胃脘疼痛, 腸燥便秘<br>鼻淵, 肺燥咳嗽<br>口瘡, 湯火燙傷<br><u>解烏頭毒<\/u>",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-生蜜은 性이 凉하여 淸熱하고,","-熟蜜은 性이 溫하여 補中한다.","-百藥을 調和하여 甘草와 더불어 效能이 같다."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-多종류의 糖類‧무기염‧비타민등의 영양물질이 함유되어 補益‧解毒‧止痛‧潤燥‧淸熱‧殺菌등의 작용을 구비하고 있으며,","-外科질환에 대해서도 消炎과 滲出液의 감소, 痛症의 경감‧感染防止‧傷口의 癒合을 촉진하고, 生體세포에 대해 再生을 促進시키는 작용이 있다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-백밀(白蜜, 꿀)은 오장을 편안하게 하고 기를 도우며 비위를 보하고 아픈 것을 멎게 하며 독을 푼다[解]. 여러 가지 병을 낫게 하고 온갖 약을 조화시키며 脾氣를 補한다. 또한 이질을 멎게 하고 입이 헌것을 치료하며 귀와 눈을 밝게 한다.","-산 속의 바위 틈에 있는 것으로서 빛이 희고 기름 같은 것이 좋다. 일명 석밀(石蜜)이라고 하는 것도 있는데 그것은 벼랑에 있는 꿀을 말한다.","-산 속의 바위 틈이나 나무통 안에서 2-3년 묵은 것이라야 성질과 냄새, 맛이 좋다. 양봉한 꿀은 1년에 두번 뜨는데 자주 뜨면 성질과 맛이 좋지 못하다. 때문에 묵어서 허옇게 된 것이 좋다[본초]","-황랍은 새것을 쓰고 꿀은 묵은 것을 쓴다. 꿀은 반드시 다음과 같이 졸여야 한다. 불에 녹여서 하룻밤 종이를 덮어 두었다가 황랍이 종이 위에 다 올라붙은 다음 건져 버리고 다시 빛이 변하도록 졸여야 한다. 대충 600g을 360g이 되게 졸이면 좋다. 지나치게 졸이면 안 된다[입문]","-봉자(蜂子)는 새끼벌인데 성질이 평(平)하고 맛이 달며[甘] 독이 없다. 새끼벌이란 바로 꿀벌 새끼를 말한다. 꿀개 속에 있는데 번데기 같으면서 빛이 희고 크다. 황봉의 새끼(黃蜂子)란 바로 집이나 큰 나무 사이에 집을 짓고 있는 퉁벌을 말하는데 벌보다 크다. 땅벌의 새끼(土蜂子)란 바로 땅 속에서 사는 벌을 말하는데 생김새가 제일 크다. 새끼벌은 대가리와 발이 생기지 않은 것을 쓰는 것이 좋은데 소금에 볶아서[炒] 먹는다. 이것은 모두 성질이 서늘하고 독이 있는데 대소변이 원활하게 하고 부인의 대하증을 치료한다[본초]","-밀랍(蜜蠟)은 성질이 약간 따뜻하고[微溫] 맛이 달며[甘] 독이 없다. 피고름이 나오는 이질과 쇠붙이에 상한 것을 치료하고 기를 보하며 배고프지 않게 하고 늙지 않게 한다","-황랍(黃蠟)이란 바로 꿀개의 찌꺼기(密脾底)를 말한다. 처음 것은 향기가 있고 묽은데 여러 번 끓이면 굳어진다. 민간에서는 황랍이라고 한다[본초]","-백랍(白蠟,벌레부)은 성질이 평(平)하고 맛이 달며[甘] 독이 없다. 오랜 이질을 치료하고 부러진 것을 이어지게 한다. 황랍을 얇게 깎아서 백일 정도 햇볕에 말리면 저절로 빛이 희어진다. 만일 빨리 쓰려면 녹여서 물 가운데 10여일 동안 넣어 두었다가 쓴다. 이와 같이 하여도 역시 빛이 희어진다[본초]","-또 한 가지 백밀은 전라도, 경상도와 제주도에서 나는데 이것은 수청목나무진(水靑木脂)을 말한다. 이것으로 초를 만들어 불을 켜면 대단히 밝다. 이것은 백랍이 아니다[속방]","-얼옹은 허리가 가는 벌을 말하는 것으로 성질이 평(平)하고 맛이 매우며[辛] 독이 없다(독이 있다고도 한다). 오래된 귀머거리와 코가 메는 것을 치료하고 구역을 멎게 하며 참대나 나무가 찔려 박힌 것을 뽑아지게 한다. 이것이 바로 과라이다. 일명 포로(蒲盧)라고도 한다. 허리가 가는 벌이다. 빛이 검고 허리가 가늘며 진흙으로 집담벽이나 어떤 물체에 붙어서 대롱을 여러 개 묶어 놓은 것 같은 집을 짓는다. 약으로는 볶아서 쓴다[본초]"]}]],"searchText":"蜂蜜 분류 補益藥-補氣藥 기원 벌꿀 性味 歸經 效能 主治 備考 甘 平 肺 脾 大腸 補中<br>潤燥<br>止痛<br><u>解毒<\/u> 胃脘疼痛, 腸燥便秘<br>鼻淵, 肺燥咳嗽<br>口瘡, 湯火燙傷<br><u>解烏頭毒<\/u>  약물특징/비교 -生蜜은 性이 凉하여 淸熱하고, -熟蜜은 性이 溫하여 補中한다. -百藥을 調和하여 甘草와 더불어 效能이 같다. 진존인본초 -多종류의 糖類‧무기염‧비타민등의 영양물질이 함유되어 補益‧解毒‧止痛‧潤燥‧淸熱‧殺菌등의 작용을 구비하고 있으며, -外科질환에 대해서도 消炎과 滲出液의 감소, 痛症의 경감‧感染防止‧傷口의 癒合을 촉진하고, 生體세포에 대해 再生을 促進시키는 작용이 있다. 동의보감 -백밀(白蜜, 꿀)은 오장을 편안하게 하고 기를 도우며 비위를 보하고 아픈 것을 멎게 하며 독을 푼다[解]. 여러 가지 병을 낫게 하고 온갖 약을 조화시키며 脾氣를 補한다. 또한 이질을 멎게 하고 입이 헌것을 치료하며 귀와 눈을 밝게 한다. -산 속의 바위 틈에 있는 것으로서 빛이 희고 기름 같은 것이 좋다. 일명 석밀(石蜜)이라고 하는 것도 있는데 그것은 벼랑에 있는 꿀을 말한다. -산 속의 바위 틈이나 나무통 안에서 2-3년 묵은 것이라야 성질과 냄새, 맛이 좋다. 양봉한 꿀은 1년에 두번 뜨는데 자주 뜨면 성질과 맛이 좋지 못하다. 때문에 묵어서 허옇게 된 것이 좋다[본초] -황랍은 새것을 쓰고 꿀은 묵은 것을 쓴다. 꿀은 반드시 다음과 같이 졸여야 한다. 불에 녹여서 하룻밤 종이를 덮어 두었다가 황랍이 종이 위에 다 올라붙은 다음 건져 버리고 다시 빛이 변하도록 졸여야 한다. 대충 600g을 360g이 되게 졸이면 좋다. 지나치게 졸이면 안 된다[입문] -봉자(蜂子)는 새끼벌인데 성질이 평(平)하고 맛이 달며[甘] 독이 없다. 새끼벌이란 바로 꿀벌 새끼를 말한다. 꿀개 속에 있는데 번데기 같으면서 빛이 희고 크다. 황봉의 새끼(黃蜂子)란 바로 집이나 큰 나무 사이에 집을 짓고 있는 퉁벌을 말하는데 벌보다 크다. 땅벌의 새끼(土蜂子)란 바로 땅 속에서 사는 벌을 말하는데 생김새가 제일 크다. 새끼벌은 대가리와 발이 생기지 않은 것을 쓰는 것이 좋은데 소금에 볶아서[炒] 먹는다. 이것은 모두 성질이 서늘하고 독이 있는데 대소변이 원활하게 하고 부인의 대하증을 치료한다[본초] -밀랍(蜜蠟)은 성질이 약간 따뜻하고[微溫] 맛이 달며[甘] 독이 없다. 피고름이 나오는 이질과 쇠붙이에 상한 것을 치료하고 기를 보하며 배고프지 않게 하고 늙지 않게 한다 -황랍(黃蠟)이란 바로 꿀개의 찌꺼기(密脾底)를 말한다. 처음 것은 향기가 있고 묽은데 여러 번 끓이면 굳어진다. 민간에서는 황랍이라고 한다[본초] -백랍(白蠟,벌레부)은 성질이 평(平)하고 맛이 달며[甘] 독이 없다. 오랜 이질을 치료하고 부러진 것을 이어지게 한다. 황랍을 얇게 깎아서 백일 정도 햇볕에 말리면 저절로 빛이 희어진다. 만일 빨리 쓰려면 녹여서 물 가운데 10여일 동안 넣어 두었다가 쓴다. 이와 같이 하여도 역시 빛이 희어진다[본초] -또 한 가지 백밀은 전라도, 경상도와 제주도에서 나는데 이것은 수청목나무진(水靑木脂)을 말한다. 이것으로 초를 만들어 불을 켜면 대단히 밝다. 이것은 백랍이 아니다[속방] -얼옹은 허리가 가는 벌을 말하는 것으로 성질이 평(平)하고 맛이 매우며[辛] 독이 없다(독이 있다고도 한다). 오래된 귀머거리와 코가 메는 것을 치료하고 구역을 멎게 하며 참대나 나무가 찔려 박힌 것을 뽑아지게 한다. 이것이 바로 과라이다. 일명 포로(蒲盧)라고도 한다. 허리가 가는 벌이다. 빛이 검고 허리가 가늘며 진흙으로 집담벽이나 어떤 물체에 붙어서 대롱을 여러 개 묶어 놓은 것 같은 집을 짓는다. 약으로는 볶아서 쓴다[본초]"},{"id":43,"name":"牡蠣","aliases":[],"category":"平肝藥-平肝潛陽藥","origin":"모려과(굴과) 굴 및 동속 근련동물의 패각","initial":"기타","sortName":"牡蠣","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹 微寒","肝 膽 腎","平肝潛陽<br><u>軟堅散結<\/u><br><u>收斂固澀<\/u>","驚悸失眠, 眩暈耳鳴<br><u>瘰癧痰核, 癥瘕痞塊<\/u><br>自汗盜汗, 遺精崩帶, 胃痛泛酸",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["平肝藥-平肝潛陽藥"]}],["sec",{"key":"origin","label":"기원","lines":["모려과(굴과) 굴 및 동속 근련동물의 패각"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["鹹 微寒","肝 膽 腎","平肝潛陽<br><u>軟堅散結<\/u><br><u>收斂固澀<\/u>","驚悸失眠, 眩暈耳鳴<br><u>瘰癧痰核, 癥瘕痞塊<\/u><br>自汗盜汗, 遺精崩帶, 胃痛泛酸",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-陰虛陽亢으로 인한 煩燥不安과 心悸失眠, 頭暈目眩 및 耳鳴 등 證을 治療","-煆用하면 收斂固澀시키는 特長이 생김(虛汗, 遺精, 帶下, 崩漏 등 證을 治療)","-制酸作用이 있어 胃酸過多로 인한 潰瘍病에 良好한 治療效果"]}],["sec",{"key":"qna","label":"본초문답","lines":["-痰瘧是濕積而成, 常山苗能透達以吐之, 瘧母是痰與血合, 鱉甲‧牡蠣‧穿山甲能破之, 此濕之兼證也(p168)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-藥性이 平하며 鎭靜‧安定작용이 있고 微寒하여 다소의 收斂性 및 消炎性이 있다.","-煆燒후에는 함유된 탄산염이 분해 염화칼슘 등을 발생시켜 유기질은 파괴되며, 臨床的으로 肺結核의 盜汗에 좋은 효과가 있고, 副作用도 없다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二七六 味微鹹微澁, 氣平이라 用此者는 用其澁能固斂이며 鹹能軟堅이라","<u>專入少陰腎臟하며 隨藥하야 亦走諸經이라<\/u>","能解傷寒溫瘧寒熱往來하며 消瘀血, 化老痰, 去煩熱하며 止驚癎心脾氣痛하며 解喉痺欬嗽, 疝瘕積塊, 痢下赤白하며 澁腸止便하며 禁鬼交遺瀝하며 止滑精帶下, 及婦人崩中帶漏, 小兒風痰虛汗이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-모려(牡蠣)는 성질이 평(平)하고(약간 차다[微寒]고도 한다) 맛이 짜며 독이 없다. 대소장을 조여들게 하고 대소변이 지나치게 나가는 것과 식은땀[盜汗]을 멎게 하며 유정, 몽설, 적백대하를 치료하며 온학을 낫게 한다.","-굴조개껍질은 굳은 것을 물러지게 하고 수렴작용하는 약제인데 약 기운은 족소음경(足少陰經)으로 들어간다[총록]","-동해에 있는데 아무 때나 잡는다. 음력 2월에 잡은 것이 좋다. 배쪽의 껍질을 남쪽으로 향하게 들고 보았을 때 주둥이가 동쪽으로 돌아가 있는 것을 좌고모려(左顧牡蠣)라고 한다. 혹 대가리가 뾰족한 것을 좌고모려라고도 하는데 이것을 약으로 쓴다. 대체로 큰 것이 좋다.","-먼저 소금물에 2시간 정도 끓인 다음 불에 구워 가루내어 쓴다[총록]","-모려육(牡蠣肉)은 먹으면 맛이 좋은데 몸에 아주 좋다. 또한 살결을 곱게 하고 얼굴빛을 좋아지게 하는데 바다에서 나는 식료품 가운데서 가장 좋은 것이다[총록]"]}]],"searchText":"牡蠣 분류 平肝藥-平肝潛陽藥 기원 모려과(굴과) 굴 및 동속 근련동물의 패각 性味 歸經 效能 主治 備考 鹹 微寒 肝 膽 腎 平肝潛陽<br><u>軟堅散結<\/u><br><u>收斂固澀<\/u> 驚悸失眠, 眩暈耳鳴<br><u>瘰癧痰核, 癥瘕痞塊<\/u><br>自汗盜汗, 遺精崩帶, 胃痛泛酸  약물특징/비교 -陰虛陽亢으로 인한 煩燥不安과 心悸失眠, 頭暈目眩 및 耳鳴 등 證을 治療 -煆用하면 收斂固澀시키는 特長이 생김(虛汗, 遺精, 帶下, 崩漏 등 證을 治療) -制酸作用이 있어 胃酸過多로 인한 潰瘍病에 良好한 治療效果 본초문답 -痰瘧是濕積而成, 常山苗能透達以吐之, 瘧母是痰與血合, 鱉甲‧牡蠣‧穿山甲能破之, 此濕之兼證也(p168) 진존인본초 -藥性이 平하며 鎭靜‧安定작용이 있고 微寒하여 다소의 收斂性 및 消炎性이 있다. -煆燒후에는 함유된 탄산염이 분해 염화칼슘 등을 발생시켜 유기질은 파괴되며, 臨床的으로 肺結核의 盜汗에 좋은 효과가 있고, 副作用도 없다. 경악전서 二七六 味微鹹微澁, 氣平이라 用此者는 用其澁能固斂이며 鹹能軟堅이라 <u>專入少陰腎臟하며 隨藥하야 亦走諸經이라<\/u> 能解傷寒溫瘧寒熱往來하며 消瘀血, 化老痰, 去煩熱하며 止驚癎心脾氣痛하며 解喉痺欬嗽, 疝瘕積塊, 痢下赤白하며 澁腸止便하며 禁鬼交遺瀝하며 止滑精帶下, 及婦人崩中帶漏, 小兒風痰虛汗이라 동의보감 -모려(牡蠣)는 성질이 평(平)하고(약간 차다[微寒]고도 한다) 맛이 짜며 독이 없다. 대소장을 조여들게 하고 대소변이 지나치게 나가는 것과 식은땀[盜汗]을 멎게 하며 유정, 몽설, 적백대하를 치료하며 온학을 낫게 한다. -굴조개껍질은 굳은 것을 물러지게 하고 수렴작용하는 약제인데 약 기운은 족소음경(足少陰經)으로 들어간다[총록] -동해에 있는데 아무 때나 잡는다. 음력 2월에 잡은 것이 좋다. 배쪽의 껍질을 남쪽으로 향하게 들고 보았을 때 주둥이가 동쪽으로 돌아가 있는 것을 좌고모려(左顧牡蠣)라고 한다. 혹 대가리가 뾰족한 것을 좌고모려라고도 하는데 이것을 약으로 쓴다. 대체로 큰 것이 좋다. -먼저 소금물에 2시간 정도 끓인 다음 불에 구워 가루내어 쓴다[총록] -모려육(牡蠣肉)은 먹으면 맛이 좋은데 몸에 아주 좋다. 또한 살결을 곱게 하고 얼굴빛을 좋아지게 하는데 바다에서 나는 식료품 가운데서 가장 좋은 것이다[총록]"},{"id":44,"name":"文蛤","aliases":[],"category":"化痰止咳平喘藥-淸化熱痰藥","origin":"문합과(참조개과) 무명조개와 모시조개의 패각","initial":"기타","sortName":"文蛤","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["<u>苦鹹 寒<\/u>","肺 胃","淸肺化痰<br><u>軟堅散結<\/u>","肺熱痰稠, 咳嗽氣喘, 癭瘤, 痰核",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["化痰止咳平喘藥-淸化熱痰藥"]}],["sec",{"key":"origin","label":"기원","lines":["문합과(참조개과) 무명조개와 모시조개의 패각"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["<u>苦鹹 寒<\/u>","肺 胃","淸肺化痰<br><u>軟堅散結<\/u>","肺熱痰稠, 咳嗽氣喘, 癭瘤, 痰核",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-煆하면 性이 收斂시키는 性으로 변하여 制酸止痛시키는 效能(胃痛泛酸과 燙傷濕疹 등 證)","-熱邪로 인한 痰結을 治療하는데 主가 되므로 肺虛有寒이나 中氣不足에는 服用을 忌"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二九二 卽五倍子라 味酸澁, 性微凉하며 能斂能降이라 故로 能降肺火하며 化痰涎, 生津液, 解酒毒하며 治心腹疼痛, 夢洩遺精하며 療腫毒喉痺하며 止欬嗽消渴, 嘔血失血, 腸風臟毒, 滑洩久痢, 痔瘻下血不止하며 解蠱毒蟲毒, 婦人崩淋帶濁, 子腸不收, 小兒夜啼, 脫肛하니 俱可爲散으로 服之라 若煎湯用이면 可洗赤眼濕爛, 皮膚風濕癬癩, 腸痔脫肛이며 爲末이면 可傅金瘡折傷이니 生肌斂毒이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-문합해합(文蛤海蛤)은 동해에서 나며 큰데 참깨모양으로 생겼다. 자줏빛의 무늬가 달아서 없어지지 않는 것은 문합이다. 무늬가 달아 없어지는 것은 해합이다. 이 2가지는 같은 종류이며 주로 치료하는 병도 같다[입문]","-마도(馬刀, 말조개)는 성질이 약간 차고[微寒] 맛이 매우며[辛] 독이 있다. 적백대하를 치료하고 석림을 삭히며 5장의 열을 내리고 새나 짐승, 쥐를 죽이며 담음으로 아픈 것을 치료한다(이것은 껍질의 효과이다). 일명 마합(馬蛤)이라고도 하는데 강이나 호수, 못에서 산다. 여러 지방에 다 있는데 가늘고 긴 것은 작은 조개이다. 흔히 진흙이나 모래에서 산다. 아무 때나 잡아서 불에 구워 쓴다[본초]. 생김새가 참마도(斬馬刀)와 같이 때문에 마도라고 하는데 백합조개종류이다. 살로는 젖을 담근다. 그러나 많이 먹으면 풍담(風痰)이 생긴다. 진주조개, 살조개, 가막조개, 소라, 골뱅이는 대체로 비슷하면서 약간 다르다[입문]","-가막조개는 성질이 서늘하고[冷](차다[寒]고도 한다) 독이 없다. 눈을 밝게 하고 오줌이 잘 나오게 하며 열 기운을 내리고 음식맛이 나게 하며 소갈을 멈춘다. 또한 술독과 황달을 없앤다(이것은 조갯살의 효과이다). 껍데기을 태워 가루낸 것은 성질이 따뜻한데 陰瘡, 이질, 反胃, 구토 등을 치료하고 가슴에 생긴 痰水를 없앤다.","-가막조개는 참조개보다 작고 거멓다. 물 속의 진흙 속에서 사는데 아무 때나 잡아서 써도 좋다[본초]","-살조개는 성질이 따뜻하고[溫] 맛이 달며[甘] 독이 없다. 5장을 편안하게 하고 위(胃)를 든든하게 하며 속을 따뜻하게 하고 음식이 소화되게 하며 음경이 일어서게 한다(이것은 조갯살의 효과이다). 껍데기은 불에 구워서 식초에 담갔다가 가루내어 식초로 고약이나 알약을 만들어 먹는다. 일체 혈기병(血氣病), 냉기병(冷氣病), 징벽등을 치료한다. 바다에서 사는 것이 제일 맛있다. 껍데기가 기와같이 생겼기 때문에 일명 와롱자(瓦壟子)라고도 한다[본초] 와롱자는 혈괴(血塊)의 담적(痰積)을 잘 삭힌다[정전]. 이것이 요즘의 강요주(江瑤柱)인 것 같다. 그 살은 맛이 달고[甘] 껍데기는 기와같이 생겼다. 함경도 일대의 바다에서 난다[속방]","-가리맛은 성질이 따뜻하고[溫](차다[寒]고도 한다) 맛이 달며[甘] 독이 없다. 가슴이 안타깝게 답답한 것[煩悶]과 갈증을 멈춘다. 바다 밑의 진흙 속에서 사는데 길이는 2-3치 정도이고 굵기는 손가락만하다. 양쪽 끝이 벌어진 것을 삶아서 먹는다[본초]","-담채(淡菜, 홍합)는 홍합으로 섭조개라고도 한다. 성질이 따뜻하고[溫] 맛이 달며[甘] 독이 없다. 5장을 보하고 허리와 다리를 든든하게 하며 음경이 일어서게 하고 허손되어 여위는 것과 몸푼 뒤에 피가 뭉쳐서 배가 아픈 것, 징가, 붕루, 대하 등을 치료한다. 바다에서 나는데 한쪽이 뾰족하고 가운데 잔 털이 있다. 일명 각채(殼菜) 또는 동해부인(東海夫人)이라고 한다. 생김새는 아름답지 못하나 사람에게 매우 좋은데 삶아서 먹으면 좋다. 아무 때나 잡아서 써도 좋다[본초]","-바다에서 나는 것은 다 맛이 짜지만 이것만은 맛이 슴슴하기 때문에 담채라고 한다. 민간에서는 홍합(紅蛤)이라고 한다[입문]"]}]],"searchText":"文蛤 분류 化痰止咳平喘藥-淸化熱痰藥 기원 문합과(참조개과) 무명조개와 모시조개의 패각 性味 歸經 效能 主治 備考 <u>苦鹹 寒<\/u> 肺 胃 淸肺化痰<br><u>軟堅散結<\/u> 肺熱痰稠, 咳嗽氣喘, 癭瘤, 痰核  약물특징/비교 -煆하면 性이 收斂시키는 性으로 변하여 制酸止痛시키는 效能(胃痛泛酸과 燙傷濕疹 등 證) -熱邪로 인한 痰結을 治療하는데 主가 되므로 肺虛有寒이나 中氣不足에는 服用을 忌 경악전서 二九二 卽五倍子라 味酸澁, 性微凉하며 能斂能降이라 故로 能降肺火하며 化痰涎, 生津液, 解酒毒하며 治心腹疼痛, 夢洩遺精하며 療腫毒喉痺하며 止欬嗽消渴, 嘔血失血, 腸風臟毒, 滑洩久痢, 痔瘻下血不止하며 解蠱毒蟲毒, 婦人崩淋帶濁, 子腸不收, 小兒夜啼, 脫肛하니 俱可爲散으로 服之라 若煎湯用이면 可洗赤眼濕爛, 皮膚風濕癬癩, 腸痔脫肛이며 爲末이면 可傅金瘡折傷이니 生肌斂毒이라 동의보감 -문합해합(文蛤海蛤)은 동해에서 나며 큰데 참깨모양으로 생겼다. 자줏빛의 무늬가 달아서 없어지지 않는 것은 문합이다. 무늬가 달아 없어지는 것은 해합이다. 이 2가지는 같은 종류이며 주로 치료하는 병도 같다[입문] -마도(馬刀, 말조개)는 성질이 약간 차고[微寒] 맛이 매우며[辛] 독이 있다. 적백대하를 치료하고 석림을 삭히며 5장의 열을 내리고 새나 짐승, 쥐를 죽이며 담음으로 아픈 것을 치료한다(이것은 껍질의 효과이다). 일명 마합(馬蛤)이라고도 하는데 강이나 호수, 못에서 산다. 여러 지방에 다 있는데 가늘고 긴 것은 작은 조개이다. 흔히 진흙이나 모래에서 산다. 아무 때나 잡아서 불에 구워 쓴다[본초]. 생김새가 참마도(斬馬刀)와 같이 때문에 마도라고 하는데 백합조개종류이다. 살로는 젖을 담근다. 그러나 많이 먹으면 풍담(風痰)이 생긴다. 진주조개, 살조개, 가막조개, 소라, 골뱅이는 대체로 비슷하면서 약간 다르다[입문] -가막조개는 성질이 서늘하고[冷](차다[寒]고도 한다) 독이 없다. 눈을 밝게 하고 오줌이 잘 나오게 하며 열 기운을 내리고 음식맛이 나게 하며 소갈을 멈춘다. 또한 술독과 황달을 없앤다(이것은 조갯살의 효과이다). 껍데기을 태워 가루낸 것은 성질이 따뜻한데 陰瘡, 이질, 反胃, 구토 등을 치료하고 가슴에 생긴 痰水를 없앤다. -가막조개는 참조개보다 작고 거멓다. 물 속의 진흙 속에서 사는데 아무 때나 잡아서 써도 좋다[본초] -살조개는 성질이 따뜻하고[溫] 맛이 달며[甘] 독이 없다. 5장을 편안하게 하고 위(胃)를 든든하게 하며 속을 따뜻하게 하고 음식이 소화되게 하며 음경이 일어서게 한다(이것은 조갯살의 효과이다). 껍데기은 불에 구워서 식초에 담갔다가 가루내어 식초로 고약이나 알약을 만들어 먹는다. 일체 혈기병(血氣病), 냉기병(冷氣病), 징벽등을 치료한다. 바다에서 사는 것이 제일 맛있다. 껍데기가 기와같이 생겼기 때문에 일명 와롱자(瓦壟子)라고도 한다[본초] 와롱자는 혈괴(血塊)의 담적(痰積)을 잘 삭힌다[정전]. 이것이 요즘의 강요주(江瑤柱)인 것 같다. 그 살은 맛이 달고[甘] 껍데기는 기와같이 생겼다. 함경도 일대의 바다에서 난다[속방] -가리맛은 성질이 따뜻하고[溫](차다[寒]고도 한다) 맛이 달며[甘] 독이 없다. 가슴이 안타깝게 답답한 것[煩悶]과 갈증을 멈춘다. 바다 밑의 진흙 속에서 사는데 길이는 2-3치 정도이고 굵기는 손가락만하다. 양쪽 끝이 벌어진 것을 삶아서 먹는다[본초] -담채(淡菜, 홍합)는 홍합으로 섭조개라고도 한다. 성질이 따뜻하고[溫] 맛이 달며[甘] 독이 없다. 5장을 보하고 허리와 다리를 든든하게 하며 음경이 일어서게 하고 허손되어 여위는 것과 몸푼 뒤에 피가 뭉쳐서 배가 아픈 것, 징가, 붕루, 대하 등을 치료한다. 바다에서 나는데 한쪽이 뾰족하고 가운데 잔 털이 있다. 일명 각채(殼菜) 또는 동해부인(東海夫人)이라고 한다. 생김새는 아름답지 못하나 사람에게 매우 좋은데 삶아서 먹으면 좋다. 아무 때나 잡아서 써도 좋다[본초] -바다에서 나는 것은 다 맛이 짜지만 이것만은 맛이 슴슴하기 때문에 담채라고 한다. 민간에서는 홍합(紅蛤)이라고 한다[입문]"},{"id":45,"name":"陳皮","aliases":[],"category":"理氣藥","origin":"운향과 상록 소교목인 귤 및 동속 근련식물의 과실의 과피","initial":"기타","sortName":"陳皮","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫","脾 肺","理氣<br>調中<br>燥濕<br>化痰","胸腹脹滿<br>不思飮食<br>嘔吐噦逆<br>咳嗽痰多",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["理氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["운향과 상록 소교목인 귤 및 동속 근련식물의 과실의 과피"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 溫","脾 肺","理氣<br>調中<br>燥濕<br>化痰","胸腹脹滿<br>不思飮食<br>嘔吐噦逆<br>咳嗽痰多",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-滯氣를 行하게 하면 脾胃腸이 스스로 康健하게 되고 寒濕이 제거되면 痰涎이 스스로 소멸되는 까닭에 理氣, 健脾, 燥濕, 化痰의 要藥이라 함(陳皮는 오래된 것이 좋다고 하여 붙여진 이름)","-약물 배합","⊕黨參 白朮 \t補하면서 滯하지 않고 그 效力을 높여 주며","⊕半夏 茯笭 \t化痰하는 效能이 있고","⊕蒼朮 厚朴 \t行氣, 燥濕하는 效力을 增加","⊕防風 白芍 白朮 \t止痛, 止瀉作用","⊕生薑 竹茹 \t和胃, 降逆한다.","-活用범위가 대단히 넓음 :【本草綱目】에 의하면 이 약이 補藥과 함께 사용하면 補하는 作用이 있고 瀉藥과 같이 사용하면 瀉하고 升藥과 同用하면 升하고, 降藥과 同用하면 降하는 作用을 나타낸다고 함.","-오직 性이 溫燥한 것에 偏向되어 있어서 津虧實熱의 證에는 愼用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-陳皮主降矣(p76)","-陳皮兼辛香, 故能上達於肺; 枳殼不辛香, 故不走肺; 厚朴辛而其氣太沈, 故不走肺, 然肺氣通於大腸, 厚朴行大腸之氣, 則肺氣得, ...(p82)","-陳皮之氣味, 不輕不重, 故可降上焦, 可降中焦(p86)","-陳皮者, 木之皮也, 象人身之皮, 味苦兼降濕熱, 故仲景用治皮膚發黃之證(p97)","-但溫肺而不兼胃治者, 則用甘草乾薑湯, 其薑炮過, 則輕而上浮, 故但溫肺, 後人用白芥逐水, 陳皮降氣, 冬花溫肺, 蘇子降氣, 皆是仿仲景小靑龍湯, 以辛溫去肺寒也(p152)","-脾停飮食, 則濕不化, 宜神曲以散濕, 枳角/陳皮/木香行氣以行濕(p163)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-橘皮의 휘발유는 消化器에 대하여 완만한 刺戟作用이 있으며 胃腸에 阻滯된 가스의 배출에 도움이 되고 胃液의 分泌를 促進하여 消化를 돕는다. 또 呼吸器 粘膜을 刺戟하여 分泌를 높이고 痰을 消하여 배출하기 쉽게 한다.","-陳皮에는 通氣‧止痛‧消食‧散結의 效能이 있으며, 通氣藥은 主로 機能調節作用과 胃腸의 平滑筋興奮 및 收縮力‧緊張力强化 留滯가스排泄, 胃液分泌促進, 消化吸收를 좋게한다.","-開胃‧消食의 良藥이며 陳皮中 리모넨이나 시트랄은 消化器에 대해 穩和한 刺戟作用을 가지며 胃液의 分泌量을 늘리고 消化 및 營養吸收를 돕는다.","-補身藥 服用後 體內阻滯로 잘 消散하지 않아 발생하는 食慾減退를 防止한다.","-呼吸器粘膜을 刺戟하여 분비를 높이고 痰을 消하여 厚痰膩液을 除하는 작용이 우수하다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二一四 味苦辛하며 性溫散하야 氣實痰滯에 必用이라 留白者는 微甘而性緩이며 去白者는 用辛而性速이라","瀉脾胃痰濁, 肺中滯氣하며 消食開胃하며 利水通便하니 呑酸噯腐 反胃嘈雜. 厄逆脹滿에 堪除하며 嘔吐惡心에 皆效하며 通達上下라. 解酒除蟲하며 表裏에 俱宜하며 癰疽에 亦用하며 尤消婦人乳癰하며 幷解魚肉諸毒이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-귤피(橘皮)는 가슴에 기가 뭉친 것을 치료한다. 음식맛이 나게 하고 소화를 잘 시킨다. 이질을 멈추며 담연(痰涎)을 삭히고 기운이 위로 치미는 것과 기침하는 것을 낫게하며 嘔逆을 멎게 하며 대소변을 잘 통하게 한다.","-나무의 높이는 3-6미터이며 잎은 탱자나무잎과 같고 가시가 줄기 사이에 돋아 있으며 초여름에 흰 꽃이 핀다. 6-7월에 열매가 열리고 겨울에 노랗게 익으므로 먹을 수 있다. 열매는 음력 10월에 따는데 껍질은 묵은 것이 좋다. 이 열매는 남방에서 난다[본초]","-우리나라에서는 오직 제주도에서만 난다. 제주도에서는 청귤, 유자, 감자 등이 다 난다[속방]","-脾胃를 補하려면 흰 속을 긁어 버리지 말아야 한다. 만일 가슴에 막힌 기를 치료하려면 흰 속을 긁어 버리고 써야 한다. 그 빛이 벌겋기 때문에 홍피(紅皮)라고 한다. 오래된 것이 좋은데 이것을 陳皮라고 한다.","-흰 속이 그대로 있는 것은 胃를 보하고 속을 편안하게 한다. 흰 속을 버린 것은 담을 삭히고 체기를 푼다.","-백출과 함께 쓰면 비위를 보하고 함께 쓰지 않으면 비위를 瀉한다. 감초와 함께 쓰면 폐를 보하고 감초와 함께 쓰지 않으면 폐를 사한다[단심]","-약 기운이 下焦에 들어가게 하려면 소금물에 담갔다가 쓰고 폐가 건조하면 童尿에 담갔다가 볕에 말려 쓴다[입문]","-귤육(橘肉, 귤속살)은 소갈증을 멎게 하고 음식맛을 나게 하고 소화를 잘 시킨다. 귤 속을 많이 먹으면 담이 생긴다.","-신 것은 담을 모이게 하고 단것은 폐를 눅여 준다[潤]. 껍질은 약으로 쓰지만 귤의 속살은 사람에게 그리 좋지 않다[본초]","-귤낭상근막(橘囊上筋膜, 귤의 속살에 붙은 실 같은 층)은 갈증을 멎게 하고 술을 마신 뒤에 토하는 것을 치료하는데 달여 먹으면 좋다[본초]"]}]],"searchText":"陳皮 분류 理氣藥 기원 운향과 상록 소교목인 귤 및 동속 근련식물의 과실의 과피 性味 歸經 效能 主治 備考 辛苦 溫 脾 肺 理氣<br>調中<br>燥濕<br>化痰 胸腹脹滿<br>不思飮食<br>嘔吐噦逆<br>咳嗽痰多  약물특징/비교 -滯氣를 行하게 하면 脾胃腸이 스스로 康健하게 되고 寒濕이 제거되면 痰涎이 스스로 소멸되는 까닭에 理氣, 健脾, 燥濕, 化痰의 要藥이라 함(陳皮는 오래된 것이 좋다고 하여 붙여진 이름) -약물 배합 ⊕黨參 白朮 \t補하면서 滯하지 않고 그 效力을 높여 주며 ⊕半夏 茯笭 \t化痰하는 效能이 있고 ⊕蒼朮 厚朴 \t行氣, 燥濕하는 效力을 增加 ⊕防風 白芍 白朮 \t止痛, 止瀉作用 ⊕生薑 竹茹 \t和胃, 降逆한다. -活用범위가 대단히 넓음 :【本草綱目】에 의하면 이 약이 補藥과 함께 사용하면 補하는 作用이 있고 瀉藥과 같이 사용하면 瀉하고 升藥과 同用하면 升하고, 降藥과 同用하면 降하는 作用을 나타낸다고 함. -오직 性이 溫燥한 것에 偏向되어 있어서 津虧實熱의 證에는 愼用 본초문답 -陳皮主降矣(p76) -陳皮兼辛香, 故能上達於肺; 枳殼不辛香, 故不走肺; 厚朴辛而其氣太沈, 故不走肺, 然肺氣通於大腸, 厚朴行大腸之氣, 則肺氣得, ...(p82) -陳皮之氣味, 不輕不重, 故可降上焦, 可降中焦(p86) -陳皮者, 木之皮也, 象人身之皮, 味苦兼降濕熱, 故仲景用治皮膚發黃之證(p97) -但溫肺而不兼胃治者, 則用甘草乾薑湯, 其薑炮過, 則輕而上浮, 故但溫肺, 後人用白芥逐水, 陳皮降氣, 冬花溫肺, 蘇子降氣, 皆是仿仲景小靑龍湯, 以辛溫去肺寒也(p152) -脾停飮食, 則濕不化, 宜神曲以散濕, 枳角/陳皮/木香行氣以行濕(p163) 진존인본초 -橘皮의 휘발유는 消化器에 대하여 완만한 刺戟作用이 있으며 胃腸에 阻滯된 가스의 배출에 도움이 되고 胃液의 分泌를 促進하여 消化를 돕는다. 또 呼吸器 粘膜을 刺戟하여 分泌를 높이고 痰을 消하여 배출하기 쉽게 한다. -陳皮에는 通氣‧止痛‧消食‧散結의 效能이 있으며, 通氣藥은 主로 機能調節作用과 胃腸의 平滑筋興奮 및 收縮力‧緊張力强化 留滯가스排泄, 胃液分泌促進, 消化吸收를 좋게한다. -開胃‧消食의 良藥이며 陳皮中 리모넨이나 시트랄은 消化器에 대해 穩和한 刺戟作用을 가지며 胃液의 分泌量을 늘리고 消化 및 營養吸收를 돕는다. -補身藥 服用後 體內阻滯로 잘 消散하지 않아 발생하는 食慾減退를 防止한다. -呼吸器粘膜을 刺戟하여 분비를 높이고 痰을 消하여 厚痰膩液을 除하는 작용이 우수하다. 경악전서 二一四 味苦辛하며 性溫散하야 氣實痰滯에 必用이라 留白者는 微甘而性緩이며 去白者는 用辛而性速이라 瀉脾胃痰濁, 肺中滯氣하며 消食開胃하며 利水通便하니 呑酸噯腐 反胃嘈雜. 厄逆脹滿에 堪除하며 嘔吐惡心에 皆效하며 通達上下라. 解酒除蟲하며 表裏에 俱宜하며 癰疽에 亦用하며 尤消婦人乳癰하며 幷解魚肉諸毒이라 동의보감 -귤피(橘皮)는 가슴에 기가 뭉친 것을 치료한다. 음식맛이 나게 하고 소화를 잘 시킨다. 이질을 멈추며 담연(痰涎)을 삭히고 기운이 위로 치미는 것과 기침하는 것을 낫게하며 嘔逆을 멎게 하며 대소변을 잘 통하게 한다. -나무의 높이는 3-6미터이며 잎은 탱자나무잎과 같고 가시가 줄기 사이에 돋아 있으며 초여름에 흰 꽃이 핀다. 6-7월에 열매가 열리고 겨울에 노랗게 익으므로 먹을 수 있다. 열매는 음력 10월에 따는데 껍질은 묵은 것이 좋다. 이 열매는 남방에서 난다[본초] -우리나라에서는 오직 제주도에서만 난다. 제주도에서는 청귤, 유자, 감자 등이 다 난다[속방] -脾胃를 補하려면 흰 속을 긁어 버리지 말아야 한다. 만일 가슴에 막힌 기를 치료하려면 흰 속을 긁어 버리고 써야 한다. 그 빛이 벌겋기 때문에 홍피(紅皮)라고 한다. 오래된 것이 좋은데 이것을 陳皮라고 한다. -흰 속이 그대로 있는 것은 胃를 보하고 속을 편안하게 한다. 흰 속을 버린 것은 담을 삭히고 체기를 푼다. -백출과 함께 쓰면 비위를 보하고 함께 쓰지 않으면 비위를 瀉한다. 감초와 함께 쓰면 폐를 보하고 감초와 함께 쓰지 않으면 폐를 사한다[단심] -약 기운이 下焦에 들어가게 하려면 소금물에 담갔다가 쓰고 폐가 건조하면 童尿에 담갔다가 볕에 말려 쓴다[입문] -귤육(橘肉, 귤속살)은 소갈증을 멎게 하고 음식맛을 나게 하고 소화를 잘 시킨다. 귤 속을 많이 먹으면 담이 생긴다. -신 것은 담을 모이게 하고 단것은 폐를 눅여 준다[潤]. 껍질은 약으로 쓰지만 귤의 속살은 사람에게 그리 좋지 않다[본초] -귤낭상근막(橘囊上筋膜, 귤의 속살에 붙은 실 같은 층)은 갈증을 멎게 하고 술을 마신 뒤에 토하는 것을 치료하는데 달여 먹으면 좋다[본초]"},{"id":46,"name":"大棗","aliases":[],"category":"補益藥-補氣藥","origin":"鼠李科(갈매나무과) 낙엽관목인 대추의 성숙한 과실","initial":"기타","sortName":"大棗","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","脾 胃","<u>補脾和胃<\/u><br>益氣生津<br>調營衛<br>解藥毒","胃虛食少, 脾弱便溏<br>氣血津液不足<br>營衛不和, 心悸怔忡<br>婦人腸躁",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補氣藥"]}],["sec",{"key":"origin","label":"기원","lines":["鼠李科(갈매나무과) 낙엽관목인 대추의 성숙한 과실"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 溫","脾 胃","<u>補脾和胃<\/u><br>益氣生津<br>調營衛<br>解藥毒","胃虛食少, 脾弱便溏<br>氣血津液不足<br>營衛不和, 心悸怔忡<br>婦人腸躁",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-대개가 生薑과 配伍하는데 \t生薑을 得하면 그 刺戟의 性을 緩和하고,","生薑이 大棗를 得하면 氣壅을 防止하여 脹滿에 이르지 않게 한다"]}],["sec",{"key":"qna","label":"본초문답","lines":["-濕積於脾, 則腹中脹, 久則水多爲膨, 宜逐其水. 甘遂‧大戟‧芫花‧牽牛, 功力峻猛, 隨用大棗‧參‧朮‧甘草, 以補脾土, 去其太過, 又恐損其不足也(p163)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-藥物의 毒性과 烈性을 緩和하는 작용이 있어, 辛烈한 약성이 胃점막을 자극하는 것을 피하고 辛溫導滯藥 혹은 辛溫表散藥에 가미하여 發汗過多를 방지","-滋養强壯 效能이 있으며 食慾增進‧安眠促進‧藥性調和의 효능을 발휘한다."]}],["sec",{"key":"dong","label":"동의보감","lines":["-대조(大棗, 대추)","․성은 평(平)하고(따뜻하다[溫]고도 한다) 맛은 달며[甘] 독이 없다. 속을 편안하게 하고 비(脾)를 영양하며 5장을 보하고 12경맥을 도와주며 진액(津液)을 불쿠고 9규[竅]를 통하게 한다. 의지를 강하게 하고 여러 가지 약을 조화시킨다.","․일명 건조(乾棗)라고 하는데 어느 곳에나 다 있다. 음력 8월에 따서 볕에 말린다.","․대추살은 허한 것을 보하기 때문에 달임약에는 모두 쪼개 넣어야 한다[본초]","․단맛으로 부족한 경락을 보하여 음혈을 완화시킨다. 혈이 완화되면 경맥이 살아나기 때문에 12경맥을 도울 수 있다[입문]","-생조(生棗, 생대추)","․맛은 달고[甘] 맵다[辛]. 많이 먹으면 배가 불러 오르고 여위며 추웠다 열이 났다 한다. 생대추를 쪄서 먹으면 장위를 보하고 살찌게 하며 기를 돕는다. 생것을 먹으면 배가 불러 오르고 설사한다[본초]","<u>-핵중인(核中仁,대추씨)<\/u>","․3년 묵은 씨 가운데 있는 알을 구워서 腹痛과 邪氣, 시주, 객오등에 쓴다[본초]","-조엽(棗葉, 대추나무잎)","․가루내어 먹으면 사람이 여위게 된다. 즙을 내어 땀띠에 문지르면 좋다[본초]"]}]],"searchText":"大棗 분류 補益藥-補氣藥 기원 鼠李科(갈매나무과) 낙엽관목인 대추의 성숙한 과실 性味 歸經 效能 主治 備考 甘 溫 脾 胃 <u>補脾和胃<\/u><br>益氣生津<br>調營衛<br>解藥毒 胃虛食少, 脾弱便溏<br>氣血津液不足<br>營衛不和, 心悸怔忡<br>婦人腸躁  약물특징/비교 -대개가 生薑과 配伍하는데 \t生薑을 得하면 그 刺戟의 性을 緩和하고, 生薑이 大棗를 得하면 氣壅을 防止하여 脹滿에 이르지 않게 한다 본초문답 -濕積於脾, 則腹中脹, 久則水多爲膨, 宜逐其水. 甘遂‧大戟‧芫花‧牽牛, 功力峻猛, 隨用大棗‧參‧朮‧甘草, 以補脾土, 去其太過, 又恐損其不足也(p163) 진존인본초 -藥物의 毒性과 烈性을 緩和하는 작용이 있어, 辛烈한 약성이 胃점막을 자극하는 것을 피하고 辛溫導滯藥 혹은 辛溫表散藥에 가미하여 發汗過多를 방지 -滋養强壯 效能이 있으며 食慾增進‧安眠促進‧藥性調和의 효능을 발휘한다. 동의보감 -대조(大棗, 대추) ․성은 평(平)하고(따뜻하다[溫]고도 한다) 맛은 달며[甘] 독이 없다. 속을 편안하게 하고 비(脾)를 영양하며 5장을 보하고 12경맥을 도와주며 진액(津液)을 불쿠고 9규[竅]를 통하게 한다. 의지를 강하게 하고 여러 가지 약을 조화시킨다. ․일명 건조(乾棗)라고 하는데 어느 곳에나 다 있다. 음력 8월에 따서 볕에 말린다. ․대추살은 허한 것을 보하기 때문에 달임약에는 모두 쪼개 넣어야 한다[본초] ․단맛으로 부족한 경락을 보하여 음혈을 완화시킨다. 혈이 완화되면 경맥이 살아나기 때문에 12경맥을 도울 수 있다[입문] -생조(生棗, 생대추) ․맛은 달고[甘] 맵다[辛]. 많이 먹으면 배가 불러 오르고 여위며 추웠다 열이 났다 한다. 생대추를 쪄서 먹으면 장위를 보하고 살찌게 하며 기를 돕는다. 생것을 먹으면 배가 불러 오르고 설사한다[본초] <u>-핵중인(核中仁,대추씨)<\/u> ․3년 묵은 씨 가운데 있는 알을 구워서 腹痛과 邪氣, 시주, 객오등에 쓴다[본초] -조엽(棗葉, 대추나무잎) ․가루내어 먹으면 사람이 여위게 된다. 즙을 내어 땀띠에 문지르면 좋다[본초]"},{"id":47,"name":"火麻仁","aliases":["麻子仁"],"category":"瀉下藥-潤下藥","origin":"大麻科(삼과) 일년생 초본인 삼의 성숙한 과실","initial":"기타","sortName":"火麻仁","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["平 甘","脾 胃 大腸","潤燥滑腸通便","<u>血虛津虧腸燥便秘<\/u>",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["瀉下藥-潤下藥"]}],["sec",{"key":"origin","label":"기원","lines":["大麻科(삼과) 일년생 초본인 삼의 성숙한 과실"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["平 甘","脾 胃 大腸","潤燥滑腸通便","<u>血虛津虧腸燥便秘<\/u>",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-質潤多脂하여 腸道를 潤滑시키는 效能이 있어 緩下通便에 常用하는 藥物.","-滋養補虛하는 效能도 가지고 있어 老年이나 體虛 및 出産後에 津枯血少로 인한 腸燥便秘에 要藥이지만,","-長期間 服用×","-一次 內服에 60～120g 이상이면 中毒症狀인 吐瀉와 四肢痲木의 症狀, 심하면 昏睡狀態."]}],["sec",{"key":"qna","label":"본초문답","lines":["-..麻子亦油滑, 而無辛烈之性, 故但能潤降, 不能速下(p80)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-便秘치료 : 약성이 緩하고 脂肪油, 揮發油, 단백질 풍부하며, 脂肪油는 腸內 알카리性 腸液과 접촉하여 지방산을 형성하고 장벽을 자극하여 유동운동을 강화","-强壓作用, 長壽(매일 3錢 常服)"]}],["sec",{"key":"dong","label":"동의보감","lines":["-마자(麻子, 삼씨)","․성질은 平하고(차다고도 한다) 맛이 달며 독이 없다. 허로증 때 보하고 5장을 눅여 주며 풍기를 없앤다. 대장에 풍열이 몰려 대변이 잘 나가지 않는 것을 치료한다. 그리고 오줌을 잘 나가게 하고 열림을 낫게 한다. 대소변을 잘 나가게 하는데 많이 먹지는 말아야 한다. 정기를 잘 나가게 하고 양기를 약해지게 한다[본초]","․이른 봄에 심은 것을 춘마자(春麻子)라고 하는데 알이 작고 독이 있다. 늦은 봄에 심은 것을 추마자(秋麻子)라고 하는데 약으로 쓰면 좋다[본초]","․족태음(足太陰)경과 수양명(手陽明)경으로 들어가는 약이다[입문]","․땀이 많이 나는 것[多汗], 위에 열이 있는 것[胃熱], 대변을 보기가 힘든 것[使難] 이 3가지는 다 습기를 마르게 하고 진액이 없어지게 한다. 張仲景은 삼씨로 족태음경부위가 건조한 것을 눅여 주어서 장을 통하게 하였다[탕액]","․삼씨는 껍질을 벗기기가 아주 어렵다. 물에 2-3일 동안 담가 두었다가 껍질이 터진 다음 햇볕에 말려 새기왓장 위에 놓고 비벼서 씨알을 받아 쓴다. 또 한 가지 방법은 다음과 같다. 천에 싸서 끓인 물에 담가 두었다가 물이 식은 다음 꺼내서 우물 가운데 하룻밤 달아 매두되 물에 닿지 않게 한다. 그 다음날 낮에 꺼내서 햇볕에 말려 새기왓장 위에 놓고 비벼서 키로 까부려 껍질을 버리고 씨알만 받는다[본초]","-마분(麻粉, 삼꽃가루)","․성질이 평(平)하고 맛이 매우며[辛] 독이 있다. 적을 헤치고[破積] 비증(痺證)을 낫게 한다. 가루로 먹는데 많이 먹으면 미친다[본초]. 일명 마발(麻勃)이라고도 하는데 삼꽃에서 날리는 꽃가루를 말한다. 음력 7월초에 받은 것이 좋다[본초]","-마엽(麻葉, 삼잎)","․蛔蟲을 죽인다. 삼잎 삶은 물로 머리를 감으면 머리털이 길게 자라고 윤택해진다[본초]","-마근(麻根, 삼뿌리)","․난산(難産)과 태반이 나오지 않는 것[衣不出]을 치료한다. 어혈을 헤치고[破瘀血] 석림(石淋)이 나오게 한다. 달여서 그 물을 마신다[본초]"]}]],"searchText":"火麻仁 麻子仁 분류 瀉下藥-潤下藥 기원 大麻科(삼과) 일년생 초본인 삼의 성숙한 과실 性味 歸經 效能 主治 備考 平 甘 脾 胃 大腸 潤燥滑腸通便 <u>血虛津虧腸燥便秘<\/u>  약물특징/비교 -質潤多脂하여 腸道를 潤滑시키는 效能이 있어 緩下通便에 常用하는 藥物. -滋養補虛하는 效能도 가지고 있어 老年이나 體虛 및 出産後에 津枯血少로 인한 腸燥便秘에 要藥이지만, -長期間 服用× -一次 內服에 60～120g 이상이면 中毒症狀인 吐瀉와 四肢痲木의 症狀, 심하면 昏睡狀態. 본초문답 -..麻子亦油 기 때문에 습한 곳에서도 열이 몹시 생기게 한다. 그러므로 많이 먹으면 비풍(脾風)이 動할 수 있다[단심]","․여러 가지 쌀로 다 만들 수 있으나 오직 찹쌀로 만든 것만 약으로 쓴다[본초]"]}]],"searchText":"飴糖 분류 補益藥-補氣藥 기원 엿 性味 歸經 效能 主治 備考      본초문답 -..皆酒得天之氣厚而升, 飴得地之味厚而補, 仲景建中用飴糖, 正取其補中宮也. -..觀白乾酒升而不守 ; 飴糖守而不升 ; 米酒能升能守. 分別處, 全在氣味厚朴..(p75,76) 동의보감 -이당(飴糖, 엿) ․성질이 따뜻하고[溫] 맛이 달다[甘]. 허약한 것을 보하며 기력을 돕고 5장을 눅여 주며 담(痰)을 삭히고 기침을 멎게 한다[본초] ․이당을 또한 교이(膠胎)라고도 하는데 이것은 진한 꿀(厚蜜)과 같은 물엿을 말하는 것이다[본초] ․자줏빛이 나는 것이 엉켜서 호박빛깔이 된 것을 교(膠)라고 한다. 빛이 희고 굳게 엉긴 것을 성당이라고 하는데 이것은 약으로 쓰지 않는다[탕액] ․엿이라고 할 때에는 무른 엿을 말한다. 건중탕(建中湯)에 넣어 쓰는데 그 기운은 비장으로 들어간다[탕액] ․엿은 토(土)에 속하는 것이지만 불로 고아 만들었기 때문에 습한 곳에서도 열이 몹시 생기게 한다. 그러므로 많이 먹으면 비풍(脾風)이 動할 수 있다[단심] ․여러 가지 쌀로 다 만들 수 있으나 오직 찹쌀로 만든 것만 약으로 쓴다[본초]"},{"id":49,"name":"冬葵子","aliases":[],"category":"利水滲濕藥-利尿通淋藥","origin":"아욱과 일년생 초본인 아욱의 성숙한 종자","initial":"기타","sortName":"冬葵子","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 寒","大腸 小腸 膀胱","利水通淋<br>下乳<br>潤腸","二便不通, 淋病, 水腫, 婦女乳汁不行, 乳房腫痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["利水滲濕藥-利尿通淋藥"]}],["sec",{"key":"origin","label":"기원","lines":["아욱과 일년생 초본인 아욱의 성숙한 종자"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘 寒","大腸 小腸 膀胱","利水通淋<br>下乳<br>潤腸","二便不通, 淋病, 水腫, 婦女乳汁不行, 乳房腫痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-下乳消腫시키는 效能 : 乳汁不行으로 인한 乳房脹痛을 治療"]}],["sec",{"key":"qna","label":"본초문답","lines":["-小便燥澁, 薏仁‧滑石‧冬葵子‧肉蓗蓉 以滑利之(p174)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-임상 : 비만과 변비치료에 多用"]}],["sec",{"key":"dong","label":"동의보감","lines":["-동규자(冬葵子, 돌아욱씨)는 성질이 차고[寒] 맛이 달며[甘] 독이 없다. 5가지 임병을 치료하고 오줌을 잘 누게 하며 5장 6부에 있는 한열증(寒熱證)과 부인의 젖줄이 막혀서 아픈 것을 치료한다. 가을에 아욱(葵)을 심고 겨울이 지나고 봄이 되도록 덮어 두면 씨가 앉는데 이것을 돌아욱씨라고 한다.약으로 많이 쓰는데 성질이 활리(滑利)하고 돌을 잘 내리게 한다. 춘규자(春葵子)도 성질이 활(滑)하나 약으로는 쓰지 못한다. 서리가 내린 뒤의 돌아욱은 먹지 못한다. 그것은 담을 동하게 하고 물을 토하게 하기 때문이다. 씨는 약간 볶아 부스러뜨려서 쓴다[본초]","-동규근(冬葵根, 돌아욱뿌리)는 악창과 임병을 치료하고 오줌을 잘 나가게 한다[본초]","-동규엽(冬葵葉, 돌아욱잎)는 다른 채소처럼 나물을 만들어 먹으면 매우 달고 맛이 있다. 적과 기운이 몰린 것을 잘 헤친다[본초]"]}]],"searchText":"冬葵子 분류 利水滲濕藥-利尿通淋藥 기원 아욱과 일년생 초본인 아욱의 성숙한 종자 . 열격을 치료한다[입문]","-백동과(白冬瓜, 동아)","․성질이 약간 차고[微寒](서늘하다[冷]고도 한다) 맛이 달며[甘] 독이 없다. 3가지 소갈병을 치료하고 몰린 병을 풀며 대소변을 잘 나가게 하고 광물성 약재의 독을 없앤다. 수창(水脹)과 가슴이 답답한 것을 낫게 한다. 일명 지지(地芝)라고도 하는데 덩굴이 뻗는다. 열매가 달리는데 처음에는 청록색이고 서리가 온 뒤에는 껍질이 분을 칠한 것처럼 허옇게 된다. 그러므로 백동과라고도 한다. 열이 있을 때 먹으면 좋으나 냉이 있을 때 먹으면 여위게 된다[본초]. 오래된 병이 있을 때와 음이 허한 사람은 먹지 말아야 한다[단심]","-백동과자(白冬瓜子, 동아씨)","․동과자(冬瓜子)이다. 성질이 평(平)하고 차며[寒] 맛이 달고[甘] 독이 없다. 피부를 윤택하게 하고 얼굴빛이 좋아지게 하며 주근깨를 없앤다. 또한 이것으로 얼굴에 바르는 기름도 만든다. 서리가 내린 뒤나 음력 8월에 받아서 껍질은 버리고 알맹이만 약간 닦아[微炒]쓴다[입문]","-백동과등(白冬瓜藤, 동아덩굴)","․태워 재를 내서 잿물을 받아 주근깨나 헌데나 옴을 씻는다[본초]","-백동과엽(白冬瓜葉, 동아잎)","․벌한테 쏘인 독을 없앤다[본초]"]}]],"searchText":"瓜蒂 분류 涌吐藥 기원 葫蘆科(박과)참외의 덜 익은 과실의 꼭지 性味 歸經 效能 主治 備考 苦 寒 脾 胃 吐風痰宿食<br>瀉水濕停飮 痰涎宿食,壅塞上脘,胸中痞硬<br>風痰癲癎,濕熱黃疸,四肢浮腫, 鼻塞,喉痺 有毒 약물특징/비교 -有毒하여 內服하면 胃腑에 들어가 熱痰을 湧吐케 하고 硏末하여 鼻中에 吹入하면 濕熱을 去하는 效能 -濕熱黃疸에 硏末하여 비중에 吹入하여 治療(身體虛弱하거나 心臟疾患이 있는 者에서 投與×) -過量 服用으로 嘔吐가 멎지 않으면 麝香 0.1\\~0.15g을 복용시켜야 한다. 동의보감 -과체(瓜蒂, 참외꼭지) ․성질이 차고[寒] 맛이 쓰며[苦] 독이 있다. 온몸이 부은 것을 치료하는데 물을 빠지게 하며 고독을 죽인다. 코 안에 생긴 군살을 없애고 황달을 치료하며 여러 가지 음식을 지나치게 먹어서 체했을 때 토하게 하거나 설사하게 한다. ․이것이 첨과체(甛瓜蒂)인데 일명 고정향(苦丁香)이라고도 한다. 참외는 퍼런 것과 흰 것 2가지가 있는데 반드시 퍼런 참외꼭지를 써야 한다. 음력 7월에 참외가 익어서 저절로 떨어진 꼭지를 쓰는데 덩굴에서부터 약 반치 정도 되게 잘라서 그늘에 말려 밀기울과 함께 누렇게 되도록 볶아 쓴다[본초] -과자(瓜子, 참외씨) ․뱃속의 적취를 없애고 피고름이 고인 것을 헤치기 때문에 장옹(腸癰)이나 위옹(胃癰)에 써야 할 약이다. 또한 부인의 월경량이 지나치게 많은 것도 치료한다. 햇볕에 말려 가루내서 종이로 3겹 싼 다음 눌러 기름을 빼버리고 쓴다[본초] -과엽(瓜葉, 참외잎) ․머리털이 없는데 즙을 내어 바른다[본초] -과화(瓜花, 참외꽃) ․가슴앓이와 딸꾹질을 치료한다[본초] -야첨과(野甛瓜, 들참외) ․마박아(馬剝兒)라고도 하는데 맛이 시다[酸]. 참외같이 생겼으나 그보다 작다. 열격을 치료한다[입문] -백동과(白冬瓜, 동아) ․성질이 약간 차고[微寒](서늘하다[冷]고도 한다) 맛이 달며[甘] 독이 없다. 3가지 소갈병을 치료하고 몰린 병을 풀며 대소변을 잘 나가게 하고 광물성 약재의 독을 없앤다. 수창(水脹)과 가슴이 답답한 것을 낫게 한다. 일명 지지(地芝)라고도 하는데 덩굴이 뻗는다. 열매가 달리는데 처음에는 청록색이고 서리가 온 뒤에는 껍질이 분을 칠한 것처럼 허옇게 된다. 그러므로 백동과라고도 한다. 열이 있을 때 먹으면 좋으나 냉이 있을 때 먹으면 여위게 된다[본초]. 오래된 병이 있을 때와 음이 허한 사람은 먹지 말아야 한다[단심] -백동과자(白冬瓜子, 동아씨) ․동과자(冬瓜子)이다. 성질이 평(平)하고 차며[寒] 맛이 달고[甘] 독이 없다. 피부를 윤택하게 하고 얼굴빛이 좋아지게 하며 주근깨를 없앤다. 또한 이것으로 얼굴에 바르는 기름도 만든다. 서리가 내린 뒤나 음력 8월에 받아서 껍질은 버리고 알맹이만 약간 닦아[微炒]쓴다[입문] -백동과등(白冬瓜藤, 동아덩굴) ․태워 재를 내서 잿물을 받아 주근깨나 헌데나 옴을 씻는다[본초] -백동과엽(白冬瓜葉, 동아잎) ․벌한테 쏘인 독을 없앤다[본초]"},{"id":51,"name":"雄黃","aliases":[],"category":"外用藥","origin":"硫化物類의 광물인 雄黃族의 硫化砒素함유 웅황","initial":"기타","sortName":"雄黃","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫 有毒","肝 大腸","燥濕<br>祛風<br>殺蟲<br>解毒","疥癬, 禿瘡, 癰疳, 走馬牙疳, 破傷風, 蛇蟲蟄傷, 蟲積腹痛",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["外用藥"]}],["sec",{"key":"origin","label":"기원","lines":["硫化物類의 광물인 雄黃族의 硫化砒素함유 웅황"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫 有毒","肝 大腸","燥濕<br>祛風<br>殺蟲<br>解毒","疥癬, 禿瘡, 癰疳, 走馬牙疳, 破傷風, 蛇蟲蟄傷, 蟲積腹痛",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-解毒殺蟲作用이 비교적 强 : 外科의 要藥(痔疔瘡腫毒과 濕疹疥癬, 蛇蟲咬傷 등 症狀에 多用)","-毒性으로 인해 內服은 삼가","-만약 經火하면 그 毒이 殺人","-雄黃精, 腰黃, 雄黃, 雌黃으로 分類하나 모두 硫化砒素의 鑛石으로 雌黃이며, 性狀은 비슷하나","․雌黃은 全體가 黃色이고","․雄黃는 紅色 또는 橙紅色으로 차이","-일반적으로 雄黃精이 가장 品質이 좋고 雌黃은 次品이며 雄資은 下品에 속한다."]}],["sec",{"key":"qna","label":"본초문답","lines":["파두(p.197)참조","-...外利用巴豆爲末, 加雄黃炒至黑色, 爲烏金膏. 化腐肉 妙不傷好肉..."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-雄黃의 水浸劑는 시험관내에서 多種類의 皮膚眞菌에 대해 모두 억제작용을 보이며, 抗菌解毒作用이 뛰어나 外科에 常用","-各種瘡瘍腫毒 치료의 君藥/毒蛇咬傷에 內服 및 外用/帶狀疱疹에 대한 特效性이 있다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二四二 味苦甘辛, 性溫, 有毒하며 消痰涎하며 治癲癎嵐瘴瘧疾寒熱, 伏暑瀉痢, 酒癖, 頭風眩暈하며 化瘀血하며 殺精物鬼疰, 蠱毒邪氣, 中惡腹痛, 及蛇虺百蟲獸毒, 疥癩疳蟲䘌瘡하며 去鼻中瘜肉, 癰疽腐肉, 幷鼠瘻廣瘡疽痔等毒이라 欲逐毒蛇면 無如燒烟熏之며 其畏遁尤速이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-웅황(雄黃, 석웅황)","․성질은 평(平)하고 차며[寒] 맛은 달고[甘] 쓰며[苦] 독이 있다. 중악, 복통, 귀주를 낫게 하며 헛것에 들린 것, 나쁜 사기를 없앤다. 또 서루, 악창, 옹저, 치질, 궂은 살, 옴과 버짐, 익창을 낫게 하고 콧속의 군살, 힘줄이 끊어졌거나 뼈가 부서진 것을 낫게 하고 온갖 벌레독을 없애며 5가지 병기의 독과 박새뿌리독[藜蘆毒]을 풀 뿐 아니라 독사의 독을 잘 풀어 준다.","․석웅황을 차고 다니면 헛것이 가까이 오지 못하며 산 속으로 들어가면 호랑이도 숨어 버리며 큰 물이나 독한 물건에도 상하지 않는다고 했다.","․순순하여[純] 잡질[雜]이 섞이지 않고 닭의 볏같이 붉으면서 번쩍번쩍한 것이라야 쓸 수 있다. 또한 불에 태우면 근처의 벌레가 죽는 것이 진짜이다.","․깨끗하고 투명한 것은 석웅황이고 겉이 검은 것은 훈황(熏黃)이라 하는데 헌데와 옴에 쓴다[본초]","․산의 양지 쪽에서 캔 것은 석웅황이고 음지 쪽에서 캔 것은 자황(雌黃)이다. 그 빛이 닭의 볏처럼 붉고 투명한 것이 좋은 것이다. 보드랍게 가루내어 수비하여 약에 넣어 쓴다[입문]","․자황(紫黃)은 악창, 옴, 문둥병을 낫게 한다. 불에 달구워 식은 다음 보드랍게 가루내어 쓴다[입문]"]}]],"searchText":"雄黃 분류 外用藥 기원 硫化物類의 광물인 雄黃族의 硫化砒素함유 웅황 性味 歸經 效能 主治 備考 辛 溫 有毒 肝 大腸 燥濕<br>祛風<br>殺蟲<br>解毒 疥癬, 禿瘡, 癰疳, 走馬牙疳, 破傷風, 蛇蟲蟄傷, 蟲積腹痛  약물특징/비교 -解毒殺蟲作用이 비교적 强 : 外科의 要藥(痔疔瘡腫毒과 濕疹疥癬, 蛇蟲咬傷 등 症狀에 多用) -毒性으로 인해 內服은 삼가 -만약 經火하면 그 毒이 殺人 -雄黃精, 腰黃, 雄黃, 雌黃으로 分類하나 모두 硫化砒素의 鑛石으로 雌黃이며, 性狀은 비슷하나 ․雌黃은 全體가 黃色이고 ․雄黃는 紅色 또는 橙紅色으로 차이 -일반적으로 雄黃精이 가장 品質이 좋고 雌黃은 次品이며 雄資은 下品에 속한다. 본초문답 파두(p.197)참조 -...外利用巴豆爲末, 加雄黃炒至黑色, 爲烏金膏. 化腐肉 妙不傷好肉... 진존인본초 -雄黃의 水浸劑는 시험관내에서 多種類의 皮膚眞菌에 대해 모두 억제작용을 보이며, 抗菌解毒作用이 뛰어나 外科에 常用 -各種瘡瘍腫毒 치료의 君藥/毒蛇咬傷에 內服 및 外用/帶狀疱疹에 대한 特效性이 있다. 경악전서 二四二 味苦甘辛, 性溫, 有毒하며 消痰涎하며 治癲癎嵐瘴瘧疾寒熱, 伏暑瀉痢, 酒癖, 頭風眩暈하며 化瘀血하며 殺精物鬼疰, 蠱毒邪氣, 中惡腹痛, 及蛇虺百蟲獸毒, 疥癩疳蟲䘌瘡하며 去鼻中瘜肉, 癰疽腐肉, 幷鼠瘻廣瘡疽痔等毒이라 欲逐毒蛇면 無如燒烟熏之며 其畏遁尤速이라 동의보감 -웅황(雄黃, 석웅황) ․성질은 평(平)하고 차며[寒] 맛은 달고[甘] 쓰며[苦] 독이 있다. 중악, 복통, 귀주를 낫게 하며 헛것에 들린 것, 나쁜 사기를 없앤다. 또 서루, 악창, 옹저, 치질, 궂은 살, 옴과 버짐, 익창을 낫게 하고 콧속의 군살, 힘줄이 끊어졌거나 뼈가 부서진 것을 낫게 하고 온갖 벌레독을 없애며 5가지 병기의 독과 박새뿌리독[藜蘆毒]을 풀 뿐 아니라 독사의 독을 잘 풀어 준다. ․석웅황을 차고 다니면 헛것이 가까이 오지 못하며 산 속으로 들어가면 호랑이도 숨어 버리며 큰 물이나 독한 물건에도 상하지 않는다고 했다. ․순순하여[純] 잡질[雜]이 섞이지 않고 닭의 볏같이 붉으면서 번쩍번쩍한 것이라야 쓸 수 있다. 또한 불에 태우면 근처의 벌레가 죽는 것이 진짜이다. ․깨끗하고 투명한 것은 석웅황이고 겉이 검은 것은 훈황(熏黃)이라 하는데 헌데와 옴에 쓴다[본초] ․산의 양지 쪽에서 캔 것은 석웅황이고 음지 쪽에서 캔 것은 자황(雌黃)이다. 그 빛이 닭의 볏처럼 붉고 투명한 것이 좋은 것이다. 보드랍게 가루내어 수비하여 약에 넣어 쓴다[입문] ․자황(紫黃)은 악창, 옴, 문둥병을 낫게 한다. 불에 달구워 식은 다음 보드랍게 가루내어 쓴다[입문]"},{"id":52,"name":"石膏","aliases":[],"category":"淸熱藥-淸熱瀉火藥","origin":"硫酸鹽類에 속한 鑛物인 石膏","initial":"기타","sortName":"石膏","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 大寒","肺 胃","(生用) 解肌淸熱<br>除煩止渴<br>(煆敷) 生肌斂瘡","熱病壯熱不退, 心煩神昏, 譫語發狂, 口渴咽乾, 肺熱喘急, 中暑自汗, 胃火頭痛, 牙痛, 熱毒壅盛, 發斑發疹, 口舌生瘡<br>(外治) 癰疽瘡瘍, 潰不收口, 湯火燙傷",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱瀉火藥"]}],["sec",{"key":"origin","label":"기원","lines":["硫酸鹽類에 속한 鑛物인 石膏"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛甘 大寒","肺 胃","(生用) 解肌淸熱<br>除煩止渴<br>(煆敷) 生肌斂瘡","熱病壯熱不退, 心煩神昏, 譫語發狂, 口渴咽乾, 肺熱喘急, 中暑自汗, 胃火頭痛, 牙痛, 熱毒壅盛, 發斑發疹, 口舌生瘡<br>(外治) 癰疽瘡瘍, 潰不收口, 湯火燙傷",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-肺胃氣分의 實熱을 淸解하는 要藥","-“斑은 陽明熱毒으로 인하고 疹은 太陰風熱로 因한다”고하여 斑疹을 發하는 病은 肺胃의 鬱熱과 관계","-石膏는 肺熱氣分의 熱을 淸解하고 또 血藥을 도와 凉血解毒하기 때문에 邪熱이 鬱肺한 發疹과 邪熱이 營血에까지 波及된 發斑에도 사용 할 수 있다.","-다만 性이 大寒하므로 實熱이 있는 경우가 아니면 사용함이 마땅하지 않다.","-煆하면 淸熱작용이 크게 減하고 收斂作用을 갖기 때문에 硏末外敷하면 生肌斂瘡하므로 外科에 常用"]}],["sec",{"key":"qna","label":"본초문답","lines":["-況人身六氣, 熱與火格不同. 熱是氣分之熱, 故淸熱者, 以石膏花粉爲主, 以其入氣分也; 火是血分, 故瀉火者, 必以黃蓮黃芩爲主, 以其入血分也(p49-50)","-暑變瘟疫, 石膏‧黃蓮爲主, 總之不可發表(用表則發熱而蒸濕), 但宜瀉熱利濕(p167)","-竹葉‧寒水石‧石膏, 均稟天水之寒氣, 故治一切熱(p177-178)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-竹葉石膏湯(生석고+담죽엽) : 口渴煩燥","-白虎湯(煆석고+지모‧감초, 米湯) : 고열에 무리한 발한→發汗過多, 수족發冷, 譫語 遺尿","-麻杏甘石湯 : 高熱證+호흡촉박","-皮膚紅腫疼痛에 생석고분말 도포→炎症, 浮氣를 消하고 화농방지","-해열성분은 천연석고에 함유된 雜質"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二五一 味甘辛, 氣大寒하며 氣味俱薄이나 體重能沈, 氣輕能升하야 陰中有陽이라","欲其緩者는 煅用하며 欲其速者는 生用이라 用此者는 用其寒散淸肅이니 善祛肺胃三焦之火나 而尤爲陽明經之要藥이라 辛能出汗解肌하니 最逐溫暑熱證而除頭痛하며 甘能緩脾淸氣하니 極能生津止渴而却熱煩이라 邪火盛者不食하며 胃火盛者多食에 皆其所長하며 陽明實熱牙疼하며 太陰火盛痰喘하며 及陽狂熱結熱毒, 發斑發黃, 火載血上, 大吐大嘔, 大便熱秘等證에 皆當速用이나 胃虛弱者는 忌服이며 陰虛熱者는 禁嘗이니 若誤用之 則敗陽作瀉하야 必反害人이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-돌림병으로 머리가 아프고 몸에 열이 나는 것과 3초로 열이 몹시 나는 것, 피부열, 입이 마르고 혀가 타며 목구멍이 다는 증을 낫게 한다. 또 소갈증을 낫게 하고 해기(解肌)해서 땀을 내게 하고 위의 화[胃火]를 사한다.","-석고는 바위 곁에서 나며 바둑씨 같고 안팎이 온통 흰 것이 가장 좋다. 본래 옥같이 말갛고 결이 가늘며 희고 윤택한 것이 좋다. 누른 것은 임병을 생기게 한다[본초]","-수태음경과 수소양경, 족양명경에 들어간다. 위 속에 열이 있는 것, 열이 나는 것, 열을 싫어하는 것, 조열(燥熱), 오후마다 나는 조열, 저절로 땀이 나는 증 등을 낫게 한다[탕액]","-부스러뜨리고 갈아서 가루내어 생감초 달인 물에 수비하며 햇볕에 말리어 쓰거나 불에 달구어 갈아서 수비하여 쓴다[입문]"]}]],"searchText":"石膏 분류 淸熱藥-淸熱瀉火藥 기원 硫酸鹽類에 속한 鑛物인 石膏 性味 歸經 效能 主治 備考 辛甘 大寒 肺 胃 (生用) 解肌淸熱<br>除煩止渴<br>(煆敷) 生肌斂瘡 熱病壯熱不退, 心煩神昏, 譫語發狂, 口渴咽乾, 肺熱喘急, 中暑自汗, 胃火頭痛, 牙痛, 熱毒壅盛, 發斑發疹, 口舌生瘡<br>(外治) 癰疽瘡瘍, 潰不收口, 湯火燙傷  약물특징/비교 -肺胃氣分의 實熱을 淸解하는 要藥 -“斑은 陽明熱毒으로 인하고 疹은 太陰風熱로 因한다”고하여 斑疹을 發하는 病은 肺胃의 鬱熱과 관계 -石膏는 肺熱氣分의 熱을 淸解하고 또 血藥을 도와 凉血解毒하기 때문에 邪熱이 鬱肺한 發疹과 邪熱이 營血에까지 波及된 發斑에도 사용 할 수 있다. -다만 性이 大寒하므로 實熱이 있는 경우가 아니면 사용함이 마땅하지 않다. -煆하면 淸熱작용이 크게 減하고 收斂作用을 갖기 때문에 硏末外敷하면 生肌斂瘡하므로 外科에 常用 본초문답 -況人身六氣, 熱與火格不同. 熱是氣分之熱, 故淸熱者, 以石膏花粉爲主, 以其入氣分也; 火是血分, 故瀉火者, 必以黃蓮黃芩爲主, 以其入血分也(p49-50) -暑變瘟疫, 石膏‧黃蓮爲主, 總之不可發表(用表則發熱而蒸濕), 但宜瀉熱利濕(p167) -竹葉‧寒水石‧石膏, 均稟天水之寒氣, 故治一切熱(p177-178) 진존인본초 -竹葉石膏湯(生석고+담죽엽) : 口渴煩燥 -白虎湯(煆석고+지모‧감초, 米湯) : 고열에 무리한 발한→發汗過多, 수족發冷, 譫語 遺尿 -麻杏甘石湯 : 高熱證+호흡촉박 -皮膚紅腫疼痛에 생석고분말 도포→炎症, 浮氣를 消하고 화농방지 -해열성분은 천연석고에 함유된 雜質 경악전서 二五一 味甘辛, 氣大寒하며 氣味俱薄이나 體重能沈, 氣輕能升하야 陰中有陽이라 欲其緩者는 煅用하며 欲其速者는 生用이라 用此者는 用其寒散淸肅이니 善祛肺胃三焦之火나 而尤爲陽明經之要藥이라 辛能出汗解肌하니 最逐溫暑熱證而除頭痛하며 甘能緩脾淸氣하니 極能生津止渴而却熱煩이라 邪火盛者不食하며 胃火盛者多食에 皆其所長하며 陽明實熱牙疼하며 太陰火盛痰喘하며 及陽狂熱結熱毒, 發斑發黃, 火載血上, 大吐大嘔, 大便熱秘等證에 皆當速用이나 胃虛弱者는 忌服이며 陰虛熱者는 禁嘗이니 若誤用之 則敗陽作瀉하야 必反害人이라 동의보감 -돌림병으로 머리가 아프고 몸에 열이 나는 것과 3초로 열이 몹시 나는 것, 피부열, 입이 마르고 혀가 타며 목구멍이 다는 증을 낫게 한다. 또 소갈증을 낫게 하고 해기(解肌)해서 땀을 내게 하고 위의 화[胃火]를 사한다. -석고는 바위 곁에서 나며 바둑씨 같고 안팎이 온통 흰 것이 가장 좋다. 본래 옥같이 말갛고 결이 가늘며 희고 윤택한 것이 좋다. 누른 것은 임병을 생기게 한다[본초] -수태음경과 수소양경, 족양명경에 들어간다. 위 속에 열이 있는 것, 열이 나는 것, 열을 싫어하는 것, 조열(燥熱), 오후마다 나는 조열, 저절로 땀이 나는 증 등을 낫게 한다[탕액] -부스러뜨리고 갈아서 가루내어 생감초 달인 물에 수비하며 햇볕에 말리어 쓰거나 불에 달구어 갈아서 수비하여 쓴다[입문]"},{"id":53,"name":"凝水石, 寒水石","aliases":[],"category":"淸熱藥-淸熱瀉火藥","origin":"황산염류 광물인 석회망초의 천연결정체","initial":"기타","sortName":"凝水石, 寒水石","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛鹹 寒","心 胃 腎","淸熱降火<br>利竅<br>消腫","時行熱病, 積熱煩渴, 吐瀉, 水腫, 齒衄, 丹毒, 燙傷",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱瀉火藥"]}],["sec",{"key":"origin","label":"기원","lines":["황산염류 광물인 석회망초의 천연결정체"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛鹹 寒","心 胃 腎","淸熱降火<br>利竅<br>消腫","時行熱病, 積熱煩渴, 吐瀉, 水腫, 齒衄, 丹毒, 燙傷",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-氣가 大寒하고 味가 辛鹹하며 入腎走血하는 效能이 모든 鹽과 같다","-古方에서는 凝水石을 寒水石으로 사용하였으나","․唐宋代의 諸方에는 石膏를 寒水石으로 사용하였고","․明代에 이르러서는 方解石을 寒水石으로 사용하였다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-紫雪丹不用大黃 以用石膏 芒硝 犀角 羚羊 寒水石 金箔 皆本天水之陰 以淸熱也(p178)","-寒水石 得水氣以淸熱(p180)"]}],["sec",{"key":"dong","label":"동의보감","lines":["-5장에 있는 열, 위(胃)에 있는 열, 몸에 있는 열, 답답하고 그득한 증, 피부 속이 불같이 뜨거운 증 등을 낫게 하고 갈증을 멈추고 부종을 내린다.","-일명 응수석(凝水石) 또는 작석(鵲石)이라고도 하며 그 빛은 운모 비슷하고 잘 꺾어지는 것이 좋은데 이것은 소금의 정기[鹽之精]이다[본초]","-불에 달구어 가루낸 다음 수비하여 쓴다[입문]"]}]],"searchText":"凝水石, 寒水石 분류 淸熱藥-淸熱瀉火藥 기원 황산염류 광물인 석회망초의 천연결정체 性味 歸經 效能 主治 備考 辛鹹 寒 心 胃 腎 淸熱降火<br>利竅<br>消腫 時行熱病, 積熱煩渴, 吐瀉, 水腫, 齒衄, 丹毒, 燙傷  약물특징/비교 -氣가 大寒하고 味가 辛鹹하며 入腎走血하는 效能이 모든 鹽과 같다 -古方에서는 凝水石을 寒水石으로 사용하였으나 ․唐宋代의 諸方에는 石膏를 寒水石으로 사용하였고 ․明代에 이르러서는 方解石을 寒水石으로 사용하였다. 본초문답 -紫雪丹不用大黃 以用石膏 芒硝 犀角 羚羊 寒水石 金箔 皆本天水之陰 以淸熱也(p178) -寒水石 得水氣以淸熱(p180) 동의보감 -5장에 있는 열, 위(胃)에 있는 열, 몸에 있는 열, 답답하고 그득한 증, 피부 속이 불같이 뜨거운 증 등을 낫게 하고 갈증을 멈추고 부종을 내린다. -일명 응수석(凝水石) 또는 작석(鵲石)이라고도 하며 그 빛은 운모 비슷하고 잘 꺾어지는 것이 좋은데 이것은 소금의 정기[鹽之精]이다[본초] -불에 달구어 가루낸 다음 수비하여 쓴다[입문]"},{"id":54,"name":"乾薑","aliases":[],"category":"溫裏藥","origin":"生薑科 生薑의 根莖건조","initial":"기타","sortName":"乾薑","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 熱","脾 胃 肺","溫中逐寒<br>回陽通脈","心腹冷痛, 吐瀉, 肢冷脈微, 寒飮喘咳, 風寒濕痺, 陽虛吐衄, 下血",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["溫裏藥"]}],["sec",{"key":"origin","label":"기원","lines":["生薑科 生薑의 根莖건조"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 熱","脾 胃 肺","溫中逐寒<br>回陽通脈","心腹冷痛, 吐瀉, 肢冷脈微, 寒飮喘咳, 風寒濕痺, 陽虛吐衄, 下血",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-薑에는 生薑 乾薑 炮薑이 있는데,","․生薑(走而不守)은 辛溫하여 發散을 위주로 하고 溫中止嘔하므로 外感風寒과 胃寒嘔吐에 常用","․乾薑(能走能守)은 性熱하고 辛烈의 성이 비교적 강하여 溫中回陽하고 溫肺化痰하여 裏寒의 證狀을 治療","․炮薑(守而不走)은 炒한 것으로 性은 苦溫으로 變하고 辛散하는 作用을 크게 減少시키고 溫經止血과 溫中止瀉를 잘 하므로 中焦가 虛寒한 것을 治療하고 脾不統血의 要藥","-乾薑과 附子는 모두 辛熱하여 祛寒의 要藥으로 溫裏‧回陽‧祛寒의 作用이 있어 임상에서 같이 사용","․附子는 回陽救逆의 힘이 강하고 오로지 下焦에 작용, 더불어 溫中하는 效果(腎陽이 衰弱할 때)","․乾薑은 溫中暖胃의 힘이 强하여 오직 中焦에 作用하고 또한 溫肺의 效能(肺寒咳喘에는)","․中焦가 虛寒하고 陽氣가 不運하면 乾薑과 附子를 같이 사용(回逆湯, 附子理中湯)","-溫補下焦하려면 附子를 쓰고 乾薑은 쓰지 않는다. 예)右歸丸, 腎氣丸","溫肺化飮하려면 乾薑을 쓰고 附子는 쓰지 않는다. 예)笭甘五味薑辛湯, 小靑龍湯","-주요구별은 附子가 中下二焦에 있고, 乾薑은 上中焦를 主治함을 알 수 있다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-肺主行水, 寒傷肺陽, 水不得行, 則停胃而爲飮, 上逆氣咳, 仲景用細辛以行水, 用乾薑以散寒, 用麻桂以驅寒外出, 小靑龍湯是也(p151)","-但溫肺而不兼胃治者, 則用甘草乾薑湯, 其薑炮過, 則輕而上浮, 故但溫肺, ..","-寒水犯中宮, 上吐下瀉, 爲癨亂洞泄, 乾薑溫中故主之, 砂仁白寇良薑亦治之(p152)","-白寇‧乾薑等, 皆治寒濕(p161)","-其有火不蒸水, 而津液不升,..理中湯之有口渴症, 宜用乾薑. ..皆是治火不蒸水之燥(p172)","-乾薑補脾火, 是以土治水(p210)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-乾薑에 함유된 Zingiberene‧Zingiberol‧Gingerol 등은 胃의 消化吸收力을 增進하고, 胃液의 分泌와 蠕動을 증가하며 胃筋肉의 收縮을 강화한다.","-乾薑은 血管運動中樞와 交感神經에 反射性의 興奮을 일으켜 血壓을 上升케한다.","-溫熱하여 消化器의 虛寒證과 婦人科의 出血‧虛痛證에 주로 적응"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["二二三 味辛微苦하며 性溫熱이라","生者는 能散寒發汗하고","熟煮는 能溫中調脾하야 善通神明, 去穢惡, 通四肢關竅, 開五臟六腑하고 消痰下氣, 除轉筋霍亂하고 逐風濕冷痺, 陰寒諸毒, 寒痞脹滿, 腰腹疼痛, 撲損瘀血, 夜多小便이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-5장 6부를 잘 통하게 하고 팔다리와 뼈마디를 잘 놀릴 수 있게 하며 풍, 한, 습비를 몰아낸다. 곽란으로 토하고 설사하는 것과 찬 기운으로 명치가 아픈 것, 설사와 이질을 치료한다. 비위를 덥게 하고 오래된 식체를 삭히며 냉담(冷痰)을 없앤다.","-생강으로 건강을 만드는 방법이 있다(자세한 것은 잡방문(雜方門)에 있다).","-물에 씻어서 싼 다음 약한 불에 구워 쓴다. 싸서 구운 것은 속을 덥히고[溫] 생것은 발산시킨다. 피를 멎게 하려면 새까맣게 되도록 볶아서[炒] 써야 한다[탕액]","-건강을 많이 쓰면 正氣가 줄어드는데 이렇게 된 때에는 생감초를 써서 완화시켜야 한다[단심]","-건강을 불에 법제하면 약 기운이 머물러 있게 된다. 그러므로 속이 찬 증이 치료된다[단심]"]}]],"searchText":"乾薑 분류 溫裏藥 기원 生薑科 生薑의 根莖건조 性味 歸經 效能 主治 備考 辛 熱 脾 胃 肺 溫中逐寒<br>回陽通脈 心腹冷痛, 吐瀉, 肢冷脈微, 寒飮喘咳, 風寒濕痺, 陽虛吐衄, 下血  약물특징/비교 -薑에는 生薑 乾薑 炮薑이 있는데, ․生薑(走而不守)은 辛溫하여 發散을 위주로 하고 溫中止嘔하므로 外感風寒과 胃寒嘔吐에 常用 ․乾薑(能走能守)은 性熱하고 辛烈의 성이 비교적 강하여 溫中回陽하고 溫肺化痰하여 裏寒의 證狀을 治療 ․炮薑(守而不走)은 炒한 것으로 性은 苦溫으로 變하고 辛散하는 作用을 크게 減少시키고 溫經止血과 溫中止瀉를 잘 하므로 中焦가 虛寒한 것을 治療하고 脾不統血의 要藥 -乾薑과 附子는 모두 辛熱하여 祛寒의 要藥으로 溫裏‧回陽‧祛寒의 作用이 있어 임상에서 같이 사용 ․附子는 回陽救逆의 힘이 강하고 오로지 下焦에 작용, 더불어 溫中하는 效果(腎陽이 衰弱할 때) ․乾薑은 溫中暖胃의 힘이 强하여 오직 中焦에 作用하고 또한 溫肺의 效能(肺寒咳喘에는) ․中焦가 虛寒하고 陽氣가 不運하면 乾薑과 附子를 같이 사용(回逆湯, 附子理中湯) -溫補下焦하려면 附子를 쓰고 乾薑은 쓰지 않는다. 예)右歸丸, 腎氣丸 溫肺化飮하려면 乾薑을 쓰고 附子는 쓰지 않는다. 예)笭甘五味薑辛湯, 小靑龍湯 -주요구별은 附子가 中下二焦에 있고, 乾薑은 上中焦를 主治함을 알 수 있다. 본초문답 -肺主行水, 寒傷肺陽, 水不得行, 則停胃而爲飮, 上逆氣咳, 仲景用細辛以行水, 用乾薑以散寒, 用麻桂以驅寒外出, 小靑龍湯是也(p151) -但溫肺而不兼胃治者, 則用甘草乾薑湯, 其薑炮過, 則輕而上浮, 故但溫肺, .. -寒水犯中宮, 上吐下瀉, 爲癨亂洞泄, 乾薑溫中故主之, 砂仁白寇良薑亦治之(p152) -白寇‧乾薑等, 皆治寒濕(p161) -其有火不蒸水, 而津液不升,..理中湯之有口渴症, 宜用乾薑. ..皆是治火不蒸水之燥(p172) -乾薑補脾火, 是以土治水(p210) 진존인본초 -乾薑에 함유된 Zingiberene‧Zingiberol‧Gingerol 등은 胃의 消化吸收力을 增進하고, 胃液의 分泌와 蠕動을 증가하며 胃筋肉의 收縮을 강화한다. -乾薑은 血管運動中樞와 交感神經에 反射性의 興奮을 일으켜 血壓을 上升케한다. -溫熱하여 消化器의 虛寒證과 婦人科의 出血‧虛痛證에 주로 적응 경악전서 二二三 味辛微苦하며 性溫熱이라 生者는 能散寒發汗하고 熟煮는 能溫中調脾하야 善通神明, 去穢惡, 通四肢關竅, 開五臟六腑하고 消痰下氣, 除轉筋霍亂하고 逐風濕冷痺, 陰寒諸毒, 寒痞脹滿, 腰腹疼痛, 撲損瘀血, 夜多小便이라 동의보감 -5장 6부를 잘 통하게 하고 팔다리와 뼈마디를 잘 놀릴 수 있게 하며 풍, 한, 습비를 몰아낸다. 곽란으로 토하고 설사하는 것과 찬 기운으로 명치가 아픈 것, 설사와 이질을 치료한다. 비위를 덥게 하고 오래된 식체를 삭히며 냉담(冷痰)을 없앤다. -생강으로 건강을 만드는 방법이 있다(자세한 것은 잡방문(雜方門)에 있다). -물에 씻어서 싼 다음 약한 불에 구워 쓴다. 싸서 구운 것은 속을 덥히고[溫] 생것은 발산시킨다. 피를 멎게 하려면 새까맣게 되도록 볶아서[炒] 써야 한다[탕액] -건강을 많이 쓰면 正氣가 줄어드는데 이렇게 된 때에는 생감초를 써서 완화시켜야 한다[단심] -건강을 불에 법제하면 약 기운이 머물러 있게 된다. 그러므로 속이 찬 증이 치료된다[단심]"},{"id":55,"name":"生薑","aliases":[],"category":"解表藥-發散風寒藥","origin":"생강과 생강의 根莖","initial":"기타","sortName":"生薑","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","肺 脾 胃","解表散寒<br>溫中止嘔<br>化痰止咳<br>解毒","外感風寒<br>胃寒嘔吐, 脹滿, 泄瀉<br>寒痰咳嗽, 喘咳<br>半夏天南星毒",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風寒藥"]}],["sec",{"key":"origin","label":"기원","lines":["생강과 생강의 根莖"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛 溫","肺 脾 胃","解表散寒<br>溫中止嘔<br>化痰止咳<br>解毒","外感風寒<br>胃寒嘔吐, 脹滿, 泄瀉<br>寒痰咳嗽, 喘咳<br>半夏天南星毒",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-風寒邪를 散하여 解表하는데 效能이 弱 → 感冒에 있어 輕한 證에 多用","-重證일 때는 반드시 다른 辛溫解表藥과 同用해야 하고 生薑은 輔助藥으로 應用","-溫中降逆시켜 止嘔시키는 要藥(嘔家에 聖藥)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-生薑其氣升散, 而又能降氣止嘔者, 因其味較勝, 且係土中之根, 是兼地火之味, 而歸於根, 故能降氣止嘔, 雖能升散, 而與麻桂之純升者不同, 故小柴胡二陳湯, 皆用之以止嘔(p68)","-呑酸‧吐酸, 有二病, 一是寒濕 宜吳萸 蒼朮 桂枝 生薑 ..(p162)","-補火之藥, 是火能化水也, 故能行血, 薑艾是矣(p199)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-薑에 함유된 Gingerol은 구강점막 및 위점막을 刺戟하여 消化液의 分泌를 촉진하고, 胃寒病에 대해 胃의 蠕動을 강화 소화흡수력을 높히고, 腸內 이상발효억제 및 가스배출을 촉진","-圓形탈모증에는 껍질을 벗긴 생강을 환부가 따끔거릴 때까지 反復塗擦을 10일간 계속."]}],["sec",{"key":"dong","label":"동의보감","lines":["-성질이 약간 따뜻하고[微溫] 맛이 매우며[辛] 독이 없다. 5장으로 들어가고 담을 삭히며 기를 내리고 토하는 것을 멎게 한다. 또한 풍한사와 습기를 없애고 딸꾹질하며 기운이 치미는 것과 숨이 차고 기침하는 것을 치료한다.","-이 약의 성질은 따뜻하나[溫] 껍질의 성질은 차다[寒]. 그러므로 반드시 뜨겁게 하려면 껍질을 버려야 하고 차게 하려면 껍질째로 써야 한다[본초]","-끼무릇(반하), 천남성, 후박의 독을 잘 없애고 토하는 것과 반위(反胃)를 멎게 하는 데 좋은 약이다[탕액]","-옛날에 생강을 먹는 것을 그만두지 말라고 한 것은 늘 먹으라는 말이다. 그러나 많이 먹지 말아야 하며 밤에 먹어서는 안 된다. 또한 음력 8-9월에 생강을 많이 먹으면 봄에 가서 눈병이 생기고 오래 살지 못하게 되며 힘이 없어진다[본초]","-우리나라 전주에서 많이 난다[속방]","-백강(白薑)은 껍질을 벗기고 말려 띄우지 않은 것인데 빛이 희다. 폐(肺)와 위(胃)에 있는 한사(寒邪)를 없앤다[입문]","-건생강(乾生薑, 말린생강)는 껍질째로 말린 것이다. 비위에 있는 한사와 습사를 없앤다[입문]"]}]],"searchText":"生薑 분류 解表藥-發散風寒藥 기원 생강과 생강의 根莖 性味 歸經 效能 主治 備考 辛 溫 肺 脾 胃 解表散寒<br>溫中止嘔<br>化痰止咳<br>解毒 外感風寒<br>胃寒嘔吐, 脹滿, 泄瀉<br>寒痰咳嗽, 喘咳<br>半夏天南星毒  약물특징/비교 -風寒邪를 散하여 解表하는데 效能이 弱 → 感冒에 있어 輕한 證에 多用 -重證일 때는 반드시 다른 辛溫解表藥과 同用해야 하고 生薑은 輔助藥으로 應用 -溫中降逆시켜 止嘔시키는 要藥(嘔家에 聖藥) 본초문답 -生薑其氣升散, 而又能降氣止嘔者, 因其味較勝, 且係土中之根, 是兼地火之味, 而歸於根, 故能降氣止嘔, 雖能升散, 而與麻桂之純升者不同, 故小柴胡二陳湯, 皆用之以止嘔(p68) -呑酸‧吐酸, 有二病, 一是寒濕 宜吳萸 蒼朮 桂枝 生薑 ..(p162) -補火之藥, 是火能化水也, 故能行血, 薑艾是矣(p199) 진존인본초 -薑에 함유된 Gingerol은 구강점막 및 위점막을 刺戟하여 消化液의 分泌를 촉진하고, 胃寒病에 대해 胃의 蠕動을 강화 소화흡수력을 높히고, 腸內 이상발효억제 및 가스배출을 촉진 -圓形탈모증에는 껍질을 벗긴 생강을 환부가 따끔거릴 때까지 反復塗擦을 10일간 계속. 동의보감 -성질이 약간 따뜻하고[微溫] 맛이 매우며[辛] 독이 없다. 5장으로 들어가고 담을 삭히며 기를 내리고 토하는 것을 멎게 한다. 또한 풍한사와 습기를 없애고 딸꾹질하며 기운이 치미는 것과 숨이 차고 기침하는 것을 치료한다. -이 약의 성질은 따뜻하나[溫] 껍질의 성질은 차다[寒]. 그러므로 반드시 뜨겁게 하려면 껍질을 버려야 하고 차게 하려면 껍질째로 써야 한다[본초] -끼무릇(반하), 천남성, 후박의 독을 잘 없애고 토하는 것과 반위(反胃)를 멎게 하는 데 좋은 약이다[탕액] -옛날에 생강을 먹는 것을 그만두지 말라고 한 것은 늘 먹으라는 말이다. 그러나 많이 먹지 말아야 하며 밤에 먹어서는 안 된다. 또한 음력 8-9월에 생강을 많이 먹으면 봄에 가서 눈병이 생기고 오래 살지 못하게 되며 힘이 없어진다[본초] -우리나라 전주에서 많이 난다[속방] -백강(白薑)은 껍질을 벗기고 말려 띄우지 않은 것인데 빛이 희다. 폐(肺)와 위(胃)에 있는 한사(寒邪)를 없앤다[입문] -건생강(乾生薑, 말린생강)는 껍질째로 말린 것이다. 비위에 있는 한사와 습사를 없앤다[입문]"},{"id":56,"name":"葛根","aliases":[],"category":"解表藥-發散風熱藥","origin":"豆科 칡의 뿌리","initial":"기타","sortName":"葛根","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘辛 平凉","脾 胃","升陽解肌<br>透疹止瀉<br>除煩止渴","傷寒溫熱,頭痛項强,高血壓頸項强痛<br>麻疹不透,熱痢,泄瀉<br>口渴,消渴",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風熱藥"]}],["sec",{"key":"origin","label":"기원","lines":["豆科 칡의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘辛 平凉","脾 胃","升陽解肌<br>透疹止瀉<br>除煩止渴","傷寒溫熱,頭痛項强,高血壓頸項强痛<br>麻疹不透,熱痢,泄瀉<br>口渴,消渴",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-陽明胃經의 要藥(陽明은 肌肉을 主管)","-表證에 項背가 强한 症에 마땅하다","-生用하면 解表, 透疹, 生津하고, 煨用하면 止瀉케 한다."]}],["sec",{"key":"qna","label":"본초문답","lines":["-羌獨葛根, 皆根深, 能以地中水氣, 上達於苗葉, 其苗又極長, 象人身太陽經, 從膀胱水中, 達陽氣於經脈, 以衛周身, 故二物均入太陽經, 羌獨氣味更新烈, 故發散而能傷血; 葛根氣味較平, 故發散之性輕, 而不傷血, 根深能引水氣, 上達苗葉, 故兼能升津液也(p69)","-葛根與升麻不同, 葛根根實, 故升津而不升氣; 升摩根空, 有孔道而行氣, 故升氣而不升津(p89)","-葛根色白, 味微苦, 故升而淸火, 不能補也...(p91)","-傷暑變瘧, 貴於散濕淸熱, 三焦膀胱之小便淸, 則瘧自除, 土茯笭‧豬苓‧葛根‧獨活, 散濕以治太陽膀胱; 黃芩‧鱉甲‧淸皮‧膽草, 淸熱以利少陽三焦, 兩腑兼治爲宜.","-寒循太陽經, 發爲痙, 用葛根引桂麻, 循經脈以散之(p150)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-葛根에는 플라보노이드‧전분이 함유. 解熱‧血糖降下作用과 穩和한 降壓作用 및 腦循環‧末梢循環 개선작용이 있다.","-藥理硏究에 의하면 Puerarin은 血管의 抵抗을 弱化시켜 腦血管 및 冠狀動脈의 循環을 좋게하고 心根의 산소消耗를 감소시키며, 腦血栓 및 腦溢血에서 오는 半身不遂의 치료에 사용하면 血栓을 溶解하여 腦血管의 血流量을 증가시키는 작용을 한다.","-發汗의 효력은 麻黃‧桂枝‧防風에 미치지 않으나 解熱作用은 보다 强하다.","-葛花는 性味가 平甘하며, 酒毒을 풀어준다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["百十二 味甘, 氣平寒하며 氣輕於味하며 浮而微降하니 陽中微陰이라","用此者는 用其凉散,이니 雖善達諸陽經, 而陽明爲最며 以其氣輕 故로 善解表發汗이라 凡解散之藥이 多辛熱이나 此獨凉而甘 故로 解溫熱時行疫疾이라 凡熱而兼渴者에 此爲最良이니 當以爲君 而佐以柴‧防‧甘‧桔이며 極妙하며 尤散鬱火하며 療頭痛하며 治溫瘧往來, 瘡疹未透하며 解酒除煩, 生津止渴하며 除胃中熱狂하며 殺野葛‧巴豆‧毒箭‧金瘡等傷이나 但其性凉하야 易於動嘔하니 胃寒者엔 所當愼用이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-갈근(葛根)은 풍한으로 머리가 아픈 것을 낫게 하며 땀이 나게 하여 표(表)를 풀어 주고 땀구멍을 열어 주며 술독을 푼다. 번갈을 멈추며 음식맛을 나게 하고 소화를 잘 되게 하며 가슴에 열을 없애고 소장을 잘 통하게 하며 쇠붙이에 다친 것을 낫게 한다.","-산에서 자라는데 곳곳에 다 있다. 음력 5월 초에 뿌리를 캐어서 햇볕에 말린다. 땅 속 깊이 들어간 것이 좋다[본초]","-일명 녹곽(鹿藿)이라고도 한다[본초]","-족양명경에 인경하는 약이다. 족양명경에 들어가서 진액이 생기게 하고 갈증을 멎게 한다. 허해서 나는 갈증은 갈근이 아니면 멈출 수 없다. 술로 생긴 병이나 갈증이 있는데 쓰면 아주 좋다. 또한 온학과 消渴도 치료한다[탕액]","-갈생근(葛生根, 생칡뿌리)은 어혈을 헤치며 헌데를 아물게 하고 유산을 시키며[墮胎解] 술독으로 열이 나는 것과 술로 황달이 생겨 오줌이 붉고 잘 나가지 않는 것을 낫게 한다.","-생뿌리를 짓찧어 즙을 내어 마시면 소갈, 상한, 온병으로 열이 몹시 나는 것이 내린다[본초]","-갈곡(葛穀, 칡씨)은 10년 이상 된 설사를 멎게 한다[본초]","-갈엽(葛葉, 칡잎)는 쇠붙이에 상한 것을 낫게 하며 피를 멎게 한다. 짓찧어서 붙인다[본초]","-갈화(葛花, 칡꽃)는 술독을 없앤다.","-갈화와 팥꽃(소두화)을 같은 양으로 가루내어 먹으면 술을 마셔도 취하는 줄 모른다[본초]","-갈분(葛粉, 칡가루)은 번갈을 멎게 하고 대소변을 잘 나가게 한다. 어린이가 열이 나면서 명치 밑이 트직해지는 데 쓴다[본초]","-생칡뿌리를 캐어 푹 짓찧어 물에 담갔다가 주물러 앙금을 앉히면 넓적한 덩어리가 된다. 이것을 끓는 물에 풀고 생꿀을 타서 먹으면 술마신 사람의 갈증이 아주 잘 풀린다[입문]"]}]],"searchText":"葛根 분류 解表藥-發散風熱藥 기원 豆科 칡의 뿌리 性味 歸經 效能 主治 備考 甘辛 平凉 脾 胃 升陽解肌<br>透疹止瀉<br>除煩止渴 傷寒溫熱,頭痛項强,高血壓頸項强痛<br>麻疹不透,熱痢,泄瀉<br>口渴,消渴  약물특징/비교 -陽明胃經의 要藥(陽明은 肌肉을 主管) -表證에 項背가 强한 症에 마땅하다 -生用하면 解表, 透疹, 生津하고, 煨用하면 止瀉케 한다. 본초문답 -羌獨葛根, 皆根深, 能以地中水氣, 上達於苗葉, 其苗又極長, 象人身太陽經, 從膀胱水中, 達陽氣於經脈, 以衛周身, 故二物均入太陽經, 羌獨氣味更新烈, 故發散而能傷血; 葛根氣味較平, 故發散之性輕, 而不傷血, 根深能引水氣, 上達苗葉, 故兼能升津液也(p69) -葛根與升麻不同, 葛根根實, 故升津而不升氣; 升摩根空, 有孔道而行氣, 故升氣而不升津(p89) -葛根色白, 味微苦, 故升而淸火, 不能補也...(p91) -傷暑變瘧, 貴於散濕淸熱, 三焦膀胱之小便淸, 則瘧自除, 土茯笭‧豬苓‧葛根‧獨活, 散濕以治太陽膀胱; 黃芩‧鱉甲‧淸皮‧膽草, 淸熱以利少陽三焦, 兩腑兼治爲宜. -寒循太陽經, 發爲痙, 用葛根引桂麻, 循經脈以散之(p150) 진존인본초 -葛根에는 플라보노이드‧전분이 함유. 解熱‧血糖降下作用과 穩和한 降壓作用 및 腦循環‧末梢循環 개선작용이 있다. -藥理硏究에 의하면 Puerarin은 血管의 抵抗을 弱化시켜 腦血管 및 冠狀動脈의 循環을 좋게하고 心根의 산소消耗를 감소시키며, 腦血栓 및 腦溢血에서 오는 半身不遂의 치료에 사용하면 血栓을 溶解하여 腦血管의 血流量을 증가시키는 작용을 한다. -發汗의 효력은 麻黃‧桂枝‧防風에 미치지 않으나 解熱作用은 보다 强하다. -葛花는 性味가 平甘하며, 酒毒을 풀어준다. 경악전서 百十二 味甘, 氣平寒하며 氣輕於味하며 浮而微降하니 陽中微陰이라 用此者는 用其凉散,이니 雖善達諸陽經, 而陽明爲最며 以其氣輕 故로 善解表發汗이라 凡解散之藥이 多辛熱이나 此獨凉而甘 故로 解溫熱時行疫疾이라 凡熱而兼渴者에 此爲最良이니 當以爲君 而佐以柴‧防‧甘‧桔이며 極妙하며 尤散鬱火하며 療頭痛하며 治溫瘧往來, 瘡疹未透하며 解酒除煩, 生津止渴하며 除胃中熱狂하며 殺野葛‧巴豆‧毒箭‧金瘡等傷이나 但其性凉하야 易於動嘔하니 胃寒者엔 所當愼用이라 동의보감 -갈근(葛根)은 풍한으로 머리가 아픈 것을 낫게 하며 땀이 나게 하여 표(表)를 풀어 주고 땀구멍을 열어 주며 술독을 푼다. 번갈을 멈추며 음식맛을 나게 하고 소화를 잘 되게 하며 가슴에 열을 없애고 소장을 잘 통하게 하며 쇠붙이에 다친 것을 낫게 한다. -산에서 자라는데 곳곳에 다 있다. 음력 5월 초에 뿌리를 캐어서 햇볕에 말린다. 땅 속 깊이 들어간 것이 좋다[본초] -일명 녹곽(鹿藿)이라고도 한다[본초] -족양명경에 인경하는 약이다. 족양명경에 들어가서 진액이 생기게 하고 갈증을 멎게 한다. 허해서 나는 갈증은 갈근이 아니면 멈출 수 없다. 술로 생긴 병이나 갈증이 있는데 쓰면 아주 좋다. 또한 온학과 消渴도 치료한다[탕액] -갈생근(葛生根, 생칡뿌리)은 어혈을 헤치며 헌데를 아물게 하고 유산을 시키며[墮胎解] 술독으로 열이 나는 것과 술로 황달이 생겨 오줌이 붉고 잘 나가지 않는 것을 낫게 한다. -생뿌리를 짓찧어 즙을 내어 마시면 소갈, 상한, 온병으로 열이 몹시 나는 것이 내린다[본초] -갈곡(葛穀, 칡씨)은 10년 이상 된 설사를 멎게 한다[본초] -갈엽(葛葉, 칡잎)는 쇠붙이에 상한 것을 낫게 하며 피를 멎게 한다. 짓찧어서 붙인다[본초] -갈화(葛花, 칡꽃)는 술독을 없앤다. -갈화와 팥꽃(소두화)을 같은 양으로 가루내어 먹으면 술을 마셔도 취하는 줄 모른다[본초] -갈분(葛粉, 칡가루)은 번갈을 멎게 하고 대소변을 잘 나가게 한다. 어린이가 열이 나면서 명치 밑이 트직해지는 데 쓴다[본초] -생칡뿌리를 캐어 푹 짓찧어 물에 담갔다가 주물러 앙금을 앉히면 넓적한 덩어리가 된다. 이것을 끓는 물에 풀고 생꿀을 타서 먹으면 술마신 사람의 갈증이 아주 잘 풀린다[입문]"},{"id":57,"name":"天花粉","aliases":[],"category":"淸熱藥-淸熱瀉火藥","origin":"葫蘆科(박과) 하늘타리의 塊根","initial":"기타","sortName":"天花粉","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘微苦酸 微寒","肺 胃","生津止渴<br>降火潤燥<br>排膿消腫"," 50) -燥甚口渴 花粉 粉葛 鹽梅 皆潤生津(p173) -花粉治酒痰(p210) -人之藏熱者 多因酒生熱痰也 皆宜知母 射干 硼砂 花粉 以淸利之(p212) 진존인본초 -制癌효과 우수 / 解熱生津/ 淸腸胃熱/ 당뇨병의 君藥 -天花粉단백질은 인공유산에 유효한 성분이다. 동의보감 -소갈로 열이 나고 가슴이 답답하면서 그득한 것을 낫게 하며 장위 속에 오래된 열과 8가지 황달로 몸과 얼굴이 누렇고 입술과 입 안이 마르는 것을 낫게 한다. 소장을 잘 청소하며 고름을 빨아내고 腫毒을 삭게 하며 乳癰, 등창[發背], 痔瘻, 瘡癤을 치료한다. 월경을 잘하게 하며 다쳐서 생긴 瘀血을 삭아지게 한다. -일명 天花粉이라고도 한다. 벌판과 들에서 자라는데 곳곳에 다 있다. 일명 과라 또는 天瓜라고도 한다. 그 뿌리가 여러 해 되어 땅 속 깊이 들어간 것이 좋다. 음력 2월, 8월에 뿌리를 캐어 긁어 버리고 햇볕에 30일 동안 말려 쓴다[본초] -천화분은 소갈을 낫게 하는 데 매우 좋은 약이다[단심] -과루인(瓜蔞仁)은 하늘타리 열매의 속에 있는 씨다. 가슴에 痰火가 있을 때에 달고 완화한[緩] 약으로 눅여 주고 내려 보내는 약으로 도와주면 담은 저절로 삭아진다. 그러므로 이 약은 기침을 낫게 하는데 주요한 약으로 된다[단심]. 음력 9월, 10월에 열매가 익어서 붉고 누른색으로 될 때에 따서 씨를 받아 닦은 다음 껍질과 기름을 버리고 쓴다. 민간에서 과루인이라고 한다[입문] -과루분(瓜蔞粉)은 하늘타리뿌리를 캐어서 가루를 만드는 것으로 葛粉을 만드는 법과 같다. 虛熱이 있는 사람이 먹으면 아주 좋다. 갈증을 멈추고 진액을 생기게 한다[본초]"},{"id":58,"name":"瓜蔞實","aliases":[],"category":"化痰止咳平喘藥-淸化熱痰藥","origin":"박과에 속한 하늘타리의 성숙한 과실을 건조한 것.","initial":"기타","sortName":"瓜蔞實","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["寒 無毒 甘微苦","肺 胃 大腸","淸熱滌痰<br>潤肺化痰<br>寬胸散結<br>潤燥滑腸","肺熱咳嗽, 痰濁黃稠<br>燥咳痰粘<br>胸痺心痛, 乳癰, 肺癰, 腸癰腫痛<br>大便秘結",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["化痰止咳平喘藥-淸化熱痰藥"]}],["sec",{"key":"origin","label":"기원","lines":["박과에 속한 하늘타리의 성숙한 과실을 건조한 것."]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["寒 無毒 甘微苦","肺 胃 大腸","淸熱滌痰<br>潤肺化痰<br>寬胸散結<br>潤燥滑腸","肺熱咳嗽, 痰濁黃稠<br>燥咳痰粘<br>胸痺心痛, 乳癰, 肺癰, 腸癰腫痛<br>大便秘結",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-瓜蔞를 全瓜蔞 瓜蔞皮 瓜蔞仁으로 分類하는데","․全瓜蔞는 淸熱化痰하고 寬胸散結시키며 또한 潤腸通便시키고,","․瓜蔞皮는 淸肺化痰시키고 寬胸利氣시키는데 偏重되었으며,","․瓜蔞仁은 質潤多脂하여 潤燥化痰하고 滑腸通便시키는 作用에 偏重하여 治療"]}],["sec",{"key":"qna","label":"본초문답","lines":["-橘絡‧瓜蔞, 皆能治胸膈間之結氣, 取橘之筋絡, 蔞之膜瓤, 有似人胸中之筋膜, 故治之也(p107)","-瓜蔞實, 子有油而氣烈, 包有瓤而味苦, 搗爛合用, 能解膈膜之膽火(p187)","-瓜蔞仁, 以潤降痰(p213)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-消痰止咳 : 甘寒滑潤하여 粘稠한 痰을 희석시켜 止咳通氣하며, 胸膈痞悶의 痛症을 除하여 氣分通暢케하며 狹心症에도 효과적이다.","-潤腸通便 : 瀉下作用은 없으며, 津液缺乏 便秘와 같이 瀉下劑를 사용할 수 없을 때 적용","-瓜蔞의 체외실험에서 抗癌作用이 확인 되었으며, 蔞仁보다 蔞皮의 효과가 더 좋다."]}],["sec", 음경과 양명경을 돌아간다. 태양경과 소음경에 땀을 내어 겉에 있는 한사(寒邪)를 없애고 위기(衛氣)가 실한 것을 사(瀉)하여 영(榮)속에 찬 기운을 없앤다[탕액]","-중국에 나는 것을 우리나라 여러 곳에 옮겨 심었는데 잘 번식되지 않아 다만 강원도와 경상도에만 있다[속방]"]}]],"searchText":"麻黃 분류 解表藥-發散風寒藥 기원 麻黃科에 속한 多年生 草本狀의 小灌木인 草麻黃, 中麻黃, 혹은 木賊麻黃의 草質莖 性味 歸經 效能 主治 備考 溫 辛微苦 肺 膀胱 發汗散寒<br>宣肺平喘<br>利水消腫 傷寒表實,發熱惡寒無汗,頭痛鼻塞<br>咳嗽氣喘,風邪頑痺,皮膚不仁,風疹瘙痒<br>風水浮腫,小便不利  약물특징/비교 -發汗과 平喘의 要藥 -發汗시키는 效能이 强하여 表虛自汗이나 肺虛喘咳에는 服用을 忌 -修治 ․生用하면 發汗力이 强(發汗解表에 사용) ․蜜炙하면 發汗力이 弱하며 潤肺시키는 效能이 있다(平喘止咳에 사용) 본초문답 -麻黃雖一莖直上. 故能上昇, 又能外散. 麻黃, 則莖空直達而上, 且無大味, 純得天輕揚之氣, 故專主氣分; 從陰出陽, 透達周身上下之皮毛(p67) -麻黃必用苗, 而其苗細長中空, 象人毛孔, 而氣又輕揚, 故能發汗, 直走皮毛. 麻黃用根者, 則以其根堅實而味澁, 故能止汗. 苗空則通, 根實則塞(p104) -服麻黃, 忌油膩. 本草有引經之藥, 如姜活麻黃, 入太陽經(p128) -麻黃莖細叢生, 中空直上, 氣味輕淸, 故能透達膀胱寒水之陽氣, 而出於皮毛, 爲傷寒要藥. 後人用姜/獨活, 代麻黃. 薄荷亦輕淸, 但薄荷升散在味, 故力稍遜. 麻黃升散, 純在於氣, 故力更峻. 蔥管通陽, 如麻黃之義同. 然麻黃莖細象毛孔, 蔥莖粗象鼻孔, 故蔥能治鼻塞(p147) 진존인본초 -麻黃은 강한 發汗作用이 있어 동절기와 寒冷지역 감기에 적합하고 小兒麻疹을 앞당기는데도 사용 -麻黃에 함유된 휘발유는 인플루엔자 바이러스에 대해 억제작용이 있고, 汗腺의 분비를 자극하여 發汗이 가능하다. -에페드린의 藥理作用은 아드레날린과 類似하나 부드럽고 持久性이 있으며, 氣管支평활근의 弛緩 및 心臟의 興奮‧血管의 收縮‧血壓의 上升으로 中樞神經系統에 현저한 興奮作用 有 경악전서 五八 味微苦微澁하며 氣는 溫而辛하니 升也며 陽也라 此는 以輕揚之味, 而兼辛溫之性이라 故로 善達肌表하고 走經絡하야 大能表散風邪하니 祛除寒毒, 一應瘟疫瘧疾, 瘴氣山嵐하야 凡足三陽表實之證엔 必宜用之라 苦寒邪深入少陰‧厥陰筋骨之間엔 非用麻黃‧官桂면 不能逐也라 但用此之法에 自有微妙, 則在佐使之間하야 或兼氣藥以助力이면 可得衛中之汗하며 或兼血藥以助液이면 可得營中之汗하며 或兼溫藥以助陽이면 可逐陰凝之寒毒하며 或兼寒藥以助陰이면 可解炎熱之瘟邪하니 此實傷寒陰瘧家에 第一要藥이라 동의보감 -중풍이나 상한으로 머리가 아픈 것과 온학을 낫게 하며 발표(發表)시켜 땀을 내며 사열(邪熱)을 없앤다. 한열(寒熱)과 5장의 사기(邪氣)도 없애고 땀구멍을 통하게 하며 온역(溫疫)을 낫게 하고 산람장기를 미리 막는다. -입추 시기에 줄기를 뜯어 그늘에 말려서 퍼런 것을 쓴다. 먼저 뿌리와 마디는 버린다. 뿌리와 마디는 땀을 멎게 하기 때문이다. 먼저 40g을 달이는데 끓으면 위에 뜬 거품[沫]을 걷어 버린다. 거품을 걷어 버리지 않고 쓰면 답답한 증[煩]이 생긴다[본초] -마황은 중모(中牟) 지방에 나는데 눈이 5자나 쌓인 곳이라도 마황이 있는 자리에는 눈이 쌓이지 못한다. 그것은 양기(陽氣)를 통하게 하고 바깥 추위를 물리치기 때문이다[삼인] -마황은 수태음경의 약이며 족태양경에 들어가고 수소음경과 양명경을 돌아간다. 태양경과 소음경에 땀을 내어 겉에 있는 한사(寒邪)를 없애고 위기(衛氣)가 실한 것을 사(瀉)하여 영(榮)속에 찬 기운을 없앤다[탕액] -중국에 나는 것을 우리나라 여러 곳에 옮겨 심었는데 잘 번식되지 않아 다만 강원도와 경상도에만 있다[속방]"},{"id":62,"name":"通草","aliases":[],"category":"利水滲濕藥-利尿通淋藥","origin":"五加科(두릅나무과) 관목인 通脫木의 莖髓","initial":"기타","sortName":"通草","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘淡 微寒","肺 胃","利水淸熱<br>通氣下乳","濕溫尿赤, 淋病澀痛, 水腫尿少<br>乳汁不下",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["利水滲濕藥-利尿通淋藥"]}],["sec",{"key":"origin","label":"기원","lines":["五加科(두릅나무과) 관목인 通脫木의 莖髓"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘淡 微寒","肺 胃","利水淸熱<br>通氣下乳","濕溫尿赤, 淋病澀痛, 水腫尿少<br>乳汁不下",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-通乳시키는 效能이 木通과 비슷하나 利水泄熱시키는 作用은 木通만 같지 못하며, 오직 通利하되 陰液을 損傷하지 않으므로 濕熱로 인한 輕證에 마땅하다."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-木通과 類似하나 약효가 弱하며, 泌尿器系輕證에 解熱利尿作用, 乳汁不下에 多用"]}],["sec",{"key":"dong","label":"동의보감","lines":["-통초(通草)는 성질은 평(平)하고(약간 차다[微寒]고도 한다) 맛은 맵고 달며[辛甘] 독이 없다. 다섯 가지 임병을 낫게 하고 오줌을 잘 나가게 하며 관격(關格)된 것을 풀어 주고 수종(水腫)을 낫게 하며 번열(煩熱)을 멎게 하고 九竅를 잘 통하게 한다. 말소리를 잘 나오게 하고 비달(脾疸)로 늘 자려고만 하는 것을 낫게 한다. 유산시키고 3충(三蟲)도 죽인다.","-산에서 자라는데 덩굴로 뻗으며 굵기가 손가락과 같고 마디마다 2-3개의 가지가 붙었다. 가지 끝에 5개의 잎이 달렸고 열매가 맺히는데 작은 모과 비슷하다. 씨는 검고 속은 흰데 먹으면 단맛이 있기 때문에 이것을 연복자라고 한다. 음력 정월, 2월에 가지를 베어 그늘에서 말린다.","-줄기에 가는 구멍이 있어 양쪽 끝이 다 통한다. 한쪽 끝을 입에 물고 불 때 공기가 저쪽으로 나가는 것이 좋다[본초]","-통초는 즉 으름덩굴이다. 속이 비고 결이 있어 가볍고 색이 희며 아주 곱다. 껍질과 마디를 버리고 생것으로 쓴다. 12경맥을 통하게 하기 때문에 통초라고 했다[입문]","-으름덩굴의 성질은 평(平)하고 맛은 달며 슴슴하다[甘淡]. 오줌이 잘 나가지 않는 데 쓴다. 소장의 열을 내리며 경맥을 통하게 하고 9규(竅)를 잘 통하게 한다[탕액]","-으름덩굴과 통초는 한 가지 식물이다. 곳곳에 있다. 강원도에서 나는 한 종류의 덩굴을 으름덩굴이라고 한다. 빛은 누르고 맛은 쓰며[苦] 습열을 사하고 오줌을 잘 누게 하는 효과가 있다. 헌데를 아물게 하는 데 역시 효과가 있다. 이것은 다른 식물이다. 혹은 목방기(木防己)라고도 한다. 습(濕)을 사하는 데 가장 좋다[속방]","-통초자(通草子, 통초열매)는 연복자라고 하는데 으름덩굴의 열매이다. 줄기는 으름덩굴 또는 통초라고 한다. 음력 7-8월에 따는데 성질은 차고[寒] 맛은 달다[甘]. 위열(胃熱)과 반위증(反胃證)을 낫게 하며 3초(三焦)의 열을 내리고 대변을 잘 나가게 하며 속을 시원하게 하고 갈증을 멎게 한다[본초]","-통초근(通草根, 통초뿌리)은 즉 으름덩굴의 뿌리다. 목 아래의 영류를 치료한다."]}]],"searchText":"通草 분류 利水滲濕藥-利尿通淋藥 기원 五加科(두릅나무과) 관목인 通脫木의 莖髓 性味 歸經 效能 主治 備考 甘淡 微寒 肺 胃 利水淸熱<br>通氣下乳 濕溫尿赤, 淋病澀痛, 水腫尿少<br>乳汁不下  약물특징/비교 -通乳시키는 效能이 木通과 비슷하나 利水泄熱시키는 作用은 木通만 같지 못하며, 오직 通利하되 陰液을 損傷하지 않으므로 濕熱로 인한 輕證에 마땅하다. 진존인본초 -木通과 類似하나 약효가 弱하며, 泌尿器系輕證에 解熱利尿作用, 乳汁不下에 多用 동의보감 -통초(通草)는 성질은 평(平)하고(약간 차다[微寒]고도 한다) 맛은 맵고 달며[辛甘] 독이 없다. 다섯 가지 임병을 낫게 하고 오줌을 잘 나가게 하며 관격(關格)된 것을 풀어 주고 수종(水腫)을 낫게 하며 번열(煩熱)을 멎게 하고 九竅를 잘 통하게 한다. 말소리를 잘 나오게 하고 비달(脾疸)로 늘 자려고만 하는 것을 낫게 한다. 유산시키고 3충(三蟲)도 죽인다. -산에서 자라는데 덩굴로 뻗으며 굵기가 손가락과 같고 마디마다 2-3개의 가지가 붙었다. 가지 끝에 5개의 잎이 달렸고 열매가 맺히는데 작은 모과 비슷하다. 씨는 검고 속은 흰데 먹으면 단맛이 있기 때문에 이것을 연복자라고 한다. 음력 정월, 2월에 가지를 베어 그늘에서 말린다. -줄기에 가는 구멍이 있어 양쪽 끝이 다 통한다. 한쪽 끝을 입에 물고 불 때 공기가 저쪽으로 나가는 것이 좋다[본초] -통초는 즉 으름덩굴이다. 속이 비고 결이 있어 가볍고 색이 희며 아주 곱다. 껍질과 마디를 버리고 생것으로 쓴다. 12경맥을 통하게 하기 때문에 통초라고 했다[입문] -으름덩굴의 성질은 평(平)하고 맛은 달며 슴슴하다[甘淡]. 오줌이 잘 나가지 않는 데 쓴다. 소장의 열을 내리며 경맥을 통하게 하고 9규(竅)를 잘 통하게 한다[탕액] -으름덩굴과 통초는 한 가지 식물이다. 곳곳에 있다. 강원도에서 나는 한 종류의 덩굴을 으름덩굴이라고 한다. 빛은 누르고 맛은 쓰며[苦] 습열을 사하고 오줌을 잘 누게 하는 효과가 있다. 헌데를 아물게 하는 데 역시 효과가 있다. 이것은 다른 식물이다. 혹은 목방기(木防己)라고도 한다. 습(濕)을 사하는 데 가장 좋다[속방] -통초자(通草子, 통초열매)는 연복자라고 하는데 으름덩굴의 열매이다. 줄기는 으름덩굴 또는 통초라고 한다. 음력 7-8월에 따는데 성질은 차고[寒] 맛은 달다[甘]. 위열(胃熱)과 반위증(反胃證)을 낫게 하며 3초(三焦)의 열을 내리고 대변을 잘 나가게 하며 속을 시원하게 하고 갈증을 멎게 한다[본초] -통초근(通草根, 통초뿌리)은 즉 으름덩굴의 뿌리다. 목 아래의 영류를 치료한다."},{"id":63,"name":"木通","aliases":[],"category":"利水滲濕藥-利尿通淋藥","origin":"木通科(으름덩굴과) 낙엽 纏繞관목인 으름의 목질경.","initial":"기타","sortName":"木通","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","<u>心 小腸 膀胱<\/u>","瀉火行水<br><u>通利血脈<\/u>","小便赤澀, 淋濁水腫, 胸中煩熱, 喉痺咽痛, 遍身拘痛, 婦女經閉, 乳汁不通",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["利水滲濕藥-利尿通淋藥"]}],["sec",{"key":"origin","label":"기원","lines":["木通科(으름덩굴과) 낙엽 纏繞관목인 으름의 목질경."]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","<u>心 小腸 膀胱<\/u>","瀉火行水<br><u>通利血脈<\/u>","小便赤澀, 淋濁水腫, 胸中煩熱, 喉痺咽痛, 遍身拘痛, 婦女經閉, 乳汁不通",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-濕熱의 邪氣가 下行하여 小便으로 排出케 하므로 降火利尿의 效能","-泄降通利의 藥物이므로 孕婦나 脾胃가 虛寒하여 尿意頻數한 病證에는 마땅×"]}],["sec",{"key":"qna","label":"본초문답","lines":["-..木通莖亦通透, 然係藤蔓, 形與一莖直上者不同, 且味苦泄, 故主下降, 而通利小便(p97)","-..然而脚氣, 亦有係熱濕者, 宜防己‧黃柏‧蒼朮‧木通‧膽草等, 苦降之品治之(p163)","-木通中空, 與防己同, 味苦泄, 故均爲行濕之要藥(p165)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-利尿消炎 : 비뇨기계염증치료/ 濕熱滯留에 의한 關節熱痛,腫大 치료(遍身拘痛)","-淸熱解毒 : 이비인후과(咽喉炎‧扁桃炎) 眼科 급성감염성 염증치료","-通乳行經 : 출산후 乳汁不足 ‧不行" 디 2\\~3개의 가지가 붙었다. 가지 끝에 5개의 잎이 달렸고 열매는 작은 木瓜크기정도된다. 씨는 검고 속은 흰데 먹으면 단맛이 아주 좋아 연복자(燕覆子)라고 한다. 1\\~2월에 가지를 채취하여 陰乾한다. ․줄기에는 細孔이 있는데 兩頭가 모두 通한다. 한쪽끝을 입으로 불면 다른쪽으로 공기가 나가는 것이 좋은것이다[本草] ․通草는 즉 木通이다. 속이 비고 결이 있어 가볍고 색이 희며 아주 곱다. 껍질과 마디를 버리고 생것으로 쓴다. 12경맥을 통하게 하기 때문에 통초라고 했다.[入門] ․木通은 性이 平하고 味는 甘하면서 淡하다. 小便不利 導小腸熱 通經利竅한다[湯液] ․木通‧通草는 한가지 식물이다. 곳곳에 있다. 江原道에서 나는 한 종류의 덩굴을 木通이라 한다. 빛은 누르고 맛은 쓴데, 濕熱을 瀉하고 오줌을 잘 누게하는 효과가 있다. 瘡에도 亦效하다. 이것은 다른 식물이다. 혹은 목방기(木防己, 댕댕이덩굴)라고도 하는데 습을 사하는데 가장 좋다. 爲最(俗方)"},{"id":64,"name":"白芍藥","aliases":[],"category":"補益藥-補血藥","origin":"毛茛科에 속한 多年生인 草本인 芍藥의 뿌리","initial":"기타","sortName":"白芍藥","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦酸 微寒","肝 脾","養血柔肝<br>緩中止痛<br>斂陰收汗","胸腹脇肋疼痛, 月經不調, 崩漏, 帶下<br>瀉痢腹痛<br>自汗盜汗, 陰虛發熱",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補血藥"]}],["sec",{"key":"origin","label":"기원","lines":["毛茛科에 속한 多年生인 草本인 芍藥의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦酸 微寒","肝 脾","養血柔肝<br>緩中止痛<br>斂陰收汗","胸腹脇肋疼痛, 月經不調, 崩漏, 帶下<br>瀉痢腹痛<br>自汗盜汗, 陰虛發熱",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-藜蘆를 反","-平肝에는 生用하고 養血斂陰에는 妙用","-白芍藥은 養血平肝하며 斂陰하는데 特長이 있어 補血養血과 止痛시키고자 하는 方劑에 쓰며","赤芍藥은 凉血活血하여 散瘀시키는 特長이 있어 淸熱凉血하고 活血消腫시키고자 하는 方劑에 쓴다"]}],["sec",{"key":"qna","label":"본초문답","lines":["-白芍藥爲春花之殿, 而根微酸, 故主能斂肝木, 降火行血(p59)","-寒性皆下引, 如白芍/射干, 味能降利. 皆以其味苦, 與大黃之降下, 其義一也(p78)","-本草有引經之藥, 白芍入厥陰經(p128)","-白芍味苦, 能瀉血, 其色白, 故又能行氣分之水(p196)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-血虛로 인한 病症에 상용되며, 筋肉痙攣에 따른 疼痛에 서서히 止痛效果를 나타냄.","-藥理硏究에 증명된 바로는 비교적 弱한 降溫 및 抗驚厥作用이 있고 動物의 冠狀動脈血管 및 後足의 血管을 擴張하여 단시간의 降壓效果를 나타내고, 炒炭 後 止血作用이 있으며, 大腸菌에 대한 抗菌作用이 强하다."]}],["sec",{"key":"gyeong","label":"경악전서","lines":["八十 味는 微苦微甘이나 略酸하며 性은 頗寒이라 氣薄於味하며 斂降多而升散少하며 陰也며 有小毒이라","白者는 味甘하야 補性多하며 赤者는 味苦하야 瀉性多하며 生者는 更凉이나 酒炒면 微平이라 其性이 沈陰 故로 入血分하야 補血熱之虛, 瀉肝火之實, 固腠理, 止熱瀉, 消癰腫, 利小便, 除眼疼, 退虛熱, 緩三消하니 諸證에 於因熱而致者는 爲宜나 若脾氣寒 而痞滿難化者는 忌用이라 止血虛之腹痛하며 斂血虛之發熱하며 白者는 安胎熱不寧하며 赤者는 能通經破血이라 此物은 乃補藥中之稍寒者나 非若極苦大寒之比라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-작약은 조금 독이 있다. 혈비(血痺)를 낫게 하고 혈맥을 잘 통하게 하며 속을 완화시키고 궂은 피를 헤치며[散惡血] 옹종(癰腫)을 삭게 한다. 복통(腹痛)을 멈추고 어혈을 삭게[消]하며 고름을 없어지게 한다. 여자의 모든 병과 산전산후의 여러 가지 병에 쓰며 월경을 통하게 한다. 장풍(腸風)으로 피를 쏟는 것, 치루(痔瘻), 등창[發背], 진무른 헌데, 눈에 피가 지고 군살이 트는데 쓰며 눈을 밝게 한다.","-산과 들에서 자라는데 음력 2월과 8월에 뿌리를 캐어 햇볕에 말린다. 산골에서 저절로 자란 것을 쓰는 것이 좋고 집 근처에서 거름을 주면서 키운 것은 쓰지 않는다. 꽃이 벌거면서 홑잎(單葉)의 것을 써야 하며 나는 것이 좋다.","-일명 해창(解倉)이라고도 하는데 두 가지 종류가 있다. 적작약은 오줌을 잘 나가게 하고 기를 내리며 백작약은 아픈 것을 멈추고 어혈을 헤친다. 또한 백작약은 보(補)하고 적작약은 사(瀉)한다고도 한다[본초]","-수족태음경에 들어간다. 또한 간기(肝氣)를 사하고 비위(脾胃)를 보한다. 술에 담갔다가 쓰면 경맥으로 간다. 혹은 술에 축여 볶아서도[炒] 쓰고 잿불에 묻어 구워서도 쓴다[입문]","-함박꽃뿌리(작약)를 술에 담갔다가 볶아 흰삽주(백출)와 같이 쓰면 비(脾)를 보하고 궁궁이(천궁)와 같이 쓰면 간기(肝氣)를 사하고 인삼, 흰삽주와 같이 쓰면 기를 보한다. 배가 아프며 곱똥을 설사하는 것을 멎게하는 데는 반드시 닦아서 쓰고 뒤가 묵직한 데는 닦아 쓰지 말아야 한다. 또는 내려가는 것을 수렴하기 때문에 혈해(血海)에 가서 밑에까지 들어가 족궐음경에 갈 수 있다고도 한다[단심]"]}]],"searchText":"白芍藥 분류 補益藥-補血藥 기원 毛茛科에 속한 多年生인 草本인 芍藥의 뿌리 性味 歸經 效能 主治 備考 苦酸 微寒 肝 脾 養血柔肝<br>緩中止痛<br>斂陰收汗 胸腹脇肋疼痛, 月經不調, 崩漏, 帶下<br>瀉痢腹痛<br>自汗盜汗, 陰虛發熱  약물특징/비교 -藜蘆를 反 -平肝에는 生用하고 養血斂陰에는 妙用 -白芍藥은 養血平肝하며 斂陰하는데 特長이 있어 補血養血과 止痛시키고자 하는 方劑에 쓰며 赤芍藥은 凉血活血하여 散瘀시키는 特長이 있어 淸熱凉血하고 活血消腫시키고자 하는 方劑에 쓴다 본초문답 -白芍藥爲春花之殿, 而根微酸, 故主能斂肝木, 降火行血(p59) -寒性皆下引, 如白芍/射干, 味能降利. 皆以其味苦, 與大黃之降下, 其義一也(p78) -本草有引經之藥, 白芍入厥陰經(p128) -白芍味苦, 能瀉血, 其色白, 故又能行氣分之水(p196) 진존인본초 -血虛로 인한 病症에 상용되며, 筋肉痙攣에 따른 疼痛에 서서히 止痛效果를 나타냄. -藥理硏究에 증명된 바로는 비교적 弱한 降溫 및 抗驚厥作用이 있고 動物의 冠狀動脈血管 및 後足의 血管을 擴張하여 단시간의 降壓效果를 나타내고, 炒炭 後 止血作用이 있으며, 大腸菌에 대한 抗菌作用이 强하다. 경악전서 八十 味는 微苦微甘이나 略酸하며 性은 頗寒이라 氣薄於味하며 斂降多而升散少하며 陰也며 有小毒이라 白者는 味甘하야 補性多하며 赤者는 味苦하야 瀉性多하며 生者는 更凉이나 酒炒면 微平이라 其性이 沈陰 故로 入血分하야 補血熱之虛, 瀉肝火之實, 固腠理, 止熱瀉, 消癰腫, 利小便, 除眼疼, 退虛熱, 緩三消하니 諸證에 於因熱而致者는 爲宜나 若脾氣寒 而痞滿難化者는 忌用이라 止血虛之腹痛하며 斂血虛之發熱하며 白者는 安胎熱不寧하며 赤者는 能通經破血이라 此物은 乃補藥中之稍寒者나 非若極苦大寒之比라 동의보감 -작약은 조금 독이 있다. 혈비(血痺)를 낫게 하고 혈맥을 잘 통하게 하며 속을 완화시키고 궂은 피를 헤치며[散惡血] 옹종(癰腫)을 삭게 한다. 복통(腹痛)을 멈추고 어혈을 삭게[消]하며 고름을 없어지게 한다. 여자의 모든 병과 산전산후의 여러 가지 병에 쓰며 월경을 통하게 한다. 장풍(腸風)으로 피를 쏟는 것, 치루(痔瘻), 등창[發背], 진무른 헌데, 눈에 피가 지고 군살이 트는데 쓰며 눈을 밝게 한다. -산과 들에서 자라는데 음력 2월과 8월에 뿌리를 캐어 햇볕에 말린다. 산골에서 저절로 자란 것을 쓰는 것이 좋고 집 근처에서 거름을 주면서 키운 것은 쓰지 않는다. 꽃이 벌거면서 홑잎(單葉)의 것을 써야 하며 나는 것이 좋다. -일명 해창(解倉)이라고도 하는데 두 가지 종류가 있다. 적작약은 오줌을 잘 나가게 하고 기를 내리며 백작약은 아픈 것을 멈추고 어혈을 헤친다. 또한 백작약은 보(補)하고 적작약은 사(瀉)한다고도 한다[본초] -수족태음경에 들어간다. 또한 간기(肝氣)를 사하고 비위(脾胃)를 보한다. 술에 담갔다가 쓰면 경맥으로 간다. 혹은 술에 축여 볶아서도[炒] 쓰고 잿불에 묻어 구워서도 쓴다[입문] -함박꽃뿌리(작약)를 술에 담갔다가 볶아 흰삽주(백출)와 같이 쓰면 비(脾)를 보하고 궁궁이(천궁)와 같이 쓰면 간기(肝氣)를 사하고 인삼, 흰삽주와 같이 쓰면 기를 보한다. 배가 아프며 곱똥을 설사하는 것을 멎게하는 데는 반드시 닦아서 쓰고 뒤가 묵직한 데는 닦아 쓰지 말아야 한다. 또는 내려가는 것을 수렴하기 때문에 혈해(血海)에 가서 밑에까지 들어가 족궐음경에 갈 수 있다고도 한다[단심]"},{"id":65,"name":"赤芍藥","aliases":[],"category":"淸熱藥-淸熱凉血藥","origin":"毛茛科 다년생 초본인 赤芍藥과 川赤芍의 뿌리","initial":"기타","sortName":"赤芍藥","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 微寒","肝","淸熱凉血<br>散瘀止痛","溫毒發斑, 吐血衄血, 目赤腫痛, 肝鬱脇痛<br>經閉痛經, 癥瘕腹痛, 跌撲損傷, 癰腫瘡瘍",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱凉血藥"]}],["sec",{"key":"origin","label":"기원","lines":["毛茛科 다년생 초본인 赤芍藥과 川赤芍의 뿌리"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 微寒","肝","淸熱凉血<br>散瘀止痛","溫毒發斑, 吐血衄血, 目赤腫痛, 肝鬱脇痛<br>經閉痛經, 癥瘕腹痛, 跌撲損傷, 癰腫瘡瘍",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-일체의 血熱과 血瘀의 證에 모두 應用하여 治療","-다만 血瘀無瘀者나 月經過多者 및 孕婦는 服用을 忌","-效能은 牡丹皮와 비슷하여 능히 凉血散瘀하므로 二藥을 항상 相須하여 應用","․牡丹皮는 淸熱凉血作用이 비교적 좋아 血分의 實熱을 淸하고 또한 陰虛發熱을 治療하며,","․赤芍藥은 活血祛瘀의 作用이 優秀하고 아울러 止痛시키는 效能이 있다."]}],["sec",{"key":"jin","label":"진존인본초","lines":["-함유한 Paeoniflorin에는 우수한 痙攣緩解作用이 있으며 특히 복부경련에 좋고, 血管擴張‧血流量增加‧血壓降下의 작용이 있으며 弱한 抗炎作用 및 抗潰瘍作用이 있다.","-消炎解熱, 散瘀止痛, 活血調經","․閉塞性血栓血管炎, 出血性과 虛血性의 腦卒中에 의한 偏麻痺, 瘀血停滯에 의한 오래끄는 疼痛, 産後의 惡露殘餘 등에 사용한다."]}],["sec",{"key":"etc","label":"동의보감 ; 백작약(p.109) 참조","lines":[]}]],"searchText":"赤芍藥 분류 淸熱藥-淸熱凉血藥 기원 毛茛科 다년생 초본인 赤芍藥과 川赤芍의 뿌리 性味 歸經 效能 主治 備考 苦 微寒 肝 淸熱凉血<br>散瘀止痛 溫毒發斑, 吐血衄血, 目赤腫痛, 肝鬱脇痛<br>經閉痛經, 癥瘕腹痛, 跌撲損傷, 癰腫瘡瘍  약물특징/비교 -일체의 血熱과 血瘀의 證에 모두 應用하여 治療 -다만 血瘀無瘀者나 月經過多者 및 孕婦는 服用을 忌 -效能은 牡丹皮와 비슷하여 능히 凉血散瘀하므로 二藥을 항상 相須하여 應用 ․牡丹皮는 淸熱凉血作用이 비교적 좋아 血分의 實熱을 淸하고 또한 陰虛發熱을 治療하며, ․赤芍藥은 活血祛瘀의 作用이 優秀하고 아울러 止痛시키는 效能이 있다. 진존인본초 -함유한 Paeoniflorin에는 우수한 痙攣緩解作用이 있으며 특히 복부경련에 좋고, 血管擴張‧血流量增加‧血壓降下의 작용이 있으며 弱한 抗 尿通淋藥 기원 石竹科 다년생 초본인 술패랭이꽃과 패랭이꽃(石竹)의 지상부 性味 歸經 效能 主治 備考 苦 寒 心 小腸 利水通淋<br>破血通經 熱淋, 血淋, 石淋, 小便不通, 淋瀝澀痛<br>月經閉止  약물특징/비교 -萆薢 萹蓄 瞿麥은 모두 利水通淋作用이 있어 淋證을 治療하는데 常用하는 藥物이나, ․萆薢는 利濕하여 淸濁을 分離(濕邪가 熱보다 重한 淋證으로 小便이 米泔汁과 같이 混濁된 症狀에 適用) ․萹蓄은 膀胱濕熱을 淸하게 하는 效能(濕熱이 함께 重하여 된 淋證의 小便不利와 尿黃短小한 證을 治療) ․瞿麥은 小腸熱을 引導하여 下行케 함(熱이 濕보다 重하여 된 淋證으로 莖中이 疼痛하며 熱感이 있거나 혹은 尿血을 兼한 症狀을 治療) -또한, ․萆薢는 風濕을 去하여 止痛시키는 作用이 優秀하고 ․萹蓄은 殺蟲止痛시키며 ․瞿麥은 活血通經시키는 作用이 優秀하다. 진존인본초 -排尿時 鹽素化合物의 排泄量을 증가시켜, 泌尿器系統의 急性‧慢性炎症에 대해 消炎利尿의 효과가 있다. -盛夏期 熱性病으로 高熱‧口渴‧小便不暢‧黃尿混濁에 大便이 나오지 않는 증상에 +滑石 -瞿麥子에는 分娩誘導와 通經活血의 효과가 있다. 경악전서 五四 味苦, 微寒하야 降也며 性滑利하니 能通小便, 降陰火, 除五淋, 利血脈하며 兼凉藥이면 亦消眼目腫痛하며 兼血藥則能通經破血下胎라 凡下焦濕熱疼痛諸病에 皆可用之라 동의보감 -구맥(瞿麥, 패랭이꽃)은 성질은 차며[寒] 맛은 쓰고 매우며[苦辛](달다[甘]고도 한다) 독이 없다. 관격(關格)된 것을 낫게 하며 여러 가지 융폐와 오줌이 나가지 않는 데 쓰고 가시를 나오게 한다. 옹종을 삭이고 눈을 밝게 하며 예막을 없애고 유산시킨다. 심경(心經)을 통하게 하며 소장(小腸)을 순조롭게 하는 데 매우 좋다. -일명 석죽(石竹)이라고 하는데 곳곳에 다 있다. 입추 후에 씨와 잎을 함께 뜯어 그늘에서 말린다. 씨는 보리(麥)와 매우 비슷하기 때문에 구맥이라고 부르기도 한다[본초] -줄기와 잎은 쓰지 않고 다만 씨의 껍질을 쓴다[입문] -관격과 여러 가지로 오줌이 막혀 나가지 않는 병을 낫게 한다. 오줌이 나가지 않는 것을 잘 나가게 하며 방광의 사열(邪熱)을 몰아내는 데 주약[主之劑]으로 쓰인다[탕액] -구맥자(瞿麥子, 패랭이꽃씨)는 월경을 하지 않는 것을 치료하며 혈괴(血塊)를 헤치고 고름을 빨아낸다[排][본초] -구맥엽(瞿麥葉, 패랭이꽃잎)은 회충을 죽이고 치질, 눈이 붓고 아픈 것, 침음창(浸淫瘡), 부인의 음부에 헌데가 생긴 것을 낫게 한다[본초]"},{"id":67,"name":"百合","aliases":[],"category":"補益藥-補陰藥","origin":"百合科 참나리, 百合, 혹은 細葉백합의 肉質鱗片","initial":"기타","sortName":"百合","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘微苦 寒","心 肺","潤肺止咳<br>淸心安神","肺癆久嗽, 咳唾痰血, 虛煩驚悸, 失眠多夢, 精神恍惚",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["補益藥-補陰藥"]}],["sec",{"key":"origin","label":"기원","lines":["百合科 참나리, 百合, 혹은 細葉백합의 肉質鱗片"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘微苦 寒","心 肺","潤肺止咳<br>淸心安神","肺癆久嗽, 咳唾痰血, 虛煩驚悸, 失眠多夢, 精神恍惚",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-失眠多夢하며 精神이 불안한 病證에 適扁","-寒潤한 藥이므로 風寒咳嗽와 中寒便牆者는 服用을 均忌"]}],["sec",{"key":"qna","label":"본초문답","lines":["-白合花覆, 如天下之下垂: 旋覆花滴露而生, 本天之淸氣, 故皆入氣分, 而斂肺降氣..(p25)","-水津不騰於上, 口乾肺萎, 痰鬱咳逆, 宜..百合.... 生津以潤之(p173)"]}],["sec",{"key":"jin","l 작용이 있어 淋巴節結核 硬結의 早期消失을 促進한다. 경악전서 十八 味苦, 氣平하며 微寒이라. 氣味俱輕하야 功力頗緩하니 用須加倍라 善解肝臟鬱愁하며 亦散心中逆氣하며 祛肺痿肺癰痰膿喘嗽하니 硏末하고 沙糖爲丸하야 含嚥이면 最佳며 降胸中因熱結胸, 及乳癰流痰結核이라 若足生人面諸瘡이면 燒灰油調하야 頻敷하며 産難胞衣不出이면 硏末하야 用酒和呑하며 亦除瘕疝, 喉痺, 金瘡하며 幷止消渴煩熱이라 赤眼翳膜에 堪點하며 時疾黃疸을 能驅라 又如半夏, 貝母, 俱治痰嗽나 但半夏兼治脾肺요 貝母獨善淸金이라 半夏는 用其辛이며 貝母는用其苦며 半夏는 用其溫이며 貝母는 用其凉이며 半夏는 性速이며 貝母는 性緩하며 半夏는 散寒하며 貝母는 淸熱하야 性味陰陽이 大有不同하니 俗有代用者는 其謬孰甚이라 동의보감 -담을 삭게 하고 심과 폐를 눅여 준다. 肺痿로 기침하고 肺癰으로 피고름을 뱉는 것을 낫게 하며 속이 답답한 것[煩]을 없애고 갈증을 멎게 하며 쇠붙이에 다친 것과 악창을 낫게 한다. 연교와 같이 쓰면 목에 생긴 癭瘤를 낫게 한다. -일명 莔根10)이라 하는데 누르고 흰빛이 나는 여러 조각으로 되어 있으면서 모양이 조개를 모아 놓은 것과 같기 때문에 이름을 패모라고도 한다. 음력 8, 10월에 뿌리를 캐어 햇볕에 말린다[본초] (주: 10) 莔 ; 패모 맹) -패모는 가슴에 몰린 기를 헤쳐 버리는 데[散] 특수한 효과가 있다[본사] -버드나무재에 묻어 구운 다음에 심을 버리고 쓴다. 또한 생강즙에 축여서 구워 쓰기도 한다[입문]"},{"id":70,"name":"黃芩","aliases":["속서근풀"],"category":"淸熱藥-淸熱燥濕藥","origin":"脣形科(꿀풀과)黃芩의 根","initial":"ㅅ","sortName":"속서근풀","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","肺 膽 胃 大腸","瀉實火<br>除濕熱<br>止血<br>安胎","壯熱煩渴, 肺熱咳嗽, 目赤腫痛<br>濕熱瀉痢, 黃疸, 熱淋, 癰腫疔瘡<br>吐衄, 崩漏<br>胎動不安",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥 - 淸熱燥濕藥"]}],["sec",{"key":"origin","label":"기원","lines":["脣形科(꿀풀과)黃芩의 根"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦 寒","肺 膽 胃 大腸","瀉實火<br>除濕熱<br>止血<br>安胎","壯熱煩渴, 肺熱咳嗽, 目赤腫痛<br>濕熱瀉痢, 黃疸, 熱淋, 癰腫疔瘡<br>吐衄, 崩漏<br>胎動不安",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-邪熱이 肺를 犯하여 나타나는 身熱咳嗽, 痰黃粘稠 등의 證에 반드시 사용","-淸肺를 위주로 하지만 적절한 配伍에 따라서 능히 諸經의 熱을 淸하게 할 수 있다","⊕柴胡 : 少陽經의 熱을 淸하면서 寒熱을 없애주고","⊕芍藥 : 大腸의 熱을 淸하게 하여 瀉痢를 止하고(?)","⊕桑白皮 : 淸肺하여 止嗽하고","⊕白朮 : 淸熱하여 安胎하며","⊕黃連 : 淸心解毒하여서 瘡癰을 治療하고","⊕山梔 : 胸隔의 熱을 治하고","⊕荊芥 防風 : 肌表의 熱을 治療한다.","-苦寒한 藥物이기 때문에 脾胃를 傷하게 할 수 있으며, 實熱이 아닌 경우에는 사용×","-生用하면 淸熱瀉火하는 힘이 强, 炒用하면 寒性이 減弱되어 安胎에 쓰며,","酒炒하면 그 上行하는 힘을 取하여 上焦의 熱을 淸하고, 炒黑存性하여 止血에 多用","-枯芩과 條芩의 구별 ; 枯芩은 體輕達上하여 淸肺火, 條芩은 體重下達하여 淸大腸熱"]}],["sec",{"key":"qna","label":"본초문답","lines":["-黃芩味苦, 中多虛空, 有孔道. 人身惟三焦, 是行水氣之孔道, 主相火. 黃芩中空有孔, 入三焦, 而味又苦, 故主淸相火(p47)","-傷暑變瘧, 貴於散濕淸熱. 三焦膀胱之小便淸, 則瘧自除. ..豬苓.., 散濕以治太陽膀胱; 黃芩.., 淸熱以利少陽三焦, 兩部兼治爲宜(p168)","-.. 西醫言是腸胃發炎, 久則腐爛, 按此正是水不濡火之極致, 宜以黃連生地爲主, 以白菊‧花粉‧黃芩爲佐(p173)","-有相火燥熱之證, 淸用黃芩‧黃連, 攻用芒硝‧大黃, 是治熱兼治火也...(p182)","-火逆口苦, 黃芩爲正藥, 苦而綠色, 故入膽也(p184)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-抗菌消炎 : 양방 항생물질과 같고, 특히 장티프스菌에 强하다.","․急性腸炎, 腹痛‧發熱時 : 黃芩+葛根‧石榴皮","․化膿有無 불문 急性扁桃炎, 急性咽頭炎, 喉頭腫脹 및 閉塞, 口腔粘膜 炎症 : 黃芩濃煎 含漱","․姙娠期 초조불안, 숙면장애 : 黃芩+桑寄生‧白芍‧茯神‧白朮‧棗仁","․血壓降壓, 精神安定 작용 : 血壓上升과 精神不安‧不眠에 用","․血中지질 과다時 : 三黃湯","-本草綱目 : 寒熱往來, 腸胃의 활동부진, 관절熱痛, 풍열습열의 頭痛,咽喉腫痛, 痢疾, 膿血"]}],["sec",{"key":"gyeong","label":"경악전서","lines":["三六 味苦氣寒하나 氣輕於味하야 可升可降하니 陰中微陽이라","枯者는 善於入肺하고 實者는 善入大腸하며 欲其上者는 酒炒하고 欲其下者는 生用이라","枯者는 淸上焦之火하니 消痰利氣, 定喘嗽, 止失血하며 退往來寒熱‧風熱濕熱頭痛, 解瘟疫, 淸咽하며 療肺痿肺癰, 乳癰發背하며 尤祛肌表之熱 故로 治斑疹鼠瘻, 瘡瘍赤眼이라","實者는 凉下焦之熱하니 能除赤痢, 熱蓄膀胱, 五淋澁痛, 大腸閉結, 便血漏血하며 胎가 因火盛不安이면 酌佐砂仁‧白朮하고 腹이 因火滯爲痛이면 可加黃連‧厚朴이나 大腸無火滑泄者, 最當愼用이라"]}],["sec",{"key":"dong","label":"동의보감","lines":["-황금(黃芩, 속썩은풀)은 열독(熱毒), 골증(骨蒸), 추웠다 열이 났다 하는 것을 치료하고 열로 나는 갈증을 멎게 하고 황달, 이질, 설사, 담열(痰熱), 위열(胃熱)을 낫게 한다. 소장을 잘 통하게 하고 유옹, 등창, 악창과 돌림열병[天行熱疾]을 낫게 한다.","-들과 벌판에 나는데 곳곳에서 다 자란다. 음력 3월 초나 2월과 8월에 뿌리를 캐 햇볕에 말린다. 그 속이 전부 썩었기 때문에 일명 부장(腐腸)이라고도 한다. 색이 진하고 속이 비지 않고 단단한 것이 좋다. 둥근 것은 자금(子芩)이라 하고 갈라진 것은 숙금(宿芩)이라 한다[본초]","-속이 마르고 퍼석퍼석하기[飄] 때문에 폐 속에 화(火)를 사(瀉)할 수 있고 담을 삭게 하고 기가 잘 돌게 한다.","-수태음경에 들어가며 뿌리가 가늘고 단단하면서 속이 비지 않는 것은 하초의 병을 낫게 하고 대장의 화(火)를 사한다. 물에 넣어서 가라앉는 것을 약에 쓴다. 술로 축여 볶으면 약 기운이 올라가고 동변에 축여 볶으면 내려간다. 보통 때는 생것을 쓴다[입문]","-황금자(黃芩子, 속썩은풀 씨)는 이질로 피고름을 누는 것을 멎게 한다[본초]"]}]],"searchText":"黃芩 속서근풀 분류 淸熱藥 - 淸熱燥濕藥 기원 脣形科(꿀풀과)黃芩의 根 性味 歸經 效能 主治 備考 苦 寒 肺 膽 胃 大腸 瀉實火<br>除濕熱<br>止血<br>安胎 壯熱煩渴, 肺熱咳嗽, 目赤腫痛<br>濕熱瀉痢, 黃疸, 熱淋, 癰腫疔瘡<br>吐衄, 崩漏<br>胎動不安  약물특징/비교 -邪熱이 肺를 犯하여 나타나는 身熱咳嗽, 痰黃粘稠 등의 證에 반드시 사용 -淸肺를 위주로 하지만 적절한 配伍에 따라서 능히 諸經의 熱을 淸하게 할 수 있다 ⊕柴胡 : 少陽經의 熱을 淸하면서 寒熱을 없애주고 ⊕芍藥 : 大腸의 熱을 淸하게 하여 瀉痢를 止하고(?) ⊕桑白皮 : 淸肺하여 止嗽하고 ⊕白朮 : 淸熱하여 安胎하며 ⊕黃連 : 淸心解毒하여서 瘡癰을 治療하고 ⊕山梔 : 胸隔의 熱을 治하고 ⊕荊芥 防風 : 肌表의 熱을 治療한다. -苦寒한 藥物이기 때문에 脾胃를 傷하게 할 수 있으며, 實熱이 아닌 경우에는 사용× -生用하면 淸熱瀉火하는 힘이 强, 炒用하면 寒性이 減弱되어 安胎에 쓰며, 酒炒하면 그 上行하는 힘을 取하여 上焦의 熱을 淸하고, 炒黑存性하여 止血에 多用 -枯芩과 條芩의 구별 ; 枯芩은 體輕達上하여 淸肺火, 條芩은 體重下達하여 淸大腸熱 본초문답 -黃芩味苦, 中多虛空, 有孔道. 人身惟三焦, 是行水氣之孔道, 主相火. 黃芩中空有孔, 入三焦, 而味又苦, 故主淸相火(p47) -傷暑變瘧, 貴於散濕淸熱. 三焦膀胱之小便淸, 則瘧自除. ..豬苓.., 散濕以治太陽膀胱; 黃芩.., 淸熱以利少陽三焦, 兩部兼治爲宜(p168) -.. 西醫言是腸胃發炎, 久則腐爛, 按此正是水不濡火之極致, 宜以黃連生地爲主, 以白菊‧花粉‧黃芩爲佐(p173) -有相火燥熱之證, 淸用黃芩‧黃連, 攻用芒硝‧大黃, 是治熱兼治火也...(p182) -火逆口苦, 黃芩爲正藥, 苦而綠色, 故入膽也(p184) 진존인본초 -抗菌消炎 : 양방 항생물질과 같고, 특히 장티프스菌에 强하다. ․急性腸炎, 腹痛‧發熱時 : 黃芩+葛根‧石榴皮 ․化膿有無 불문 急性扁桃炎, 急性咽頭炎, 喉頭腫脹 및 閉塞, 口腔粘膜 炎症 : 黃芩濃煎 含漱 ․姙娠期 초조불안, 숙면장애 : 黃芩+桑寄生‧白芍‧茯神‧白朮‧棗仁 ․血壓降壓, 精神安定 작용 : 血壓上升과 精神不安‧不眠에 用 ․血中지질 과다時 : 三黃湯 -本草綱目 : 寒熱往來, 腸胃의 활동부진, 관절熱痛, 풍열습열의 頭痛,咽喉腫痛, 痢疾, 膿血 경악전서 三六 味苦氣寒하나 氣輕於味하야 可升可降하니 陰中微陽이라 枯者는 善於入肺하고 實者는 善入大腸하며 欲其上者는 酒炒하고 欲其下者는 生用이라 枯者는 淸上焦之火하니 消痰利氣, 定喘嗽, 止失血하며 退往來寒熱‧風熱濕熱頭痛, 解瘟疫, 淸咽하며 療肺痿肺癰, 乳癰發背하며 尤祛肌表之熱 故로 治斑疹鼠瘻, 瘡瘍赤眼이라 實者는 凉下焦之熱하니 能除赤痢, 熱蓄膀胱, 五淋澁痛, 大腸閉結, 便血漏血하며 胎가 因火盛不安이면 酌佐砂仁‧白朮하고 腹이 因火滯爲痛이면 可加黃連‧厚朴이나 大腸無火滑泄者, 最當愼用이라 동의보감 -황금(黃芩, 속썩은풀)은 열독(熱毒), 골증(骨蒸), 추웠다 열이 났다 하는 것을 치료하고 열로 나는 갈증을 멎게 하고 황달, 이질, 설사, 담열(痰熱), 위열(胃熱)을 낫게 한다. 소장을 잘 통하게 하고 유옹, 등창, 악창과 돌림열병[天行熱疾]을 낫게 한다. -들과 벌판에 나는데 곳곳에서 다 자란다. 음력 3월 초나 2월과 8월에 뿌리를 캐 햇볕에 말린다. 그 속이 전부 썩었기 때문에 일명 부장(腐腸)이라고도 한다. 색이 진하고 속이 비지 않고 단단한 것이 좋다. 둥근 것은 자금(子芩)이라 하고 갈라진 것은 숙금(宿芩)이라 한다[본초] -속이 마르고 퍼석퍼석하기[飄] 때문에 폐 속에 화(火)를 사(瀉)할 수 있고 담을 삭게 하고 기가 잘 돌게 한다. -수태음경에 들어가며 뿌리가 가늘고 단단하면서 속이 비지 않는 것은 하초의 병을 낫게 하고 대장의 화(火)를 사한다. 물에 넣어서 가라앉는 것을 약에 쓴다. 술로 축여 볶으면 약 기운이 올라가고 동변에 축여 볶으면 내려간다. 보통 때는 생것을 쓴다[입문] -황금자(黃芩子, 속썩은풀 씨)는 이질로 피고름을 누는 것을 멎게 한다[본초]"},{"id":71,"name":"紫菀","aliases":[],"category":"化痰止咳平喘藥-止咳平喘藥","origin":"菊花科 다년생 초본인 개미취의 근과 근경","initial":"기타","sortName":"紫菀","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["苦甘 溫","肺","潤肺下氣<br>化痰止咳","痰多喘咳, 新久咳嗽<br>勞嗽咳血",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["化痰止咳平喘藥-止咳平喘藥"]}],["sec",{"key":"origin","label":"기원","lines":["菊花科 다년생 초본인 개미취의 근과 근경"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["苦甘 溫","肺","潤肺下氣<br>化痰止咳","痰多喘咳, 新久咳嗽<br>勞嗽咳血",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-化痰止咳의 要藥","-咳嗽證의 寒熱과 外感內傷을 莫論하고 咳嗽에 痰이 있어 咯吐不暢하는 者에게 모두 配伍하여 治療","-性溫한 藥이므로 )와 폐옹(肺癰)으로 피고름을 뱉는 것을 낫게 하며 번열을 없애며 허로를 보한다. -뿌리는 자줏빛이고 줄기는 푸른 자줏빛이며 잎은 비해와 비슷하다. 음력 11월, 12월에 눈 속에서 붉은 자줏빛의 꽃이 핀다. -모든 풀 가운데 이 풀만이 눈 속에서도 봄기운을 가장 먼저 맞는다. 눈 속에서도 꽃이 핀다. 음력 11월에 꽃을 따서 그늘에서 말린다. 혹은 음력 정월에 일찍이 따는데 꽃이 절반쯤 핀 것이 좋다. 만일 활짝 피면 약의 효과가 전혀 없다[본초] -일명 과동(顆冬)이라고도 하며 기침을 낫게 하는 데 가장 중요한 약이다. 가지를 버리고 쓴다[입문] -『신농본초경』에는 우리나라에서 난다 하였는데 지금은 없다[속방]"},{"id":73,"name":"敗醬草","aliases":["마타리"],"category":"淸熱藥-淸熱解毒藥","origin":"敗醬科(마타리과) 다년생 초본인 뚝갈(白花敗醬)과 마타리(黃花敗醬)의 根달린 전초","initial":"ㅁ","sortName":"마타리","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 微寒","胃 大腸 肝","淸熱解毒<br>消腫排膿<br>祛瘀止痛","赤白帶下,目赤腫痛,下痢<br>腸癰<br>産後瘀滯腹痛,癰腫疥癬",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱解毒藥"]}],["sec",{"key":"origin","label":"기원","lines":["敗醬科(마타리과) 다년생 초본인 뚝갈(白花敗醬)과 마타리(黃花敗醬)의 根달린 전초"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 微寒","胃 大腸 肝","淸熱解毒<br>消腫排膿<br>祛瘀止痛","赤白帶下,目赤腫痛,下痢<br>腸癰<br>産後瘀滯腹痛,癰腫疥癬",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-瘡癰腫毒을 治療하는데 常用하는 要藥","-腸癰에 膿의 有無룔 莫論하고 必用하는 要藥","-臨床에서는 肺膿瘍, 肝膿瘍 및 子宮內膜炎, 子宮附屬器炎, 卵巢囊腫 등 證에 비교적 良好한 治療效果","-實熱瘀血者가 아니면 適用 ×"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-淸熱解毒, 消癰排膿, 祛瘀止痛의 효능이 있어 각종 皮膚 感染性病症에 현저한 효과가 있다.","․大腸의 發炎‧化膿 : +金銀花‧薏苡仁‧桃仁","․肺膿瘍(高熱, 咳嗽, 膿血吐) : +魚腥草‧鴨跖草‧桔梗","․夏季의 瘡癤로 紅腫熱痛時 一兩 內服 또는 外用, 化膿後 +金銀花‧天花粉‧黃連","․流行性耳下腺炎 / 鼻腔 및 眼結膜 炎症","․月經痛, 排經不暢, 産後血液循環 不行","-임상 : 痢疾, 炎症疾患(만성腸炎, 맹장炎등 五臟六腑炎症)에 多用"]}],["sec",{"key":"dong","label":"동의보감","lines":["-패장(敗醬, 마타리)은 성질은 평(平)하고(약간 차다[微寒]고도 한다) 맛은 쓰고 짜며 독이 없다. 어혈이 여러 해 된 것을 헤치고[破] 고름을 삭혀 물이 되게 하며 또 몸푼 뒤의 여러 가지 병을 낫게 하고 쉽게 몸풀게 하며 유산하게 한다. 몹시 뜨거운 열과 불에 덴 것, 창양(瘡瘍), 옴과 버짐, 단독을 낫게 하고 눈에 피가 진 것, 예장[眼障]과 예막[眼膜]이 생긴 것, 눈에 군살이 돋아난 것, 귀를 앓아 듣지 못하는 것을 낫게 한다. 또 고름을 빨아내고 누공[瘻]을 아물게 한다.","-산과 들에서 자라는데 뿌리는 자줏빛이며 시호와 비슷하다. 오래 묵어 상한 콩장 냄새가 나기 때문에 패장이라 한다. 음력 8월에 뿌리를 캐 햇볕을 말린다[본초]","-족소음경과 수궐음경에 들어간다[탕액]"]}]],"searchText":"敗醬草 마타리 분류 淸熱藥-淸熱解毒藥 기원 敗醬科(마타리과) 다년생 초본인 뚝갈(白花敗醬)과 마타리(黃花敗醬)의 根달린 전초 性味 歸經 效能 主治 備考 辛苦 微寒 胃 大腸 肝 淸熱解毒<br>消腫排膿<br>祛瘀止痛 赤白帶下, 然이라 동의보감 -상근백피(桑根白皮, 뽕나무뿌리껍질)는 폐기(肺氣)로 숨이 차고 가슴이 그득한 것, 수기(水氣)로 부종이 생긴 것을 낫게 하며 담을 삭이고 갈증을 멈춘다. 또 폐 속의 수기를 없애며 오줌을 잘 나가게 한다. 기침하면서 피를 뱉는 것을 낫게 하며 대소장을 잘 통하게 한다. 뱃속의 벌레를 죽이고 또한 쇠붙이에 다친 것을 아물게 한다. -아무 때나 채취하는데 땅 위에 드러나 있는 것은 사람을 상한다. 처음 캐서 구리칼로 겉껍질을 긁어 버리고 속에 있는 흰 껍질을 벗겨서 햇볕에 말린다. 동쪽으로 뻗어간 뿌리가 더욱 좋다[본초] -수태음경에 들어가서 肺氣를 瀉한다. 오줌을 잘 나가게 하려면 생것을 쓰고 기침에는 꿀물에 축여 찌거나 볶아 쓴다[입문]"},{"id":84,"name":"桑葉","aliases":[],"category":"解表藥-發散風熱藥","origin":"桑科(뽕나무과) 낙엽교목 뽕나무의 첫 서리 내린 후의 잎","initial":"기타","sortName":"桑葉","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["甘苦 寒","肺 肝","疏散風熱<br>淸肺潤燥<br>淸肝明目","感冒風熱<br>肺熱燥咳, 頭暈頭痛<br>目赤昏花",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["解表藥-發散風熱藥"]}],["sec",{"key":"origin","label":"기원","lines":["桑科(뽕나무과) 낙엽교목 뽕나무의 첫 서리 내린 후의 잎"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["甘苦 寒","肺 肝","疏散風熱<br>淸肺潤燥<br>淸肝明目","感冒風熱<br>肺熱燥咳, 頭暈頭痛<br>目赤昏花",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-凉血시키는 作用을 兼하여 血熱로 因한 吐血에도 應用할 수 있으나 藥力이 비교적 緩하다"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-淸熱止咳 : 解熱效果는 强하지 않으나 咳喘初期 發作性 咳嗽가 중지되지 않고 多量의 黃色痰에 咽喉痛이 있을 때 桑葉‧杏仁‧枇杷葉‧款冬花를 함께 사용","-淸肝明目 : 상엽은 Vt.A, D를 함유 頭暈頭痛‧目赤昏花를 治하고, 老人의 身體衰弱으로 눈이 흐릴 때 黑芝麻‧金石斛‧山茱萸 등 滋陰補益藥을 配合한다.","-降低血壓 : 神經性고혈압으로 혈압이 불규칙할 때 桑葉‧釣鉤藤 각5錢 茶로 복용","-혈당치를 내리고, Vt.B1이 풍부하여 利尿消腫하고, 脚氣를 예방한다.","-桑葉주사액은 象皮病치료에 효과가 있고, 手術傷處 또는 化膿性瘺管의 癒合을 促進하고 皮膚의 糜爛面을 건조시키는 작용을 한다.","-임상 : 癎風腦動, 고혈압, 당뇨에 多用"]}],["sec",{"key":"dong","label":"동의보감","lines":["-상엽(桑葉, 뽕잎)은 성질이 따뜻하고[煖] 독이 없다. 각기와 수종을 낫게 하며 대소장을 잘 통하게 하고 기를 내리며 풍(風)으로 오는 통증을 멈춘다","-잎이 갈라진 것은 가새뽕이라 하여 제일 좋다. 여름과 가을에 재차 난 잎이 좋은데 서리 내린 이후에 따서 쓴다[본초]","-상지(桑枝, 뽕나무가지)는 봄에 잎이 내돋지 않은 때에 베어서 닦아[炒] 물에 달여서 먹으면 모든 풍증, 수기, 각기, 폐기, 기침, 상기(上氣) 등을 낫게 한다. 먹은 것을 잘 삭이며 오줌을 잘 나가게 한다. 팔이 아픈 것, 입 안이 마르는 것을 낫게 하는 데는 즉 뽕나무가지로 만든 차가 제일이다[본초]","-상심(桑椹, 오디)은 성질은 차고[寒] 맛은 달며[甘] 독이 없다. 소갈증을 낫게 하고 5장을 편안하게 한다. 오래 먹으면 배가 고프지 않게 된다","-검은오디(黑桑椹)는 뽕나무의 정기[桑之精]가 다 들어 있다[본초]","-상화(桑花, 뽕나무이끼)의 성질은 따뜻하며[暖] 독이 없다. 코피가 몹시 나는 것[鼻洪], 피 토하기[吐血], 장풍, 붕루, 대하를 낫게 한다. 이것은 뽕나무껍질 위에 있는 흰 이끼다. 칼로 긁어 볶아 말려서 쓴다[본초]","-상시회림즙(桑柴灰淋汁, 뽕나무잿물)의 성질은 차며[寒] 맛은 맵고[辛] 조금 독이 있다. 이 물에 붉은팥(적소두)을 삶아서 죽을 쑤어 먹으면 수종, 창만이 잘 내린다[본초]","-상두충(桑蠹蟲, 뽕나무좀벌레)은 갑자기 생긴 가슴앓이를 낫게 하며 쇠붙이에 다친 데서 새살이 잘 살아나지 않는 것을 낫게 한다. 늙은 뽕나무 속에 있다[본초]","-자목(柘木, 산뽕나무)의 성질은 따뜻하며[溫] 맛이 달고[甘] 독이 없다. 풍허(風虛)로 귀먹은 것과 학질을 낫게 한다. 삶은 물은 노랗게 물이 든다[본초]"]}]],"searchText":"桑葉 분류 解表藥-發散風熱藥 기원 桑科(뽕나무과) 낙엽교목 뽕나무의 첫 서리 내린 후의 잎 性味 歸經 效能 主治 備考 甘苦 寒 肺 肝 疏散風熱<br>淸肺潤燥<br>淸肝明目 感冒風熱<br>肺熱燥咳, 頭暈頭痛<br>目赤昏花  약물특징/비교 -凉血시키는 作用을 兼하여 血熱로 因한 吐血에도 應用할 수 있으나 藥力이 비교적 緩하다 진존인본초 -淸熱止咳 : 解熱效果는 强하지 않으나 咳喘初期 發作性 咳嗽가 중지되지 않고 多量의 黃色痰에 咽喉痛이 있을 때 桑葉‧杏仁‧枇杷葉‧款冬花를 함께 사용 -淸肝明目 : 상엽은 Vt.A, D를 함유 頭暈頭痛‧目赤昏花를 治하고, 老人의 身體衰弱으로 눈이 흐릴 때 黑芝麻‧金石斛‧山茱萸 등 滋陰補益藥을 配合한다. -降低血壓 : 神經性고혈압으로 혈압이 불규칙할 때 桑葉‧釣鉤藤 각5錢 茶로 복용 -혈당치를 내리고, Vt.B1이 풍부하여 利尿消腫하고, 脚氣를 예방한다. -桑葉주사액은 象皮病치료에 효과가 있고, 手術傷處 또는 化膿性瘺管의 癒合을 促進하고 皮膚의 糜爛面을 건조시키는 작용을 한다. -임상 : 癎風腦動, 고혈압, 당뇨에 多用 동의보감 -상엽(桑葉, 뽕잎)은 성질이 따뜻하고[煖] 독이 없다. 각기와 수종을 낫게 하며 대소장을 잘 통하게 하고 기를 내리며 풍(風)으로 오는 통증을 멈춘다 -잎이 갈라진 것은 가새뽕이라 하여 제일 좋다. 여름과 가을에 재차 난 잎이 좋은데 서리 내린 이후에 따서 쓴다[본초] -상지(桑枝, 뽕나무가지)는 봄에 잎이 내돋지 않은 때에 베어서 닦아[炒] 물에 달여서 먹으면 모든 풍증, 수기, 각기, 폐기, 기침, 상기(上氣) 등을 낫게 한다. 먹은 것을 잘 삭이며 오줌을 잘 나가게 한다. 팔이 아픈 것, 입 안이 마르는 것을 낫게 하는 데는 즉 뽕나무가지로 만든 차가 제일이다[본초] -상심(桑椹, 오디)은 성질은 차고[寒] 맛은 달며[甘] 독이 없다. 소갈증을 낫게 하고 5장을 편안하게 한다. 오래 먹으면 배가 고프지 않게 된다 -검은오디(黑桑椹)는 뽕나무의 정기[桑之精]가 다 들어 있다[본초] -상화(桑花, 뽕나무이끼)의 성질은 따뜻하며[暖] 독이 없다. 코피가 몹시 나는 것[鼻洪], 피 토하기[吐血], 장풍, 붕루, 대하를 낫게 한다. 이것은 뽕나무껍질 위에 있는 흰 이끼다. 칼로 긁어 볶아 말려서 쓴다[본초] -상시회림즙(桑柴灰淋汁, 뽕나무잿물)의 성질은 차며[寒] 맛은 맵고[辛] 조금 독이 있다. 이 물에 붉은팥(적소두)을 삶아서 죽을 쑤어 먹으면 수종, 창만이 잘 내린다[본초] -상두충(桑蠹蟲, 뽕나무좀벌레)은 갑자기 생긴 가슴앓이를 낫게 하며 쇠붙이에 다친 데서 새살이 잘 살아나지 않는 것을 낫게 한다. 늙은 뽕나무 속에 있다[본초] -자목(柘木, 산뽕나무)의 성질은 따뜻하며[溫] 맛이 달고[甘] 독이 없다. 풍허(風虛)로 귀먹은 것과 학질을 낫게 한다. 삶은 물은 노랗게 물이 든다[본초]"},{"id":85,"name":"竹葉","aliases":[],"category":"淸熱藥-淸熱瀉火藥","origin":"禾本科(벼과) 다년생 상록교목 솜대의 잎","initial":"기타","sortName":"竹葉","table":{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 寒","心 肺 膽 胃","淸熱除煩<br>生津利尿","熱病煩渴, 小兒驚癎, 咳逆吐衄, 面赤<br>小便短赤, 口糜舌瘡",""]]},"items":[["sec",{"key":"category","label":"분류","lines":["淸熱藥-淸熱瀉火藥"]}],["sec",{"key":"origin","label":"기원","lines":["禾本科(벼과) 다년생 상록교목 솜대의 잎"]}],["table",{"header":["性味","歸經","效能","主治","備考"],"body":[["辛苦 寒","心 肺 膽 胃","淸熱除煩<br>生津利尿","熱病煩渴, 小兒驚癎, 咳逆吐衄, 面赤<br>小便短赤, 口糜舌瘡",""]]}],["sec",{"key":"feature","label":"약물특징/비교","lines":["-入藥時에는 鮮者가 좋으며 久煎하지 ×","-竹葉卷心은 竹葉 중 처음 나온 卷狀의 嫩葉으로 性味와 效能이 竹葉과 서로 같으나 竹葉보다 心熱을 淸하는데 優秀(오로지 心經의 實熱로 인한 煩熱, 尿赤, 口舌生瘡 및 溫病으로 神昏 譫語한 등 證에 應用)"]}],["sec",{"key":"qna","label":"본초문답","lines":["-若夫葉在四方, 則主四散, .....竹葉能淸肌肉中之熱, 仲景竹葉石膏湯, 正取竹葉之散也(p101)","-竹葉‧寒水石‧石膏, 均禀天水之寒氣, 故治一切熱(p178)"]}],["sec",{"key":"jin","label":"진존인본초","lines":["-淸熱化痰 : 傷寒症으로 熱病煩渴하면 곧 淡竹葉에 石膏를 사용(竹葉石膏湯)","-소아의 氣管중 痰液제거(小兒驚癎,痰多痙攣症) : 淡竹葉+竹茹‧竹瀝‧萊菔子"]}],["sec",{"key":"dong","label":"동의보감","lines":["-근죽엽(왕대잎)의 성질은 차며[寒] 맛이 달고[甘](쓰다[苦]고도 한다) 독이 없다. 기침하면서 기운이 치미는 것을 멈추고 번열을 없애며 소갈을 멎게 하고 광물성 약독을 풀어 준다. 풍경(風痙), 후비(喉痺), 구토, 토혈(吐血), 열독풍(熱毒風), 악창을 낫게 하며 잔벌레를 죽인다","-참대 잎에는 근대엽, 담죽엽(淡竹葉), 고죽엽(苦竹葉) 3가지가 있다. 왕대[ 竹]는 둥글고 질이 굳은데 큰 것은 배의 상앗대를 만들 수 있고 가는 것은 피리를 만든다. 감죽(甘竹)은 왕대 비슷한데 가늘고 긴 것이 즉 솜대(淡竹)이다. 고죽은 흰 것과 자줏빛 나는 것이 있다[본초]","-왕대, 담죽이 상품이고 고죽은 그 다음 간다[입문]","-담죽엽(淡竹葉)의 성질은 차며[寒] 맛은 달고[甘] 독이 없다. 담을 삭이고 열을 내리며 중풍으로 목이 쉬어 말 못하는 것, 열이 세게 나고 머리가 아픈 것[壯熱頭痛] 등을 낫게 한다. 경계증, 온역(瘟疫)으로 발광하며 안타까워 하는 것, 기침하면서 기운이 치미는 것, 임신부가 어지럼증이 나서 넘어지는 것, 어린이의 경간(驚癎), 천조풍(天弔風) 등을 낫게 한다[본초]","-고죽엽(苦竹葉, 오죽잎)의 성질은 서늘하며 맛이 쓰고 독이 없다. 잠 못자는 것을 낫게 하며 소갈을 멈추고 술독을 풀며 번열을 없애고 땀을 낸다. 중풍으로 말을 못하는 것도 낫게 한다[본초]","-죽실(竹實, 참대열매)은 대숲이 무성하고 빽빽한 가운데서 나는데 크기가 달걀만하고 참대잎이 층층으로 쌓인다. 맛은 달다. 정신을 좋게 하고 가슴을 시원하게 하며 몸을 가볍게 하고 기운을 돕는다[입문]. 생김새가 밀알 비슷한데 밥을 지어 먹을 수 있다고 했다[본초]","-죽근(竹根, 참대뿌리)을 달여 먹으면 번열과 갈증을 없애며 허한 것을 보하고 기를 내리며 독을 풀어 준다. 또는 풍경[風痔]을 낫게 한다[본초]"]}]],"searchText":"竹葉 분류 淸熱藥-淸熱瀉火藥 기원 禾本科(벼과) 다년생 상록교목 솜대의 잎 性味 歸經 效能 主治 備考 辛苦 寒 心 肺 膽 胃 淸熱除煩<br>生津利尿 熱病煩渴, 小兒驚癎, 咳逆吐衄, 面赤<br>小便短赤, 口糜舌瘡  약물특징/비교 -入藥時에는 鮮者가 좋으며 久煎하지 × -竹葉卷心은 竹葉 중 처음 나온 卷狀의 嫩葉으로 性味와 效能이 竹葉과 서로 같으나 竹葉보다 心熱을 淸하는데 優秀(오로지 心經의 實熱로 인한 煩熱, 尿赤, 口舌生瘡 및 溫病으로 神昏 譫語한 등 證에 應用) 본초문답 -若夫葉在四方, 則主四散, .....竹
